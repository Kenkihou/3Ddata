<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Head Tracking Parallax</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        /* ウェブカメラの映像はデバッグ用以外では隠す */
        #video-element { display: none; transform: scaleX(-1); } 
        /* ローディング表示 */
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-family: sans-serif; pointer-events: none;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/+esm"
            }
        }
    </script>
</head>
<body>
    <div id="loading">Loading AI & Model...</div>
    <video id="video-element" autoplay playsinline></video>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { FilesetResolver, FaceLandmarker } from '@mediapipe/tasks-vision';

        // --- 設定 ---
        const SETTINGS = {
            sensitivity: 2.0, // カメラの移動量（大きいほど動きが大きくなる）
            smoothness: 0.1,  // 追従の滑らかさ (0.01〜1.0: 小さいほど遅れてついてくる)
            modelPath: './girl2.glb', // 読み込むGLBファイルのパス
            cameraZ: 3 // カメラの初期Z位置（モデルとの距離）
        };

        // --- Three.js 初期化 ---
        const scene = new THREE.Scene();
        // 背景色（必要に応じて変更）
        scene.background = new THREE.Color(0x222222); 

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = SETTINGS.cameraZ;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- ライティング (モデルに合わせて調整してください) ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);

        // --- GLBモデルの読み込み ---
        let mixer = null;
        const loader = new GLTFLoader();
        loader.load(SETTINGS.modelPath, (gltf) => {
            const model = gltf.scene;
            // モデルを中心に配置
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            model.position.sub(center); // 原点合わせ
            
            scene.add(model);

            // アニメーションがある場合は再生
            if (gltf.animations.length > 0) {
                mixer = new THREE.AnimationMixer(model);
                gltf.animations.forEach((clip) => {
                    mixer.clipAction(clip).play();
                });
            }
            console.log("Model Loaded");
        }, undefined, (error) => {
            console.error('An error happened loading GLB:', error);
            // モデルがない場合のフォールバック（赤い箱を表示）
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshStandardMaterial({ color: 0xff0000 });
            const cube = new THREE.Mesh(geometry, material);
            scene.add(cube);
            document.getElementById('loading').innerText = "Model load failed. Showing cube.";
        });

        // --- MediaPipe FaceLandmarker セットアップ ---
        let faceLandmarker;
        let lastVideoTime = -1;
        let targetCameraX = 0;
        let targetCameraY = 0;
        const video = document.getElementById('video-element');

        async function setupMediaPipe() {
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/wasm"
            );
            faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`,
                    delegate: "GPU"
                },
                outputFaceBlendshapes: false,
                runningMode: "VIDEO",
                numFaces: 1
            });

            // ウェブカメラの起動
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                video.addEventListener("loadeddata", predictWebcam);
                document.getElementById('loading').style.display = 'none';
            } catch (err) {
                console.error("Webcam access denied:", err);
                document.getElementById('loading').innerText = "Webcam access denied";
            }
        }

        // --- トラッキングループ ---
        async function predictWebcam() {
            let startTimeMs = performance.now();
            if (lastVideoTime !== video.currentTime) {
                lastVideoTime = video.currentTime;
                const result = faceLandmarker.detectForVideo(video, startTimeMs);

                if (result.faceLandmarks.length > 0) {
                    // 鼻先(インデックス1)または眉間(インデックス168)などの座標を使用
                    // MediaPipeの座標系は上が0、下が1、左が0、右が1
                    const face = result.faceLandmarks[0][1]; // 鼻先の座標

                    // 0.0〜1.0 の座標を -1.0〜1.0 に変換し、感度を掛ける
                    // 顔が右(x大)に行くとカメラも右(x大)へ → 物体の右側面が見える
                    // 顔が上(y小)に行くとカメラも上(y大)へ
                    
                    // X座標: 画面中央(0.5)からのずれを反転せずに適用
                    targetCameraX = (face.x - 0.5) * SETTINGS.sensitivity * -5; // 左右反転調整が必要な場合あり
                    
                    // Y座標: MediaPipeは上が0なので反転させる
                    targetCameraY = -(face.y - 0.5) * SETTINGS.sensitivity * 5; 
                }
            }
            window.requestAnimationFrame(predictWebcam);
        }

        // --- メインレンダリングループ ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);

            // カメラ位置の更新（Lerpを使って滑らかに追従）
            // 現在の位置 += (目標位置 - 現在の位置) * 係数
            camera.position.x += (targetCameraX - camera.position.x) * SETTINGS.smoothness;
            camera.position.y += (targetCameraY - camera.position.y) * SETTINGS.smoothness;

            // カメラは常に原点（モデルのある位置）を向く
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        // --- リサイズ対応 ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 開始
        setupMediaPipe();
        animate();

    </script>
</body>
</html>
