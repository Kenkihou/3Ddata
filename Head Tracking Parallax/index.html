<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallax: Healing Ocean View</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #video-element { display: none; } 
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #00ff00; font-family: monospace; pointer-events: none; text-align: center;
            font-size: 14px; letter-spacing: 1px; z-index: 999;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/+esm"
            }
        }
    </script>
</head>
<body>
    <div id="loading">LOADING RELAXATION...<br>Please wait</div>
    <video id="video-element" autoplay playsinline></video>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { FilesetResolver, FaceLandmarker } from '@mediapipe/tasks-vision';

        // --- 設定 ---
        const SETTINGS = {
            sensitivity: 5.0,
            smoothness: 0.15,
            modelPath: './model.glb', 
            windowWidth: 4.5, 
            windowHeight: 0,  
            cameraDistance: 4.0,
            boxDepth: 3.0 // 奥行き3.0（浅め）
        };

        // --- 初期化 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        scene.fog = new THREE.Fog(0x000000, 2, 15);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, SETTINGS.cameraDistance);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        let mixer = null;
        let modelRoot = null;
        let reflectionRoot = null;
        let roomGroup = new THREE.Group(); 
        
        scene.add(roomGroup);

        // --- ライティング ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5); 
        scene.add(ambientLight);

        const frontLight = new THREE.DirectionalLight(0xffffff, 0.8);
        frontLight.position.set(0, 0, 5); 
        scene.add(frontLight);

        // --- モデル読み込み ---
        const loader = new GLTFLoader();
        loader.load(SETTINGS.modelPath, (gltf) => {
            const model = gltf.scene;
            model.traverse(c => { 
                if(c.isMesh) { 
                    c.castShadow = true; 
                    c.receiveShadow = true;
                    // チラつき防止策（roughness=1.0など）は撤回し、元の0.6に戻しています
                    if(c.material) c.material.roughness = 0.6;
                } 
            });

            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());

            const targetHeight = 0.45; 
            const scale = targetHeight / size.y;
            model.scale.setScalar(scale);
            
            // --- 姿勢調整（継続） ---
            // 1. 角度調整（-10度）
            model.rotation.x = -THREE.MathUtils.degToRad(10);

            // 2. 位置合わせ
            model.position.x = -center.x * scale;
            const yOffset = 0.15; 
            model.position.y = -center.y * scale + (size.y * scale / 2) - yOffset;
            model.position.z = -center.z * scale;
            // ---------------------------

            modelRoot = new THREE.Group();
            modelRoot.add(model);
            scene.add(modelRoot);

            reflectionRoot = modelRoot.clone();
            reflectionRoot.scale.y = -1; 
            reflectionRoot.traverse(c => {
                if (c.isMesh) {
                    c.castShadow = false; c.receiveShadow = false;
                    c.material = c.material.clone();
                    c.material.color.setHex(0x2244aa);
                    c.material.transparent = true;
                    c.material.opacity = 0.25;
                }
            });
            scene.add(reflectionRoot);

            if (gltf.animations.length > 0) {
                mixer = new THREE.AnimationMixer(modelRoot);
                const mixer2 = new THREE.AnimationMixer(reflectionRoot);
                gltf.animations.forEach(clip => {
                    mixer.clipAction(clip).play();
                    mixer2.clipAction(clip).play();
                });
                mixer.updateReflection = (delta) => mixer2.update(delta);
            }

            updateEnvironment();
            addStudioLights();

            document.getElementById('loading').style.display = 'none';
        }, undefined, (err) => console.error(err));


        // --- 環境更新 ---
        function updateEnvironment() {
            const aspect = window.innerWidth / window.innerHeight;
            SETTINGS.windowHeight = SETTINGS.windowWidth / aspect;
            
            const floorY = -SETTINGS.windowHeight / 2;
            
            while(roomGroup.children.length > 0){ 
                const obj = roomGroup.children[0];
                roomGroup.remove(obj);
                if(obj.geometry) obj.geometry.dispose();
                if(obj.material) {
                   if(Array.isArray(obj.material)) obj.material.forEach(m=>m.dispose());
                   else obj.material.dispose();
                }
            }
            
            buildCyberBox(floorY, SETTINGS.windowWidth, SETTINGS.windowHeight, SETTINGS.boxDepth);

            if(modelRoot && reflectionRoot) {
                const zPos = -1.0; 
                modelRoot.position.set(0, floorY, zPos);
                reflectionRoot.position.set(0, floorY - 0.01, zPos);
            }
        }

        // --- 箱の構築（動画スクリーン追加） ---
        function buildCyberBox(floorY, w, h, d) {
            const ceilY = -floorY;

            const colorSide = 0x606080; 
            const colorBack = 0x404040; 
            const colorCeil = 0x111111; 
            const matFloor = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.1, metalness: 0.8 });

            const matBack = new THREE.MeshBasicMaterial({ color: colorBack });
            const matSide = new THREE.MeshBasicMaterial({ color: colorSide });
            const matCeil = new THREE.MeshBasicMaterial({ color: colorCeil });

            // 1. 奥の壁（ベースの壁）
            const backWall = new THREE.Mesh(new THREE.PlaneGeometry(w * 2, h * 4), matBack);
            backWall.position.set(0, 0, -d);
            roomGroup.add(backWall);

            // -------------------------------------------------------------
            // ▼ 動画スクリーンの追加 ▼
            // -------------------------------------------------------------
            // HTMLのvideo要素を作成（非表示）
            const bgVideo = document.createElement('video');
            // フリー素材（Pexels）: 穏やかな波の映像
            bgVideo.src = "./sample1.mp4"; 
            bgVideo.crossOrigin = "anonymous";
            bgVideo.loop = true;
            bgVideo.muted = true; // 自動再生のためミュート必須
            bgVideo.playsInline = true;
            bgVideo.play();

            const videoTexture = new THREE.VideoTexture(bgVideo);
            videoTexture.colorSpace = THREE.SRGBColorSpace; // 色味を正しく表示

            // 動画を表示するスクリーン用メッシュ
            // サイズを部屋の開口部(w, h)に合わせる
            const screenGeo = new THREE.PlaneGeometry(w, h);
            const screenMat = new THREE.MeshBasicMaterial({ map: videoTexture }); // Basicなので暗くならない
            const screenMesh = new THREE.Mesh(screenGeo, screenMat);
            
            // 奥の壁のわずかに手前に配置
            screenMesh.position.set(0, 0, -d + 0.02); 
            roomGroup.add(screenMesh);
            // -------------------------------------------------------------

            // 2. 側壁・天井・床
            const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(d * 2, h * 4), matSide);
            leftWall.rotation.y = Math.PI / 2;
            leftWall.position.set(-w/2, 0, -d/2);
            roomGroup.add(leftWall);

            const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(d * 2, h * 4), matSide);
            rightWall.rotation.y = -Math.PI / 2;
            rightWall.position.set(w/2, 0, -d/2);
            roomGroup.add(rightWall);

            const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(w * 2, d * 2), matCeil);
            ceiling.rotation.x = Math.PI / 2;
            ceiling.position.set(0, ceilY, -d/2);
            roomGroup.add(ceiling);

            const floor = new THREE.Mesh(new THREE.PlaneGeometry(w * 2, d + 2), matFloor);
            floor.rotation.x = -Math.PI / 2;
            floor.position.set(0, floorY, -d/2);
            roomGroup.add(floor);

            // 3. グリッド
            const gridBack = new THREE.GridHelper(w*2, 20, 0x0044aa, 0x222222);
            gridBack.rotation.x = -Math.PI / 2;
            gridBack.position.set(0, 0, -d + 0.05);
            // roomGroup.add(gridBack); // 動画の邪魔になるので奥のグリッドは削除

            const gridSideH = new THREE.GridHelper(d*2, 20, 0x333388, 0x222233);
            const gridLeft = gridSideH.clone();
            gridLeft.rotation.z = Math.PI / 2;
            gridLeft.position.set(-w/2 + 0.05, 0, -d/2);
            roomGroup.add(gridLeft);
            const gridRight = gridSideH.clone();
            gridRight.rotation.z = Math.PI / 2;
            gridRight.position.set(w/2 - 0.05, 0, -d/2);
            roomGroup.add(gridRight);

            const floorGrid = new THREE.GridHelper(w*2, 20, 0x0088ff, 0x111122);
            floorGrid.position.set(0, floorY + 0.01, -d/2);
            floorGrid.scale.z = d/(w*2);
            roomGroup.add(floorGrid);

            // 4. 輪郭線
            const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, opacity: 1.0, transparent: false });
            const points = [];
            points.push(new THREE.Vector3(-w/2, floorY, -d), new THREE.Vector3(-w/2, ceilY, -d));
            points.push(new THREE.Vector3(w/2, floorY, -d), new THREE.Vector3(w/2, ceilY, -d));
            points.push(new THREE.Vector3(-w/2, ceilY, -d), new THREE.Vector3(w/2, ceilY, -d));
            points.push(new THREE.Vector3(-w/2, floorY, -d), new THREE.Vector3(w/2, floorY, -d));
            points.push(new THREE.Vector3(-w/2, ceilY, 0), new THREE.Vector3(-w/2, ceilY, -d));
            points.push(new THREE.Vector3(w/2, ceilY, 0), new THREE.Vector3(w/2, ceilY, -d));
            points.push(new THREE.Vector3(-w/2, floorY, 0), new THREE.Vector3(-w/2, floorY, -d));
            points.push(new THREE.Vector3(w/2, floorY, 0), new THREE.Vector3(w/2, floorY, -d));
            points.push(new THREE.Vector3(-w/2, ceilY, 0), new THREE.Vector3(w/2, ceilY, 0)); 
            points.push(new THREE.Vector3(-w/2, floorY, 0), new THREE.Vector3(w/2, floorY, 0)); 
            points.push(new THREE.Vector3(-w/2, ceilY, 0), new THREE.Vector3(-w/2, floorY, 0)); 
            points.push(new THREE.Vector3(w/2, ceilY, 0), new THREE.Vector3(w/2, floorY, 0)); 
            const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
            const frame = new THREE.LineSegments(lineGeo, lineMat);
            roomGroup.add(frame);
        }

        // --- 演出 ---
        function addStudioLights() {
            const center = new THREE.Vector3(0, 0, -1);
            function createShaft(color, source) {
                const h = 8;
                const geo = new THREE.ConeGeometry(1.5, h, 32, 1, true);
                geo.translate(0, -h/2, 0); geo.rotateX(-Math.PI/2);
                const mat = new THREE.MeshBasicMaterial({
                    color: color, opacity: 0.04, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
                });
                const m = new THREE.Mesh(geo, mat);
                m.position.copy(source.position); m.lookAt(center);
                return m;
            }
            const keyLight = new THREE.SpotLight(0xfff0dd, 50);
            keyLight.position.set(-2, 4, 1); 
            keyLight.angle = Math.PI/8; keyLight.penumbra = 0.5;
            keyLight.castShadow = true;
            keyLight.target.position.copy(center);
            scene.add(keyLight.target); scene.add(keyLight);
            scene.add(createShaft(0xfff0dd, keyLight));

            const rimLight = new THREE.SpotLight(0x4488ff, 30);
            rimLight.position.set(2, 4, -3.5);
            rimLight.angle = Math.PI/6;
            rimLight.target.position.copy(center);
            scene.add(rimLight.target); scene.add(rimLight);
            scene.add(createShaft(0x4488ff, rimLight));
        }

        // --- カメラ制御 ---
        function updateOffAxisCamera(headX, headY) {
            const camZ = SETTINGS.cameraDistance;
            const camX = headX * (SETTINGS.windowWidth * 0.5); 
            const camY = headY * (SETTINGS.windowHeight * 0.5);
            camera.position.set(camX, camY, camZ);
            const near = 0.1; const far = 100.0;
            const halfW = SETTINGS.windowWidth / 2;
            const halfH = SETTINGS.windowHeight / 2;
            const left   = (-halfW - camX) * (near / camZ);
            const right  = ( halfW - camX) * (near / camZ);
            const top    = ( halfH - camY) * (near / camZ);
            const bottom = (-halfH - camY) * (near / camZ);
            camera.projectionMatrix.makePerspective(left, right, top, bottom, near, far);
            camera.rotation.set(0, 0, 0);
            camera.updateMatrixWorld();
        }

        // --- MediaPipe ---
        let faceLandmarker;
        let lastVideoTime = -1;
        let targetHeadX = 0, targetHeadY = 0;
        let currentHeadX = 0, currentHeadY = 0;
        const video = document.getElementById('video-element');

        async function setupMediaPipe() {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/wasm");
            faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
                baseOptions: { modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`, delegate: "GPU" },
                runningMode: "VIDEO", numFaces: 1
            });
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                video.addEventListener("loadeddata", predictWebcam);
            } catch (err) { console.error(err); }
        }

        async function predictWebcam() {
            if (lastVideoTime !== video.currentTime && faceLandmarker) {
                lastVideoTime = video.currentTime;
                const result = faceLandmarker.detectForVideo(video, performance.now());
                if (result.faceLandmarks.length > 0) {
                    const face = result.faceLandmarks[0][1]; 
                    targetHeadX = (face.x - 0.5) * -SETTINGS.sensitivity; 
                    targetHeadY = -(face.y - 0.5) * SETTINGS.sensitivity;
                }
            }
            window.requestAnimationFrame(predictWebcam);
        }

        // --- ループ ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if(mixer) {
                mixer.update(delta);
                if(mixer.updateReflection) mixer.updateReflection(delta);
            }
            currentHeadX += (targetHeadX - currentHeadX) * SETTINGS.smoothness;
            currentHeadY += (targetHeadY - currentHeadY) * SETTINGS.smoothness;
            updateOffAxisCamera(currentHeadX, currentHeadY);
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            renderer.setSize(w, h);
            updateEnvironment();
        });
        
        // 画面クリックで動画再生を確実にする（ブラウザ制限対策）
        window.addEventListener('click', () => {
            const v = document.querySelector('video[src*="pexels"]');
            if(v && v.paused) v.play();
        });

        setupMediaPipe();
        animate();
    </script>
</body>
</html>
