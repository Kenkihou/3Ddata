<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spherical Parallax</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; }
        #video-element { display: none; } 
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #eee; font-family: sans-serif; pointer-events: none; text-align: center;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/+esm"
            }
        }
    </script>
</head>
<body>
    <div id="loading">Loading...<br>カメラを許可してください</div>
    <video id="video-element" autoplay playsinline></video>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { FilesetResolver, FaceLandmarker } from '@mediapipe/tasks-vision';

        // --- 設定 ---
        const SETTINGS = {
            sensitivity: 2.0, // 視差の強さ
            smoothness: 0.1,  // 動きの滑らかさ
            modelPath: './model.glb', 
            fitPadding: 1.3
        };

        // --- 初期化 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222); 

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- ライティング ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
        dirLight.position.set(3, 10, 7);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- 変数 ---
        let mixer = null;
        let modelCenter = new THREE.Vector3(0, 0, 0); 
        let baseDistance = 5; // モデルとの基準距離（半径）
        let modelReady = false;

        // --- モデル読み込み ---
        const loader = new GLTFLoader();
        loader.load(SETTINGS.modelPath, (gltf) => {
            const model = gltf.scene;
            model.traverse(c => { if(c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });
            scene.add(model);

            model.updateMatrixWorld(true);
            const box = new THREE.Box3().setFromObject(model);
            box.getCenter(modelCenter); 
            const size = box.getSize(new THREE.Vector3());

            // 画面に収まる距離を計算
            const fov = camera.fov * (Math.PI / 180);
            const maxDim = Math.max(size.x, size.y, size.z);
            baseDistance = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * SETTINGS.fitPadding;

            // カメラの初期位置セット（Z軸方向）
            // ここでは位置を決めるだけで、毎フレーム animate で距離が強制補正されます
            camera.position.copy(modelCenter).add(new THREE.Vector3(0, 0, baseDistance));
            camera.lookAt(modelCenter);

            addBackgroundObjects(modelCenter);

            if (gltf.animations.length > 0) {
                mixer = new THREE.AnimationMixer(model);
                gltf.animations.forEach(clip => mixer.clipAction(clip).play());
            }

            modelReady = true;
            document.getElementById('loading').style.display = 'none';

        }, undefined, (err) => {
            console.error(err);
            document.getElementById('loading').innerText = "Load Error";
        });

        function addBackgroundObjects(center) {
            const geoBox = new THREE.BoxGeometry(0.3, 0.3, 0.3);
            const geoIso = new THREE.IcosahedronGeometry(0.2, 0);
            const mat = new THREE.MeshStandardMaterial({ color: 0x4488aa });
            for (let i = 0; i < 50; i++) {
                const mesh = new THREE.Mesh(Math.random() > 0.5 ? geoBox : geoIso, mat);
                mesh.position.set(
                    center.x + (Math.random() - 0.5) * 8,
                    center.y + (Math.random() - 0.5) * 8,
                    center.z + (Math.random() - 0.5) * 6 - 2
                );
                if (mesh.position.distanceTo(center) < 2.0) continue;
                mesh.rotation.set(Math.random()*3, Math.random()*3, 0);
                scene.add(mesh);
            }
        }

        // --- MediaPipe ---
        let faceLandmarker;
        let lastVideoTime = -1;
        let targetAngleX = 0, targetAngleY = 0; // 角度で管理
        const video = document.getElementById('video-element');

        async function setupMediaPipe() {
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/wasm"
            );
            faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`,
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numFaces: 1
            });
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                video.addEventListener("loadeddata", predictWebcam);
            } catch (err) { console.error(err); }
        }

        async function predictWebcam() {
            if (lastVideoTime !== video.currentTime && faceLandmarker) {
                lastVideoTime = video.currentTime;
                const result = faceLandmarker.detectForVideo(video, performance.now());
                if (result.faceLandmarks.length > 0) {
                    const face = result.faceLandmarks[0][1];
                    // 顔の位置を「移動量」ではなく「角度」として解釈する
                    // sensitivity を調整して回転具合を変えてください
                    targetAngleX = (face.x - 0.5) * -SETTINGS.sensitivity * 1.5; // 横回転
                    targetAngleY = -(face.y - 0.5) * SETTINGS.sensitivity * 1.5; // 縦回転
                }
            }
            window.requestAnimationFrame(predictWebcam);
        }

        // --- メインループ ---
        const clock = new THREE.Clock();
        
        // 滑らかにするための現在の角度変数
        let currentAngleX = 0;
        let currentAngleY = 0;

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);

            if (modelReady) {
                // 1. 角度を滑らかに更新 (Lerp)
                currentAngleX += (targetAngleX - currentAngleX) * SETTINGS.smoothness;
                currentAngleY += (targetAngleY - currentAngleY) * SETTINGS.smoothness;

                // 2. 球面座標計算: 
                // モデル中心から、計算した角度の方向に、距離(baseDistance)だけ離れた位置を求める
                // X = r * sin(x) * cos(y)
                // Y = r * sin(y)
                // Z = r * cos(x) * cos(y)
                // 簡易的に三角関数で計算します
                
                const x = baseDistance * Math.sin(currentAngleX) * Math.cos(currentAngleY);
                const y = baseDistance * Math.sin(currentAngleY);
                const z = baseDistance * Math.cos(currentAngleX) * Math.cos(currentAngleY);

                // 3. モデル中心座標 + オフセット = 新しいカメラ位置
                camera.position.set(
                    modelCenter.x + x,
                    modelCenter.y + y,
                    modelCenter.z + z
                );

                // 4. 常に中心を見る
                camera.lookAt(modelCenter);
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        setupMediaPipe();
        animate();
    </script>
</body>
</html>
