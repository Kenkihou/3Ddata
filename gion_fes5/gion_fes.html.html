<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>祇園祭 山鉾巡行シミュレーション</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
            }
        }
    </script>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: black;
        }
        canvas { 
            display: block; 
        }
        /* ★ここから追加 */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        #loading-message {
            color: white;
            font-size: 2em;
            font-family: 'メイリオ', Meiryo, sans-serif;
        }
        /* ★ここまで追加 */

        #time-display {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: monospace;
            font-size: 2em;
            background-color: rgba(50, 50, 50, 0.7);
            padding: 5px 10px;
            border-radius: 5px;
            z-index: 100;
        }
        #info-display {
            position: absolute;
            top: 10px;
            right: 10px;
            color: white;
            font-family: 'メイリオ', Meiryo, sans-serif;
            font-size: 1.2em;
            background-color: rgba(50, 50, 50, 0.7);
            padding: 5px 10px;
            border-radius: 5px;
            z-index: 100;
            white-space: nowrap;
        }
        .yamahoko-label {
            position: absolute;
            color: white;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 2px 5px;
            border-radius: 3px;
            font-family: 'メイリオ', Meiryo, sans-serif;
            font-size: 0.8em;
            white-space: nowrap;
            transform: translate(-50%, -120%);
            pointer-events: none;
            z-index: 99;
            text-shadow: 0px 0px 3px black, 0px 0px 3px black;
            writing-mode: vertical-rl;
            text-orientation: upright;
        }
        .point-label {
            position: absolute;
            color: black;
            background-color: rgba(255, 255, 255, 0.7);
            padding: 2px 5px;
            border-radius: 3px;
            font-family: 'メイリオ', Meiryo, sans-serif;
            font-size: 0.7em;
            white-space: nowrap;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 98;
        }
        #controls-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 800px;
            background-color: rgba(50, 50, 50, 0.7);
            padding: 10px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 101;
            height: 60px; 
            box-sizing: border-box;
        }
        #playPauseBtn {
            padding: 5px 15px;
            font-size: 1em;
            cursor: pointer;
            width: 150px;
            text-align: center;
            white-space: nowrap;
            box-sizing: border-box; 
        }
        #seek-container {
            position: relative;
            width: 100%;
            height: 40px;
        }
        #seekBar {
            width: 100%;
            cursor: pointer;
            margin: 0;
        }
        #time-markers-container {
            position: absolute;
            top: 25px;
            left: 0;
            width: 100%;
            display: flex;
            pointer-events: none;
            font-family: monospace;
            font-size: 0.8em;
        }
        .time-marker {
            position: absolute;
            transform: translateX(-50%);
            color: white;
        }
        #visibility-controls {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 280px;
            background-color: rgba(50, 50, 50, 0.7);
            color: white;
            font-family: 'メイリオ', Meiryo, sans-serif;
            font-size: 0.9em;
            padding: 10px;
            border-radius: 5px;
            z-index: 102;
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-height: 95vh;
            overflow-y: auto;
        }
        .visibility-item {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            width: 100%;
            gap: 5px;
        }
        .visibility-toggle-btn {
            width: 60px;
            flex-shrink: 0;
        }
        #master-visibility-controls {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-bottom: 8px;
        }
        .master-btn {
            width: 100%;
            background-color: #555;
            color: white;
            border: 1px solid #777;
            cursor: pointer;
        }
        .name-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .rank-column {
            width: 110px;
            flex-shrink: 0;
        }
        .name-column {
            color: red;
        }

    </style>
</head>
<body>
    <div id="loading-overlay">
        <div id="loading-message">読み込み中...</div>
    </div>

    <div id="visibility-controls"></div>
    <div id="time-display"></div>
    <div id="info-display" style="display:none;"></div>

    <div id="controls-container">
        <button id="playPauseBtn">再生</button>
        <div id="seek-container">
            <input type="range" id="seekBar" value="0" min="0" max="1000">
            <div id="time-markers-container"></div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- シーン、カメラ、レンダラーの設定 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 8000); 
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        document.body.appendChild(renderer.domElement);
        renderer.setSize(window.innerWidth, window.innerHeight);
        
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const keyLight = new THREE.DirectionalLight(0xffffff, 1.0);
        keyLight.position.set(1, 1, 1);
        scene.add(keyLight);
        
        const fillLight = new THREE.DirectionalLight(0xffffff, 0.5);
        fillLight.position.set(-1, 0.5, 0.5);
        scene.add(fillLight);

        const backLight = new THREE.DirectionalLight(0xffffff, 0.3);
        backLight.position.set(0, 1, -1);
        scene.add(backLight);


        // --- カメラコントロール ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.25;
        controls.minPolarAngle = 0.01;
        controls.maxPolarAngle = Math.PI / 2 - 0.01;

        // --- DOM要素 ---
        const timeDisplay = document.getElementById('time-display');
        const infoDisplay = document.getElementById('info-display');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const seekBar = document.getElementById('seekBar');
        const timeMarkersContainer = document.getElementById('time-markers-container');
        const visibilityControls = document.getElementById('visibility-controls');


        // --- 定数 ---
        const SIMULATION_SPEED_MULTIPLIER = 120;
        const START_HOUR = 8;
        const START_MINUTE = 25;
        const SIMULATION_START_TIME_OFFSET_MS = (START_HOUR * 3600 + START_MINUTE * 60) * 1000;
        
        const yamahokoTitles = {
            "長刀鉾": "01 くじ取らず", "油天神山": "02 山一番", "伯牙山": "03 山二番",
            "白楽天山": "04 山三番", "函谷鉾": "05 くじ取らず", "山伏山": "06 山四番",
            "綾傘鉾": "07 傘一番", "保昌山": "08 山五番", "鶏鉾": "09 鉾一番",
            "霰天神山": "10 山六番", "芦刈山": "11 山七番", "孟宗山": "12 山八番",
            "月鉾": "13 鉾二番", "太子山": "14 山九番", "四条傘鉾": "15 傘二番",
            "蟷螂山": "16 山十番", "菊水鉾": "17 鉾三番", "木賊山": "18 山十一番",
            "郭巨山": "19 山十二番", "占出山": "20 山十三番", "放下鉾": "21 くじ取らず",
            "岩戸山": "22 くじ取らず", "船鉾": "23 くじ取らず"
        };


        // --- グローバル変数 ---
        let relayPoints = {};
        let yamahokoData = [];
        let yamahokoMeshes = [];
        let yamahokoLabels = []; 
        let pointLabels = [];
        let buildingModels = [];
        let visibilityToggleButtons = [];

        let lastTime = 0;
        let simulationClockTimeMs = 0;
        let animationFrameId = null;
        let simulationEndTimeMs = 0;
        let isPaused = true;
        let wasPlayingBeforeSeek = false;

        // --- ヘルパー関数 ---
        function timeToMsOffset(timeStr) {
            if (typeof timeStr !== 'string' || !timeStr.includes(':')) return NaN;
            const parts = timeStr.split(':').map(Number);
            if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
                return (parts[0] * 3600 + parts[1] * 60) * 1000;
            }
            return NaN;
        }

        function updateTimeDisplay(currentSimTimeOffsetMs) {
            const totalSeconds = Math.floor(Math.max(0, currentSimTimeOffsetMs) / 1000);
            if (isNaN(totalSeconds)) return;
            const hours = Math.floor(totalSeconds / 3600) % 24;
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            const formattedTime = `${String(hours).padStart(2, '0')}時${String(minutes).padStart(2, '0')}分${String(seconds).padStart(2, '0')}秒`;
            timeDisplay.textContent = formattedTime;
        }
        
        async function loadData() {
            try {
                const [responseRelay, responseYamahoko] = await Promise.all([
                    fetch('Relay_point.json'),
                    fetch('yamahoko2.json'),
                    loadBuildings()
                ]);
                if (!responseRelay.ok) throw new Error(`HTTP error! status: ${responseRelay.status} for Relay_point.json`);
                if (!responseYamahoko.ok) throw new Error(`HTTP error! status: ${responseYamahoko.status} for yamahoko2.json`);
                
                const dataRelay = await responseRelay.json();
                yamahokoData = await responseYamahoko.json();

                dataRelay.forEach(point => {
                    const x = parseFloat(point.location.x);
                    const y = parseFloat(point.location.y);
                    const z = parseFloat(point.location.z);
                    if (!isNaN(x) && !isNaN(y) && !isNaN(z)) {
                        relayPoints[point.name] = new THREE.Vector3(x, z, -y); 
                    }
                });

                initializeScene();
                calculateSimulationEndTime();
                setupControls();
                
                // ★追加：すべてのデータ読み込み完了後にローディング画面を非表示にする
                const loadingOverlay = document.getElementById('loading-overlay');
                loadingOverlay.style.display = 'none';
                
                updateSceneToTime(SIMULATION_START_TIME_OFFSET_MS);
                animationFrameId = requestAnimationFrame(animate);

            } catch (error) {
                console.error('Error loading JSON data or models:', error);
                const loadingMessage = document.getElementById('loading-message');
                loadingMessage.textContent = 'データの読み込みに失敗しました。';
            }
        }
        
        async function loadBuildings() {
            const loader = new GLTFLoader();
            const whiteMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const yellowMaterial = new THREE.MeshStandardMaterial({ color: 0xffff00 });

            const buildingFiles = [
                'bld5234600.glb',
                'bld5234601.glb',
                'bld5234610.glb',
                'bld5234611.glb',
                'tran.glb'
            ];

            const promises = buildingFiles.map(file => loader.loadAsync(file));

            try {
                const gltfs = await Promise.all(promises);
                gltfs.forEach((gltf, index) => {
                    const model = gltf.scene;
                    const filename = buildingFiles[index];
                    const materialToApply = (filename === 'tran.glb') ? yellowMaterial : whiteMaterial;
                    model.traverse((child) => {
                        if (child.isMesh) {
                            child.material = materialToApply;
                        }
                    });

                    scene.add(model);
                    buildingModels.push(model);
                });
                console.log('All buildings loaded successfully.');
            } catch (error) {
                console.error('An error happened during building loading:', error);
            }
        }

        function calculateSimulationEndTime() {
            let maxEndTimeMs = 0;
            yamahokoData.forEach(yamanoko => {
                if (yamanoko.position && yamanoko.position.length > 0) {
                    const lastTimeStr = Object.values(yamanoko.position[yamanoko.position.length - 1])[0];
                    const endTimeMs = timeToMsOffset(lastTimeStr);
                    if (!isNaN(endTimeMs)) maxEndTimeMs = Math.max(maxEndTimeMs, endTimeMs);
                }
            });
            simulationEndTimeMs = maxEndTimeMs; 
        }

        function createTimeMarkers() {
            timeMarkersContainer.innerHTML = '';
            const markerStartTime = timeToMsOffset('08:30');
            const interval = 30 * 60 * 1000;
            const totalRange = simulationEndTimeMs - SIMULATION_START_TIME_OFFSET_MS;

            if (totalRange <= 0) return;

            for (let time = markerStartTime; time <= simulationEndTimeMs; time += interval) {
                const percent = ((time - SIMULATION_START_TIME_OFFSET_MS) / totalRange) * 100;
                if (percent >= 0 && percent <= 100) {
                    const marker = document.createElement('div');
                    marker.className = 'time-marker';
                    const hours = Math.floor(time / 3600000) % 24;
                    const minutes = Math.floor((time % 3600000) / 60000);
                    marker.textContent = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
                    marker.style.left = `${percent}%`;
                    timeMarkersContainer.appendChild(marker);
                }
            }
        }
        
        function setupControls() {
            seekBar.min = SIMULATION_START_TIME_OFFSET_MS;
            seekBar.max = simulationEndTimeMs;
            seekBar.value = SIMULATION_START_TIME_OFFSET_MS;
            
            createTimeMarkers();

            playPauseBtn.addEventListener('click', () => {
                isPaused = !isPaused;
                playPauseBtn.textContent = isPaused ? '再生' : '一時停止';
                if (!isPaused) {
                    lastTime = performance.now();
                }
            });

            seekBar.addEventListener('mousedown', () => {
                wasPlayingBeforeSeek = !isPaused;
                isPaused = true;
                playPauseBtn.textContent = '再生';
            });

            seekBar.addEventListener('input', () => {
                const seekTime = parseFloat(seekBar.value);
                simulationClockTimeMs = seekTime - SIMULATION_START_TIME_OFFSET_MS;
                updateSceneToTime(seekTime);
            });

            seekBar.addEventListener('change', () => {
                if (wasPlayingBeforeSeek) {
                    isPaused = false;
                    playPauseBtn.textContent = '一時停止';
                    lastTime = performance.now();
                }
            });
        }
        
        function initializeScene() {
            const geometry = new THREE.BoxGeometry(20, 20, 20);
            const material = new THREE.MeshBasicMaterial({ color: 0xff0000 });

            yamahokoData.forEach(yamanoko => {
                const mesh = new THREE.Mesh(geometry, material);
                mesh.name = yamanoko.name;
                scene.add(mesh); 
                yamahokoMeshes.push({ data: yamanoko, mesh: mesh });

                if (yamanoko.position && yamanoko.position.length > 0) {
                    const firstPointName = Object.keys(yamanoko.position[0])[0];
                    if (relayPoints[firstPointName]) mesh.position.copy(relayPoints[firstPointName]);
                }
                const labelDiv = document.createElement('div');
                labelDiv.className = 'yamahoko-label';
                labelDiv.textContent = yamanoko.name;
                document.body.appendChild(labelDiv);
                yamahokoLabels.push({ mesh: mesh, label: labelDiv });
            });

            for (const pointName in relayPoints) {
                if (!pointName.includes('基位置')) {
                    const labelDiv = document.createElement('div');
                    labelDiv.className = 'point-label';
                    labelDiv.textContent = pointName;
                    document.body.appendChild(labelDiv);
                    pointLabels.push({ position: relayPoints[pointName], label: labelDiv });
                }
            }
            
            adjustCamera();

            const masterControlsContainer = document.createElement('div');
            masterControlsContainer.id = 'master-visibility-controls';

            const showAllBtn = document.createElement('button');
            showAllBtn.textContent = 'すべて表示';
            showAllBtn.className = 'master-btn';
            showAllBtn.addEventListener('click', () => {
                yamahokoMeshes.forEach(item => item.mesh.visible = true);
                visibilityToggleButtons.forEach(btn => btn.textContent = '非表示');
            });

            const hideAllBtn = document.createElement('button');
            hideAllBtn.textContent = 'すべて非表示';
            hideAllBtn.className = 'master-btn';
            hideAllBtn.addEventListener('click', () => {
                yamahokoMeshes.forEach(item => item.mesh.visible = false);
                visibilityToggleButtons.forEach(btn => btn.textContent = '表示');
            });
            
            masterControlsContainer.appendChild(showAllBtn);
            masterControlsContainer.appendChild(hideAllBtn);
            
            visibilityControls.appendChild(masterControlsContainer);

            yamahokoData.sort((a, b) => {
                const titleA = yamahokoTitles[a.name] || '';
                const titleB = yamahokoTitles[b.name] || '';
                return titleA.localeCompare(titleB, 'ja', { numeric: true });
            }).forEach(yamanoko => {
                const item = yamahokoMeshes.find(m => m.data.name === yamanoko.name);
                if (!item) return;

                const mesh = item.mesh;

                const controlContainer = document.createElement('div');
                controlContainer.className = 'visibility-item';

                const nameContainer = document.createElement('div');
                nameContainer.className = 'name-container';

                const rankSpan = document.createElement('span');
                rankSpan.className = 'rank-column';
                rankSpan.textContent = yamahokoTitles[yamanoko.name] || '';

                const nameSpan = document.createElement('span');
                nameSpan.className = 'name-column';
                nameSpan.textContent = yamanoko.name;

                nameContainer.appendChild(rankSpan);
                nameContainer.appendChild(nameSpan);

                const toggleButton = document.createElement('button');
                toggleButton.className = 'visibility-toggle-btn';
                toggleButton.textContent = '非表示';
                
                visibilityToggleButtons.push(toggleButton);

                controlContainer.appendChild(nameContainer);
                controlContainer.appendChild(toggleButton);
                visibilityControls.appendChild(controlContainer);

                toggleButton.addEventListener('click', () => {
                    mesh.visible = !mesh.visible;
                    toggleButton.textContent = mesh.visible ? '非表示' : '表示';
                });
            });
        }
        
        const _vector = new THREE.Vector3();
        
        function updateSceneToTime(finalSimTimeOffsetMs) {
            yamahokoMeshes.forEach(yamanokoObj => {
                const yamanoko = yamanokoObj.data;
                const mesh = yamanokoObj.mesh;
                if (!yamanoko.position || yamanoko.position.length < 2) return;

                let foundSegment = false;
                for (let i = 0; i < yamanoko.position.length - 1; i++) {
                    const startPointEntry = yamanoko.position[i];
                    const endPointEntry = yamanoko.position[i + 1];
                    const startPointName = Object.keys(startPointEntry)[0];
                    const endPointName = Object.keys(endPointEntry)[0];
                    const startTimeOffsetMs = timeToMsOffset(Object.values(startPointEntry)[0]);
                    const endTimeOffsetMs = timeToMsOffset(Object.values(endPointEntry)[0]);

                    if (isNaN(startTimeOffsetMs) || isNaN(endTimeOffsetMs) || startTimeOffsetMs >= endTimeOffsetMs) continue;

                    if (finalSimTimeOffsetMs >= startTimeOffsetMs && finalSimTimeOffsetMs <= endTimeOffsetMs) {
                        foundSegment = true;
                        const segmentDurationMs = endTimeOffsetMs - startTimeOffsetMs;
                        const elapsedInSegmentMs = finalSimTimeOffsetMs - startTimeOffsetMs;
                        let t = segmentDurationMs === 0 ? 0 : elapsedInSegmentMs / segmentDurationMs;
                        t = Math.max(0, Math.min(1, t));

                        if (relayPoints[startPointName] && relayPoints[endPointName]) {
                            mesh.position.lerpVectors(relayPoints[startPointName], relayPoints[endPointName], t);
                        }
                        break;
                    }
                }

                if (!foundSegment) {
                    const firstPointTimeOffsetMs = timeToMsOffset(Object.values(yamanoko.position[0])[0]);
                    const lastPointTimeOffsetMs = timeToMsOffset(Object.values(yamanoko.position[yamanoko.position.length - 1])[0]);
                    if (isNaN(firstPointTimeOffsetMs) || isNaN(lastPointTimeOffsetMs)) return;

                    if (finalSimTimeOffsetMs < firstPointTimeOffsetMs && relayPoints[Object.keys(yamanoko.position[0])[0]]) {
                        mesh.position.copy(relayPoints[Object.keys(yamanoko.position[0])[0]]);
                    } else if (finalSimTimeOffsetMs > lastPointTimeOffsetMs && relayPoints[Object.keys(yamanoko.position[yamanoko.position.length - 1])[0]]) {
                        mesh.position.copy(relayPoints[Object.keys(yamanoko.position[yamanoko.position.length - 1])[0]]);
                    }
                }
            });

            updateTimeDisplay(finalSimTimeOffsetMs);
            updateYamahokoLabels();
            updatePointLabels();
            renderer.render(scene, camera);
        }

        function animate(currentTime) {
            animationFrameId = requestAnimationFrame(animate);
            controls.update();

            if (isPaused) {
                updateYamahokoLabels();
                updatePointLabels();
                renderer.render(scene, camera);
                return;
            }

            if (lastTime === 0) lastTime = currentTime;
            let deltaTime = currentTime - lastTime;
            lastTime = currentTime;

            if (isNaN(deltaTime) || deltaTime <= 0) return;

            simulationClockTimeMs += deltaTime * SIMULATION_SPEED_MULTIPLIER;
            const finalSimTimeOffsetMs = SIMULATION_START_TIME_OFFSET_MS + simulationClockTimeMs;

            if (finalSimTimeOffsetMs >= simulationEndTimeMs) {
                isPaused = true;
                playPauseBtn.textContent = '再生';
                seekBar.value = simulationEndTimeMs;
                updateSceneToTime(simulationEndTimeMs);
                return;
            }
            
            seekBar.value = finalSimTimeOffsetMs;
            updateSceneToTime(finalSimTimeOffsetMs);
        }

        function updateYamahokoLabels() {
            yamahokoLabels.forEach(item => {
                const mesh = item.mesh, label = item.label;
                
                if (!mesh.visible) {
                    label.style.display = 'none';
                    return;
                }

                mesh.updateWorldMatrix(true, false);
                _vector.setFromMatrixPosition(mesh.matrixWorld);
                _vector.y += 10; 
                _vector.project(camera);
                const isBehind = _vector.z > 1;
                label.style.display = isBehind ? 'none' : 'block';
                if (!isBehind) {
                    const x = (_vector.x * .5 + .5) * renderer.domElement.clientWidth;
                    const y = (-_vector.y * .5 + .5) * renderer.domElement.clientHeight;
                    label.style.left = `${x}px`;
                    label.style.top = `${y}px`;
                }
            });
        }
        function updatePointLabels() {
            pointLabels.forEach(item => {
                const point3D = item.position, label = item.label;
                _vector.copy(point3D).project(camera);
                const isBehind = _vector.z > 1;
                label.style.display = isBehind ? 'none' : 'block';
                if (!isBehind) {
                    const x = (_vector.x * .5 + .5) * renderer.domElement.clientWidth;
                    const y = (-_vector.y * .5 + .5) * renderer.domElement.clientHeight;
                    label.style.left = `${x}px`;
                    label.style.top = `${y}px`;
                }
            });
        }
        
        function adjustCamera() {
            const bbox = new THREE.Box3();
            
            if (Object.keys(relayPoints).length > 0) {
                Object.values(relayPoints).forEach(point => {
                    bbox.expandByPoint(point);
                });
            }

            if (buildingModels.length > 0) {
                buildingModels.forEach(model => {
                    bbox.expandByObject(model);
                });
            }

            if (bbox.isEmpty()) {
                camera.position.set(0, 500, 500);
                camera.lookAt(0, 0, 0);
                controls.target.set(0, 0, 0);
                controls.update();
                return;
            }

            const center = new THREE.Vector3(), size = new THREE.Vector3();
            bbox.getCenter(center);
            bbox.getSize(size);
            const maxDim = Math.max(size.x, size.z);
            const fov = camera.fov * (Math.PI / 180);
            const distance = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 1.5;
            camera.position.set(center.x, center.y + distance, center.z);
            camera.lookAt(center);
            controls.target.copy(center);
            controls.update();
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            updateSceneToTime(parseFloat(seekBar.value));
            createTimeMarkers();
        });

        loadData();
    </script>
</body>
</html>
