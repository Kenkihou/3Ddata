<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>日影規制シミュレーターR071130</title>
    <style>
        body { margin: 0; overflow: hidden; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; }
        #container { flex-grow: 1; position: relative; }
        #controls { padding: 10px; background: #f0f0f0; border-top: 1px solid #ccc; display: flex; align-items: center; }
        #timeDisplay { margin-left: 20px; font-weight: bold; }
        #info { 
            position: absolute; 
            top: 10px; 
            left: 10px; 
            background: rgba(255,255,255,0.9); 
            padding: 10px; 
            border-radius: 4px;
            box-shadow: 0 0 5px rgba(0,0,0,0.2);
            pointer-events: none; 
            user-select: none;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="info">
        <strong>設定パラメータ</strong><br>
        日付: 12月22日 (冬至)<br>
        緯度: 北緯 35.02° (京都)<br>
        経度: 東経 135.73°<br>
        時刻基準: 真太陽時 (南中=12:00)<br>
        <hr style="margin: 5px 0; border: none; border-top: 1px solid #ccc;">
        <strong>凡例</strong><br>
        <span style="color:red">■</span> 北(N), <span style="color:blue">■</span> 南(S)<br>
        <span style="color:green">■</span> 東(E), <span style="color:orange">■</span> 西(W)<br>
        <span style="color:#00aaff">■</span> 測定面 (H=4m)
    </div>

    <div id="controls">
        <label for="timeSlider">真太陽時 (8:00 - 16:00):</label>
        <input type="range" id="timeSlider" min="8" max="16" step="0.05" value="8.00" style="width: 300px; margin: 0 10px;">
        <span id="timeDisplay">08:00</span>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.8.0/suncalc.min.js"></script>
    <script src="https://unpkg.com/d3-polygon@1"></script> 
    <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- 設定パラメータ (京都地方気象台) ---
        // 緯度: 35度01分 -> 35 + 1/60 = 35.01666...
        const LATITUDE = 35.0167; 
        // 経度: 135度44分 -> 135 + 44/60 = 135.7333...
        const LONGITUDE = 135.7333;
        
        const DATE_WINTER_SOLSTICE = new Date('2024-12-22T12:00:00'); // 冬至
        const BUILDING_WIDTH = 10;
        const BUILDING_DEPTH = 15;
        const BUILDING_HEIGHT = 20;
        const MEASUREMENT_HEIGHT = 4; // 測定面高さ

        // --- Three.js 初期設定 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xb0c4de); // 空色背景
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / (window.innerHeight - 50), 0.1, 1000);
        camera.position.set(0, 60, 60); 
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight - 50);
        renderer.shadowMap.enabled = true; 
        document.getElementById('container').appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0x606060); 
        scene.add(ambientLight);

        // --- シーン構成 ---

        // 1. 地盤面 (Y=0)
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(1000, 1000), 
            new THREE.MeshLambertMaterial({ color: 0xeeeeee, side: THREE.DoubleSide })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // 2. 建物 (Y=0〜H)
        const building = new THREE.Mesh(
            new THREE.BoxGeometry(BUILDING_WIDTH, BUILDING_HEIGHT, BUILDING_DEPTH),
            new THREE.MeshPhongMaterial({ color: 0x8b0000 })
        );
        building.position.y = BUILDING_HEIGHT / 2;
        building.castShadow = true;
        scene.add(building);

        // 3. 測定面 (Y=4m, 半透明)
        const measurePlane = new THREE.Mesh(
            new THREE.PlaneGeometry(1000, 1000),
            new THREE.MeshBasicMaterial({ color: 0x00aaff, opacity: 0.1, transparent: true, side: THREE.DoubleSide })
        );
        measurePlane.rotation.x = -Math.PI / 2;
        measurePlane.position.y = MEASUREMENT_HEIGHT;
        scene.add(measurePlane);

        // 4. 日影ライン (Line Loop)
        const shadowLine = new THREE.LineLoop(
            new THREE.BufferGeometry(),
            new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 })
        );
        shadowLine.position.y = MEASUREMENT_HEIGHT + 0.05; 
        scene.add(shadowLine);

        // 5. 太陽光源と球
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.0);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048; 
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.left = -50;
        sunLight.shadow.camera.right = 50;
        sunLight.shadow.camera.top = 50;
        sunLight.shadow.camera.bottom = -50;
        scene.add(sunLight);
        scene.add(sunLight.target); 

        const sunSphere = new THREE.Mesh(
            new THREE.SphereGeometry(2, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0xffff00 })
        );
        scene.add(sunSphere);


        // --- 方位記号 (N, S, E, W) ---
        function initCompass() {
            const group = new THREE.Group();
            group.position.set(25, 0.1, 25); // 配置位置
            
            const len = 8;
            // 軸線: N=赤(Z-), S=青(Z+), E=緑(X+), W=橙(X-)
            const axes = [
                { dir: new THREE.Vector3(0,0,-1), col: 0xff0000, txt: 'N' },
                { dir: new THREE.Vector3(0,0, 1), col: 0x0000ff, txt: 'S' },
                { dir: new THREE.Vector3( 1,0,0), col: 0x008000, txt: 'E' },
                { dir: new THREE.Vector3(-1,0,0), col: 0xffa500, txt: 'W' }
            ];

            const loader = new THREE.FontLoader();
            loader.load('https://unpkg.com/three@0.128.0/examples/fonts/helvetiker_regular.typeface.json', (font) => {
                axes.forEach(ax => {
                    const pts = [new THREE.Vector3(0,0,0), ax.dir.clone().multiplyScalar(len)];
                    const geo = new THREE.BufferGeometry().setFromPoints(pts);
                    const mat = new THREE.LineBasicMaterial({ color: ax.col, linewidth: 3 });
                    group.add(new THREE.Line(geo, mat));

                    const tGeo = new THREE.TextGeometry(ax.txt, { font: font, size: 2, height: 0.1 });
                    tGeo.computeBoundingBox();
                    const centerOffset = -0.5 * (tGeo.boundingBox.max.x - tGeo.boundingBox.min.x);
                    tGeo.translate(centerOffset, 0, 0);
                    
                    const tMesh = new THREE.Mesh(tGeo, new THREE.MeshBasicMaterial({ color: ax.col }));
                    const pos = ax.dir.clone().multiplyScalar(len + 1);
                    tMesh.position.set(pos.x, 0.5, pos.z);
                    tMesh.rotation.x = -Math.PI / 2;
                    group.add(tMesh);
                });
                scene.add(group);
            });
        }


        // --- 計算ロジック (真太陽時) ---

        function getSunVector(userHours) {
            // 1. その日の南中時刻(Solar Noon)を取得
            const times = SunCalc.getTimes(DATE_WINTER_SOLSTICE, LATITUDE, LONGITUDE);
            const solarNoon = times.solarNoon;

            // 2. ユーザー入力時刻を南中(12.0)からのオフセットとして適用
            const offsetHours = userHours - 12.0;
            const targetDate = new Date(solarNoon.getTime() + offsetHours * 60 * 60 * 1000);

            // 3. 太陽位置計算
            const sunPos = SunCalc.getPosition(targetDate, LATITUDE, LONGITUDE);
            
            // 4. ベクトル変換 (Three.js座標系へ)
            // SunCalc: 南=0, 東=-PI/2, 西=PI/2
            // Three.js: Z+=南, X+=東, Z-=北
            
            const r = Math.cos(sunPos.altitude);
            
            // X軸(東): -sin(azimuth)
            const x = r * -Math.sin(sunPos.azimuth); 
            const y = Math.sin(sunPos.altitude);
            // Z軸(南): cos(azimuth)
            const z = r * Math.cos(sunPos.azimuth);

            return new THREE.Vector3(x, y, z).normalize();
        }

        function calculateShadow(sunVec) {
            if (sunVec.y <= 0) return null;

            const hw = BUILDING_WIDTH / 2;
            const hd = BUILDING_DEPTH / 2;
            const h  = BUILDING_HEIGHT;
            const mh = MEASUREMENT_HEIGHT;

            // 頂点リスト (建物上部 + 測定面レベルの断面)
            const points3d = [
                new THREE.Vector3( hw, h,  hd), new THREE.Vector3(-hw, h,  hd),
                new THREE.Vector3(-hw, h, -hd), new THREE.Vector3( hw, h, -hd),
                new THREE.Vector3( hw, mh,  hd), new THREE.Vector3(-hw, mh,  hd),
                new THREE.Vector3(-hw, mh, -hd), new THREE.Vector3( hw, mh, -hd),
            ];

            const projected2d = [];

            // 投影計算
            points3d.forEach(p => {
                const t = (mh - p.y) / sunVec.y; 
                const px = p.x + t * sunVec.x;
                const pz = p.z + t * sunVec.z;
                projected2d.push([px, pz]);
            });

            // 凸包計算
            const hull = d3.polygonHull(projected2d);
            if (!hull || hull.length < 3) return null;

            return hull.map(p => new THREE.Vector3(p[0], mh, p[1]));
        }

        function update() {
            const tVal = parseFloat(document.getElementById('timeSlider').value);
            const h = Math.floor(tVal);
            const m = Math.round((tVal % 1) * 60);
            
            document.getElementById('timeDisplay').innerText = 
                `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')} (真太陽時)`;

            const sunVec = getSunVector(tVal);

            // 光源と球の移動
            const dist = 50;
            sunLight.position.copy(sunVec).multiplyScalar(dist);
            sunSphere.position.copy(sunVec).multiplyScalar(40);

            // 影ポリゴン計算
            const shadowPoints = calculateShadow(sunVec);

            // 線画更新
            shadowLine.geometry.dispose();
            if (shadowPoints) {
                const pts = [...shadowPoints, shadowPoints[0]]; 
                shadowLine.geometry.setFromPoints(pts);
            } else {
                shadowLine.geometry = new THREE.BufferGeometry();
            }
            
            renderer.render(scene, camera);
        }

        // --- 実行開始 ---
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.addEventListener('change', () => renderer.render(scene, camera));
        
        document.getElementById('timeSlider').addEventListener('input', update);
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / (window.innerHeight - 50);
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight - 50);
            update();
        });

        initCompass();
        update();

    </script>
</body>
</html>
