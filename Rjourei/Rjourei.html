<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIチャットボット | お問い合わせ</title>
    <!-- Tailwind CSSを読み込んで、基本的なスタイリングを行います -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* フォントをInterに設定 */
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100">

    <div class="container mx-auto p-4 sm:p-6 lg:p-8">
        <!-- ページ全体のヘッダー -->
        <header class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-bold text-gray-800">AIチャットボット</h1>
            <p class="text-gray-600 mt-2">ご不明な点について、AIチャットボットがお答えします。</p>
        </header>

        <!-- チャットボットを埋め込むコンテナ -->
        <main class="max-w-4xl mx-auto bg-white rounded-2xl shadow-2xl overflow-hidden">
            <!-- ユーザーから提供されたDifyチャットボットのiframe -->
            <iframe
                src="https://udify.app/chatbot/GktEaqipQqxUyMcl"
                style="width: 100%; height: 100%; min-height: 700px; border: none;"
                frameborder="0"
                allow="microphone"
            >
            </iframe>
        </main>

        <!-- フッター -->
        <footer class="text-center mt-8">
            <p class="text-gray-500 text-sm">&copy; 2024 Your Company. All rights reserved.</p>
        </footer>
    </div>

</body>
</html>
