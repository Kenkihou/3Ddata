<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mitoooos（みとおす）｜まちを見通す</title>
  <!--
    Mitoooos（景観検討シミュレーター）の入口。
    ・パスワードが合えば、このページの中に本体（/Keikan_sim202607/）を全画面の iframe で開く。
      アドレス欄はこのページの URL のまま。同じ kenkihou.github.io の下なので、本体はふつうに動く。
    ・本体の側は、公開サイトで「この入口の中」以外から開かれると、ここへ戻す（本体の index.html の先頭）。
    ・照合はブラウザの中だけ（SHA-256）。平文のパスワードはどこにも置かない。
      ⚠️ 鍵ではなく目隠し。本体の URL を知っていれば、開発者ツールなどで回り込める。
    ・覚えておかない。再読み込みのたびにパスワードを聞く（2026-10-14 ユーザー要望）。
      以前に覚えていた印（sessionStorage の mitoooos_gate）は開いたときに消す。
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #eef2f6; --card: #ffffff; --ink: #1f2d3a; --muted: #6b7a89;
      --blue: #1f5fbf; --blue-d: #174a96; --line: #d5dde6; --err: #c0392b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg); color: var(--ink);
      font-family: 'Zen Maru Gothic', 'Hiragino Sans', 'Yu Gothic UI', 'Meiryo', sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .card {
      width: 100%; max-width: 380px; background: var(--card); border-radius: 18px;
      padding: 36px 28px 28px; box-shadow: 0 18px 50px rgba(20, 40, 70, .14); text-align: center;
    }
    /* 見出しは本体のトップページ（01 index.html の #portal-title）と同じ形：添え書き＋ Mit＋4つの目玉＋s */
    .tag {
      margin: 0 0 10px; display: flex; align-items: center; justify-content: center; gap: 10px;
      font-size: 15px; font-weight: 700; letter-spacing: .3em; color: #0f6f78;
    }
    .tag::before, .tag::after {
      content: ''; width: 26px; height: 2px; border-radius: 1px;
      background: linear-gradient(90deg, rgba(15, 111, 120, 0), rgba(15, 111, 120, .55));
    }
    .tag::after { transform: scaleX(-1); margin-left: -.3em; }
    .logo {
      margin: 0; display: flex; align-items: baseline; justify-content: center;
      font-family: 'Fredoka', sans-serif; font-size: 54px; font-weight: 600; line-height: 1; letter-spacing: .5px;
    }
    .logo .t { background: linear-gradient(180deg, #0a52b8 0%, #0a3a8f 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .logo .t-r { background: linear-gradient(180deg, #0f7d86 0%, #0b5c6e 100%); -webkit-background-clip: text; background-clip: text; }
    .logo .brand-eye {
      width: .6em; height: .6em; margin: 0 .012em; position: relative; top: .035em; overflow: visible;
      filter: drop-shadow(0 2px 3px rgba(15, 23, 42, .18));
    }
    .logo .brand-eye:first-of-type { margin-left: .04em; }
    .logo .brand-eye + .t { margin-left: .04em; }
    .sub { margin: 6px 0 26px; color: var(--muted); font-size: 13px; line-height: 1.6; }
    label { display: block; text-align: left; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
    .row { display: flex; gap: 8px; }
    /* 入力欄と、中の右端の「表示する」目のボタン */
    .pw-box { position: relative; flex: 1; min-width: 0; display: flex; }
    #pw {
      flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 11px 44px 11px 12px;
      border: 1.5px solid var(--line); border-radius: 10px; outline: none; background: #fbfcfd;
    }
    #pw:focus { border-color: var(--blue); background: #fff; }
    #pw::-ms-reveal, #pw::-ms-clear { display: none; }   /* Edge の印は入力中しか出ないので、自前のボタンに一本化 */
    .eye-btn {
      position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
      width: 36px; height: 36px; padding: 0; border: 0; border-radius: 8px;
      background: transparent; color: #64748b; display: flex; align-items: center; justify-content: center;
    }
    .eye-btn:hover { background: #eef2f6; color: var(--ink); }
    .eye-btn svg { width: 22px; height: 22px; }
    .eye-btn .slash { display: none; }
    .eye-btn[aria-pressed="true"] { color: var(--blue); }
    .eye-btn[aria-pressed="true"] .slash { display: inline; }
    button {
      font: inherit; font-weight: 700; font-size: 15px; padding: 0 18px; border: 0; border-radius: 10px;
      background: var(--blue); color: #fff; cursor: pointer;
    }
    button:hover { background: var(--blue-d); }
    button:disabled { opacity: .6; cursor: default; }
    .msg { min-height: 1.6em; margin: 12px 0 0; font-size: 13px; color: var(--err); }
    .shake { animation: shake .35s; }
    @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: #fff; }
    body.open { padding: 0; }
    body.open .card { display: none; }
    body.open #app { display: block; }
  </style>
</head>
<body>
  <form class="card" id="gate" autocomplete="off">
    <p class="tag">まちを見通す</p>
    <h1 class="logo" aria-label="Mitoooos（みとおす）"><span class="t" aria-hidden="true">Mit</span><svg class="brand-eye" viewBox="0 0 100 100" aria-hidden="true"><line x1="20.4" y1="12.2" x2="11.8" y2="1.1" stroke="#8a5c35" stroke-width="7" stroke-linecap="round"/><line x1="40.0" y1="3.0" x2="37.1" y2="-10.6" stroke="#8a5c35" stroke-width="7" stroke-linecap="round"/><line x1="61.6" y1="3.4" x2="65.0" y2="-10.2" stroke="#8a5c35" stroke-width="7" stroke-linecap="round"/><circle cx="50" cy="50" r="42" fill="#ffffff" stroke="#8a5c35" stroke-width="12"/><ellipse cx="60" cy="43" rx="15" ry="18" fill="#14213d"/><circle cx="65" cy="36" r="5" fill="#ffffff"/></svg><svg class="brand-eye" viewBox="0 0 100 100" aria-hidden="true"><line x1="20.4" y1="12.2" x2="11.8" y2="1.1" stroke="#4f9a5b" stroke-width="7" stroke-linecap="round"/><line x1="40.0" y1="3.0" x2="37.1" y2="-10.6" stroke="#4f9a5b" stroke-width="7" stroke-linecap="round"/><line x1="61.6" y1="3.4" x2="65.0" y2="-10.2" stroke="#4f9a5b" stroke-width="7" stroke-linecap="round"/><circle cx="50" cy="50" r="42" fill="#ffffff" stroke="#4f9a5b" stroke-width="12"/><ellipse cx="60" cy="43" rx="15" ry="18" fill="#14213d"/><circle cx="65" cy="36" r="5" fill="#ffffff"/></svg><svg class="brand-eye" viewBox="0 0 100 100" aria-hidden="true"><line x1="20.4" y1="12.2" x2="11.8" y2="1.1" stroke="#10707a" stroke-width="7" stroke-linecap="round"/><line x1="40.0" y1="3.0" x2="37.1" y2="-10.6" stroke="#10707a" stroke-width="7" stroke-linecap="round"/><line x1="61.6" y1="3.4" x2="65.0" y2="-10.2" stroke="#10707a" stroke-width="7" stroke-linecap="round"/><circle cx="50" cy="50" r="42" fill="#ffffff" stroke="#10707a" stroke-width="12"/><ellipse cx="60" cy="43" rx="15" ry="18" fill="#14213d"/><circle cx="65" cy="36" r="5" fill="#ffffff"/></svg><svg class="brand-eye" viewBox="0 0 100 100" aria-hidden="true"><line x1="20.4" y1="12.2" x2="11.8" y2="1.1" stroke="#3b8be6" stroke-width="7" stroke-linecap="round"/><line x1="40.0" y1="3.0" x2="37.1" y2="-10.6" stroke="#3b8be6" stroke-width="7" stroke-linecap="round"/><line x1="61.6" y1="3.4" x2="65.0" y2="-10.2" stroke="#3b8be6" stroke-width="7" stroke-linecap="round"/><circle cx="50" cy="50" r="42" fill="#ffffff" stroke="#3b8be6" stroke-width="12"/><ellipse cx="60" cy="43" rx="15" ry="18" fill="#14213d"/><circle cx="65" cy="36" r="5" fill="#ffffff"/></svg><span class="t t-r" aria-hidden="true">s</span></h1>
    <p class="sub">パスワードを入れてください</p>
    <label for="pw">パスワード</label>
    <div class="row">
      <span class="pw-box">
        <input type="password" id="pw" autocomplete="current-password" autofocus>
        <button type="button" class="eye-btn" id="eye" aria-label="パスワードを表示する" aria-pressed="false" title="パスワードを表示する">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
            <path class="slash" d="M4 4l16 16"/>
          </svg>
        </button>
      </span>
      <button type="submit" id="go">開く</button>
    </div>
    <p class="msg" id="msg" role="alert"></p>
  </form>
  <iframe id="app" title="Mitoooos" allow="fullscreen; clipboard-read; clipboard-write"></iframe>

  <script>
    (function () {
      // 本体（同じ kenkihou.github.io の下）
      var APP_URL = '/Keikan_sim202607/';
      // SHA-256('mitoooos:' + パスワード)。パスワードを変えるときはここを書き換える
      var HASH = 'c73bb1bdf5c0d5b3e5438ca6b00422ba2e469014958760a73ab079e7b763f57a';

      var form = document.getElementById('gate');
      var pw = document.getElementById('pw');
      var go = document.getElementById('go');
      var msg = document.getElementById('msg');
      var app = document.getElementById('app');
      var eye = document.getElementById('eye');

      // 目のボタン：押すたびにパスワードの表示・非表示を切り替える（カーソルの位置は保つ）
      eye.addEventListener('click', function () {
        var show = pw.type === 'password';
        var a = pw.selectionStart, b = pw.selectionEnd;
        pw.type = show ? 'text' : 'password';
        eye.setAttribute('aria-pressed', String(show));
        var label = show ? 'パスワードを隠す' : 'パスワードを表示する';
        eye.setAttribute('aria-label', label); eye.title = label;
        pw.focus();
        try { pw.setSelectionRange(a, b); } catch (e) { /* 無視 */ }
      });

      // 以前の版が覚えていた印を消す（いまは覚えない）
      try { sessionStorage.removeItem('mitoooos_gate'); } catch (e) { /* 無視 */ }

      function open() {
        document.body.classList.add('open');
        app.src = APP_URL;
        // 題名は本体のものを写す（同じサイトなので読める）
        app.addEventListener('load', function () {
          try { if (app.contentDocument && app.contentDocument.title) document.title = app.contentDocument.title; } catch (e) { /* そのまま */ }
        });
      }

      async function sha256(text) {
        var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
        return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
      }

      form.addEventListener('submit', async function (ev) {
        ev.preventDefault();
        msg.textContent = '';
        go.disabled = true;
        try {
          var h = await sha256('mitoooos:' + pw.value);
          if (h === HASH) {
            open();
          } else {
            msg.textContent = 'パスワードが違います';
            form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
            pw.select();
          }
        } catch (e) {
          msg.textContent = 'このブラウザでは確認できませんでした';
        } finally {
          go.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
