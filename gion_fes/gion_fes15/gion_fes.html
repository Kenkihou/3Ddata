    <script id="vertexShader" type="x-shader/x-vertex">
        attribute float _id;
        varying vec3 vNormal;
        varying float vBuildingID;
        varying vec3 vWorldPosition;
        
        void main() {
            vBuildingID = _id;
            vNormal = normalize(normalMatrix * normal);
            vWorldPosition = (modelMatrix * vec4(position, 1.0)).xyz;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    </script>
    <script id="fragmentShader" type="x-shader/x-fragment">
        varying float vBuildingID;
        varying vec3 vNormal;
        varying vec3 vWorldPosition;

        uniform float uSelectedID;
        uniform vec3 uBaseColor;
        uniform vec3 uHighlightColor;
        
        void main() {
            if (vWorldPosition.z > 800.0 || vWorldPosition.z < -800.0 || vWorldPosition.x < -1050.0 || vWorldPosition.x > 950.0) {
                discard;
            }

            vec3 finalColor = uBaseColor;
            if (vBuildingID > 0.0 && vBuildingID == uSelectedID) {
                finalColor = uHighlightColor;
            }

            vec3 lightDirection = normalize(vec3(0.5, 1.0, 0.75));
            float ambientLight = 0.4;
            float diffuse = max(dot(vNormal, lightDirection), 0.0);
            float brightness = ambientLight + (1.0 - ambientLight) * diffuse;
            vec3 lightedColor = finalColor * brightness;
            
            gl_FragColor = vec4(lightedColor, 1.0);
        }
    </script>

    <script id="skyVertexShader" type="x-shader/x-vertex">
        varying vec3 vWorldPosition;
        void main() {
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            gl_Position = projectionMatrix * mvPosition;
            gl_Position.z = gl_Position.w; 
            vWorldPosition = position;
        }
    </script>
    <script id="skyFragmentShader" type="x-shader/x-fragment">
        varying vec3 vWorldPosition;
        uniform vec3 uTopColor;
        uniform vec3 uBottomColor;

        void main() {
            float h = normalize(vWorldPosition).y;
            float t = (h + 1.0) / 2.0;
            vec3 finalColor = mix(uBottomColor, uTopColor, smoothstep(0.5, 0.7, t));
            float alpha = smoothstep(0.5, 0.55, t);
            gl_FragColor = vec4(finalColor, alpha);
        }
    </script>

    <script id="mapTileVertexShader" type="x-shader/x-vertex">
        varying vec2 vUv;
        varying vec3 vWorldPosition;
        void main() {
            vUv = uv;
            vec4 worldPosition = modelMatrix * vec4(position, 1.0);
            vWorldPosition = worldPosition.xyz;
            gl_Position = projectionMatrix * viewMatrix * worldPosition;
        }
    </script>
    <script id="mapTileFragmentShader" type="x-shader/x-fragment">
        varying vec2 vUv;
        varying vec3 vWorldPosition;

        uniform sampler2D tMap;
        uniform float uRadius;
        uniform float uFadeDistance;

        void main() {
            float dist = length(vWorldPosition.xz);
            float alpha = smoothstep(uRadius, uRadius - uFadeDistance, dist);

            if (alpha < 0.01) {
                discard;
            }

            vec4 texColor = texture2D(tMap, vUv);
            gl_FragColor = vec4(texColor.rgb, texColor.a * alpha);
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

        class GionSimulationApp {
            constructor() {
                const proj_WGS84 = '+proj=longlat +datum=WGS84 +no_defs';
                const proj_JGD2011 = '+proj=tmerc +lat_0=33 +lon_0=135.8333333333333 +k=0.9999 +x_0=0 +y_0=0 +ellps=GRS80 +units=m +no_defs';
                this.wgs84_to_jgd2011 = proj4(proj_WGS84, proj_JGD2011);

                this.setupState();
                this.setupCore();
                this.setupDOM();
                this.setupConstants();
                this.loadInitialData();
            }

            setupCore() {
                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(75, (window.innerWidth - 320) / window.innerHeight, 0.1, 8000);
                
                const canvas = document.querySelector('.webgl-canvas');
                this.renderer = new THREE.WebGLRenderer({ antialias: true, canvas: canvas, alpha: true });
                this.renderer.setClearColor(0x000000, 0);
                this.renderer.setSize(window.innerWidth, window.innerHeight); 
                this.renderer.setPixelRatio(window.devicePixelRatio);
                this.renderer.autoClear = false;

                this.cssScene = new THREE.Scene();
                this.cssRenderer = new CSS3DRenderer();
                const leftPanelWidth = 320;
                this.cssRenderer.setSize(window.innerWidth - leftPanelWidth, window.innerHeight); 
                document.getElementById('css3d-container').appendChild(this.cssRenderer.domElement);

                this.controls = new OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;
                this.controls.dampingFactor = 0.25;
                this.controls.minPolarAngle = 0.01;
                this.controls.maxPolarAngle = Math.PI / 2 - 0.01;

                this.camera.position.set(10, 1200, 666);
                const rotX = -56.2 * (Math.PI / 180);
                this.camera.rotation.set(rotX, 0, 0);
                const direction = new THREE.Vector3(0, 0, -1).applyQuaternion(this.camera.quaternion);
                const distance = 840;
                const targetPosition = new THREE.Vector3().addVectors(this.camera.position, direction.multiplyScalar(distance));
                this.controls.target.copy(targetPosition);
                this.controls.update();
                
                this.setupLights();
                this.setupClipping();

                window.addEventListener('resize', this.onWindowResize.bind(this));
            }

            onWindowResize() {
                const leftPanelWidth = 320;
                const mainViewWidth = window.innerWidth - leftPanelWidth;
                const mainViewHeight = window.innerHeight;

                this.camera.aspect = mainViewWidth / mainViewHeight;
                this.camera.updateProjectionMatrix();
                
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.cssRenderer.setSize(mainViewWidth, mainViewHeight);
            }
            
            setupClipping() {
                this.clippingPlanes = [
                    new THREE.Plane(new THREE.Vector3(0, 0, -1), 800),
                    new THREE.Plane(new THREE.Vector3(0, 0, 1), 800),
                    new THREE.Plane(new THREE.Vector3(1, 0, 0), 1050),
                    new THREE.Plane(new THREE.Vector3(-1, 0, 0), 950)
                ];
                this.renderer.localClippingEnabled = true;
            }
            
            setupDOM() {
                this.buildingInfoDisplay = document.getElementById('building-info-display');
                this.playPauseBtn = document.getElementById('playPauseBtn');
                this.seekBar = document.getElementById('seekBar');
                this.timeMarkersContainer = document.getElementById('time-markers-container');
                this.cameraInfoDisplay = document.getElementById('camera-info-display');
                this.visibilityControls = document.getElementById('visibility-controls');

                this.subCameraLabel = document.getElementById('sub-camera-label');
                this.subCameraSwitchBtn = document.getElementById('sub-camera-switch-btn');
                this.cameraSelectModal = document.getElementById('camera-select-modal');
                this.cameraSelectList = document.getElementById('camera-select-list');
                this.modalCloseBtn = document.querySelector('.modal-close-btn');

                this.youtubePlayer = document.getElementById('youtube-player');
                this.disableVideoSyncCheckbox = document.getElementById('disable-video-sync');

                this.mapSelectContainer = document.getElementById('map-select-container');
                this.toggleMapBtn = document.getElementById('toggle-map-btn');
            }

            setupConstants() {
                this.SIMULATION_SPEED_MULTIPLIER = 120;
                this.START_HOUR = 8;
                this.START_MINUTE = 25;
                this.SIMULATION_START_TIME_OFFSET_MS = (this.START_HOUR * 3600 + this.START_MINUTE * 60) * 1000;
                this.YAMAHOKO_TITLES = {
                    "長刀鉾": "01 くじ取らず",
                    "占出山": "02 山一番",
                    "霰天神山": "03 山二番",
                    "山伏山": "04 山三番",
                    "函谷鉾": "05 くじ取らず",
                    "油天神山": "06 山四番",
                    "綾傘鉾": "07 傘一番",
                    "蟷螂山": "08 山五番",
                    "菊水鉾": "09 鉾一番",
                    "保昌山": "10 山六番",
                    "伯牙山": "11 山七番",
                    "白楽天山": "12 山八番",
                    "月鉾": "13 鉾二番",
                    "木賊山": "14 山九番",
                    "四条傘鉾": "15 傘二番",
                    "太子山": "16 山十番",
                    "鶏鉾": "17 鉾三番",
                    "芦刈山": "18 山十一番",
                    "郭巨山": "19 山十二番",
                    "孟宗山": "20 山十三番",
                    "放下鉾": "21 くじ取らず",
                    "岩戸山": "22 くじ取らず",
                    "船鉾": "23 くじ取らず"
                };
            
                this.MAP_CENTER_LAT = 35.0052083333333;
                this.MAP_CENTER_LON = 135.7625;
                this.SKY_DOME_RADIUS = 2000;
                this.MAP_AREA_METERS = this.SKY_DOME_RADIUS * 2;
                this.MAP_ZOOM_LEVEL = 17;
                this.MAP_YEAR = 2020;
            }
            
            setupState() {
                this.relayPoints = {}; this.yamahokoData = [];
                this.yamahokoMeshes = []; 
                this.yamahokoLabels = []; 
                this.pointLabels = [];
                this.subCameraYamahokoLabels = [];
                //【変更点】サブカメラ用の地名ラベル配列は不要なため削除
                // this.subCameraPointLabels = [];

                this.visibilityToggleButtons = [];
                this.toggleVisibilityBtn = null;
                this.lastTime = 0; this.simulationClockTimeMs = 0;
                this.animationFrameId = null; this.simulationEndTimeMs = 0;
                this.isPaused = true; this.wasPlayingBeforeSeek = false;
                
                this.interactiveMeshes = [];
                this.interactiveBuildingGroup = new THREE.Group();
                this.customBuildingMaterial = null;
                this.buildingAttributes = {};

                this.cssScene = null;
                this.cssRenderer = null;
                
                this.naginataBokoModel = null;
                this.cssTimeTextPivot = null;

            async loadInitialData() {
                try {
                    const [relayRes, yamahokoRes, buildingAttrRes] = await Promise.all([
                        fetch('Relay_point.json'),
                        fetch('yamahoko2.json'),
                        fetch('../gion_asset/merged_merged_output.json'),
                        this.loadAllModels(),
                    ]);

                    if (!relayRes.ok) throw new Error(`Relay_point.json: ${relayRes.statusText}`);
                    if (!yamahokoRes.ok) throw new Error(`yamahoko2.json: ${yamahokoRes.statusText}`);
                    if (!buildingAttrRes.ok) throw new Error(`merged_merged_output.json: ${buildingAttrRes.statusText}`);
                    
                    const relayData = await relayRes.json();
                    this.yamahokoData = await yamahokoRes.json();
                    const buildingAttrData = await buildingAttrRes.json();

                    buildingAttrData.forEach(attr => {
                        const key = attr.sequential_id || attr.serial_number;
                        if (key) {
                            this.buildingAttributes[key] = attr;
                        }
                    });

                    relayData.forEach(p => {
                        if(p.location && p.location.x && p.location.y && p.location.z) {
                           this.relayPoints[p.name] = new THREE.Vector3(parseFloat(p.location.x), parseFloat(p.location.z), -parseFloat(p.location.y));
                        }
                    });
                    
                    await this.loadMapTiles(); 
                    
                    this.setupSubCameras();
                    this.initializeSceneObjects();
                    this.setupUI();

                    document.getElementById('loading-overlay').style.display = 'none';
                    this.updateSceneToTime(this.SIMULATION_START_TIME_OFFSET_MS);
                    this.animationFrameId = requestAnimationFrame(this.animate.bind(this));

                } catch (error) {
                    console.error('初期データ読み込みエラー:', error);
                    document.getElementById('loading-message').textContent = 'データの読み込みに失敗しました。';
                }
            }
            
            async loadAllModels() {
                const loader = new GLTFLoader();
                const dracoLoader = new DRACOLoader();
                dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/libs/draco/gltf/');
                loader.setDRACOLoader(dracoLoader);
                
                const interactiveModelPaths = [
                    '../gion_asset/bld52353690_3.glb', '../gion_asset/bld52353691_3.glb',
                    '../gion_asset/bld52354600_3.glb', '../gion_asset/bld52354601_3.glb',
                    '../gion_asset/bld52354610_3.glb', '../gion_asset/bld52354611_3.glb',
                ];
                const naginataBokoPath = '../gion_asset/長刀鉾.glb';

                this.customBuildingMaterial = this.createCustomMaterial();

                const interactivePromises = interactiveModelPaths.map(path => loader.loadAsync(path).catch(e => console.error(`Failed to load ${path}`, e)));
                const naginataBokoPromise = loader.loadAsync(naginataBokoPath).catch(e => console.error(`Failed to load ${naginataBokoPath}`, e));

                const [interactiveGltfs, naginataBokoGltf] = await Promise.all([
                    Promise.all(interactivePromises),
                    naginataBokoPromise
                ]);

                interactiveGltfs.forEach(gltf => {
                    if(!gltf) return;
                    const model = gltf.scene;
                    model.traverse(object => {
                        if (object.isMesh) {
                            object.material = this.customBuildingMaterial;
                            this.interactiveMeshes.push(object);
                        }
                    });
                    this.interactiveBuildingGroup.add(model);
                });
                this.scene.add(this.interactiveBuildingGroup);

                if (naginataBokoGltf) {
                    this.naginataBokoModel = naginataBokoGltf.scene;
                    this.naginataBokoModel.traverse(child => {
                        if (child.isMesh) {
                            child.material.clippingPlanes = this.clippingPlanes;
                            child.material.clipIntersection = false;
                        }
                    });
                    console.log('長刀鉾モデル読み込み完了');
                }

                console.log('3Dモデル（建物・山鉾）読み込み完了');
            }

            lonLatToTile(lon, lat, zoom) {
                const x = Math.floor((lon / 180 + 1) * Math.pow(2, zoom) / 2);
                const y = Math.floor((-Math.log(Math.tan((45 + lat / 2) * Math.PI / 180)) + Math.PI) * Math.pow(2, zoom) / (2 * Math.PI));
                return { x, y };
            }
            
            tileToLonLat(x, y, zoom) {
                const n = Math.pow(2, zoom);
                const lon_deg = x / n * 360.0 - 180.0;
                const lat_rad = Math.atan(Math.sinh(Math.PI * (1 - 2 * y / n)));
                const lat_deg = lat_rad * 180.0 / Math.PI;
                return { lon: lon_deg, lat: lat_deg };
            }

            async loadMapTiles() {
                const oldMapGroup = this.mapGroup;

                // ▼▼▼【ここから修正】▼▼▼
                // ローカル画像（用途地域図、高度地区図）が選択された場合の処理
                if (this.currentMapLayer === 'youto' || this.currentMapLayer === 'kodo') {
                    const textureLoader = new THREE.TextureLoader();
                    const newMapGroup = new THREE.Group();
                    
                    const fileName = this.currentMapLayer === 'youto' ? '用途地域.jpg' : '高度地区.jpg';
                    const layerName = this.currentMapLayer === 'youto' ? '用途地域図' : '高度地区図';

                    try {
                        const texture = await textureLoader.loadAsync(fileName);
                        
                        const geometry = new THREE.PlaneGeometry(2000, 2000);
                        const material = new THREE.ShaderMaterial({
                            vertexShader: document.getElementById('mapTileVertexShader').textContent,
                            fragmentShader: document.getElementById('mapTileFragmentShader').textContent,
                            uniforms: {
                                tMap: { value: texture },
                                uRadius: { value: this.SKY_DOME_RADIUS },
                                uFadeDistance: { value: 300.0 }
                            },
                            transparent: true
                        });
                        
                        const plane = new THREE.Mesh(geometry, material);
                        plane.rotation.x = -Math.PI / 2;
                        newMapGroup.add(plane);

                        this.scene.add(newMapGroup);
                        this.mapGroup = newMapGroup;

                        if (oldMapGroup) {
                            this.scene.remove(oldMapGroup);
                            oldMapGroup.traverse(child => {
                                if (child.isMesh) {
                                    if (child.geometry) child.geometry.dispose();
                                    if (child.material) {
                                        if (child.material.uniforms && child.material.uniforms.tMap.value) {
                                            child.material.uniforms.tMap.value.dispose();
                                        }
                                        child.material.dispose();
                                    }
                                }
                            });
                        }
                        console.log(`地図レイヤー '${layerName}' の読み込みが完了し、表示を更新しました。`);
                    } catch (err) {
                        console.error(`「${fileName}」の読み込みに失敗しました。ファイルがHTMLと同じ階層にあるか確認してください。`, err);
                    }
                    return;
                }
                // ▲▲▲【ここまで修正】▲▲▲

                const textureLoader = new THREE.TextureLoader();
                const tileUrlTemplate = this.mapLayers[this.currentMapLayer].url;
                
                const newMapGroup = new THREE.Group();
                const promises = [];

                const centerTile = this.lonLatToTile(this.MAP_CENTER_LON, this.MAP_CENTER_LAT, this.MAP_ZOOM_LEVEL);
                const centerJGD = this.wgs84_to_jgd2011.forward([this.MAP_CENTER_LON, this.MAP_CENTER_LAT]);
                const centerMeters = { x: centerJGD[0], y: centerJGD[1] };

                const metersPerPixel = (Math.cos(this.MAP_CENTER_LAT * Math.PI / 180) * 2 * Math.PI * 6378137) / (256 * Math.pow(2, this.MAP_ZOOM_LEVEL));
                const tileSideMetersApprox = 256 * metersPerPixel;
                const tileOffset = Math.ceil((this.SKY_DOME_RADIUS) / tileSideMetersApprox);

                for (let i = -tileOffset; i <= tileOffset; i++) {
                    for (let j = -tileOffset; j <= tileOffset; j++) {
                        
                        const tileX = centerTile.x + i;
                        const tileY = centerTile.y + j;
                        
                        const tileUrl = tileUrlTemplate.replace('{z}', this.MAP_ZOOM_LEVEL).replace('{x}', tileX).replace('{y}', tileY);
                        
                        const promise = textureLoader.loadAsync(tileUrl).then(texture => {
                            const topLeft = this.tileToLonLat(tileX, tileY, this.MAP_ZOOM_LEVEL);
                            const topRight = this.tileToLonLat(tileX + 1, tileY, this.MAP_ZOOM_LEVEL);
                            const bottomLeft = this.tileToLonLat(tileX, tileY + 1, this.MAP_ZOOM_LEVEL);
                            const bottomRight = this.tileToLonLat(tileX + 1, tileY + 1, this.MAP_ZOOM_LEVEL);

                            const v0_jgd = this.wgs84_to_jgd2011.forward([topLeft.lon, topLeft.lat]);
                            const v1_jgd = this.wgs84_to_jgd2011.forward([bottomLeft.lon, bottomLeft.lat]);
                            const v2_jgd = this.wgs84_to_jgd2011.forward([topRight.lon, topRight.lat]);
                            const v3_jgd = this.wgs84_to_jgd2011.forward([bottomRight.lon, bottomRight.lat]);

                            const v0 = { x: v0_jgd[0] - centerMeters.x, z: -(v0_jgd[1] - centerMeters.y) };
                            const v1 = { x: v1_jgd[0] - centerMeters.x, z: -(v1_jgd[1] - centerMeters.y) };
                            const v2 = { x: v2_jgd[0] - centerMeters.x, z: -(v2_jgd[1] - centerMeters.y) };
                            const v3 = { x: v3_jgd[0] - centerMeters.x, z: -(v3_jgd[1] - centerMeters.y) };

                            const vertices = new Float32Array([
                                v0.x, 0, v0.z, v1.x, 0, v1.z, v2.x, 0, v2.z, v3.x, 0, v3.z  
                            ]);

                            const uvs = new Float32Array([0, 1, 0, 0, 1, 1, 1, 0]);

                            const indices = new Uint16Array([0, 1, 2, 2, 1, 3]);
                            
                            const geometry = new THREE.BufferGeometry();
                            geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
                            geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
                            geometry.setIndex(new THREE.BufferAttribute(indices, 1));
                            geometry.computeVertexNormals();
                            
                            const material = new THREE.ShaderMaterial({
                                vertexShader: document.getElementById('mapTileVertexShader').textContent,
                                fragmentShader: document.getElementById('mapTileFragmentShader').textContent,
                                uniforms: {
                                    tMap: { value: texture },
                                    uRadius: { value: this.SKY_DOME_RADIUS },
                                    uFadeDistance: { value: 300.0 }
                                },
                                transparent: true
                            });
                            const plane = new THREE.Mesh(geometry, material);
                            newMapGroup.add(plane);

                        }).catch(err => {});
                        promises.push(promise);
                    }
                }
                
                await Promise.all(promises);

                this.scene.add(newMapGroup);
                this.mapGroup = newMapGroup;

                if (oldMapGroup) {
                    this.scene.remove(oldMapGroup);
                    oldMapGroup.traverse(child => {
                        if (child.isMesh) {
                            if (child.geometry) child.geometry.dispose();
                            if (child.material) {
                                if (child.material.uniforms && child.material.uniforms.tMap.value) {
                                    child.material.uniforms.tMap.value.dispose();
                                }
                                child.material.dispose();
                            }
                        }
                    });
                }

                console.log(`地図レイヤー '${this.currentMapLayer}' の読み込みが完了し、表示を更新しました。`);
            }

            addHtmlText() {
                this.htmlTextPivot = new THREE.Object3D();
                this.cssScene.add(this.htmlTextPivot);

                const text = "令和７年７月１７日山鉾巡行（前祭）のシミュレーションツールです。";
                const radius = this.SKY_DOME_RADIUS * 0.9; 
                
                const tempElement = document.createElement('div');
                tempElement.className = 'text-label';
                tempElement.style.position = 'absolute';
                tempElement.style.visibility = 'hidden';
                document.body.appendChild(tempElement);
                const fontSizePx = parseFloat(window.getComputedStyle(tempElement).fontSize);
                document.body.removeChild(tempElement);
                
                const charWidth3D = fontSizePx * 1.0; 
                const characterSpacingAngle = charWidth3D / radius;

                let currentAngle = -Math.PI / 2;

                for (let i = 0; i < text.length; i++) {
                    const char = text[i];
                    
                    if (char === ' ') {
                        currentAngle += characterSpacingAngle;
                        continue;
                    }

                    const element = document.createElement('div');
                    element.className = 'text-label';
                    element.textContent = char;

                    const cssObject = new CSS3DObject(element);
                    
                    const x = radius * Math.cos(currentAngle);
                    const z = radius * Math.sin(currentAngle);
                    cssObject.position.set(x, 150, z);
                    
                    cssObject.rotation.y = -currentAngle - Math.PI / 2;

                    this.htmlTextPivot.add(cssObject);
                    
                    currentAngle += characterSpacingAngle;
                }
            }

            timeToMsOffset(timeStr) {
                 if (typeof timeStr !== 'string' || !timeStr.includes(':')) return NaN;
                 const parts = timeStr.split(':').map(Number);
                 if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
                     return (parts[0] * 3600 + parts[1] * 60) * 1000;
                 }
                 return NaN;
            }

            updateTimeDisplay(currentSimTimeOffsetMs) {
                 const totalSeconds = Math.floor(Math.max(0, currentSimTimeOffsetMs) / 1000);
                 if (isNaN(totalSeconds)) return;
                 const hours = Math.floor(totalSeconds / 3600) % 24;
                 const minutes = Math.floor((totalSeconds % 3600) / 60);
                 const seconds = totalSeconds % 60;
                 const formattedTime = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                 
                 if (!this.cssTimeTextPivot) return;
                 this.cssTimeTextPivot.clear();
                 const charWidth3D = 135; 
                 const textBlockCenter = new THREE.Vector3(0, 0, -1000); 
                 const totalWidth3D = formattedTime.length * charWidth3D;
                 const startX = textBlockCenter.x - (totalWidth3D / 2);
                 for (let i = 0; i < formattedTime.length; i++) {
                    const char = formattedTime[i];
                    const element = document.createElement('div');
                    element.className = 'time-3d-label';
                    element.textContent = char;
                    const cssObject = new CSS3DObject(element);
                    const currentX = startX + (i * charWidth3D);
                    cssObject.position.set(currentX, textBlockCenter.y, textBlockCenter.z);
                    cssObject.rotation.set(0, 0, 0);
                    this.cssTimeTextPivot.add(cssObject);
                }
            }

            calculateSimulationEndTime() {
                 let maxEndTimeMs = 0;
                 this.yamahokoData.forEach(yamanoko => {
                     if (yamanoko.position && yamanoko.position.length > 0) {
                         const lastTimeStr = Object.values(yamanoko.position[yamanoko.position.length - 1])[0];
                         const endTimeMs = this.timeToMsOffset(lastTimeStr);
                         if (!isNaN(endTimeMs)) maxEndTimeMs = Math.max(maxEndTimeMs, endTimeMs);
                     }
                 });
                 this.simulationEndTimeMs = maxEndTimeMs; 
            }

            createTimeMarkers() {
                 this.timeMarkersContainer.innerHTML = '';
                 const markerStartTime = this.timeToMsOffset('08:30');
                 const interval = 30 * 60 * 1000;
                 const totalRange = this.simulationEndTimeMs - this.SIMULATION_START_TIME_OFFSET_MS;
                 if (totalRange <= 0) return;
                 for (let time = markerStartTime; time <= this.simulationEndTimeMs; time += interval) {
                     const percent = ((time - this.SIMULATION_START_TIME_OFFSET_MS) / totalRange) * 100;
                     if (percent >= 0 && percent <= 100) {
                         const marker = document.createElement('div');
                         marker.className = 'time-marker';
                         const hours = Math.floor(time / 3600000) % 24;
                         const minutes = Math.floor((time % 3600000) / 60000);
                         marker.textContent = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
                         marker.style.left = `${percent}%`;
                         this.timeMarkersContainer.appendChild(marker);
                     }
                 }
            }
            
            setupControls() {
                 this.seekBar.min = this.SIMULATION_START_TIME_OFFSET_MS;
                 this.seekBar.max = this.simulationEndTimeMs;
                 this.seekBar.value = this.SIMULATION_START_TIME_OFFSET_MS;
                 this.createTimeMarkers();
                 this.playPauseBtn.addEventListener('click', () => {
                     this.isPaused = !this.isPaused;
                     this.playPauseBtn.textContent = this.isPaused ? '再生' : '一時停止';
                     if (!this.isPaused) {
                         this.lastTime = performance.now();
                     }
                 });
                 this.seekBar.addEventListener('mousedown', () => {
                     this.wasPlayingBeforeSeek = !this.isPaused;
                     this.isPaused = true;
                     this.playPauseBtn.textContent = '再生';
                 });
                 this.seekBar.addEventListener('input', () => {
                     const seekTime = parseFloat(this.seekBar.value);
                     this.simulationClockTimeMs = seekTime - this.SIMULATION_START_TIME_OFFSET_MS;
                     this.updateSceneToTime(seekTime);
                 });
                 this.seekBar.addEventListener('change', () => {
                     if (this.wasPlayingBeforeSeek) {
                         this.isPaused = false;
                         this.playPauseBtn.textContent = '一時停止';
                         this.lastTime = performance.now();
                     }
                 });
            }

            }

            positionLabels(camera, viewport, labels) {
                const _vector = new THREE.Vector3();

                labels.forEach(item => {
                    const label = item.label;
                    const position3d = item.mesh ? item.mesh.position : item.position;

                    if (item.mesh && !item.mesh.visible) {
                        label.style.display = 'none';
                        return;
                    }

                    _vector.copy(position3d);

                    if (item.mesh) {
                        _vector.y += 10;
                    }

                    _vector.project(camera);

                    const isBehind = _vector.z > 1;
                    if (isBehind || _vector.x < -1 || _vector.x > 1 || _vector.y < -1 || _vector.y > 1) {
                        label.style.display = 'none';
                        return;
                    }
                    
                    const x = viewport.left + ((_vector.x + 1) / 2) * viewport.width;
                    const y = viewport.top + ((-_vector.y + 1) / 2) * viewport.height;
                    
                    label.style.display = 'block';
                    label.style.left = `${x}px`;
                    label.style.top = `${y}px`;
                });
            }
            
            updateCameraInfoDisplay() {
                if (!this.cameraInfoDisplay) return;
                const pos = this.camera.position;
                const rot = this.camera.rotation;
                const distance = this.camera.position.distanceTo(this.controls.target);
                const toDeg = (rad) => (rad * 180 / Math.PI).toFixed(1);
                const infoText = 
`Camera Info:
Pos: X:${pos.x.toFixed(1)} Y:${pos.y.toFixed(1)} Z:${pos.z.toFixed(1)}
Rot: X:${toDeg(rot.x)}° Y:${toDeg(rot.y)}° Z:${toDeg(rot.z)}°
Dist: ${distance.toFixed(1)}`;
                this.cameraInfoDisplay.textContent = infoText;
            }

            updateDynamicCameras() {
                if (this.subCameras.length === 0) return;

                const activeCamData = this.subCameraData[this.activeSubCameraIndex];
                const activeCam = this.subCameras[this.activeSubCameraIndex];

                if (activeCamData.type === 'chase' && activeCamData.targetName) {
                    const target = this.yamahokoMeshes.find(y => y.data.name === activeCamData.targetName);
                    if (target && target.mesh) {
                        const targetMesh = target.mesh;

                        const targetPosition = new THREE.Vector3();
                        targetMesh.getWorldPosition(targetPosition);

                        const targetQuaternion = new THREE.Quaternion();
                        targetMesh.getWorldQuaternion(targetQuaternion);

                        const offset = activeCamData.offset.clone();
                        offset.applyQuaternion(targetQuaternion);

                        const cameraPosition = new THREE.Vector3().addVectors(targetPosition, offset);
                        activeCam.position.copy(cameraPosition);

                        activeCam.lookAt(targetPosition);
                    }
                }
            }

            animate = (currentTime) => {
                 this.animationFrameId = requestAnimationFrame(this.animate.bind(this));
                 this.controls.update();
                 this.updateCameraInfoDisplay();

                if (this.htmlTextPivot) {
                     this.htmlTextPivot.rotation.y += 0.002;
                 }

                 if (!this.isPaused) {
                    if (this.lastTime === 0) this.lastTime = currentTime;
                    let deltaTime = currentTime - this.lastTime;
                    this.lastTime = currentTime;
                    if (isNaN(deltaTime) || deltaTime <= 0) return;
                    this.simulationClockTimeMs += deltaTime * this.SIMULATION_SPEED_MULTIPLIER;
                    const finalSimTimeOffsetMs = this.SIMULATION_START_TIME_OFFSET_MS + this.simulationClockTimeMs;
                    if (finalSimTimeOffsetMs >= this.simulationEndTimeMs) {
                        this.isPaused = true;
                        this.playPauseBtn.textContent = '再生';
                        this.seekBar.value = this.simulationEndTimeMs;
                        this.updateSceneToTime(this.simulationEndTimeMs);
                    } else {
                        this.seekBar.value = finalSimTimeOffsetMs;
                        this.updateSceneToTime(finalSimTimeOffsetMs);
                    }
                 }
                 
                 this.updateDynamicCameras();

                 const leftPanelWidth = 320;
                 const subViewportSize = 320;

                 const mainViewport = { left: leftPanelWidth, top: 0, width: window.innerWidth - leftPanelWidth, height: window.innerHeight };
                 const subViewport = { left: 0, top: window.innerHeight - subViewportSize, width: subViewportSize, height: subViewportSize };

                 this.positionLabels(this.camera, mainViewport, this.yamahokoLabels);
                 this.positionLabels(this.camera, mainViewport, this.pointLabels);
                 
                 if (this.subCameras.length > 0) {
                     const activeSubCamera = this.subCameras[this.activeSubCameraIndex];
                     this.positionLabels(activeSubCamera, subViewport, this.subCameraYamahokoLabels);
                     //【変更点】サブカメラ用の地名ラベル描画処理を削除
                     // this.positionLabels(activeSubCamera, subViewport, this.subCameraPointLabels);
                 }


                this.renderer.clear(); 
                this.renderer.setScissorTest(true);
                
                this.renderer.setViewport(mainViewport.left, 0, mainViewport.width, mainViewport.height);
                this.renderer.setScissor(mainViewport.left, 0, mainViewport.width, mainViewport.height);
                this.renderer.render(this.scene, this.camera);
                
                if (this.subCameras.length > 0) {
                    const activeSubCamera = this.subCameras[this.activeSubCameraIndex];
                    this.renderer.setViewport(subViewport.left, 0, subViewport.width, subViewport.height);
                    this.renderer.setScissor(subViewport.left, 0, subViewport.width, subViewport.height);
                    this.renderer.clearDepth();
                    this.renderer.render(this.scene, activeSubCamera);
                }

                this.renderer.setScissorTest(false);
                this.cssRenderer.render(this.cssScene, this.camera);
            };

            updateSceneToTime = (finalSimTimeOffsetMs) => {
                 this.yamahokoMeshes.forEach(yamanokoObj => {
                     const yamanoko = yamanokoObj.data;
                     const mesh = yamanokoObj.mesh;
                     if (!yamanoko.position || yamanoko.position.length < 2) return;
                     let foundSegment = false;
                     for (let i = 0; i < yamanoko.position.length - 1; i++) {
                         const startPointEntry = yamanoko.position[i];
                         const endPointEntry = yamanoko.position[i + 1];
                         const startPointName = Object.keys(startPointEntry)[0];
                         const endPointName = Object.keys(endPointEntry)[0];
                         const startTimeOffsetMs = this.timeToMsOffset(Object.values(startPointEntry)[0]);
                         const endTimeOffsetMs = this.timeToMsOffset(Object.values(endPointEntry)[0]);
                         if (isNaN(startTimeOffsetMs) || isNaN(endTimeOffsetMs) || startTimeOffsetMs >= endTimeOffsetMs) continue;
                         if (finalSimTimeOffsetMs >= startTimeOffsetMs && finalSimTimeOffsetMs <= endTimeOffsetMs) {
                             foundSegment = true;
                             const segmentDurationMs = endTimeOffsetMs - startTimeOffsetMs;
                             const elapsedInSegmentMs = finalSimTimeOffsetMs - startTimeOffsetMs;
                             let t = segmentDurationMs === 0 ? 0 : elapsedInSegmentMs / segmentDurationMs;
                             t = Math.max(0, Math.min(1, t));
                             if (this.relayPoints[startPointName] && this.relayPoints[endPointName]) {
                                 const startVec = this.relayPoints[startPointName];
                                 const endVec = this.relayPoints[endPointName];
                                 mesh.position.lerpVectors(startVec, endVec, t);

                                 if (yamanoko.name === '長刀鉾') {
                                     const direction = new THREE.Vector3().subVectors(endVec, startVec);
                                     if (direction.lengthSq() > 0.0001) {
                                         const lookAtTarget = new THREE.Vector3(
                                             mesh.position.x + direction.x,
                                             mesh.position.y,
                                             mesh.position.z + direction.z
                                         );
                                         mesh.lookAt(lookAtTarget);
                                     }
                                     mesh.position.y = 0;
                                 }
                             }
                             break;
                         }
                     }
                     if (!foundSegment) {
                         const firstPointTimeOffsetMs = this.timeToMsOffset(Object.values(yamanoko.position[0])[0]);
                         const lastPointTimeOffsetMs = this.timeToMsOffset(Object.values(yamanoko.position[yamanoko.position.length - 1])[0]);
                         if (isNaN(firstPointTimeOffsetMs) || isNaN(lastPointTimeOffsetMs)) return;
                         if (finalSimTimeOffsetMs < firstPointTimeOffsetMs && this.relayPoints[Object.keys(yamanoko.position[0])[0]]) {
                             mesh.position.copy(this.relayPoints[Object.keys(yamanoko.position[0])[0]]);
                         } else if (finalSimTimeOffsetMs > lastPointTimeOffsetMs && this.relayPoints[Object.keys(yamanoko.position[yamanoko.position.length - 1])[0]]) {
                             mesh.position.copy(this.relayPoints[Object.keys(yamanoko.position[yamanoko.position.length - 1])[0]]);
                         }
                         if (yamanoko.name === '長刀鉾') {
                             mesh.position.y = 0;
                         }
                     }
                 });
                 this.updateTimeDisplay(finalSimTimeOffsetMs);
            };
            
            addYamahokoObjects() {
                this.yamahokoData.forEach(y => {
                    let mesh;
                    if (y.name === '長刀鉾' && this.naginataBokoModel) {
                        mesh = this.naginataBokoModel.clone();
                        mesh.scale.set(1, 1, 1);
                    } else {
                        const geometry = new THREE.BoxGeometry(20, 20, 20);
                        const material = new THREE.MeshBasicMaterial({ color: 0xff0000 });
                        mesh = new THREE.Mesh(geometry, material);
                    }
                    mesh.name = y.name;
                    this.scene.add(mesh);
                    this.yamahokoMeshes.push({ data: y, mesh: mesh });
                    if (y.position && y.position.length > 0) {
                        const firstPoint = this.relayPoints[Object.keys(y.position[0])[0]];
                        if (firstPoint) mesh.position.copy(firstPoint);
                    }

                    const labelDiv = document.createElement('div');
                    labelDiv.className = 'yamahoko-label';
                    labelDiv.textContent = y.name;
                    document.body.appendChild(labelDiv);
                    this.yamahokoLabels.push({ mesh: mesh, label: labelDiv });

                    const subLabelDiv = document.createElement('div');
                    subLabelDiv.className = 'yamahoko-label-sub';
                    subLabelDiv.textContent = y.name;
                    document.body.appendChild(subLabelDiv);
                    this.subCameraYamahokoLabels.push({ mesh: mesh, label: subLabelDiv });
                });

                for (const pointName in this.relayPoints) {
                    if (!pointName.includes('基位置')) {
                        const labelDiv = document.createElement('div');
                        labelDiv.className = 'point-label';
                        labelDiv.textContent = pointName;
                        document.body.appendChild(labelDiv);
                        this.pointLabels.push({ position: this.relayPoints[pointName], label: labelDiv });

                        //【変更点】サブカメラ用の地名ラベル作成処理を削除
                    }
                }
            }
            
            setupVisibilityControls() {
                const panel = this.visibilityControls;
                panel.innerHTML = '';
                panel.classList.add('collapsed');
                this.toggleVisibilityBtn = document.createElement('button');
                this.toggleVisibilityBtn.id = 'toggle-visibility-btn';
                this.toggleVisibilityBtn.textContent = '山鉾リストを表示';
                panel.appendChild(this.toggleVisibilityBtn);
                const contentWrapper = document.createElement('div');
                contentWrapper.id = 'visibility-content-wrapper';
                panel.appendChild(contentWrapper);
                this.toggleVisibilityBtn.addEventListener('click', () => {
                    panel.classList.toggle('collapsed');
                    if (panel.classList.contains('collapsed')) {
                        this.toggleVisibilityBtn.textContent = '山鉾リストを表示';
                    } else {
                        this.toggleVisibilityBtn.textContent = '山鉾リストを隠す';
                    }
                });
                 const masterControlsContainer = document.createElement('div');
                 masterControlsContainer.id = 'master-visibility-controls';
                 const showAllBtn = document.createElement('button');
                 showAllBtn.textContent = 'すべて表示';
                 showAllBtn.className = 'master-btn';
                 showAllBtn.addEventListener('click', () => {
                     this.yamahokoMeshes.forEach(item => item.mesh.visible = true);
                     this.visibilityToggleButtons.forEach(btn => btn.textContent = '非表示');
                 });
                 const hideAllBtn = document.createElement('button');
                 hideAllBtn.textContent = 'すべて非表示';
                 hideAllBtn.className = 'master-btn';
                 hideAllBtn.addEventListener('click', () => {
                     this.yamahokoMeshes.forEach(item => item.mesh.visible = false);
                     this.visibilityToggleButtons.forEach(btn => btn.textContent = '表示');
                 });
                 masterControlsContainer.appendChild(showAllBtn);
                 masterControlsContainer.appendChild(hideAllBtn);
                 contentWrapper.appendChild(masterControlsContainer);
                 this.yamahokoData.sort((a, b) => {
                     const titleA = this.YAMAHOKO_TITLES[a.name] || '';
                     const titleB = this.YAMAHOKO_TITLES[b.name] || '';
                     return titleA.localeCompare(titleB, 'ja', { numeric: true });
                 }).forEach(yamanoko => {
                     const item = this.yamahokoMeshes.find(m => m.data.name === yamanoko.name);
                     if (!item) return;
                     const mesh = item.mesh;
                     const controlContainer = document.createElement('div');
                     controlContainer.className = 'visibility-item';
                     const nameContainer = document.createElement('div');
                     nameContainer.className = 'name-container';
                     const rankSpan = document.createElement('span');
                     rankSpan.className = 'rank-column';
                     rankSpan.textContent = this.YAMAHOKO_TITLES[yamanoko.name] || '';
                     const nameSpan = document.createElement('span');
                     nameSpan.className = 'name-column';
                     nameSpan.textContent = yamanoko.name;
                     nameContainer.appendChild(rankSpan);
                     nameContainer.appendChild(nameSpan);
                     const toggleButton = document.createElement('button');
                     toggleButton.className = 'visibility-toggle-btn';
                     toggleButton.textContent = '非表示';
                     this.visibilityToggleButtons.push(toggleButton);
                     controlContainer.appendChild(nameContainer);
                     controlContainer.appendChild(toggleButton);
                     contentWrapper.appendChild(controlContainer); 

                     toggleButton.addEventListener('click', () => {
                         mesh.visible = !mesh.visible;
                         toggleButton.textContent = mesh.visible ? '非表示' : '表示';
                     });
                 });
            }

            setupClickEvents() {
                this.raycaster = new THREE.Raycaster();
                this.mouse = new THREE.Vector2();
                const leftPanelWidth = 320;

                window.addEventListener('dblclick', (event) => {
                    if (event.clientX < leftPanelWidth) return;

                    const mainViewportX = event.clientX - leftPanelWidth;
                    const mainViewportWidth = window.innerWidth - leftPanelWidth;
                    
                    this.mouse.x = (mainViewportX / mainViewportWidth) * 2 - 1;
                    this.mouse.y = - (event.clientY / window.innerHeight) * 2 + 1;
                    
                    this.raycaster.setFromCamera(this.mouse, this.camera);
                    
                    const buildingIntersects = this.raycaster.intersectObjects(this.interactiveMeshes);
                    if (buildingIntersects.length > 0) {
                        this.handleBuildingClick(buildingIntersects[0]);
                        return;
                    } else {
                        if (this.customBuildingMaterial) {
                           this.customBuildingMaterial.uniforms.uSelectedID.value = -1.0;
                        }
                        this.buildingInfoDisplay.style.display = 'none';
                    }
                });
            }

            handleBuildingClick(intersection) {
                const idAttribute = intersection.object.geometry.attributes._id;
                if (idAttribute) {
                    const clickedID = idAttribute.getX(intersection.face.a);
                    this.customBuildingMaterial.uniforms.uSelectedID.value = clickedID;
                    
                    const attributes = this.buildingAttributes[clickedID];
                    if (attributes) {
                        this.buildingInfoDisplay.innerHTML = '';

                        const closeBtn = document.createElement('span');
                        closeBtn.className = 'close-btn';
                        closeBtn.innerHTML = '×';
                        
                        closeBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            this.buildingInfoDisplay.style.display = 'none';
                            this.customBuildingMaterial.uniforms.uSelectedID.value = -1.0;
                        });
                        
                        this.buildingInfoDisplay.appendChild(closeBtn);

                        let infoText = `ID: ${clickedID}\n`;
                        infoText += `GmlID: ${attributes.id || '不明'}\n`;
                        const year = (attributes.yearOfConstruction === "0001" || !attributes.yearOfConstruction) 
                                     ? '不明' 
                                     : `${attributes.yearOfConstruction}年`;
                        infoText += `建築年：${year}\n`;
                        infoText += `計測高さ：${attributes.measuredHeight !== null ? attributes.measuredHeight + 'm' : '不明'}\n`;
                        infoText += `地上階数：${attributes.storeysAboveGround !== null ? attributes.storeysAboveGround : '不明'}\n`;
                        infoText += `地下階数：${attributes.storeysBelowGround !== null ? attributes.storeysBelowGround : '不明'}\n`;
                        const usage = attributes.usage_jp || attributes.usage || '不明';
                        const structure = attributes.buildingStructureType_jp || attributes.buildingStructureType || '不明';
                        infoText += `用途：${usage}\n`;
                        infoText += `構造種別：${structure}`;
                        
                        const textElement = document.createElement('pre');
                        textElement.style.whiteSpace = 'pre-wrap';
                        textElement.style.margin = '0';
                        textElement.style.paddingTop = '5px';
                        textElement.textContent = infoText;
                        this.buildingInfoDisplay.appendChild(textElement);
                        
                        if (this.visibilityControls && !this.visibilityControls.classList.contains('collapsed')) {
                            this.visibilityControls.classList.add('collapsed');
                            if (this.toggleVisibilityBtn) {
                                this.toggleVisibilityBtn.textContent = '山鉾リストを表示';
                            }
                        }

                        this.buildingInfoDisplay.style.display = 'block';

                    } else {
                        this.buildingInfoDisplay.style.display = 'none';
                    }

                } else {
                    this.buildingInfoDisplay.style.display = 'none';
                }
            }

            createCustomMaterial() {
                const vertexShader = document.getElementById('vertexShader').textContent;
                const fragmentShader = document.getElementById('fragmentShader').textContent;
                return new THREE.ShaderMaterial({
                    vertexShader, fragmentShader,
                    uniforms: {
                        uSelectedID: { value: -1.0 },
                        uBaseColor: { value: new THREE.Color(0xffffff) },
                        uHighlightColor: { value: new THREE.Color(0x007bff) },
                    },
                    clippingPlanes: this.clippingPlanes,
                    clipIntersection: false
                });
            }
        }
        
        window.addEventListener('DOMContentLoaded', () => {
            new GionSimulationApp();
        });
    </script>
