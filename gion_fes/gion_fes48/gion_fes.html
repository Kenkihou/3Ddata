        setupControls() {
             this.seekBar.min = this.animationStartTime;
             this.seekBar.max = this.animationEndTime;
             this.seekBar.value = this.masterTime;
             this.seekBar.step = 1;

             this.playPauseBtn.addEventListener('click', () => {
                 if (this.timeScale === 0) {
                     if (this.masterTime >= this.animationEndTime) {
                         this.masterTime = this.animationStartTime;
                     }
                     this.timeScale = this.isCharacterMode ? 10 : 100;
                     this.playPauseBtn.innerHTML = '❚❚ 一時停止';
                 } else {
                     this.timeScale = 0;
                     const playText = this.isCharacterMode ? '▶ | 10倍再生' : '▶ | 100倍再生';
                     this.playPauseBtn.innerHTML = playText;
                 }
                 // ▼▼▼ この行を追加 ▼▼▼
                 // 再生状態が変更されたので、次のフレームで再描画を要求する
                 this.needsRender = true;
                 // ▲▲▲ 追加ここまで ▲▲▲
             });

             this.seekBar.addEventListener('mousedown', () => {
                 this.isScrubbing = true;
             });

             this.seekBar.addEventListener('input', () => {
                 this.masterTime = parseInt(this.seekBar.value, 10);
                 // ▼▼▼ この行を追加 ▼▼▼
                 // シークバーが操作されたので、再描画を要求する
                 this.needsRender = true;
                 // ▲▲▲ 追加ここまで ▲▲▲
             });

             this.seekBar.addEventListener('mouseup', () => {
                 this.isScrubbing = false;
                 // ▼▼▼ この行を追加 ▼▼▼
                 // シークバーの操作が終わったので、最後の状態を確定させるために再描画を要求する
                 this.needsRender = true;
                 // ▲▲▲ 追加ここまで ▲▲▲
             });

             this.timeMarkersContainer.innerHTML = '';
             const sliderMinTime = this.animationStartTime;
             const sliderMaxTime = this.animationEndTime;
             const sliderDuration = sliderMaxTime - sliderMinTime;
             const tickInterval = 30 * 60;
             const firstTickTime = 9 * 3600;
             for (let tickTime = firstTickTime; tickTime <= sliderMaxTime; tickTime += tickInterval) {
                 const timeFromStart = tickTime - sliderMinTime;
                 const percent = (timeFromStart / sliderDuration) * 100;
                 if (percent >= 0 && percent <= 100) {
                     const marker = document.createElement('div');
                     marker.className = 'slider-tick';
                     marker.style.left = `${percent}%`;
                     this.timeMarkersContainer.appendChild(marker);
                 }
             }
        }

                });

            masterControls.appendChild(showAllBtn);

            yamahokoList.forEach(item => {

                const itemDiv = document.createElement('div');

                const nameContainer = document.createElement('div');
                nameContainer.className = 'name-container';

                toggleVisibilityBtn.className = 'visibility-toggle-btn';
                toggleVisibilityBtn.textContent = item.object.visible ? '非表示' : '表示';
                if (!item.object.visible) {

            };
            window.addEventListener('mousemove', handleMouseMove, false);

            window.addEventListener('dblclick', (event) => {
                if (this.isCharacterMode || this.isSelectingStartPosition) return;
                
                this.raycaster.far = Infinity; // 光線の探索距離をリセット
                this.raycaster.setFromCamera(this.mouse, this.camera);
                
                const intersectMeshes = this.interactiveBuildingGroup.visible ? this.interactiveMeshes : this.interactiveMeshes1946;
                const buildingIntersects = this.raycaster.intersectObjects(intersectMeshes, true);
                if (buildingIntersects.length > 0) {

                infoHtml += `<b>地下階数:</b> ${attributes.storeysBelowGround !== null ? attributes.storeysBelowGround : '不明'}<br>`;

        positionLabels(camera, viewport, labels, occlusionArea = null) {
            const _vector = new THREE.Vector3();

            for (const item of labels) {
                const { element, position } = item;

                if (element.style.visibility === 'hidden') {
                    continue;
                }

                _vector.copy(position);
                _vector.project(camera);

                const isInView = _vector.z < 1 && _vector.x >= -1 && _vector.x <= 1 && _vector.y >= -1 && _vector.y <= 1;
                const isSearchVisible = element.style.display === 'block';

                if (isInView && isSearchVisible) {
                    const x = viewport.left + ((_vector.x + 1) / 2) * viewport.width;
                    const y = viewport.top + ((-_vector.y + 1) / 2) * viewport.height;

                    let isOccluded = false;
                    if (occlusionArea && this.isSubCameraVisible && !this.isCharacterMode) {
                        if (x > occlusionArea.left && x < occlusionArea.right && y > occlusionArea.top && y < occlusionArea.bottom) {
                            isOccluded = true;
                        }
                    }

                    if (isOccluded) {
                        element.style.visibility = 'hidden';
                    } else {
                        element.style.visibility = 'visible';
                        element.style.left = `${x}px`;
                        element.style.top = `${y}px`;
                    }
                } else {
                    element.style.visibility = 'hidden';
                }
            }
        }

        }

updateCharacter(deltaTime) {
            if (!this.girlModel || !this.girlMixer) return;

            this.girlMixer.update(deltaTime);
            
            const wasMoving = this.isMoving;
            this.isMoving = this.moveState.force > 0.05;

            // ▼▼▼ この部分は正しい処理なので、このまま残します ▼▼▼
            if (wasMoving && !this.isMoving) {
                this.isWaitingForIdle = true;
                if (this.idleTransitionTimer) clearTimeout(this.idleTransitionTimer);
                // 0.5秒後にアイドル移行待ち状態を解除
                this.idleTransitionTimer = setTimeout(() => {
                    this.isWaitingForIdle = false;
                }, 500);
            }
            // ▲▲▲ ここまで ▲▲▲

            if (this.isMoving && !wasMoving) {
                this.cameraFollowOffset.copy(this.camera.position).sub(this.girlModel.position);
            }

            if (this.isMoving) {
                this.controls.enabled = false; 

                const isRunning = this.moveState.force > 0.6;
                this.switchToAction(isRunning ? 'run' : 'walk1child');
                
                const nippleInstance = this.joystickManager.get(0);
                if (nippleInstance && nippleInstance.ui.front) {
                    nippleInstance.ui.front.style.backgroundColor = isRunning ? 'skyblue' : 'white';
                }

                const walkSpeed = 4.0;
                const runSpeed = 10.0;
                const speed = isRunning ? runSpeed : walkSpeed;
                const moveDistance = speed * this.moveState.force * deltaTime;

                const cameraForward = new THREE.Vector3();
                this.camera.getWorldDirection(cameraForward);
                cameraForward.y = 0;
                cameraForward.normalize();
                const cameraRight = new THREE.Vector3().crossVectors(this.camera.up, cameraForward).negate();
                const moveDirection = cameraForward.multiplyScalar(this.moveState.y).add(cameraRight.multiplyScalar(this.moveState.x)).normalize();
                
                const characterAngle = Math.atan2(moveDirection.x, moveDirection.z) + Math.PI;
                const targetQuaternion = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), characterAngle);
                this.girlModel.quaternion.slerp(targetQuaternion, 0.15);
                
                const intendedMove = moveDirection.clone().multiplyScalar(moveDistance);

                const raycaster = new THREE.Raycaster();
                const characterPosition = this.girlModel.position.clone();
                const characterRadius = 0.25;
                const rightVec = new THREE.Vector3().crossVectors(moveDirection, this.camera.up).normalize().multiplyScalar(characterRadius);

                const baseRayOrigins = [
                    characterPosition.clone().add(new THREE.Vector3(0, 0.25, 0)),
                    characterPosition.clone().add(new THREE.Vector3(0, 0.8, 0))
                ];
                const rayOrigins = [];
                baseRayOrigins.forEach(base => {
                    rayOrigins.push(base);
                    rayOrigins.push(base.clone().add(rightVec));
                    rayOrigins.push(base.clone().sub(rightVec));
                });
                
                let collisionDetected = false;
                let collisionNormal = null;

                for (const origin of rayOrigins) {
                    raycaster.set(origin, moveDirection);
                    raycaster.far = 1.0;
                    const intersects = raycaster.intersectObjects(this.wallCollisionMeshes);

                    if (intersects.length > 0) {
                        collisionDetected = true;
                        collisionNormal = intersects[0].face.normal;
                        break; 
                    }
                }

                if (collisionDetected) {
                    const slideDirection = intendedMove.clone();
                    slideDirection.projectOnPlane(collisionNormal);
                    this.girlModel.position.add(slideDirection);
                } else {
                    this.girlModel.position.add(intendedMove);
                }

            } else {
                this.controls.enabled = true;
                this.switchToAction('idle');
                if(this.joystickManager){
                    const nippleInstance = this.joystickManager.get(0);
                    if (nippleInstance && nippleInstance.ui.front) {
                        nippleInstance.ui.front.style.backgroundColor = 'white';
                    }
                }
            }

            if (this.compassContainer) {
                const cameraDirection = new THREE.Vector3();
                this.camera.getWorldDirection(cameraDirection);
                cameraDirection.y = 0;
                cameraDirection.normalize();

                const angleRad = Math.atan2(cameraDirection.x, cameraDirection.z);
                const angleDeg = -angleRad * 180 / Math.PI;
                
                this.compassContainer.style.transform = `rotate(${angleDeg}deg)`;
                
                if (this.compassLabelSpans) {
                    const counterAngleDeg = -angleDeg;
                    this.compassLabelSpans.forEach(span => {
                        span.style.transform = `rotate(${counterAngleDeg}deg)`;
                    });
                }
            }
        }

        updateCharacterCamera() {
            if (!this.girlModel) return;

            const modelCenter = this.girlModel.position.clone().add(new THREE.Vector3(0, 1, 0));
            if (this.isMoving) {
                // 移動中はカメラが追従
                this.camera.position.copy(this.girlModel.position).add(this.cameraFollowOffset);
            }
            this.controls.target.copy(modelCenter);
        }



_setYamabokoModelScale(scale) {
            this.allYamabokoObjects.forEach(yamaboko => {
                if (yamaboko) {
                    const modelScene = yamaboko.children.find(child => child.type === 'Group');
                    if (modelScene) {
                        modelScene.scale.set(scale, scale, scale);
                    }
                }
            });
        }        


_cullBuildingBlocks(camera) {
            if (!this.buildingBlocks || this.buildingBlocks.length === 0) return;

            const frustum = new THREE.Frustum();
            const matrix = new THREE.Matrix4().multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
            frustum.setFromProjectionMatrix(matrix);

            const tempBox = new THREE.Box3();

            this.buildingBlocks.forEach(block => {
                tempBox.copy(block.geometry.boundingBox);
                tempBox.applyMatrix4(block.matrixWorld);
                
                // このブロックが現在描画対象のカメラの視野に入っているかで表示を判断
                block.visible = frustum.intersectsBox(tempBox);
            });
        }

animate = (currentTime) => {
             this.animationFrameId = requestAnimationFrame(this.animate.bind(this));

             this.controls.update();

             const delta = this.clock.getDelta();
             const isPlaying = this.timeScale > 0;

             const isCurrentlyMoving = this.isCharacterMode && this.moveState.force > 0.05;

             if (this.isWaitingForIdle) {
                 if(this.idleTransitionTimer) {
                    clearTimeout(this.idleTransitionTimer);
                    this.idleTransitionTimer = setTimeout(() => {
                        this.isWaitingForIdle = false;
                    }, 500);
                 }
             }
             
             if (isPlaying || this.needsRender || isCurrentlyMoving || this.isWaitingForIdle) {
                
                // --- 神獣アニメーションの更新と切り替え ---
                const targetAction = isPlaying ? 'fly' : 'idle';
                if (this.currentShishinAction !== targetAction) {
                    for (const name in this.shishinMixers) {
                        const mixerData = this.shishinMixers[name];
                        const fromAction = mixerData.actions[this.currentShishinAction];
                        const toAction = mixerData.actions[targetAction];
                        
                        if (fromAction && toAction) {
                            fromAction.fadeOut(0.5);
                            toAction.reset().setEffectiveWeight(1).fadeIn(0.5).play();
                        }
                    }
                    this.currentShishinAction = targetAction;
                }

                for (const name in this.shishinMixers) {
                    this.shishinMixers[name].mixer.update(delta);
                }

                for (const name in this.shishinModels) {
                    const model = this.shishinModels[name];
                    const labelContainer = model.getObjectByName('labelContainer');
                    if (labelContainer) {
                        const box = new THREE.Box3().setFromObject(model);
                        const worldHeight = box.max.y - model.position.y;
                        const localY = worldHeight / model.scale.y;
                        const localOffset = 2 / model.scale.y;
                        labelContainer.position.set(0, localY + localOffset, 0);
                    }
                }
                
                // ▼▼▼ 変更/追加 ▼▼▼
                // 新しいルール関数をここで呼び出す
                this._applyLabelDisplayRules();
                // ▲▲▲ 変更/追加ここまで ▲▲▲

                this._cullBuildingBlocks(this.camera);

                if (!this.isScrubbing) {
                    this.masterTime += delta * this.timeScale;
                }
                if (this.masterTime >= this.animationEndTime) {
                    this.masterTime = this.animationEndTime;
                    if (this.timeScale !== 0) {
                        this.timeScale = 0;
                        this.playPauseBtn.textContent = this.isCharacterMode ? '10倍再生' : '100倍再生';
                    }
                }
                if (this.masterTime < this.animationStartTime) {
                    this.masterTime = this.animationStartTime;
                }
                if (!this.isScrubbing) {
                    this.seekBar.value = this.masterTime;
                }
                
                const h = Math.floor(this.masterTime / 3600).toString().padStart(2, '0');
                const m = Math.floor((this.masterTime % 3600) / 60).toString().padStart(2, '0');
                const s = Math.floor(this.masterTime % 60).toString().padStart(2, '0');
                this.timeDisplay.textContent = `時刻: ${h}:${m}:${s}`;
                
                const subViewportSize = 320;
                const occlusionArea = {
                    left: 0,
                    top: window.innerHeight - subViewportSize,
                    right: subViewportSize,
                    bottom: window.innerHeight
                };
                const subViewportRenderer = { left: 0, top: 0, width: subViewportSize, height: subViewportSize };

                this._updateObjectState(this.naginataHokoObject, this.naginataHokoSchedule, this.masterTime, this.specialPositions);
                this._updateObjectState(this.arareTenjinyamaObject, this.arareTenjinyamaSchedule, this.masterTime, this.specialPositions);
                this._updateObjectState(this.uradeyamaObject, this.uradeyamaSchedule, this.masterTime, this.specialPositions);
                this._updateObjectState(this.yamabushiyamaObject, this.yamabushiyamaSchedule, this.masterTime, this.specialPositions);
                this._updateObjectState(this.kankobokoObject, this.kankobokoSchedule, this.masterTime, this.specialPositions);
                this._updateObjectState(this.aburatenjinyamaObject, this.aburatenjinyamaSchedule, this.masterTime, this.specialPositions);
                this._updateObjectState(this.ayagasabokoObject, this.ayagasabokoSchedule, this.masterTime, this.specialPositions);
                this._updateObjectState(this.toroyamaObject, this.toroyamaSchedule, this.masterTime, this.specialPositions);
                this._updateObjectState(this.kikusuibokoObject, this.kikusuibokoSchedule, this.masterTime, this.specialPositions);
                this._updateObjectState(this.hoshoyamaObject, this.hoshoyamaSchedule, this.masterTime, this.specialPositions);
                this._updateObjectState(this.hakugasanObject, this.hakugasanSchedule, this.masterTime, this.specialPositions);
                this._updateObjectState(this.hakurakutenyamaObject, this.hakurakutenyamaSchedule, this.masterTime, this.specialPositions);
                this._updateObjectState(this.tsukihokoObject, this.tsukihokoSchedule, this.masterTime, this.specialPositions);
                this._updateObjectState(this.tokusayamaObject, this.tokusayamaSchedule, this.masterTime, this.specialPositions);
                this._updateObjectState(this.shijokasabokoObject, this.shijokasabokoSchedule, this.masterTime, this.specialPositions);
                this._updateObjectState(this.taishiyamaObject, this.taishiyamaSchedule, this.masterTime, this.specialPositions);
                this._updateObjectState(this.niwatoribokoObject, this.niwatoribokoSchedule, this.masterTime, this.specialPositions);
                this._updateObjectState(this.ashikariyamaObject, this.ashikariyamaSchedule, this.masterTime, this.specialPositions);
                this._updateObjectState(this.kakkyoyamaObject, this.kakkyoyamaSchedule, this.masterTime, this.specialPositions);
                this._updateObjectState(this.mosoyamaObject, this.mosoyamaSchedule, this.masterTime, this.specialPositions);
                this._updateObjectState(this.houkabokoObject, this.houkabokoSchedule, this.masterTime, this.specialPositions);
                this._updateObjectState(this.iwatoyamaObject, this.iwatoyamaSchedule, this.masterTime, this.specialPositions);
                this._updateObjectState(this.funabokoObject, this.funabokoSchedule, this.masterTime, this.specialPositions);

                if (this.fixedLocationVideoGroups.length > 0) {
                    this.fixedLocationVideoGroups.forEach(group => {
                        group.logoInstances.forEach(logo => logo.style.display = 'none');

                        const activeVideos = group.videoData.filter(video => {
                            if (video.displayType === 'timed') {
                                const startTime = group.timeToSeconds(video.startTime);
                                const endTime = group.timeToSeconds(video.endTime);
                                return this.masterTime >= startTime && this.masterTime < endTime;
                            }
                            return true;
                        });

                        activeVideos.forEach((video, index) => {
                            if (index < group.logoInstances.length) {
                                const logoToShow = group.logoInstances[index];
                                if (logoToShow.style.display !== 'flex') {
                                     logoToShow.style.display = 'flex';
                                }
                                if (!logoToShow.dataset.videoId || logoToShow.dataset.videoId !== video.videoUrl) {
                                    logoToShow.dataset.name = video.videoTitle || '動画を再生';
                                    logoToShow.title = `動画を再生: ${video.videoTitle || ''}`;
                                    logoToShow.dataset.videoId = video.videoUrl;

                                    const newLogo = logoToShow.cloneNode(true);
                                    logoToShow.parentNode.replaceChild(newLogo, logoToShow);
                                    group.logoInstances[index] = newLogo;
                                    
                                    newLogo.addEventListener('click', (e) => {
                                        e.stopPropagation();
                                        this.showVideoModal(video.videoUrl);
                                    });
                                }
                            }
                        });
                    });
                }

                 if(this.isCharacterMode) {
                     if (this.mapGroup) this.mapGroup.visible = false;
                     this.updateCharacter(delta);
                     this.updateCharacterCamera();
                     if (this.characterPositionMarker) this.characterPositionMarker.position.set(this.girlModel.position.x, 50.0, this.girlModel.position.z);
                    
                    if (this.girlModel) {
                        if (isCurrentlyMoving) {
                            const origin = this.girlModel.position.clone().add(new THREE.Vector3(0, 0.5, 0));
                            const direction = new THREE.Vector3(0, -1, 0);
                            this.raycaster.set(origin, direction);
                            this.raycaster.far = 1.0;
                            const intersects = this.raycaster.intersectObjects(this.walkableMeshes, true);
                            
                            if (intersects.length > 0) {
                                let roadName = null;
                                let currentObject = intersects[0].object;
                                while (currentObject) {
                                    if (currentObject.userData && currentObject.userData.road_name) {
                                        roadName = currentObject.userData.road_name;
                                        break; 
                                    }
                                    currentObject = currentObject.parent;
                                }
                                this.currentRoadName = roadName || 'null';
                            } else {
                                this.currentRoadName = 'null';
                            }
                        }

                        const cameraDirection = new THREE.Vector3();
                        this.camera.getWorldDirection(cameraDirection);
                        cameraDirection.setY(0).normalize();

                        const directions = {
                            '北向き': new THREE.Vector3(0, 0, -1),
                            '南向き': new THREE.Vector3(0, 0, 1),
                            '東向き': new THREE.Vector3(1, 0, 0),
                            '西向き': new THREE.Vector3(-1, 0, 0)
                        };

                        let maxDot = -Infinity;
                        let closestDirection = '不明';
                        for (const [name, vec] of Object.entries(directions)) {
                            const dot = cameraDirection.dot(vec);
                            if (dot > maxDot) {
                                maxDot = dot;
                                closestDirection = name;
                            }
                        }
                        this.characterDirection = closestDirection;
                        
                        this.roadNameLabel.textContent = `現在地: ${this.currentRoadName || 'null'} ${this.characterDirection}`;
                        
                        this.detectionCircle.position.copy(this.girlModel.position).setY(0.05);

                        if (isCurrentlyMoving) {
                            this.detectedBuildings.clear();
                            if (this.buildingObjectsForRaycast.length > 0) {
                                const origin = this.girlModel.position.clone().setY(0.5);
                                const numRays = 24;
                                for (let i = 0; i < numRays; i++) {
                                    const angle = (i / numRays) * Math.PI * 2;
                                    const dir = new THREE.Vector3(Math.cos(angle), 0, Math.sin(angle));
                                    this.raycaster.set(origin, dir);
                                    this.raycaster.far = this.detectionRadius;
                                    const intersects = this.raycaster.intersectObjects(this.buildingObjectsForRaycast, true);
                                    if (intersects.length > 0) {
                                        const face = intersects[0].face;
                                        const uv = intersects[0].object.geometry.attributes.uv;
                                        const buildingId = Math.round(uv.getX(face.a));
                                        this.detectedBuildings.set(buildingId, intersects[0].object);
                                    }
                                }
                            }
                        }

                        let planeIndex = 0;
                        let labelIndex = 0;
                        const worldBbox = new THREE.Box3();
                        const logicBbox = new THREE.Box3();
                        const faces = [
                            { dir: new THREE.Vector3(1, 0, 0) }, { dir: new THREE.Vector3(-1, 0, 0) },
                            { dir: new THREE.Vector3(0, 0, 1) }, { dir: new THREE.Vector3(0, 0, -1) }
                        ];
                        const rayOrigin = new THREE.Vector3();
                        const screenPosition = new THREE.Vector3();

                        for (const [id, mesh] of this.detectedBuildings) {
                            const localBbox = this.buildingBBoxCache.get(id);
                            if (localBbox) {
                                worldBbox.copy(localBbox).applyMatrix4(mesh.matrixWorld);
                                logicBbox.copy(worldBbox).expandByScalar(-1.0);

                                if (!logicBbox.isEmpty() && this.wallCollisionMeshes.length > 0) {
                                    const logicBboxCenter = logicBbox.getCenter(new THREE.Vector3());
                                    for (const face of faces) {
                                        if (planeIndex >= this.MAX_ROAD_FACES) break;

                                        if (face.dir.x !== 0) {
                                            rayOrigin.set(face.dir.x > 0 ? logicBbox.max.x : logicBbox.min.x, 0.5, logicBboxCenter.z);
                                        } else {
                                            rayOrigin.set(logicBboxCenter.x, 0.5, face.dir.z > 0 ? logicBbox.max.z : logicBbox.min.z);
                                        }
                                        this.raycaster.set(rayOrigin, face.dir);
                                        this.raycaster.far = 4;

                                        if (this.raycaster.intersectObjects(this.wallCollisionMeshes).length > 0) {
                                            const plane = this.roadFacingPlanes[planeIndex];
                                            const displaySize = worldBbox.getSize(new THREE.Vector3());
                                            const displayCenter = worldBbox.getCenter(new THREE.Vector3());

                                            plane.position.set(
                                                face.dir.x !== 0 ? (face.dir.x > 0 ? worldBbox.max.x : worldBbox.min.x) : displayCenter.x,
                                                displayCenter.y,
                                                face.dir.z !== 0 ? (face.dir.z > 0 ? worldBbox.max.z : worldBbox.min.z) : displayCenter.z
                                            );

                                            if (face.dir.x !== 0) {
                                                plane.scale.set(displaySize.z, displaySize.y, 1);
                                                plane.rotation.set(0, Math.PI / 2, 0);
                                            } else {
                                                plane.scale.set(displaySize.x, displaySize.y, 1);
                                                plane.rotation.set(0, 0, 0);
                                            }
                                            plane.visible = true;
                                            planeIndex++;
                                            
                                            if (labelIndex < this.MAX_LABELS) {
                                                const buildingData = this.buildingDataCache.get(id);
                                                if(buildingData) {
                                                    const label = this.labelObjects[labelIndex];
                                                    let labelHtml = '';

                                                    const gmlIdForImage = buildingData.id;
                                                    if(gmlIdForImage) {
                                                        const keikanInfoForImage = this.keikanData.get(gmlIdForImage);
                                                        if (keikanInfoForImage && keikanInfoForImage['ポータルサイトNo']) {
                                                            const portalId = String(keikanInfoForImage['ポータルサイトNo']);
                                                            const foundImage = this.keikanPhotoList.find(fileName => fileName.startsWith(portalId + '.'));
                                                            
                                                            if (foundImage) {
                                                                const imagePath = `../gion_asset_photos/${foundImage}`;
                                                                labelHtml += `<img src="${imagePath}" alt="景観写真" style="width: 100%; height: auto; border-radius: 5px; margin-bottom: 5px;">`;
                                                            }
                                                        }
                                                    }

                                                    const usage = buildingData.usage_jp || buildingData.usage || '不明';
                                                    const structure = buildingData.buildingStructureType_jp || buildingData.buildingStructureType || '不明';
                                                    labelHtml += `<p><strong>ID:</strong> ${id} | <strong>高さ:</strong> ${buildingData.measuredHeight}m</p>`;
                                                    labelHtml += `<p><strong>構造:</strong> ${structure} | <strong>用途:</strong> ${usage}</p>`;

                                                    const gmlId = buildingData.id;
                                                    if (gmlId) {
                                                        const matsuriInfo = this.matsuriData.get(gmlId);
                                                        if (matsuriInfo) {
                                                            labelHtml += `<hr style="margin: 5px 0; border-color: #555;">`;
                                                            labelHtml += `<p style="color: #F48FB1; text-align: center;"><strong>- 祇園祭関連情報 -</strong></p>`;
                                                            for (const key in matsuriInfo) {
                                                                if (key !== 'GML_ID' && matsuriInfo[key]) {
                                                                     labelHtml += `<p><strong>${key}:</strong> ${matsuriInfo[key]}</p>`;
                                                                }
                                                            }
                                                        }
                                                        
                                                        const keikanInfo = this.keikanData.get(gmlId);
                                                        if (keikanInfo) {
                                                            labelHtml += `<hr style="margin: 5px 0; border-color: #555;">`;
                                                            labelHtml += `<p style="color: #90EE90; text-align: center;"><strong>- 景観情報 -</strong></p>`;
                                                            for (const key in keikanInfo) {
                                                                if (key !== 'GML_ID' && key !== 'ポータルサイトNo' && keikanInfo[key]) {
                                                                    if (key === '彩るURL') {
                                                                        labelHtml += `<p><strong>${key}:</strong> <a href="${keikanInfo[key]}" target="_blank" style="color: #87CEEB; pointer-events: auto; cursor: pointer;">リンクを開く</a></p>`;
                                                                    } else {
                                                                        labelHtml += `<p><strong>${key}:</strong> ${keikanInfo[key]}</p>`;
                                                                    }
                                                                }
                                                            }
                                                        }

                                                        const bunkazaiInfo = this.bunkazaiData.get(gmlId);
                                                        if (bunkazaiInfo) {
                                                            labelHtml += `<hr style="margin: 5px 0; border-color: #555;">`;
                                                            labelHtml += `<p style="color: #FFD700; text-align: center;"><strong>- 文化財情報 -</strong></p>`;
                                                            for (const key in bunkazaiInfo) {
                                                                if (key !== 'GML ID' && bunkazaiInfo[key]) {
                                                                     labelHtml += `<p><strong>${key}:</strong> ${bunkazaiInfo[key]}</p>`;
                                                                }
                                                            }
                                                        }

                                                        const height = parseFloat(buildingData.measuredHeight);
                                                        if (this.kyomachiyaGmlIds.has(gmlId) && !isNaN(height) && height < 10.0) {
                                                            labelHtml += `<hr style="margin: 5px 0; border-color: #555;">`;
                                                            labelHtml += `<p style="color: #66BB6A; text-align: center;"><strong>- 京町家 -</strong></p>`;
                                                        }

                                                        const densanInfo = this.densanData.get(gmlId);
                                                        if (densanInfo) {
                                                            labelHtml += `<hr style="margin: 5px 0; border-color: #555;">`;
                                                            labelHtml += `<p style="color: #FFEE58; text-align: center;"><strong>- 伝統産業情報 -</strong></p>`;
                                                            for (const key in densanInfo) {
                                                                if (key !== 'GML_ID' && densanInfo[key]) {
                                                                     labelHtml += `<p><strong>${key}:</strong> ${densanInfo[key]}</p>`;
                                                                }
                                                            }
                                                        }
                                                    }

                                                    label.element.innerHTML = labelHtml;
                                                    
                                                    label.position.set(plane.position.x, 2, plane.position.z);
                                                    
                                                    screenPosition.copy(label.position).project(this.camera);
                                                    label.center.set(screenPosition.x < 0 ? 1 : 0, 0.5);

                                                    label.visible = true;
                                                    labelIndex++;
                                                }
                                            }
                                        }
                                    }
                                }
                            }
                        }
                        
                        for (let i = planeIndex; i < this.MAX_ROAD_FACES; i++) this.roadFacingPlanes[i].visible = false;
                        for (let i = labelIndex; i < this.MAX_LABELS; i++) this.labelObjects[i].visible = false;
                    }

                 } else {
                    if (this.mapGroup && !this.isMinimalMode) this.mapGroup.visible = true;
                    const showRoadsInMainView = this.camera.position.y < 100 && !this.isMinimalMode;
                    const roadModels = [ this.roadAsphaltModel, this.roadMarkingModel, this.busBayModel, this.gutterModel, this.sidewalkModel ];
                    roadModels.forEach(model => { if (model) model.visible = showRoadsInMainView; });
                    
                    //this.updateCameraInfoDisplay();//カメラ位置パネルは非表示
                 }

                if (!this.isCharacterMode) {
                    const cameraHeight = this.camera.position.y;
                    const minHeight = 50;
                    const maxHeight = 1000;
                    const minZoom = 0.1;
                    const maxZoom = 1.0;
                    const minRotate = 0.1;
                    const maxRotate = 1.0;
                    const t = Math.max(0, Math.min(1, (cameraHeight - minHeight) / (maxHeight - minHeight)));
                    const newZoomSpeed = minZoom + t * (maxZoom - minZoom);
                    const newRotateSpeed = minRotate + t * (maxRotate - minRotate);
                    this.controls.zoomSpeed = newZoomSpeed;
                    this.controls.rotateSpeed = newRotateSpeed;
                }
                
                if (this.isSubCameraVisible && !this.isCharacterMode) {
                    this._updateLabelOcclusion(occlusionArea);
                }
                
                this.positionLabels(this.camera, {left: 0, top: 0, width: window.innerWidth, height: window.innerHeight}, this.buildingLabels, occlusionArea);

                this.renderer.clear();
                this.renderer.setScissorTest(true);

                if (this.subCameraMapGroup) this.subCameraMapGroup.visible = false;
                
                const mainViewport = { left: 0, top: 0, width: window.innerWidth, height: window.innerHeight };
                this.renderer.setViewport(mainViewport.left, 0, mainViewport.width, mainViewport.height);
                this.renderer.setScissor(mainViewport.left, 0, mainViewport.width, mainViewport.height);

                this.renderer.render(this.scene, this.camera);

                if(this.isSubCameraVisible && !this.isCharacterMode) {
                    if (this.mapGroup) this.mapGroup.visible = false;
                    if (this.subCameraMapGroup) this.subCameraMapGroup.visible = true;
                    
                    this.renderer.setViewport(subViewportRenderer.left, subViewportRenderer.top, subViewportRenderer.width, subViewportRenderer.height);
                    this.renderer.setScissor(subViewportRenderer.left, subViewportRenderer.top, subViewportRenderer.width, subViewportRenderer.height);
                    this.renderer.clear();

                    if (this.subCameras.length > 0) {
                        const activeSubCameraIndex = this.activeSubCameraIndex;
                        const activeSubCameraData = this.subCameraData[activeSubCameraIndex];
                        const activeSubCamera = this.subCameras[activeSubCameraIndex];

                        if (activeSubCameraData.type === 'chase') {
                            const target = this[activeSubCameraData.targetName];
                            if (target) {
                                const modelScene = target.children.find(child => child.type === 'Group');
                                const currentScale = modelScene ? modelScene.scale.x : 1;
                                const box = new THREE.Box3().setFromObject(target);
                                const highestPointY = box.max.y / currentScale;

                                const lookAtTarget = new THREE.Vector3(
                                    target.position.x,
                                    highestPointY - 1,
                                    target.position.z
                                );
                                const forward = new THREE.Vector3(0, 0, 1);
                                forward.applyQuaternion(target.quaternion);
                                forward.y = 0;
                                forward.normalize();
                                const cameraOffset = forward.clone().multiplyScalar(-5);
                                const cameraPosition = lookAtTarget.clone().add(cameraOffset);
                                cameraPosition.y = highestPointY + 2;
                                activeSubCamera.position.copy(cameraPosition);
                                activeSubCamera.lookAt(lookAtTarget);
                            }
                        }

                        activeSubCamera.updateMatrixWorld();
                        
                        this.subCameraCombinedBtn.innerHTML = `${this.subCameraData[this.activeSubCameraIndex].name}<br>切替 🔄`;
                        
                        let newRoadName = null;
                        const activeSubCameraDataForRoad = this.subCameraData[this.activeSubCameraIndex];
                        if (activeSubCameraDataForRoad && activeSubCameraDataForRoad.type === 'chase') {
                            const targetYamaboko = this[activeSubCameraDataForRoad.targetName];
                            if (targetYamaboko) {
                                const origin = targetYamaboko.position.clone().add(new THREE.Vector3(0, 0.5, 0));
                                const direction = new THREE.Vector3(0, -1, 0);
                                this.raycaster.set(origin, direction);
                                this.raycaster.far = 1.0;
                                const intersects = this.raycaster.intersectObjects(this.walkableMeshes, true);
                                if (intersects.length > 0) {
                                    let foundName = null;
                                    let currentObject = intersects[0].object;
                                    while (currentObject) {
                                        if (currentObject.userData && currentObject.userData.road_name) {
                                            foundName = currentObject.userData.road_name;
                                            break;
                                        }
                                        currentObject = currentObject.parent;
                                    }
                                    newRoadName = foundName || 'null';
                                } else {
                                    newRoadName = 'null';
                                }
                            }
                        }
                        this.subCameraRoadName = newRoadName;

                        if (this.subCameraRoadName && this.subCameraRoadName !== 'null') {
                            this.subCameraRoadNameLabel.style.display = 'block';
                            this.subCameraRoadNameLabel.textContent = this.subCameraRoadName;
                        } else {
                            this.subCameraRoadNameLabel.style.display = 'none';
                        }
                        
                        this._cullBuildingBlocks(activeSubCamera);

                        this.renderer.render(this.scene, activeSubCamera);
                    }
                    
                    if (this.mapGroup && !this.isMinimalMode) this.mapGroup.visible = true;
                }
                
                this.renderer.setScissorTest(false);
                this.cssRenderer.render(this.cssScene, this.camera);
                this.labelRenderer.render(this.scene, this.camera);

                this.needsRender = false;
             }
        };

        
        _applyLabelDisplayRules() {
            const cameraY = this.camera.position.y;
            const isLowAltitude = cameraY <= 200;
            
            // 建物に付く「しらべる」ラベルを全て取得
            const searchLabels = [...this.buildingLabels, ...this.subCameraBuildingLabels];
            // ★★★ 山鉾に付く「祭」ラベルを別途取得 ★★★
            const yamabokoMatsuriLabels = document.querySelectorAll('.yamaboko-search-label');

            if (isLowAltitude) {
                // カメラY座標が200以下の場合
                this.yamabokoLabelContainers.forEach(label => {
                    label.visible = true;
                    const nameLabel = label.element.querySelector('.yamaboko-label');
                    const logoContainer = label.element.querySelector('.logo-stack-container');
                    if(nameLabel) nameLabel.style.zIndex = 'auto';
                    if(logoContainer) logoContainer.style.zIndex = 'auto';
                });
                this.placeNameLabels.forEach(label => {
                    label.visible = false;
                    label.element.style.display = 'none'; 
                });
                this.videoLabelContainers.forEach(label => {
                    label.visible = false;
                    label.element.style.display = 'none';
                });
                
                // 建物に付く「しらべる」ラベルを非表示にする
                searchLabels.forEach(item => item.element.style.visibility = 'hidden');
                // ★★★ 山鉾に付く「祭」ラベルも非表示にする ★★★
                yamabokoMatsuriLabels.forEach(label => label.style.visibility = 'hidden');

            } else {
                // カメラY座標が200より高い場合
                this.yamabokoLabelContainers.forEach(label => {
                    label.visible = true;
                    const nameLabel = label.element.querySelector('.yamaboko-label');
                    const logoContainer = label.element.querySelector('.logo-stack-container');
                    if(nameLabel) nameLabel.style.zIndex = '100';
                    if(logoContainer) logoContainer.style.zIndex = '80';
                });
                this.placeNameLabels.forEach(label => {
                    label.visible = true;
                    label.element.style.display = '';
                    label.element.style.zIndex = '90';
                });
                this.videoLabelContainers.forEach(label => {
                const shouldShow = this.showVideoLabels;
                label.visible = shouldShow;
                label.element.style.display = shouldShow ? '' : 'none';
                label.element.style.zIndex = '80';
                });

                // 建物ラベルのvisibilityをリセット
                searchLabels.forEach(item => item.element.style.visibility = '');
                // ★★★ 山鉾の「祭」ラベルのvisibilityもリセットする ★★★
                yamabokoMatsuriLabels.forEach(label => label.style.visibility = '');
            }
        }



createYoutubeClickableLogo(videoInfo) { 
            const div = document.createElement('div');
            div.className = 'youtube-bubble'; 
            div.style.cursor = 'pointer';
            
            // videoInfo.typeに応じて、色分け用のクラスを追加
            if (videoInfo.type === 'keikan') {
                div.classList.add('youtube-bubble-keikan');
            } else if (videoInfo.type === 'bunkazai') {
                div.classList.add('youtube-bubble-bunkazai');
            }

            // ツールチップ表示のためにdata-name属性に名称を設定
            div.dataset.name = videoInfo.name;
            // ネイティブのtitle属性も設定しておくと親切
            div.title = `動画を再生: ${videoInfo.name}`;

            div.style.pointerEvents = 'auto';

            const img = document.createElement('img');
            img.src = 'https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg';
            div.appendChild(img);
            
            const logoObject = new CSS2DObject(div);

            // ▼▼▼ 変更箇所：イベントハンドラを修正 ▼▼▼
            // userDataに依存せず、クロージャ内のvideoInfoを直接参照するように変更
            div.addEventListener('click', (e) => {
                e.stopPropagation();
                // videoInfoオブジェクトがURLプロパティを持っているか確認
                if (videoInfo && videoInfo.url) {
                    this.showVideoModal(videoInfo.url);
                }
            });
            // ▲▲▲ 変更ここまで ▲▲▲

            return logoObject;
        }

        showVideoModal(videoUrl) {
            // もしシミュレーションが再生中なら停止する
            if (this.timeScale > 0) {
                this.timeScale = 0;
                // ボタンのテキストを再生可能状態に戻す
                const playText = this.isCharacterMode ? '▶ | 10倍再生' : '▶ | 100倍再生';
                this.playPauseBtn.innerHTML = playText;
            }
            
            // iframeを作成し、自動再生オプションを付けてコンテナに挿入
            const iframe = document.createElement('iframe');
            iframe.width = "560";
            iframe.height = "315";
            // autoplay=1 をURLに追加して自動再生
            iframe.src = `${videoUrl}&autoplay=1`;
            iframe.title = "YouTube video player";
            iframe.frameBorder = "0";
            iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
            iframe.referrerPolicy = "strict-origin-when-cross-origin";
            iframe.allowFullscreen = true;

            // コンテナを一度空にしてからiframeを追加
            this.youtubePlayerContainer.innerHTML = '';
            this.youtubePlayerContainer.appendChild(iframe);

            // モーダルを表示
            this.videoModal.style.display = 'flex';
        }
_attachMatsuriLabelsToModels() {
            if (this.matsuriGlbData.size === 0) {
                return;
            }

            this.matsuriGlbData.forEach((matsuriInfo, glbName) => {
                const modelName = glbName.replace('.glb', '');
                
                let targetObject = null;

                // 1. まず山鉾オブジェクトの中から探す
                targetObject = this.allYamabokoObjects.find(obj => obj.userData.name === modelName);

                // 2. 山鉾に見つからなければ、神獣モデルの中から探す
                if (!targetObject) {
                    for (const shishinName in this.shishinModels) {
                        if (modelName.startsWith(shishinName)) {
                            targetObject = this.shishinModels[shishinName];
                            break;
                        }
                    }
                }

                if (!targetObject) {
                    console.warn(`「${glbName}」に一致するモデルがシーンに見つかりませんでした。`);
                    return;
                }
                
                // 山鉾でも四神でも、必ずlabelContainerを取得する
                const labelContainer = targetObject.getObjectByName('labelContainer');
                if (!labelContainer) {
                    console.warn(`モデル「${modelName}」にラベルコンテナが見つかりませんでした。`);
                    return;
                }

                if (!matsuriInfo || !matsuriInfo['タイトル']) {
                    return;
                }

                const containerDiv = labelContainer.element;
                // 既に「祭」ラベルがあれば追加しない
                if (containerDiv.querySelector('.yamaboko-search-label')) {
                    return;
                }

                // --- ラベルのDOM要素を作成して、コンテナに追加する ---
                const matsuriLabelDiv = document.createElement('div');
                matsuriLabelDiv.className = 'matsuri-label yamaboko-search-label';
                matsuriLabelDiv.textContent = '祭';
                matsuriLabelDiv.dataset.name = matsuriInfo['タイトル'];
                matsuriLabelDiv.style.display = 'none'; // 初期状態は非表示
                matsuriLabelDiv.style.pointerEvents = 'auto';
                matsuriLabelDiv.style.cursor = 'pointer';

                matsuriLabelDiv.addEventListener('click', (e) => {
                    e.stopPropagation();
                    this._showInfoPanel(matsuriInfo['タイトル'], matsuriInfo['説明']);
                });
                
                containerDiv.prepend(matsuriLabelDiv);
            });
        }

        _showInfoPanel(title, description) {
            let infoHtml = `<b>タイトル:</b> ${title || '不明'}<br>`;
            if (description) {
                // 説明文の中の改行文字(\n)をHTMLの<br>タグに変換
                infoHtml += `<b>説明:</b> ${description.replace(/\n/g, '<br>')}<br>`;
            }
            this.infoOverlayText.innerHTML = infoHtml;
            this.infoOverlay.classList.add('visible');
        }

        _createAllTorikumiLabels(torikumiData) {
            if (!torikumiData || !this.allWaypoints) return;

            torikumiData.forEach((data, index) => {
                const position = this.allWaypoints.get(data.地点);
                if (!position) {
                    console.warn(`「京都市の取組」の地点が見つかりません: ${data.地点}`);
                    return;
                }

                // Mapにデータを保存
                const torikumiId = `torikumi_${index}`;
                this.torikumiData.set(torikumiId, data);
                
                const clickHandler = (e) => {
                    e.stopPropagation();
                    this._showTorikumiInfoPanel(torikumiId);
                };

                // メインカメラ用のラベルを作成
                const labelDiv = document.createElement('div');
                labelDiv.className = 'bunkazai-label torikumi-label'; // CSSを流用しつつ独自クラスも付与
                labelDiv.textContent = '行';
                labelDiv.dataset.name = data.地点; // ホバーで表示するテキスト
                labelDiv.addEventListener('click', clickHandler);
                document.getElementById('css3d-container').appendChild(labelDiv);
                this.buildingLabels.push({ 
                    position: position.clone(), 
                    element: labelDiv, 
                    type: 'torikumi', // フィルター用のタイプ
                    buildingId: torikumiId // 識別子
                });
                
                // サブカメラ用のラベルを作成
                const subLabelDiv = document.createElement('div');
                subLabelDiv.className = 'bunkazai-label-sub torikumi-label-sub'; // CSSを流用
                subLabelDiv.textContent = '行';
                subLabelDiv.dataset.name = data.地点;
                subLabelDiv.addEventListener('click', clickHandler);
                document.getElementById('css3d-container').appendChild(subLabelDiv);
                this.subCameraBuildingLabels.push({ 
                    position: position.clone(), 
                    element: subLabelDiv, 
                    type: 'torikumi', 
                    buildingId: torikumiId
                });
            });
        }
        
        _showTorikumiInfoPanel(torikumiId) {
            const data = this.torikumiData.get(torikumiId);
            if (!data) return;

            let infoHtml = `<b>地点:</b> ${data.地点}<br><hr style="border-color: #555; margin: 10px 0;">`;
            infoHtml += `<b>取組内容:</b><br>${data.取組内容}<br><hr style="border-color: #555; margin: 10px 0;">`;
            if (data.URL) {
                infoHtml += `<b>URL:</b> <a href="${data.URL}" target="_blank" style="color: #90caf9;">関連ページを開く</a>`;
            }

            this.infoOverlayText.innerHTML = infoHtml;
            this.infoOverlay.classList.add('visible');
        }        

    }



    
    
    window.addEventListener('DOMContentLoaded', () => {
        new GionSimulationApp();
    });
</script>
