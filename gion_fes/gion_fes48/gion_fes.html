/* ▼▼▼ ローディング画面のスタイルを変更 ▼▼▼ */
#loading-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background-color: white; 
    display: flex; justify-content: center;
    align-items: center; z-index: 9999;
    transition: opacity 0.5s ease;
    flex-direction: column;
}
#loading-animation-container {
    position: relative;
    width: 70vmin; 
    max-width: 450px;
    aspect-ratio: 1 / 1; 
}
.road-h, .road-v {
    position: absolute;
    background-color: #FFD700; 
    border-radius: 4px;
    overflow: hidden; 
}
.road-h::before, .road-v::before {
    content: '';
    position: absolute;
    background-color: #007bff; 
}

.road-h {
    width: 110%;
    height: 10%;
    left: -5%;
    z-index: 2;
}
.road-v {
    width: 10%;
    height: 110%;
    top: -5%;
    z-index: 1;
}

/* ★★★ 修正箇所 ★★★ */
/* 以下の各道路の位置を指定するルール4つが抜けていました */
#road-oike { top: 0; }
#road-shijo { bottom: 0; }
#road-shinmachi { left: 0; }
#road-kawaramachi { right: 0; }


#road-oike::before { 
    top: 0; bottom: 0; left: 4.545%; right: 4.545%;
    transform-origin: right;
    transform: scaleX(var(--progress-oike, 0));
}
#road-shijo::before { 
    top: 0; bottom: 0; left: 4.545%; right: 4.545%;
    transform-origin: left;
    transform: scaleX(var(--progress-shijo, 0));
}
#road-kawaramachi::before { 
    left: 0; right: 0; top: 4.545%; bottom: 4.545%;
    transform-origin: bottom;
    transform: scaleY(var(--progress-kawaramachi, 0));
}

.street-label {
    position: absolute;
    color: black;
    font-weight: bold;
    font-size: clamp(12px, 3.5vmin, 20px);
    white-space: nowrap;
}
#label-oike {
    left: calc(100% + 25px);
    top: 5%;
    transform: translateY(-50%);
}
#label-shijo {
    left: calc(100% + 25px);
    top: 95%;
    transform: translateY(-50%);
}
#label-shinmachi {
    top: 105%;
    left: 5%;
    transform: translateX(-50%);
}
#label-kawaramachi {
    top: 105%;
    left: 95%;
    transform: translateX(-50%);
}

#yamaboko-icon {

}
#progress-text {

    color: black; 
    font-size: clamp(24px, 7vmin, 48px);

    font-weight: bold;
    white-space: nowrap;
}

<script id="vertexShader" type="x-shader/x-vertex">
        attribute float _id;
        attribute float isKeikan;
        attribute float isKyomachiya;
        attribute float isBunkazai;
        attribute float isDensan;
        attribute float isMatsuri;
        varying vec3 vNormal;
        varying float vBuildingID;
        varying vec3 vWorldPosition;
        varying float vIsKeikan;
        varying float vIsKyomachiya;
        varying float vIsBunkazai;
        varying float vIsDensan;
        varying float vIsMatsuri;

        void main() {
            vBuildingID = _id;
            vIsKeikan = isKeikan;
            vIsKyomachiya = isKyomachiya;
            vIsBunkazai = isBunkazai;
            vIsDensan = isDensan;
            vIsMatsuri = isMatsuri;
            vNormal = normalize(normalMatrix * normal);
            vWorldPosition = (modelMatrix * vec4(position, 1.0)).xyz;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    </script>
<script id="fragmentShader" type="x-shader/x-fragment">
        varying float vBuildingID;
        varying vec3 vNormal;
        varying vec3 vWorldPosition;
        varying float vIsKeikan;
        varying float vIsKyomachiya;
        varying float vIsBunkazai;
        varying float vIsDensan;
        varying float vIsMatsuri;

        uniform float uSelectedID;
        uniform vec3 uBaseColor;
        uniform vec3 uHighlightColor;
        
        void main() {
            if (vWorldPosition.z > 800.0 || vWorldPosition.z < -800.0 || vWorldPosition.x < -1050.0 || vWorldPosition.x > 950.0) {
                discard;
            }

            vec3 baseColor = uBaseColor;
            if (vIsMatsuri > 0.5) {
                baseColor = vec3(1.0, 0.71, 0.76); // 祇園祭（ピンク #FFB6C1）
            } else if (vIsKeikan > 0.5) {
                baseColor = vec3(0.65, 0.55, 0.85); // 景観（紫）
            } else if (vIsBunkazai > 0.5) {
                baseColor = vec3(0.6, 0.4, 0.2);   // 文化財（茶色）
            } else if (vIsDensan > 0.5) {
                baseColor = vec3(1.0, 0.75, 0.0); // 伝統産業（濃い黄色 #FFBF00）
            } else if (vIsKyomachiya > 0.5) {
                baseColor = vec3(0.4, 0.8, 0.4);   // 京町家（緑）
            }
            vec3 finalColor = baseColor;
            if (vBuildingID > 0.0 && vBuildingID == uSelectedID) {
                finalColor = uHighlightColor;
            }

            vec3 lightDirection = normalize(vec3(0.5, 1.0, 0.75));
            float ambientLight = 0.4;
            float diffuse = max(dot(vNormal, lightDirection), 0.0);
            float brightness = ambientLight + (1.0 - ambientLight) * diffuse;
            vec3 lightedColor = finalColor * brightness;
            
            gl_FragColor = vec4(lightedColor, 1.0);
        }
    </script>

<script id="skyVertexShader" type="x-shader/x-vertex">
    varying vec3 vWorldPosition;
    void main() {
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mvPosition;
        // これにより、スカイドームが常にカメラの後ろ（背景）に描画されるようになります
        gl_Position.z = gl_Position.w; 
        vWorldPosition = position;
    }
</script>

<script id="skyFragmentShader" type="x-shader/x-fragment">
    varying vec3 vWorldPosition;
    uniform vec3 uTopColor;
    uniform vec3 uBottomColor;
    uniform sampler2D uMountainTexture;
    uniform float uVerticalOffset;
    const float PI = 3.141592653589793;

    void main() {
        // グラデーション空の色を計算
        float h = normalize(vWorldPosition).y;
        float t = (h + 1.0) / 2.0;
        vec3 skyColor = mix(uBottomColor, uTopColor, smoothstep(0.5, 0.7, t));
        // ★★★ 地平線付近が滑らかに透明になる、元のロジックに戻します ★★★
        float skyAlpha = smoothstep(0.5, 0.55, t);
        vec4 finalSky = vec4(skyColor, skyAlpha);

        // 3D座標からUV座標を計算
        vec3 dir = normalize(vWorldPosition);
        float u = 0.5 + atan(dir.z, dir.x) / (2.0 * PI);
        float v = 0.5 - asin(dir.y) / PI;
        
        // 山のテクスチャから色を取得
        vec4 mountainColor = texture2D(uMountainTexture, vec2(u, 1.0 - v + uVerticalOffset));
        
        // 空の色と山の画像をアルファ合成
        vec4 finalColor = mix(finalSky, mountainColor, mountainColor.a);

        gl_FragColor = finalColor;
    }
</script>

<script id="mapTileVertexShader" type="x-shader/x-vertex">
    varying vec2 vUv;
    varying vec3 vWorldPosition;
    void main() {
        vUv = uv;
        vec4 worldPosition = modelMatrix * vec4(position, 1.0);
        vWorldPosition = worldPosition.xyz;
        gl_Position = projectionMatrix * viewMatrix * worldPosition;
    }
</script>
<script id="mapTileFragmentShader" type="x-shader/x-fragment">
    varying vec2 vUv;
    varying vec3 vWorldPosition;
    uniform sampler2D tMap;
    uniform float uRadius;       // フェードアウトを開始する半径
    uniform float uFadeDistance; // フェードアウトにかける距離

    void main() {
        float dist = length(vWorldPosition.xz);
        // uRadiusからuFadeDistanceを引いた距離にかけて、滑らかに透明にする
        float alpha = smoothstep(uRadius, uRadius - uFadeDistance, dist);
        // 完全に透明になったピクセルは描画しない（パフォーマンス向上）
        if (alpha < 0.01) discard;

        vec4 texColor = texture2D(tMap, vUv);
        gl_FragColor = vec4(texColor.rgb, texColor.a * alpha);
    }
</script>

// ▼▼▼ 以下2つの関数を新規追加 ▼▼▼
_updateLoadingStyles(percent) {
            // HTML要素を取得
            const progressText = document.getElementById('progress-text');
            const yamabokoIcon = document.getElementById('yamaboko-icon');
            const roadShijo = document.getElementById('road-shijo');
            const roadKawaramachi = document.getElementById('road-kawaramachi');
            const roadOike = document.getElementById('road-oike');

            if (!progressText || !yamabokoIcon || !roadShijo || !roadKawaramachi || !roadOike) return;

            // 1. テキスト表示を更新
            progressText.textContent = `${Math.round(percent)}% 読込済`;

            // 2. 青色の進捗バーのスケール値(0～1)を計算
            let shijoScale = 0, kawaramachiScale = 0, oikeScale = 0;

            if (percent <= 33.33) {
                // 四条通の進捗 (0 -> 1)
                shijoScale = percent / 33.33;
            } else {
                shijoScale = 1; // 四条通は完了
                if (percent <= 66.66) {
                    // 河原町通の進捗 (0 -> 1)
                    kawaramachiScale = (percent - 33.33) / 33.33;
                } else {
                    kawaramachiScale = 1; // 河原町通は完了
                    // 御池通の進捗 (0 -> 1)
                    oikeScale = (percent - 66.66) / 33.34;
                }
            }
            // CSSのカスタムプロパティ（変数）を更新してバーを伸縮させる
            roadShijo.style.setProperty('--progress-shijo', shijoScale);
            roadKawaramachi.style.setProperty('--progress-kawaramachi', kawaramachiScale);
            roadOike.style.setProperty('--progress-oike', oikeScale);

            // 3. 山鉾の位置を計算 (この部分は変更なし)
            const roadWidthPercent = 10;
            const iconWidthPercent = 9;
            const offset = (roadWidthPercent - iconWidthPercent) / 2;
            let top, left;

            if (percent <= 33.33) {
                const phaseProgress = percent / 33.33;
                top = 100 - roadWidthPercent + offset;
                left = offset + (phaseProgress * (100 - roadWidthPercent));
            } else if (percent <= 66.66) {
                const phaseProgress = (percent - 33.33) / 33.33;
                top = (100 - roadWidthPercent + offset) - (phaseProgress * (100 - roadWidthPercent));
                left = 100 - roadWidthPercent + offset;
            } else {
                const phaseProgress = (percent - 66.66) / 33.34;
                top = offset;
                left = (100 - roadWidthPercent + offset) - (phaseProgress * (100 - roadWidthPercent));
            }
            
            // 4. 計算結果をCSSに適用 (この部分は変更なし)
            yamabokoIcon.style.left = `${left}%`;
            yamabokoIcon.style.top = `${top}%`;
            yamabokoIcon.style.transform = `translate(-50%, -50%)`;
        }

        animateLoading() {
            // 目標値に近づける処理 (線形補間)
            this.loadingProgressCurrent += (this.loadingProgressTarget - this.loadingProgressCurrent) * 0.08;

            // 計算した滑らかな値を使って、画面の表示を更新
            this._updateLoadingStyles(this.loadingProgressCurrent);
            
            // 進捗が99.9%を超えるまでアニメーションを繰り返す
            if (this.loadingProgressCurrent < 99.9) {
                this.loadingAnimationId = requestAnimationFrame(this.animateLoading.bind(this));
            } else {
                // 最後に100%にきっちり合わせる
                this._updateLoadingStyles(100);
            }
        }

// ▼▼▼ 変更/追加: チュートリアルの内容を描画するメソッド ▼▼▼
_displayTutorial() {
            // もしデータがなければ何もしない
            if (!this.tutorialData || this.tutorialData.length === 0) {
                this.tutorialBody.innerHTML = '<p>チュートリアルの読み込みに失敗しました。</p>';
                return;
            }

            // 描画エリアを一旦空にする
            this.tutorialBody.innerHTML = '';

            // JSONデータの各要素をループしてHTMLに変換
            this.tutorialData.forEach(item => {
                let element;
                let contentText = '';
                
                if (Array.isArray(item.content)) {
                    contentText = item.content.join('');
                } else {
                    contentText = item.content;
                }

                switch (item.type) {
                    case 'title':
                        element = document.createElement('h3');
                        element.textContent = contentText;
                        break;
                    case 'text':
                        element = document.createElement('p');
                        element.innerHTML = contentText.replace(/\n/g, '<br>');
                        break;
                    case 'image':
                        element = document.createElement('img');
                        element.src = contentText;
                        element.alt = 'チュートリアル画像';
                        break;
                    // ▼▼▼ 変更/追加: linkタイプの場合の処理を追加 ▼▼▼
                    case 'link':
                        // リンクを<p>タグで囲むために、まず<p>を作成
                        element = document.createElement('p');
                        
                        // 次に<a>タグ（リンク本体）を作成
                        const linkAnchor = document.createElement('a');
                        linkAnchor.textContent = item.content.text; // "text"プロパティを表示テキストに設定
                        linkAnchor.href = item.content.url;         // "url"プロパティをリンク先に設定
                        
                        // 外部リンクは新しいタブで開くようにし、セキュリティ対策も施す
                        linkAnchor.target = '_blank';
                        linkAnchor.rel = 'noopener noreferrer';
                        
                        // <p>タグの中に<a>タグを入れる
                        element.appendChild(linkAnchor);
                        break;
                    // ▲▲▲ 追加ここまで ▲▲▲
                    default:
                        return; // 未知のタイプは無視
                }
                // 作成した要素を描画エリアに追加
                this.tutorialBody.appendChild(element);
            });
        }

                const final_y_distance = final_z_distance * (600 / 900);

                this.camera.position.set(center.x, center.y + final_y_distance, center.z + final_z_distance);
                this.camera.lookAt(center);
                this.controls.target.copy(center);
                this.controls.update();
                
                this.initialCameraPosition = this.camera.position.clone();

                // 遅延対策：スタート画面表示前に一度レンダリングしてGPUをウォームアップさせる

                setTimeout(() => {

                this.needsRender = true;

            } catch (error) {

                const progressText = document.getElementById('progress-text');
                if(progressText) progressText.textContent = 'Error';

        _calculateVideoTimings() {
            const allSchedules = new Map();
            for (const name in this.yamabokoPropertyMap) {
                const scheduleProp = this.yamabokoPropertyMap[name].replace('Object', 'Schedule');
                if (this[scheduleProp]) {
                    allSchedules.set(name, this[scheduleProp]);
                }
            }

            this.videoEventsData.forEach(eventInfo => {
                const schedule = allSchedules.get(eventInfo.yamabokoName);
                if (!schedule) return;

                const waypointPos = this.allWaypoints.get(eventInfo.placeName);
                if (!waypointPos) return;

                const targetEvent = schedule.find(e => 
                    (e.type === 'STOP' || e.type === 'TURN') && e.position.equals(waypointPos)
                );

                if (targetEvent) {
                    const arrivalTime = targetEvent.startTime;
                    // ▼▼▼ この行を修正します ▼▼▼
                    const displayEndTime = arrivalTime + (eventInfo.duration || 500);

                    if (!this.videoDisplayTimings.has(eventInfo.yamabokoName)) {
                        this.videoDisplayTimings.set(eventInfo.yamabokoName, []);
                    }
                    this.videoDisplayTimings.get(eventInfo.yamabokoName).push({
                        startTime: arrivalTime,
                        endTime: displayEndTime,
                        videoUrl: eventInfo.videoUrl,
                        videoTitle: eventInfo.videoTitle
                    });
                }
            });
        }

        
        _createCSSLabel(text, className) {
            const div = document.createElement('div');
            div.className = className;
            div.textContent = text;
            const label = new CSS2DObject(div);
            return label;
        }

        _extractWaypoints(sceneObject) {
            const waypointPositions = new Map();
            sceneObject.traverse((child) => {
                if (child.isObject3D && child.name) {
                    const worldPos = new THREE.Vector3();
                    child.getWorldPosition(worldPos);
                    waypointPositions.set(child.name, worldPos);
                }
            });
            return waypointPositions;
        }

        _createPathFromGltf(gltf) {
            const points = [];
            gltf.scene.traverse(obj => {
                if (obj.isLine || obj.isMesh) {
                    const positionAttribute = obj.geometry.getAttribute('position');
                    if (positionAttribute) {
                        for (let i = 0; i < positionAttribute.count; i++) {
                            const point = new THREE.Vector3();
                            point.fromBufferAttribute(positionAttribute, i);
                            obj.localToWorld(point);
                            if (!points.length || !points[points.length - 1].equals(point)) {
                                points.push(point);
                            }
                        }
                    }
                }
            });
            if (points.length < 2) return null;
            const path = new THREE.CurvePath();
            for (let i = 0; i < points.length - 1; i++) {
                path.add(new THREE.LineCurve3(points[i], points[i + 1]));
            }
            return path;
        }

        _createSchedule(yamabokoName, timetable, waypointPositions, fullPath) {
            const schedule = [];
            if (!fullPath || !timetable) return schedule;
            const tsujimawashiNames = ['四条河原町', '河原町御池', '新町御池', '四条新町'];
            const pathPoints = fullPath.getPoints(2000);
            const findForwardClosestPointIndex = (targetPos, searchFromIndex) => {
                let closestIndex = searchFromIndex, minDistance = Infinity;
                if (searchFromIndex >= 0 && searchFromIndex < pathPoints.length) minDistance = pathPoints[searchFromIndex].distanceTo(targetPos);
                else return 0;
                for (let i = searchFromIndex; i < pathPoints.length; i++) {
                    const distance = pathPoints[i].distanceTo(targetPos);
                    if (distance < minDistance) { minDistance = distance; closestIndex = i; }
                }
                return closestIndex;
            };
            const findWrappedClosestPointIndex = (targetPos, searchToIndex) => {
                 let closestIndex = 0, minDistance = Infinity;
                 if (searchToIndex > 0 && pathPoints.length > 0) minDistance = pathPoints[0].distanceTo(targetPos);
                 else return 0;
                 for (let i = 0; i < searchToIndex; i++) {
                    const distance = pathPoints[i].distanceTo(targetPos);
                    if (distance < minDistance) { minDistance = distance; closestIndex = i; }
                 }
                 return closestIndex;
            };
            const timeToSeconds = (timeStr) => {
                const [h, m, s] = timeStr.split(':').map(Number);
                return h * 3600 + m * 60 + s;
            };
            let lastPathIndex = 0;
            for (let i = 0; i < timetable.length - 1; i++) {
                const startEntry = timetable[i], endEntry = timetable[i + 1];
                const startTime = timeToSeconds(startEntry.time), endTime = timeToSeconds(endEntry.time);
                const startPos = waypointPositions.get(startEntry.place), endPos = waypointPositions.get(endEntry.place);
                if (!startPos || !endPos) continue;
                const event = { startTime, endTime };
                const isTurnEvent = tsujimawashiNames.includes(startEntry.place) && startEntry.place === endEntry.place;
                if (isTurnEvent) {
                    if (startTime > endTime) continue;
                    event.type = 'TURN';
                    event.position = startPos;
                    let preTurnWaypointName = startEntry.place + "-1";
                    if ((yamabokoName === "船鉾" || yamabokoName === "岩戸山") && startEntry.place === "四条新町") preTurnWaypointName = startEntry.place + "-2";
                    const preTurnPos = waypointPositions.get(preTurnWaypointName);
                    const postTurnPos = waypointPositions.get(startEntry.place + "+1");
                    if (preTurnPos && postTurnPos) {
                        event.startDirection = new THREE.Vector3().subVectors(startPos, preTurnPos).normalize();
                        event.endDirection = new THREE.Vector3().subVectors(postTurnPos, startPos).normalize();
                    }
                } else if (startPos.equals(endPos)) {
                    if (startTime > endTime) continue;
                    event.type = 'STOP'; event.position = startPos;
                } else {
                    if (startTime >= endTime) continue;
                    event.type = 'MOVE';
                    const startIndex = findForwardClosestPointIndex(startPos, lastPathIndex);
                    let endIndex = findForwardClosestPointIndex(endPos, startIndex);
                    const forwardMatchDistance = pathPoints[endIndex].distanceTo(endPos);
                    const wrappedEndIndex = findWrappedClosestPointIndex(endPos, startIndex);
                    const wrappedMatchDistance = pathPoints[wrappedEndIndex].distanceTo(endPos);
                    if (wrappedMatchDistance < forwardMatchDistance * 0.8) endIndex = wrappedEndIndex;
                    if (startIndex !== -1 && endIndex !== -1) {
                        let segmentPoints;
                        if (startIndex <= endIndex) segmentPoints = pathPoints.slice(startIndex, endIndex + 1);
                        else segmentPoints = pathPoints.slice(startIndex).concat(pathPoints.slice(0, endIndex + 1));
                        
                        if (segmentPoints.length > 1) {
                            const path = new THREE.CurvePath();
                            for (let j = 0; j < segmentPoints.length - 1; j++) path.add(new THREE.LineCurve3(segmentPoints[j], segmentPoints[j + 1]));
                            event.path = path;
                        } else {
                            event.type = 'FALLBACK_MOVE'; event.startPos = startPos; event.endPos = endPos;
                        }
                    } else {
                        event.type = 'FALLBACK_MOVE'; event.startPos = startPos; event.endPos = endPos;
                    }
                    lastPathIndex = endIndex;
                }
                schedule.push(event);
            }
            return schedule;
        }

_updateObjectState(movingObject, schedule, currentTime, specialPositions) {
            if (!movingObject || movingObject.children.length === 0) return;

            const labelContainer = movingObject.getObjectByName('labelContainer');
            if (!labelContainer) return;

            // ▼▼▼ ここからが修正箇所です ▼▼▼
            // 1. ロゴの「串」コンテナと、その中の全ロゴ（団子）要素を取得
            const logoStackContainer = labelContainer.element.querySelector('.logo-stack-container');
            const nameDiv = labelContainer.element.querySelector('.yamaboko-label');
            const logoInstances = logoStackContainer ? logoStackContainer.querySelectorAll('.logo-instance') : [];
            
            // 2. まず、すべてのロゴを一旦非表示にする
            logoInstances.forEach(logo => logo.style.display = 'none');
            // ▲▲▲ 修正ここまで ▲▲▲

            let isKujiAratame = false;
            let isShimenawaKiri = false;
            let isTsujimawashi = false;

            let currentEvent = schedule.find(e => currentTime >= e.startTime && currentTime < e.endTime);
            
            if (currentEvent) {
                const eventDuration = currentEvent.endTime - currentEvent.startTime;
                const eventProgress = eventDuration > 0 ? (currentTime - currentEvent.startTime) / eventDuration : 1;
                const forward = new THREE.Vector3(0, 0, 1);
                switch (currentEvent.type) {
                    case 'MOVE':
                        if (currentEvent.path && currentEvent.path.getLength() > 0) {
                            const currentPosition = currentEvent.path.getPointAt(eventProgress);
                            movingObject.position.copy(currentPosition);
                            const tangent = currentEvent.path.getTangentAt(eventProgress).normalize();
                            const lookAtPosition = new THREE.Vector3().addVectors(currentPosition, tangent);
                            movingObject.lookAt(lookAtPosition);
                        }
                        break;
                    case 'STOP':
                        movingObject.position.copy(currentEvent.position);
                        
                        if (specialPositions.shijoSakaimachi && currentEvent.position.equals(specialPositions.shijoSakaimachi)) {
                            isKujiAratame = true;
                        }
                                                
                        if (movingObject.userData.name === '長刀鉾' && specialPositions.shijoFuyacho && currentEvent.position.equals(specialPositions.shijoFuyacho)) isShimenawaKiri = true;
                        break;
                    case 'TURN':
                        movingObject.position.copy(currentEvent.position);
                        if (currentEvent.startDirection && currentEvent.endDirection) {
                            const startQuat = new THREE.Quaternion().setFromUnitVectors(forward, currentEvent.startDirection);
                            const endQuat = new THREE.Quaternion().setFromUnitVectors(forward, currentEvent.endDirection);
                            movingObject.quaternion.slerpQuaternions(startQuat, endQuat, eventProgress);
                        }
                        isTsujimawashi = true;
                        break;
                    case 'FALLBACK_MOVE':
                        movingObject.position.lerpVectors(currentEvent.startPos, currentEvent.endPos, eventProgress);
                        break;
                }
            } else {
                const pastEvents = schedule.filter(e => e.endTime <= currentTime);
                const futureEvents = schedule.filter(e => e.startTime >= currentTime);
                
                if (pastEvents.length > 0) {
                    const lastEvent = pastEvents[pastEvents.length - 1];
                    const forward = new THREE.Vector3(0, 0, 1);
                    switch (lastEvent.type) {
                        case 'MOVE':
                            if (lastEvent.path && lastEvent.path.getLength() > 0) {
                                const finalPosition = lastEvent.path.getPointAt(1);
                                movingObject.position.copy(finalPosition);
                                const finalTangent = lastEvent.path.getTangentAt(1).normalize();
                                movingObject.lookAt(new THREE.Vector3().addVectors(finalPosition, finalTangent));
                            }
                            break;
                        case 'STOP': 
                            movingObject.position.copy(lastEvent.position);
                            break;
                        case 'TURN':
                            movingObject.position.copy(lastEvent.position);
                            if (lastEvent.startDirection && lastEvent.endDirection) {
                                const endQuat = new THREE.Quaternion().setFromUnitVectors(forward, lastEvent.endDirection);
                                movingObject.quaternion.copy(endQuat);
                            }
                            break;
                        case 'FALLBACK_MOVE':
                            movingObject.position.copy(lastEvent.endPos);
                            break;
                    }
                } else if (futureEvents.length > 0) {
                    const firstEvent = futureEvents[0];
                    if (firstEvent.type === 'MOVE' && firstEvent.path) {
                        movingObject.position.copy(firstEvent.path.getPointAt(0));
                        const tangent = firstEvent.path.getTangentAt(0).normalize();
                        movingObject.lookAt(new THREE.Vector3().addVectors(movingObject.position, tangent));
                    } else if (firstEvent.position) {
                        movingObject.position.copy(firstEvent.position);
                    } else if (firstEvent.startPos) {
                        movingObject.position.copy(firstEvent.startPos);
                    }
                }
            }
            
            // ▼▼▼ ここからが修正箇所です ▼▼▼
            if (logoInstances.length > 0) {
                const yamabokoName = movingObject.userData.name;
                const videoTimings = this.videoDisplayTimings.get(yamabokoName);
                if (videoTimings && this.showVideoLabels) {
                    const activeTimings = videoTimings.filter(timing => 
                        currentTime >= timing.startTime && currentTime < timing.endTime
                    );

                    activeTimings.forEach((timing, index) => {
                        if (index < logoInstances.length) {
                            const logoToShow = logoInstances[index];
                            logoToShow.style.display = 'flex';
                            logoToShow.userData = { videoUrl: timing.videoUrl };
                            logoToShow.dataset.name = timing.videoTitle || '動画を再生';
                            logoToShow.title = `動画を再生: ${timing.videoTitle || ''}`;   
                        }
                    });
                }
            }
            // ▲▲▲ 修正ここまで ▲▲▲
            
            if (!nameDiv) return;

            const kujiTorazuFloats = new Set(['長刀鉾', '函谷鉾', '放下鉾', '岩戸山', '船鉾']);
            const baseText = movingObject.userData.name || '';
            let newText = baseText;
            let newClassName = 'yamaboko-label';

            if (isKujiAratame) {
                if (kujiTorazuFloats.has(baseText)) {
                    newText = `${baseText}<br>くじ取らず`;
                } else {
                    newText = `${baseText}<br>くじ改め`;
                }
                newClassName += ' event-kuji-aratame';
            } else if (isShimenawaKiri) {
                newText = `${baseText}<br>しめ縄切り`;
                newClassName += ' event-shimenawa-kiri';
            } else if (isTsujimawashi && this.tsujimawashiLabelTargets.has(baseText)) {
                newText = `${baseText}<br>辻回し`;
                newClassName += ' event-tsujimawashi';
            }
            
            nameDiv.innerHTML = newText;
            nameDiv.className = newClassName;

            const wasVisible = movingObject.visible;
            movingObject.visible = true; 
            
            const box = new THREE.Box3().setFromObject(movingObject);
            const topY = box.max.y;

            movingObject.visible = wasVisible;

            const nameLabelOffset = 5;
            labelContainer.position.y = topY + nameLabelOffset;
        }

_updateLabelOcclusion(occlusionArea) {
            // シーン全体を探すのではなく、管理している配列から直接ラベルを取得する
            const labelsToCheck = [
                ...this.yamabokoLabelContainers,
                ...this.videoLabelContainers, // ★★★ 動画ラベルのコンテナを判定対象に追加
                ...this.placeNameLabels
            ];

            const _vector = new THREE.Vector3();
            for (const label of labelsToCheck) {
                // ラベルが表示対象でない場合はスキップ
                if (!label.parent || !label.parent.visible || !label.visible) {
                    continue;
                }
                
                _vector.setFromMatrixPosition(label.matrixWorld);
                _vector.project(this.camera);

                if (_vector.z > 1) {
                    label.visible = false;
                    continue;
                }

                const x = (_vector.x * 0.5 + 0.5) * window.innerWidth;
                const y = (_vector.y * -0.5 + 0.5) * window.innerHeight;

                // サブカメラ領域と重なっている場合は非表示にする
                if (x > occlusionArea.left && x < occlusionArea.right && y > occlusionArea.top && y < occlusionArea.bottom) {
                    label.visible = false;
                }
            }
        }

async loadAllModels() {
            this.buildingBlocks = [];

            const loader = new GLTFLoader();
            const dracoLoader = new DRACOLoader();
            dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/libs/draco/gltf/');
            loader.setDRACOLoader(dracoLoader);
            
            const interactiveModelPaths = ['../gion_asset/グリッド状建築物群.glb'];
            const girlPath = 'girl3.glb';
            const tranPath = '../gion_asset/tran_3.glb'; 
            const roadPath = '../gion_asset/車道アスファルト.glb';
            const markingPath = '../gion_asset/白線.glb';
            const busBayPath = '../gion_asset/バスベイ.glb';
            const gutterPath = '../gion_asset/側溝.glb';
            const sidewalkPath = '../gion_asset/歩道.glb';
            const wallPath = 'collision_walls.glb';
            
            const [buildingAttrRes, keikanRes, kyomachiyaRes, bunkazaiRes, densanRes, matsuriRes, keikanPhotoListRes] = await Promise.all([
                fetch('../gion_asset/merged_merged_output.json'),
                fetch('../gion_asset/景観+彩る.json'),
                fetch('../gion_asset/kyomachiya_kachizuke.json'),
                fetch('../gion_asset/bunkazai_kachizuke.json'),
                fetch('../gion_asset/伝統産業.json'),
                fetch('../gion_asset/祇園祭関連.json').catch(e => { console.warn('祇園祭関連.json not found, skipping.'); return new Response('[]')}),
                fetch('../gion_asset_photos/file_list.json').catch(e => { console.warn('file_list.json not found, skipping.'); return new Response('[]')})
            ]);

            const buildingAttrData = await buildingAttrRes.json();
            const keikanData = await keikanRes.json();
            const kyomachiyaData = await kyomachiyaRes.json();
            const bunkazaiData = await bunkazaiRes.json();
            const densanData = await densanRes.json();
            const matsuriRawData = await matsuriRes.json();
            this.keikanPhotoList = await keikanPhotoListRes.json();

            buildingAttrData.forEach(attr => {
                const key = attr.sequential_id || attr.serial_number;
                if (key) {
                    this.buildingAttributes[key] = attr;
                    this.buildingDataCache.set(key, attr);
                }
            });

            // ▼▼▼ 変更箇所 ▼▼▼
            const addVideoToMap = (gmlId, videoInfo) => {
                if (!this.videoUrlMap.has(gmlId)) {
                    this.videoUrlMap.set(gmlId, []);
                }
                this.videoUrlMap.get(gmlId).push(videoInfo);
            };

            keikanData.forEach(item => {
                if (item.GML_ID) {
                    this.keikanData.set(item.GML_ID, item);
                    this.keikanGmlIds.add(item.GML_ID);
                    if (item.youtubeUrl) {
                        addVideoToMap(item.GML_ID, {
                            url: item.youtubeUrl,
                            type: 'keikan', 
                            name: item['表示名称'] || '名称不明'
                        });
                    }
                }
            });
            // ▲▲▲ 変更ここまで ▲▲▲

            kyomachiyaData.forEach(item => {
                if (item['GML ID']) this.kyomachiyaGmlIds.add(item['GML ID']);
            });

            // ▼▼▼ 変更箇所 ▼▼▼
            bunkazaiData.forEach(item => {
                if (item['GML ID']) {
                    this.bunkazaiData.set(item['GML ID'], item);
                    this.bunkazaiGmlIds.add(item['GML ID']);
                    if (item.youtubeUrl) {
                        addVideoToMap(item['GML ID'], {
                            url: item.youtubeUrl,
                            type: 'bunkazai', 
                            name: item['名称'] || '名称不明'
                        });
                    }
                }
            });
            // ▲▲▲ 変更ここまで ▲▲▲

            densanData.forEach(item => {
                if (item.GML_ID) {
                    this.densanData.set(item.GML_ID, item);
                    this.densanGmlIds.add(item.GML_ID);
                }
            });
            
            matsuriRawData.forEach(item => {
                if (item.GML_ID) {
                    this.matsuriData.set(item.GML_ID, item);
                    this.matsuriGmlIds.add(item.GML_ID);
                } else if (item.GLB_NAME) {
                    this.matsuriGlbData.set(item.GLB_NAME, item);
                }
            });

            this.customBuildingMaterial = this.createCustomMaterial();

            const interactivePromises = interactiveModelPaths.map(path => loader.loadAsync(path).catch(e => console.error(`Failed to load ${path}`, e)));
            const girlPromise = loader.loadAsync(girlPath).catch(e => console.error(`Failed to load ${girlPath}`, e));
            const tranPromise = loader.loadAsync(tranPath).catch(e => console.error(`Failed to load ${tranPath}`, e));
            const roadPromise = loader.loadAsync(roadPath).catch(e => console.error(`Failed to load ${roadPath}`, e));
            const markingPromise = loader.loadAsync(markingPath).catch(e => console.error(`Failed to load ${markingPath}`, e));
            const busBayPromise = loader.loadAsync(busBayPath).catch(e => console.error(`Failed to load ${busBayPath}`, e));
            const gutterPromise = loader.loadAsync(gutterPath).catch(e => console.error(`Failed to load ${gutterPath}`, e));
            const sidewalkPromise = loader.loadAsync(sidewalkPath).catch(e => console.error(`Failed to load ${sidewalkPath}`, e));
            const wallPromise = loader.loadAsync(wallPath).catch(e => console.error(`Failed to load ${wallPath}`, e));

            const [interactiveGltfs, girlGltf, tranGltf, roadGltf,markingGltf, busBayGltf, gutterGltf, sidewalkGltf, wallGltf] = await Promise.all([
                Promise.all(interactivePromises),
                girlPromise, tranPromise, roadPromise, markingPromise, busBayPromise, gutterPromise, sidewalkPromise, wallPromise
            ]);

            interactiveGltfs.forEach(gltf => {
                if(!gltf) return;
                const tempBBoxes = [];
                gltf.scene.traverse(object => {
                    if (object.isMesh && object.geometry.attributes.uv) {
                        object.geometry.computeBoundingBox();
                        this.buildingBlocks.push(object);
                        
                        this.buildingObjectsForRaycast.push(object);

                        const uvAttribute = object.geometry.attributes.uv;
                        const vertexCount = uvAttribute.count;
                        const idArray = new Float32Array(vertexCount);
                        const isKeikanArray = new Float32Array(vertexCount).fill(0.0);
                        const isKyomachiyaArray = new Float32Array(vertexCount).fill(0.0);
                        const isBunkazaiArray = new Float32Array(vertexCount).fill(0.0);
                        const isDensanArray = new Float32Array(vertexCount).fill(0.0);
                        const isMatsuriArray = new Float32Array(vertexCount).fill(0.0);
                        for (let i = 0; i < vertexCount; i++) {
                            const buildingId = Math.round(uvAttribute.getX(i));
                            idArray[i] = buildingId;
                            const buildingAttr = this.buildingAttributes[buildingId];
                            if (buildingAttr) {
                                if (this.keikanGmlIds.has(buildingAttr.id)) isKeikanArray[i] = 1.0;
                                if (this.kyomachiyaGmlIds.has(buildingAttr.id)) {
                                    const height = parseFloat(buildingAttr.measuredHeight);
                                    if (!isNaN(height) && height < 10.0) isKyomachiyaArray[i] = 1.0;
                                }
                                if (this.bunkazaiGmlIds.has(buildingAttr.id)) isBunkazaiArray[i] = 1.0;
                                if (this.densanGmlIds.has(buildingAttr.id)) isDensanArray[i] = 1.0;
                                if (this.matsuriGmlIds.has(buildingAttr.id)) isMatsuriArray[i] = 1.0;
                            }
                        }
                        object.geometry.setAttribute('_id', new THREE.BufferAttribute(idArray, 1));
                        object.geometry.setAttribute('isKeikan', new THREE.BufferAttribute(isKeikanArray, 1));
                        object.geometry.setAttribute('isKyomachiya', new THREE.BufferAttribute(isKyomachiyaArray, 1));
                        object.geometry.setAttribute('isBunkazai', new THREE.BufferAttribute(isBunkazaiArray, 1));
                        object.geometry.setAttribute('isDensan', new THREE.BufferAttribute(isDensanArray, 1));
                        object.geometry.setAttribute('isMatsuri', new THREE.BufferAttribute(isMatsuriArray, 1));
                        object.material = this.customBuildingMaterial;
                        this.interactiveMeshes.push(object);
                        
                        object.bBox = new THREE.Box3().setFromObject(object);
                        tempBBoxes.push(object);
                    }
                });
                this.interactiveBuildingGroup.add(gltf.scene);
                this.collisionObstacles = tempBBoxes; 
                
                this.preprocessAndCacheBuildingBBoxes(gltf.scene);
            });
            this.scene.add(this.interactiveBuildingGroup);
            this._createAllBuildingLabels();
            
            if (girlGltf) {
                this.girlModel = girlGltf.scene;
                const box = new THREE.Box3().setFromObject(this.girlModel);
                const size = box.getSize(new THREE.Vector3());
                const scale = this.characterHeight / size.y;
                this.girlModel.scale.set(scale, scale, scale);
                this.girlModel.traverse(child => { if (child.isMesh) child.castShadow = true; });
                this.girlModel.visible = false;
                this.scene.add(this.girlModel);

                this.girlMixer = new THREE.AnimationMixer(this.girlModel);
                girlGltf.animations.forEach((clip) => {
                    const cleanName = clip.name.replace(/[|()]/g, '').trim();
                    this.animationsMap.set(cleanName, this.girlMixer.clipAction(clip));
                });
                const idleAction = this.animationsMap.get('idle');
                if (idleAction) {
                    this.currentAction = idleAction;
                    this.currentAction.play();
                }
            }

            if (wallGltf) {
                const wallModel = wallGltf.scene;
                wallModel.traverse((child) => {
                    if (child.isMesh) {
                        child.material.visible = false; 
                        this.wallCollisionMeshes.push(child);
                    }
                });
                this.scene.add(wallModel);
            }

            if (tranGltf) {
                this.walkableArea = tranGltf.scene;
                this.walkableAreaMaterial = new THREE.MeshBasicMaterial({ color: 0x404040, side: THREE.DoubleSide });
                this.walkableAreaHighlightMaterial = new THREE.MeshBasicMaterial({ color: 0xffff00, transparent: true, opacity: 0.4, polygonOffset: true, polygonOffsetFactor: -2.0, polygonOffsetUnits: -1.0 });
                this.walkableArea.position.y = 0.11;
                this.walkableArea.traverse(object => {
                    if (object.isMesh) {
                        object.material = this.walkableAreaMaterial;
                        this.walkableMeshes.push(object);
                    }
                });
                this.walkableArea.visible = false; 
                this.scene.add(this.walkableArea);
            }
            
            if (roadGltf) {
                this.roadAsphaltModel = roadGltf.scene;
                const asphaltMaterial = new THREE.MeshStandardMaterial({ color: 0x696969, roughness: 0.8, metalness: 0.1 });
                this.roadAsphaltModel.traverse(child => { if (child.isMesh) child.material = asphaltMaterial; });
                this.roadAsphaltModel.position.y = 0.01;
                this.roadAsphaltModel.visible = false;
                this.scene.add(this.roadAsphaltModel);
            }
            const roadParts = [
                { modelGltf: busBayGltf,   prop: 'busBayModel',   color: 0x808080 },
                { modelGltf: sidewalkGltf, prop: 'sidewalkModel', color: 0xA9A9A9 },
                { modelGltf: gutterGltf,   prop: 'gutterModel',   color: 0xC0C0C0 },
                { modelGltf: markingGltf,  prop: 'roadMarkingModel', color: 0xFFFFFF },
            ];
            const roadPartYPosition = 0.11;
            roadParts.forEach(part => {
                if (part.modelGltf) {
                    this[part.prop] = part.modelGltf.scene;
                    const material = new THREE.MeshStandardMaterial({ color: part.color, roughness: 0.8, metalness: 0.1 });
                    this[part.prop].traverse(child => { if (child.isMesh) child.material = material; });
                    this[part.prop].position.y = roadPartYPosition;
                    this[part.prop].visible = false;
                    this.scene.add(this[part.prop]);
                }
            });
            console.log('建物・キャラクターモデル等読み込み完了');
        }

        preprocessAndCacheBuildingBBoxes(scene) {
            scene.traverse(mesh => {
                if (mesh.isMesh) {
                    const { position, uv } = mesh.geometry.attributes;
                    if (!position || !uv) return;

                    const verticesById = new Map();
                    for (let i = 0; i < position.count; i++) {
                        const id = Math.round(uv.getX(i));
                        if (!verticesById.has(id)) {
                            verticesById.set(id, []);
                        }
                        verticesById.get(id).push(new THREE.Vector3().fromBufferAttribute(position, i));
                    }
                    
                    for (const [id, verts] of verticesById) {
                        if (!this.buildingBBoxCache.has(id)) {
                            this.buildingBBoxCache.set(id, new THREE.Box3().setFromPoints(verts));
                        }
                    }
                }
            });
            console.log(`BBoxの前処理完了. ${this.buildingBBoxCache.size} 個のBBoxをキャッシュしました.`);
        }



        async loadSubCameraMap() {

            this.scene.add(this.subCameraMapGroup);
            const modelsToClone = [ this.roadAsphaltModel, this.busBayModel, this.sidewalkModel, this.gutterModel, this.roadMarkingModel ];
            modelsToClone.forEach(model => {
                if (model) {
                    const clonedModel = model.clone();
                    clonedModel.visible = true;
                    this.subCameraMapGroup.add(clonedModel);
                }
            });
        }

        _showLabelInfoPanel(gmlId, buildingId) {
            let infoHtml = '';
            
            // ▼▼▼ このブロックを丸ごと追加 ▼▼▼
            // --- 画像検索と表示ロジック ---
            const keikanInfoForImage = this.keikanData.get(gmlId);
            if (keikanInfoForImage && keikanInfoForImage['ポータルサイトNo']) {
                const portalId = String(keikanInfoForImage['ポータルサイトNo']);
                // 読み込んだリストから、IDで始まるファイル名を探す
                const foundImage = this.keikanPhotoList.find(fileName => fileName.startsWith(portalId + '.'));
                
                if (foundImage) {
                    // 見つかったら画像パスを組み立て、imgタグを追加
                    const imagePath = `../gion_asset_photos/${foundImage}`;
                    infoHtml += `<img src="${imagePath}" alt="景観写真" style="width: 100%; height: auto; border-radius: 5px; margin-bottom: 15px;">`;
                }
            }
            // ▲▲▲ 追加ここまで ▲▲▲

            const matsuriInfo = this.matsuriData.get(gmlId);
            if (matsuriInfo) {
                if (infoHtml !== '') infoHtml += `<hr style="border-color: #555; margin: 10px 0;">`;
                infoHtml += `<b>タイトル:</b> ${matsuriInfo['タイトル'] || '不明'}<br>`;
                if (matsuriInfo['説明']) {
                    infoHtml += `<b>説明:</b> ${matsuriInfo['説明']}<br>`;
                }
            }

            const bunkazaiInfo = this.bunkazaiData.get(gmlId);
            if (bunkazaiInfo) {
                if (infoHtml !== '') infoHtml += `<hr style="border-color: #555; margin: 10px 0;">`;
                infoHtml += `<b>名称:</b> ${bunkazaiInfo['名称'] || '不明'}<br>`;
                infoHtml += `<b>文化財種類:</b> ${bunkazaiInfo['文化財種類'] || '不明'}<br>`;
                infoHtml += `<b>時代:</b> ${bunkazaiInfo['時代'] || '不明'}<br>`;
            }
            const keikanInfo = this.keikanData.get(gmlId);
            if (keikanInfo) {
                if (infoHtml !== '') infoHtml += `<hr style="border-color: #555; margin: 10px 0;">`;
                const fieldsToShow = { '表示名称': { label: '表示名称' },'景観重要建造物': { label: '景観重要建造物', type: 'boolean' },'歴史的風致形成建造物': { label: '歴史的風致形成建造物', type: 'boolean' },'指定理由１': { label: '指定理由１' },'指定理由２': { label: '指定理由２' },'歴史的意匠建造物': { label: '歴史的意匠建造物', type: 'boolean' },'界わい景観建造物': { label: '界わい景観建造物', type: 'boolean' },'京都を彩る建物や庭園': { label: '京都を彩る建物や庭園', type: 'boolean' },'彩るURL': { label: '彩るURL', type: 'url' } };
                for (const key in fieldsToShow) {
                    const value = keikanInfo[key];
                    if (value !== null && value !== '' && value !== undefined) {
                        const config = fieldsToShow[key];
                        switch(config.type) {
                            case 'boolean': infoHtml += `<b>${config.label}:</b> 指定あり<br>`; break;
                            case 'url': infoHtml += `<b>${config.label}:</b> <a href="${value}" target="_blank" style="color: #90caf9;">リンクを開く</a><br>`; break;
                            default: infoHtml += `<b>${config.label}:</b> ${value}<br>`; break;
                        }
                    }
                }
            }
            if (infoHtml !== '') {
                this.infoOverlayText.innerHTML = infoHtml;
                this.infoOverlay.classList.add('visible');
            }
        }

_createAllBuildingLabels() {
            const buildingVertices = new Map();
            this.interactiveMeshes.forEach(mesh => {
                const idAttribute = mesh.geometry.attributes._id;
                const positionAttribute = mesh.geometry.attributes.position;
                const matrix = mesh.matrixWorld;
                for (let i = 0; i < idAttribute.count; i++) {
                    const buildingId = idAttribute.getX(i);
                    const buildingAttr = this.buildingAttributes[buildingId];
                    if (buildingAttr && (this.bunkazaiGmlIds.has(buildingAttr.id) || this.keikanGmlIds.has(buildingAttr.id) || this.kyomachiyaGmlIds.has(buildingAttr.id) || this.densanGmlIds.has(buildingAttr.id) || this.matsuriGmlIds.has(buildingAttr.id))) {
                        if (!buildingVertices.has(buildingId)) {
                            buildingVertices.set(buildingId, { vertices: [], gmlId: buildingAttr.id });
                        }
                        const vertex = new THREE.Vector3().fromBufferAttribute(positionAttribute, i);
                        vertex.applyMatrix4(matrix);
                        buildingVertices.get(buildingId).vertices.push(vertex);
                    }
                }
            });
            
            buildingVertices.forEach((data, buildingId) => {
                if (data.vertices.length === 0) return;
                let sumX = 0, sumZ = 0, maxY = -Infinity;
                data.vertices.forEach(v => { sumX += v.x; sumZ += v.z; maxY = Math.max(maxY, v.y); });

                const anchorPosition = new THREE.Vector3( sumX / data.vertices.length, maxY, sumZ / data.vertices.length );
                const gmlId = data.gmlId;
                const clickHandler = (e) => { e.stopPropagation(); this._showLabelInfoPanel(gmlId, buildingId); };
                
                let labelCount = 0;
                const createLabel = (info) => {
                    const offset = new THREE.Vector3(labelCount * 20, 0, 0); 
                    labelCount++;
                    const labelDiv = document.createElement('div');
                    labelDiv.className = info.css;
                    labelDiv.textContent = info.text;
                    labelDiv.dataset.name = info.name;
                    if (info.isClickable !== false) {
                        labelDiv.addEventListener('click', clickHandler);
                    }
                    document.getElementById('css3d-container').appendChild(labelDiv);
                    this.buildingLabels.push({ position: anchorPosition.clone().add(offset), element: labelDiv, type: info.type, buildingId: buildingId });
                    
                    const subLabelDiv = document.createElement('div');
                    subLabelDiv.className = `${info.css}-sub`;
                    subLabelDiv.textContent = info.text;
                    subLabelDiv.dataset.name = info.name;
                    if (info.isClickable !== false) {
                        subLabelDiv.addEventListener('click', clickHandler);
                    }
                    document.getElementById('css3d-container').appendChild(subLabelDiv);
                    this.subCameraBuildingLabels.push({ position: anchorPosition.clone().add(offset), element: subLabelDiv, type: info.type, buildingId: buildingId });
                };

                const videoInfos = this.videoUrlMap.get(gmlId);
                if (videoInfos && videoInfos.length > 0) {
                    const containerDiv = document.createElement('div');
                    containerDiv.className = 'label-flex-container';

                    const logoStackContainer = document.createElement('div');
                    logoStackContainer.className = 'logo-stack-container';
                    containerDiv.appendChild(logoStackContainer);

                    videoInfos.forEach(videoInfo => {
                        const logoDiv = document.createElement('div');
                        logoDiv.className = 'youtube-bubble';
                        logoDiv.style.cursor = 'pointer';
                        if (videoInfo.type === 'keikan') {
                            logoDiv.classList.add('youtube-bubble-keikan');
                        } else if (videoInfo.type === 'bunkazai') {
                            logoDiv.classList.add('youtube-bubble-bunkazai');
                        }
                        logoDiv.dataset.name = videoInfo.name;
                        logoDiv.title = `動画を再生: ${videoInfo.name}`;
                        logoDiv.style.pointerEvents = 'auto';

                        const img = document.createElement('img');
                        img.src = 'https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg';
                        logoDiv.appendChild(img);
                        
                        logoDiv.addEventListener('click', (e) => {
                            e.stopPropagation();
                            this.showVideoModal(videoInfo.url);
                        });

                        logoStackContainer.appendChild(logoDiv);
                    });

                    const logoStackObject = new CSS2DObject(containerDiv);
                    logoStackObject.position.copy(anchorPosition);
                    logoStackObject.position.y += 15;
                    this.scene.add(logoStackObject);

        lonLatToTile(lon, lat, zoom) {
            const x = Math.floor((lon / 180 + 1) * Math.pow(2, zoom) / 2);
            const y = Math.floor((-Math.log(Math.tan((45 + lat / 2) * Math.PI / 180)) + Math.PI) * Math.pow(2, zoom) / (2 * Math.PI));
            return { x, y };
        }
        
        tileToLonLat(x, y, zoom) {
            const n = Math.pow(2, zoom);
            const lon_deg = x / n * 360.0 - 180.0;
            const lat_rad = Math.atan(Math.sinh(Math.PI * (1 - 2 * y / n)));
            const lat_deg = lat_rad * 180.0 / Math.PI;
            return { lon: lon_deg, lat: lat_deg };
        }

        _createDistrictLabel(message, options = {}) {
            const { fontface = 'Arial', textColor = '#000000', backgroundColor = 'rgba(255, 255, 255, 0.7)', borderRadius = 20, padding = 20, scale = 4 } = options;
            let fontsize;
            if (options.fontsize) fontsize = options.fontsize;
            else {
                fontsize = 120;
                if (message.length > 8) fontsize = 70;
                else if (message.length > 4) fontsize = 90;
            }
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            context.font = `Bold ${fontsize}px ${fontface}`;
            const metrics = context.measureText(message);
            const textWidth = metrics.width;
            const textHeight = fontsize;
            const backgroundWidth = textWidth + padding * 2;
            const backgroundHeight = textHeight + padding * 2;
            canvas.width = backgroundWidth;
            canvas.height = backgroundHeight;
            context.font = `Bold ${fontsize}px ${fontface}`;
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillStyle = backgroundColor;
            context.beginPath();
            context.moveTo(borderRadius, 0);
            context.lineTo(canvas.width - borderRadius, 0);
            context.arcTo(canvas.width, 0, canvas.width, borderRadius, borderRadius);
            context.lineTo(canvas.width, canvas.height - borderRadius);
            context.arcTo(canvas.width, canvas.height, canvas.width - borderRadius, canvas.height, borderRadius);
            context.lineTo(borderRadius, canvas.height);
            context.arcTo(0, canvas.height, 0, canvas.height - borderRadius, borderRadius);
            context.lineTo(0, borderRadius);
            context.arcTo(0, 0, borderRadius, 0, borderRadius);
            context.closePath();
            context.fill();
            context.fillStyle = textColor;
            context.fillText(message, canvas.width / 2, canvas.height / 2);
            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearFilter;
            const textMaterial = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
            const textPlaneWidth = backgroundWidth / scale;
            const textPlaneHeight = backgroundHeight / scale;
            const textGeometry = new THREE.PlaneGeometry(textPlaneWidth, textPlaneHeight);
            const textMesh = new THREE.Mesh(textGeometry, textMaterial);
            const group = new THREE.Group();
            group.add(textMesh);
            return group;
        }

        _formatKodoDistrictName(originalName) {
            if (!originalName) return '';
            const meterMatch = originalName.match(/^(\d+m)/);
            const typeMatch = originalName.match(/第(\d)種/);
            const meterPart = meterMatch ? meterMatch[1] : null;
            const typePart = typeMatch ? typeMatch[1] : null;
            if (meterPart && typePart) return `${meterPart}-${typePart}`;
            if (meterPart) return meterPart;
            return originalName;
        }

        this.sky = sky; // ★★★ この一行を追加して、skyオブジェクトをクラスプロパティに保存 ★★★
        sky.renderOrder = 2; // ★★★ 描画順を「2」に設定 (地面より後) ★★★
        sky.rotation.y = Math.PI / 2;
        
        this.scene.add(sky);

        console.log("カスタムスカイドームがシーンに追加されました。(async/await)");

    } catch (error) {
        console.error('スカイドームのテクスチャ読み込み中にエラーが発生しました:', error);
    }
}

setupSubCameras() {
            this.subCameraData.forEach((data, index) => {
                const subCamera = new THREE.PerspectiveCamera(75, 1, 0.1, 8000);
                if (data.type !== 'chase') {
                     if (index === 0) { 
                        const shijoKawaramachiPos = this.allWaypoints.get('四条河原町');
                        if (shijoKawaramachiPos) {
                            // ▼▼▼ ここから修正 ▼▼▼
                            
                            const lookAtTarget = shijoKawaramachiPos.clone();
                            lookAtTarget.y += 10; // 注視点用の座標を複製し、Y座標を10m上げる

                            subCamera.position.set(shijoKawaramachiPos.x + 15, 15, shijoKawaramachiPos.z + 15);
                            subCamera.lookAt(lookAtTarget); // Yを上げた座標を見る
                            // ▲▲▲ 修正ここまで ▲▲▲
                        }
                    } else if (data.position) {
                        subCamera.position.copy(data.position);
                        if (data.lookAtTargetName && this.allWaypoints.has(data.lookAtTargetName)) {
                            subCamera.lookAt(this.allWaypoints.get(data.lookAtTargetName));
                        }
                    }
                }
                this.subCameras.push(subCamera);
            });
        }
        
        setupUI() {
            const isLikelyPhone = () => {
                const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
                if (!isTouch) return false;
                const smallerDimension = Math.min(window.screen.width, window.screen.height);
                return smallerDimension <= 650;
            };

            if (isLikelyPhone()) {
                this.isPhone = true;
                this.isSubCameraVisible = false;
                document.body.classList.add('is-phone');
            }
            
            let currentPanelContent = null;
            let originalParent = null;

            const openPanelModal = (contentElement) => {
                if (!contentElement) return;
                currentPanelContent = contentElement;
                originalParent = contentElement.parentNode;
                contentElement.style.display = 'block';
                this.panelOverlayBody.appendChild(contentElement);
                this.panelOverlay.classList.add('visible');
            };

            const closePanelModal = () => {
                if (currentPanelContent && originalParent) {
                    currentPanelContent.style.display = 'none';
                    originalParent.appendChild(currentPanelContent);
                }
                this.panelOverlay.classList.remove('visible');
                currentPanelContent = null;
                originalParent = null;
            };

            this.panelOverlayCloseBtn.addEventListener('click', closePanelModal);
            this.panelOverlay.addEventListener('click', (e) => {
                if (e.target === this.panelOverlay) {
                    closePanelModal();
                }
            });

            this.setupControls();

            this.setupVisibilityControls(openPanelModal);
            this.setupClickEvents();

            // ▼▼▼ このブロックを変更 ▼▼▼
            this.subCameraCombinedBtn.addEventListener('click', () => {
                this.cancelCharacterModeSelection();
                this.cameraSelectModal.classList.remove('modal-hidden');
            });
            // ▲▲▲ 変更ここまで ▲▲▲

            this.setupMapSelection(openPanelModal);
            this.setupCharacterModeControls();
            this.setupBuildingSearchModeControls(openPanelModal);
            this.minimalModeBtn.addEventListener('click', () => {
                this.cancelCharacterModeSelection();
                this.toggleMinimalMode();
            });
            this.viewMoveBtn.addEventListener('click', () => {
                this.cancelCharacterModeSelection();
                this.viewpointModal.classList.remove('modal-hidden');
            });

            const closeModal = () => this.cameraSelectModal.classList.add('modal-hidden');
            this.modalCloseBtn.addEventListener('click', closeModal);
            this.cameraSelectModal.addEventListener('click', (e) => {
                if (e.target === this.cameraSelectModal) {
                    closeModal();
                }
            });
            this.cameraSelectList.innerHTML = '';
            this.subCameraData.forEach((camData, index) => {
                const li = document.createElement('li');
                li.textContent = camData.name;
                li.dataset.index = index;
                li.addEventListener('click', () => {
                    const selectedIndex = parseInt(li.dataset.index, 10);
                    this.activeSubCameraIndex = selectedIndex;
                    closeModal();
                    this.needsRender = true;
                });
                this.cameraSelectList.appendChild(li);
            });

            this.viewpointList.innerHTML = '';
            Object.keys(this.predefinedViewpoints).forEach(name => {
                const li = document.createElement('li');
                li.textContent = name;
                li.addEventListener('click', () => {
                    this._setViewpoint(name);
                    this.viewpointModal.classList.add('modal-hidden');
                });
                this.viewpointList.appendChild(li);
            });
            this.viewpointModalCloseBtn.addEventListener('click', () => this.viewpointModal.classList.add('modal-hidden'));
            this.viewpointModal.addEventListener('click', (e) => {
                if (e.target === this.viewpointModal) this.viewpointModal.classList.add('modal-hidden');
            });
            
            const closeVideoModal = () => {
                this.videoModal.style.display = 'none';
                this.youtubePlayerContainer.innerHTML = ''; 
            };
            this.videoModalCloseBtn.addEventListener('click', closeVideoModal);
            this.videoModal.addEventListener('click', (e) => {
                if (e.target === this.videoModal) closeVideoModal();

                this.youtubePlayerContainer.innerHTML = ''; 
            };

setupViewpointControls() {
            const openModal = () => {
                this.viewpointList.innerHTML = ''; // リストを初期化

                    const li = document.createElement('li');
                    li.textContent = name;

            };

            });

            this.viewpointModal.addEventListener('click', (e) => {
                if (e.target === this.viewpointModal) {

                }

        _setViewpoint(name) {
            const viewpoint = this.predefinedViewpoints[name];
            if (viewpoint) {
                this.camera.position.copy(viewpoint.position);
                this.controls.target.copy(viewpoint.target);
                this.controls.update();
                this.camera.updateMatrixWorld(true);
                this.needsRender = true;
            }
        }

        setupMinimalModeControls() {
            const minimalModeBtn = document.getElementById('minimal-mode-btn');
            if (minimalModeBtn) {
                minimalModeBtn.addEventListener('click', () => {
                    this.cancelCharacterModeSelection();
                    this.toggleMinimalMode();
                });
            }
        }        


        toggleMinimalMode() {
            // ▼▼▼ このifブロックを追加 ▼▼▼
            // これから最小構成モードに入る場合（isMinimalModeが現在falseの場合）
            if (!this.isMinimalMode) {
                // 先に検索フィルターをすべてクリアする
                this._clearSearchFilters();
            }
            // ▲▲▲ 追加ここまで ▲▲▲

            this.isMinimalMode = !this.isMinimalMode;
            this.applyMinimalModeState();
        }

        async _resetToInitialState() {
            // 1. 地図の切り替えを初期状態（オルソ）に戻す
            this.currentMapLayer = 'ort';
            await this.loadMapTiles(); // 地図を非同期で再読み込みし、完了を待つ

            // 2. 建物検索のチェックをすべて外す
            [this.matsuriCheckbox, this.bunkazaiCheckbox, this.keikanCheckbox, this.kyomachiyaCheckbox, this.densanCheckbox, this.torikumiCheckbox].forEach(cb => {
                if(cb) cb.checked = false;
            });
            
            // 3. 検索モードの状態をクリア
            this.activeSearchModes.clear();

            // 4. 地図選択ボタンの見た目を更新
            const mapButtons = document.querySelectorAll('.map-select-btn');
            mapButtons.forEach(button => {
                button.classList.toggle('active', button.dataset.layer === this.currentMapLayer);
            });

            // 5. 山鉾に付いている「祭」ラベルも非表示にする
            document.querySelectorAll('.yamaboko-search-label').forEach(label => label.style.display = 'none');
        }

async applyMinimalModeState() {
            const minimalModeBtn = document.getElementById('minimal-mode-btn');
            
            const buttonsToHide = [
                document.getElementById('building-search-toggle-btn'),
                document.getElementById('character-mode-btn'),
                document.getElementById('toggle-map-btn'),
                document.getElementById('toggle-visibility-btn')
            ];

            const subCameraUIs = [
                this.subCameraCombinedBtn,
                this.subCameraRoadNameLabel
            ];

            if (minimalModeBtn) minimalModeBtn.classList.toggle('active', this.isMinimalMode);

            buttonsToHide.forEach(btn => {
                if (btn) {
                    btn.style.visibility = this.isMinimalMode ? 'hidden' : 'visible';
                }
            });


            if (this.isMinimalMode) {
                // --- 最小構成モードへの移行処理 ---
                this.interactiveBuildingGroup.visible = false;
                if (this.buildingModel1946) this.buildingModel1946.visible = false;
                if (this.buildingModel1975) this.buildingModel1975.visible = false;
                if (this.mapGroup) this.mapGroup.visible = false;
                
                if (this.sky) this.sky.visible = false;
                document.body.style.backgroundColor = 'black';

                const roadModels = [ this.roadAsphaltModel, this.roadMarkingModel, this.busBayModel, this.gutterModel, this.sidewalkModel ];
                roadModels.forEach(model => { if (model) model.visible = false; });
                
                this.isSubCameraVisible = false;

                for (const name in this.shishinModels) {
                    if (this.shishinModels[name]) {
                        this.shishinModels[name].visible = false;
                    }
                }

                this.buildingLabels.forEach(label => label.element.style.display = 'none');
                this.subCameraBuildingLabels.forEach(label => label.element.style.display = 'none');
                document.querySelectorAll('.yamaboko-search-label').forEach(label => label.style.display = 'none');

            } else {
                // --- 通常モードへの復帰処理 ---
                await this._resetToInitialState();

                if (this.sky) this.sky.visible = true;
                document.body.style.backgroundColor = 'white';
                
                for (const name in this.shishinModels) {
                    if (this.shishinModels[name]) {
                        this.shishinModels[name].visible = true;
                    }
                }
                
                this.isSubCameraVisible = !this.isPhone;
            }
            
            this._updateWalkableAreaState();
            
            subCameraUIs.forEach(ui => {
                if (ui) {
                    ui.style.display = this.isSubCameraVisible ? 'block' : 'none';
                }
            });
            if(this.subCameraRoadNameLabel && this.isSubCameraVisible) {
                this.subCameraRoadNameLabel.style.display = (this.subCameraRoadName && this.subCameraRoadName !== 'null') ? 'block' : 'none';
            }

            const cameraInfo = document.getElementById('camera-info-display');
            if (cameraInfo) cameraInfo.style.display = this.isMinimalMode ? 'none' : 'block';
            
            this._updateLabelVisibility();
            
            // ▼▼▼ 変更箇所 ▼▼▼
            // この関数から地名ラベル(waypoint-label)の表示制御ロジックを削除し、
            // 新しいルール関数に管理を一本化します。
            this.scene.traverse(child => {
                if (child.isCSS2DObject) {
                    if (child.name === 'labelContainer') {
                        child.visible = !this.isCharacterMode && child.parent.visible;
                    }
                }
            });
            // ▲▲▲ 変更ここまで ▲▲▲
            
            this.needsRender = true;
        }

        _clearSearchFilters() {
            // 1. 建物検索のチェックをすべて外す
            [this.matsuriCheckbox, this.bunkazaiCheckbox, this.keikanCheckbox, this.kyomachiyaCheckbox, this.densanCheckbox].forEach(cb => {
                if(cb) cb.checked = false;
            });
            
            // 2. 検索モードの状態をクリア
            this.activeSearchModes.clear();

            // 3. ラベルの表示状態を即座に更新して非表示にする
            this._updateLabelVisibility();
        }

        _updateWalkableAreaState() {
            if (!this.walkableArea) return;

            if (this.isSelectingStartPosition) {
                // 場所選び中は、必ず黄色で表示
                this.walkableArea.visible = true;
                this.setWalkableAreaHighlight(true);
            } else if (this.isMinimalMode) {
                // 最小構成モード中は、必ず灰色で表示
                this.walkableArea.visible = true;
                this.setWalkableAreaHighlight(false);
            } else {
                // それ以外の場合は非表示
                this.walkableArea.visible = false;
            }
            this.needsRender = true;
        }

        setupBuildingSearchModeControls(openModalCallback) {
            this.buildingSearchToggleBtn.addEventListener('click', () => {
                this.cancelCharacterModeSelection();
                openModalCallback(document.getElementById('building-search-content-wrapper'));
            });

            this.searchModeCheckboxes.addEventListener('change', (e) => {
                if (e.target.type === 'checkbox') {
                    const mode = e.target.value;
                // ★★★ このifブロックを追加 ★★★
                    if (mode === 'video') {
                        // 「動画」チェックボックスの場合の特別な処理
                        this.showVideoLabels = e.target.checked;
                        this.needsRender = true;
                        return; // 他の処理は行わない
                    }
                    if (e.target.checked) {
                        this.activeSearchModes.add(mode);
                    } else {
                        this.activeSearchModes.delete(mode);
                    }
                    this._updateLabelVisibility();
                    
                    const showMatsuriLabels = this.activeSearchModes.has('matsuri');
                    const yamabokoMatsuriLabels = document.querySelectorAll('.yamaboko-search-label');
                    
                    yamabokoMatsuriLabels.forEach(label => {
                        label.style.display = showMatsuriLabels ? 'block' : 'none';
                    });
                    
                    this.needsRender = true;
                }
            });
        }

        _updateLabelVisibility() {
            // ▼▼▼ このif文を追加 ▼▼▼
            // 最小構成モード中は、この関数のロジックを一切実行しない
            if (this.isMinimalMode) {
                // 念のため全ての建物検索ラベルを非表示にしておく
                this.buildingLabels.forEach(item => item.element.style.display = 'none');
                this.subCameraBuildingLabels.forEach(item => item.element.style.display = 'none');
                return;
            }
            // ▲▲▲ 追加ここまで ▲▲▲

            const allLabels = [...this.buildingLabels, ...this.subCameraBuildingLabels];

            allLabels.forEach(item => item.element.style.display = 'none');

            if (this.activeSearchModes.size === 0) {
                return;
            }

            const groupedLabels = new Map();
            allLabels.forEach(item => {
                const key = item.buildingId;
                if (!groupedLabels.has(key)) {
                    groupedLabels.set(key, []);
                }
                groupedLabels.get(key).push(item);
            });

            groupedLabels.forEach(group => {
                group.forEach(labelItem => {
                    if (this.activeSearchModes.has(labelItem.type)) {
                        labelItem.element.style.display = 'block';
                    }
                });
            });
        }
        
        _updateBuildingModelsVisibility(layerId) {
            this.interactiveBuildingGroup.visible = false;
            if (this.buildingModel1946) this.buildingModel1946.visible = false;
            if (this.buildingModel1975) this.buildingModel1975.visible = false;

            if (layerId === 'ort_USA10') {
                if (this.buildingModel1946) {
                    this.buildingModel1946.visible = true;
                } else {
                    this.load1946Model();
                }
            } else if (layerId === 'gazo1') {
                if (this.buildingModel1975) {
                    this.buildingModel1975.visible = true;
                } else {
                    this.load1975Model();
                }
            } else {
                this.interactiveBuildingGroup.visible = true;
            }

            // ▼▼▼ この行を追加 ▼▼▼
            // 建築物モデルの表示グループが変更されたので、再描画を要求する
            this.needsRender = true;
            // ▲▲▲ 追加ここまで ▲▲▲
        }
