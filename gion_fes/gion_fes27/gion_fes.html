        timeToMsOffset(timeStr) {
             if (typeof timeStr !== 'string' || !timeStr.includes(':')) return NaN;
             const parts = timeStr.split(':').map(Number);
             if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
                 return (parts[0] * 3600 + parts[1] * 60) * 1000;
             }
             return NaN;
        }

        updateTimeDisplay(currentSimTimeOffsetMs) {
             const totalSeconds = Math.floor(Math.max(0, currentSimTimeOffsetMs) / 1000);
             if (isNaN(totalSeconds)) return;
             const hours = Math.floor(totalSeconds / 3600) % 24;
             const minutes = Math.floor((totalSeconds % 3600) / 60);
             const seconds = totalSeconds % 60;
             const formattedTime = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
             
            if (this.timeDisplay) {
                this.timeDisplay.textContent = `時刻: ${formattedTime}`;
            }
        }

        calculateSimulationEndTime() {
             let maxEndTimeMs = 0;
             this.yamahokoData.forEach(yamanoko => {
                 if (yamanoko.position && yamanoko.position.length > 0) {
                     const lastTimeStr = Object.values(yamanoko.position[yamanoko.position.length - 1])[0];
                     const endTimeMs = this.timeToMsOffset(lastTimeStr);
                     if (!isNaN(endTimeMs)) maxEndTimeMs = Math.max(maxEndTimeMs, endTimeMs);
                 }
             });
             this.simulationEndTimeMs = maxEndTimeMs; 
        }

        createTimeMarkers() {
             this.timeMarkersContainer.innerHTML = '';
             const markerStartTime = this.timeToMsOffset('08:30');
             const interval = 30 * 60 * 1000;
             const totalRange = this.simulationEndTimeMs - this.SIMULATION_START_TIME_OFFSET_MS;
             if (totalRange <= 0) return;

             for (let time = markerStartTime; time <= this.simulationEndTimeMs; time += interval) {
                 const percent = ((time - this.SIMULATION_START_TIME_OFFSET_MS) / totalRange) * 100;
                 if (percent >= 0 && percent <= 100) {
                     const marker = document.createElement('div');
                     marker.className = 'slider-tick';
                     marker.style.left = `${percent}%`;
                     this.timeMarkersContainer.appendChild(marker);
                 }
             }
        }
        
        setupControls() {
             this.seekBar.min = this.SIMULATION_START_TIME_OFFSET_MS;
             this.seekBar.max = this.simulationEndTimeMs;
             this.seekBar.value = this.SIMULATION_START_TIME_OFFSET_MS;
             this.createTimeMarkers();
             this.playPauseBtn.addEventListener('click', () => {
                 this.isPaused = !this.isPaused;
                 this.playPauseBtn.textContent = this.isPaused ? '100倍再生' : '一時停止';
                 if (!this.isPaused) {
                     this.lastTime = performance.now();
                 }
             });
             this.seekBar.addEventListener('mousedown', () => {
                 this.wasPlayingBeforeSeek = !this.isPaused;
                 this.isPaused = true;
                 this.playPauseBtn.textContent = '100倍再生';
             });
             this.seekBar.addEventListener('input', () => {
                 const seekTime = parseFloat(this.seekBar.value);
                 this.simulationClockTimeMs = seekTime - this.SIMULATION_START_TIME_OFFSET_MS;
                 this.updateSceneToTime(seekTime);
             });
             this.seekBar.addEventListener('change', () => {
                 if (this.wasPlayingBeforeSeek) {
                     this.isPaused = false;
                     this.playPauseBtn.textContent = '一時停止';
                     this.lastTime = performance.now();
                 }
             });
        }
        
        addStandardObjects() {
        }

        positionLabels(camera, viewport, labels, occlusionArea = null) {
            const _vector = new THREE.Vector3();

            for (const item of labels) {
                const { label, mesh, position } = item;
                
                if (mesh && !mesh.visible) {
                    if (label.style.display !== 'none') {
                        label.style.display = 'none';
                    }
                    continue;
                }

                const position3d = mesh ? mesh.position : position;
                _vector.copy(position3d);
                if (mesh) {
                    const baseOffsetY = 30;
                    _vector.y += baseOffsetY * mesh.scale.y; 
                }
                _vector.project(camera);

                const isInView = _vector.z < 1 && _vector.x >= -1 && _vector.x <= 1 && _vector.y >= -1 && _vector.y <= 1;

                if (isInView) {
                    const x = viewport.left + ((_vector.x + 1) / 2) * viewport.width;
                    const y = viewport.top + ((-_vector.y + 1) / 2) * viewport.height;

                    let isOccluded = false;
                    if (occlusionArea) {
                        if (x >= occlusionArea.left && x <= (occlusionArea.left + occlusionArea.width) &&
                            y >= occlusionArea.top && y <= (occlusionArea.top + occlusionArea.height)) {
                            isOccluded = true;
                        }
                    }

                    if (isOccluded) {
                        if (label.style.display !== 'none') {
                            label.style.display = 'none';
                        }
                        continue;
                    }

                    const isBuildingLabel = !!item.type;
                    if (isBuildingLabel) {
                        if (label.style.display === 'block') {
                            label.style.left = `${x}px`;
                            label.style.top = `${y}px`;
                        }
                    } else {
                        if (label.style.display !== 'block') {
                            label.style.display = 'block';
                        }
                        label.style.left = `${x}px`;
                        label.style.top = `${y}px`;
                    }

                } else {
                    if (label.style.display !== 'none') {
                        label.style.display = 'none';
                    }
                }
            }
        }        

        updateCameraInfoDisplay() {
            if (!this.cameraInfoDisplay) return;
            const pos = this.camera.position;
            const rot = this.camera.rotation;
            const distance = this.camera.position.distanceTo(this.controls.target);
            const toDeg = (rad) => (rad * 180 / Math.PI).toFixed(1);
            const infoText = 
`Pos: X:${pos.x.toFixed(1)} Y:${pos.y.toFixed(1)} Z:${pos.z.toFixed(1)}
Rot: X:${toDeg(rot.x)}° Y:${toDeg(rot.y)}° Z:${toDeg(rot.z)}°
Dist: ${distance.toFixed(1)}`;
            this.cameraInfoDisplay.textContent = infoText;
        }

        updateDynamicCameras() {
            if (this.subCameras.length === 0) return;

            const activeCamData = this.subCameraData[this.activeSubCameraIndex];
            const activeCam = this.subCameras[this.activeSubCameraIndex];

            if (activeCamData.type === 'chase' && activeCamData.targetName) {
                const target = this.yamahokoMeshes.find(y => y.data.name === activeCamData.targetName);
                if (target && target.mesh) {
                    const targetMesh = target.mesh;

                    const targetPosition = new THREE.Vector3();
                    targetMesh.getWorldPosition(targetPosition);

                    const targetQuaternion = new THREE.Quaternion();
                    targetMesh.getWorldQuaternion(targetQuaternion);

                    const offset = activeCamData.offset.clone();
                    offset.applyQuaternion(targetQuaternion);

                    const cameraPosition = new THREE.Vector3().addVectors(targetPosition, offset);
                    activeCam.position.copy(cameraPosition);

                    activeCam.lookAt(targetPosition);
                }
            }
        }

        animate = (currentTime) => {
             this.animationFrameId = requestAnimationFrame(this.animate.bind(this));
             const delta = this.clock.getDelta();

            if (!this.isPaused) {
                if (this.lastTime === 0) this.lastTime = currentTime;
                let deltaTime = currentTime - this.lastTime;
                this.lastTime = currentTime;
                if (!isNaN(deltaTime) && deltaTime > 0) {
                    const speedMultiplier = this.isCharacterMode ? 10 : this.SIMULATION_SPEED_MULTIPLIER;
                    this.simulationClockTimeMs += deltaTime * speedMultiplier;
                    const finalSimTimeOffsetMs = this.SIMULATION_START_TIME_OFFSET_MS + this.simulationClockTimeMs;
                    
                    if (finalSimTimeOffsetMs >= this.simulationEndTimeMs) {
                        this.isPaused = true; this.playPauseBtn.textContent = '100倍再生';
                        this.seekBar.value = this.simulationEndTimeMs;
                        this.updateSceneToTime(this.simulationEndTimeMs);
                    } else {
                        this.seekBar.value = finalSimTimeOffsetMs;
                        this.updateSceneToTime(finalSimTimeOffsetMs);
                    }
                }
            }

            const leftPanelWidth = 0;
            const subViewportSize = 320;
            const mainViewport = { left: leftPanelWidth, top: 0, width: window.innerWidth - leftPanelWidth, height: window.innerHeight };
            
            const subViewportRenderer = { left: leftPanelWidth, top: 0, width: subViewportSize, height: subViewportSize };
            const subViewportLabels = { left: leftPanelWidth, top: window.innerHeight - subViewportSize, width: subViewportSize, height: subViewportSize };


             if(this.isCharacterMode) {
                 const inputs = this.handleCharacterInputs();
                 this.updateCharacter(delta, inputs);
                 this.updateCharacterCamera();

                 if (this.characterPositionMarker) {
                    this.characterPositionMarker.position.set(
                        this.girlModel.position.x,
                        50.0, 
                        this.girlModel.position.z
                    );
                 }
             } else {
                this.controls.update();
                this.updateDynamicCameras();
                this.updateCameraInfoDisplay();
             }

            if ((this.currentMapLayer === 'kodo' || this.currentMapLayer === 'youto' || this.currentMapLayer === 'keikan') && this.kodoInteractiveObjects.length > 0) {
                this.raycaster.setFromCamera(this.mouse, this.camera);
                const intersects = this.raycaster.intersectObjects(this.kodoInteractiveObjects, true);

                let intersectedGroup = null;
                if (intersects.length > 0 && intersects[0].object.parent) {
                    intersectedGroup = intersects[0].object.parent;
                }

                if (intersectedGroup && intersectedGroup.userData.polygonMesh) {
                    const targetPolygon = intersectedGroup.userData.polygonMesh;
                    if (this.hoveredKodoPolygon !== targetPolygon) {
                        if (this.hoveredKodoPolygon) {
                            this.hoveredKodoPolygon.material.color.copy(this.hoveredKodoPolygon.userData.originalColor);
                        }
                        this.hoveredKodoPolygon = targetPolygon;
                        this.hoveredKodoPolygon.material.color.set(0xff0000);
                    }
                } else {
                    if (this.hoveredKodoPolygon) {
                        this.hoveredKodoPolygon.material.color.copy(this.hoveredKodoPolygon.userData.originalColor);
                    }
                    this.hoveredKodoPolygon = null;
                }

                if(this.mapGroup) {
                    this.mapGroup.children.forEach(child => {
                        if (child.name === 'district_label_group') {
                            child.quaternion.copy(this.camera.quaternion);
                        }
                    });
                }
            }

            if (this.isCharacterMode) {
                this.yamahokoLabels.forEach(item => { if (item.label.style.display !== 'none') item.label.style.display = 'none'; });
                this.pointLabels.forEach(item => { if (item.label.style.display !== 'none') item.label.style.display = 'none'; });
            } else {
                this.positionLabels(this.camera, mainViewport, this.yamahokoLabels, subViewportLabels);
                this.positionLabels(this.camera, mainViewport, this.pointLabels, subViewportLabels);
            }
            
            this.positionLabels(this.camera, mainViewport, this.buildingLabels, subViewportLabels);
            
            this.renderer.clear();
            this.renderer.setScissorTest(true);

            if (this.mapGroup) this.mapGroup.visible = !this.isCharacterMode;
            if (this.subCameraMapGroup) this.subCameraMapGroup.visible = false;
            
            this.yamahokoMeshes.forEach(item => {
                if (item.mesh.userData.isGltf) {
                    let scale = 1;
                    if (!this.isCharacterMode) {
                        if (item.data.name.includes('鉾')) {
                            scale = 5;
                        } else if (item.data.name.includes('山')) {
                            scale = 10;
                        }
                    }
                    item.mesh.scale.set(scale, scale, scale);
                }
            });

            this.renderer.setViewport(mainViewport.left, 0, mainViewport.width, mainViewport.height);
            this.renderer.setScissor(mainViewport.left, 0, mainViewport.width, mainViewport.height);
            this.renderer.render(this.scene, this.camera);
            
            this.yamahokoMeshes.forEach(item => {
                if (item.mesh.userData.isGltf) {
                    item.mesh.scale.set(1, 1, 1);
                }
            });
            
            if(this.isSubCameraVisible) {
                this.renderer.setViewport(subViewportRenderer.left, subViewportRenderer.top, subViewportRenderer.width, subViewportRenderer.height);
                this.renderer.setScissor(subViewportRenderer.left, subViewportRenderer.top, subViewportRenderer.width, subViewportRenderer.height);
                
                this.renderer.clear();

                if (this.mapGroup) this.mapGroup.visible = false;
                if (this.subCameraMapGroup) this.subCameraMapGroup.visible = true;

                if (this.isCharacterMode) {
                    this.subCameraLabel.textContent = '上空から';
                    this.subCameraSwitchBtn.style.display = 'none';
                    
                    if (this.characterPositionMarker) this.characterPositionMarker.scale.set(3, 3, 3);
                    this.renderer.render(this.scene, this.topDownCamera);
                    if (this.characterPositionMarker) this.characterPositionMarker.scale.set(1, 1, 1);
                } else {
                    if (this.subCameras.length > 0) {
                        const activeSubCamera = this.subCameras[this.activeSubCameraIndex];
                        this.subCameraLabel.textContent = this.subCameraData[this.activeSubCameraIndex].name;
                        this.subCameraSwitchBtn.style.display = 'block';
                        
                        this.positionLabels(activeSubCamera, subViewportLabels, this.subCameraYamahokoLabels);
                        this.renderer.render(this.scene, activeSubCamera);
                    }
                }
            }


            if (this.mapGroup && !this.isCharacterMode) {
                this.mapGroup.visible = true;
            }
            
            this.renderer.setScissorTest(false);
            this.cssRenderer.render(this.cssScene, this.camera);
        };        

        updateSceneToTime = (finalSimTimeOffsetMs) => {
             this.yamahokoMeshes.forEach(yamanokoObj => {
                 const yamanoko = yamanokoObj.data;
                 const mesh = yamanokoObj.mesh;
                 if (!yamanoko.position || yamanoko.position.length < 2) return;
                 let foundSegment = false;
                 for (let i = 0; i < yamanoko.position.length - 1; i++) {
                     const startPointEntry = yamanoko.position[i];
                     const endPointEntry = yamanoko.position[i + 1];
                     const startPointName = Object.keys(startPointEntry)[0];
                     const endPointName = Object.keys(endPointEntry)[0];
                     const startTimeOffsetMs = this.timeToMsOffset(Object.values(startPointEntry)[0]);
                     const endTimeOffsetMs = this.timeToMsOffset(Object.values(endPointEntry)[0]);
                     if (isNaN(startTimeOffsetMs) || isNaN(endTimeOffsetMs) || startTimeOffsetMs >= endTimeOffsetMs) continue;
                     if (finalSimTimeOffsetMs >= startTimeOffsetMs && finalSimTimeOffsetMs <= endTimeOffsetMs) {
                         foundSegment = true;
                         const segmentDurationMs = endTimeOffsetMs - startTimeOffsetMs;
                         const elapsedInSegmentMs = finalSimTimeOffsetMs - startTimeOffsetMs;
                         let t = segmentDurationMs === 0 ? 0 : elapsedInSegmentMs / segmentDurationMs;
                         t = Math.max(0, Math.min(1, t));
                         if (this.relayPoints[startPointName] && this.relayPoints[endPointName]) {
                             const startVec = this.relayPoints[startPointName];
                             const endVec = this.relayPoints[endPointName];
                             mesh.position.lerpVectors(startVec, endVec, t);

                             if (this.yamahokoModels.has(yamanoko.name)) {
                                 const direction = new THREE.Vector3().subVectors(endVec, startVec);
                                 if (direction.lengthSq() > 0.0001) {
                                     const lookAtTarget = new THREE.Vector3(
                                         mesh.position.x + direction.x,
                                         mesh.position.y,
                                         mesh.position.z + direction.z
                                     );
                                     mesh.lookAt(lookAtTarget);
                                 }
                                 mesh.position.y = 0;
                             }
                         }
                         break;
                     }
                 }
                 if (!foundSegment) {
                     const firstPointTimeOffsetMs = this.timeToMsOffset(Object.values(yamanoko.position[0])[0]);
                     const lastPointTimeOffsetMs = this.timeToMsOffset(Object.values(yamanoko.position[yamanoko.position.length - 1])[0]);
                     if (isNaN(firstPointTimeOffsetMs) || isNaN(lastPointTimeOffsetMs)) return;
                     if (finalSimTimeOffsetMs < firstPointTimeOffsetMs && this.relayPoints[Object.keys(yamanoko.position[0])[0]]) {
                         mesh.position.copy(this.relayPoints[Object.keys(yamanoko.position[0])[0]]);
                     } else if (finalSimTimeOffsetMs > lastPointTimeOffsetMs && this.relayPoints[Object.keys(yamanoko.position[yamanoko.position.length - 1])[0]]) {
                         mesh.position.copy(this.relayPoints[Object.keys(yamanoko.position[yamanoko.position.length - 1])[0]]);
                     }
                     if (this.yamahokoModels.has(yamanoko.name)) {
                         mesh.position.y = 0;
                     }
                 }
             });
             this.updateTimeDisplay(finalSimTimeOffsetMs);
        };
        
        addYamahokoObjects() {
            this.yamahokoData.forEach(y => {
                let mesh;
                const loadedModel = this.yamahokoModels.get(y.name);

                if (loadedModel) {
                    mesh = loadedModel.clone();
                    mesh.userData.isGltf = true;

                    if (y.name === '長刀鉾') {
                        const box = new THREE.Box3().setFromObject(mesh);
                        const size = box.getSize(new THREE.Vector3());
                        const center = box.getCenter(new THREE.Vector3());
                        
                        const proxyGeometry = new THREE.BoxGeometry(size.x, size.y, size.z);
                        const proxyMaterial = new THREE.MeshBasicMaterial({ visible: false, transparent: true, opacity: 0 });
                        const proxyMesh = new THREE.Mesh(proxyGeometry, proxyMaterial);
                        
                        proxyMesh.position.copy(center);
                        
                        this.naginataBokoProxy = proxyMesh;
                        mesh.add(this.naginataBokoProxy);
                    }
                } else {
                    const geometry = new THREE.BoxGeometry(20, 20, 20);
                    const material = new THREE.MeshBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0.5 });
                    mesh = new THREE.Mesh(geometry, material);
                    mesh.userData.isGltf = false;
                }

                mesh.name = y.name;
                this.scene.add(mesh);
                this.yamahokoMeshes.push({ data: y, mesh: mesh });
                if (y.position && y.position.length > 0) {
                    const firstPoint = this.relayPoints[Object.keys(y.position[0])[0]];
                    if (firstPoint) mesh.position.copy(firstPoint);
                }

                const labelDiv = document.createElement('div');
                labelDiv.className = 'yamahoko-label';
                labelDiv.textContent = y.name;
                document.body.appendChild(labelDiv);
                this.yamahokoLabels.push({ mesh: mesh, label: labelDiv });

                const subLabelDiv = document.createElement('div');
                subLabelDiv.className = 'yamahoko-label-sub';
                subLabelDiv.textContent = y.name;
                document.body.appendChild(subLabelDiv);

                this.subCameraYamahokoLabels.push({ mesh: mesh, label: subLabelDiv });
            });

            for (const pointName in this.relayPoints) {
                if (!pointName.includes('基位置')) {
                    const labelDiv = document.createElement('div');
                    labelDiv.className = 'point-label';
                    labelDiv.textContent = pointName;
                    document.body.appendChild(labelDiv);
                    this.pointLabels.push({ position: this.relayPoints[pointName], label: labelDiv });
                }
            }
        }        

        setupVisibilityControls(openModalCallback) {
            const panel = this.visibilityControls;
            const contentWrapper = panel.querySelector('#visibility-content-wrapper');
            contentWrapper.innerHTML = '';
            
            this.toggleVisibilityBtn = panel.querySelector('#toggle-visibility-btn');

            this.toggleVisibilityBtn.addEventListener('click', () => {
                openModalCallback(contentWrapper);
            });
             const masterControlsContainer = document.createElement('div');
             masterControlsContainer.id = 'master-visibility-controls';
             const showAllBtn = document.createElement('button');
             showAllBtn.textContent = 'すべて表示';
             showAllBtn.className = 'master-btn';
             showAllBtn.addEventListener('click', () => {
                 this.yamahokoMeshes.forEach(item => item.mesh.visible = true);
                 this.visibilityToggleButtons.forEach(btn => btn.textContent = '非表示');
             });
             const hideAllBtn = document.createElement('button');
             hideAllBtn.textContent = 'すべて非表示';
             hideAllBtn.className = 'master-btn';
             hideAllBtn.addEventListener('click', () => {
                 this.yamahokoMeshes.forEach(item => item.mesh.visible = false);
                 this.visibilityToggleButtons.forEach(btn => btn.textContent = '表示');
             });
             masterControlsContainer.appendChild(showAllBtn);
             masterControlsContainer.appendChild(hideAllBtn);
             contentWrapper.appendChild(masterControlsContainer);
             this.visibilityToggleButtons = [];
             this.yamahokoData.sort((a, b) => {
                 const titleA = this.YAMAHOKO_TITLES[a.name] || '';
                 const titleB = this.YAMAHOKO_TITLES[b.name] || '';
                 return titleA.localeCompare(titleB, 'ja', { numeric: true });
             }).forEach(yamanoko => {
                 const item = this.yamahokoMeshes.find(m => m.data.name === yamanoko.name);
                 if (!item) return;
                 const mesh = item.mesh;
                 const controlContainer = document.createElement('div');
                 controlContainer.className = 'visibility-item';
                 const nameContainer = document.createElement('div');
                 nameContainer.className = 'name-container';
                 const rankSpan = document.createElement('span');
                 rankSpan.className = 'rank-column';
                 rankSpan.textContent = this.YAMAHOKO_TITLES[yamanoko.name] || '';
                 const nameSpan = document.createElement('span');
                 nameSpan.className = 'name-column';
                 nameSpan.textContent = yamanoko.name;
                 nameContainer.appendChild(rankSpan);
                 nameContainer.appendChild(nameSpan);
                 const toggleButton = document.createElement('button');
                 toggleButton.className = 'visibility-toggle-btn';
                 toggleButton.textContent = '非表示';
                 this.visibilityToggleButtons.push(toggleButton);
                 controlContainer.appendChild(nameContainer);
                 controlContainer.appendChild(toggleButton);
                 contentWrapper.appendChild(controlContainer); 

                 toggleButton.addEventListener('click', () => {
                     mesh.visible = !mesh.visible;
                     toggleButton.textContent = mesh.visible ? '非表示' : '表示';
                 });
             });
        }

        setupClickEvents() {
            this.raycaster = new THREE.Raycaster();
            this.mouse = new THREE.Vector2(1, 1); 

            const closeOverlay = () => {
                this.infoOverlay.classList.remove('visible');
                if (this.customBuildingMaterial) {
                    this.customBuildingMaterial.uniforms.uSelectedID.value = -1.0;
                }
            };
            this.infoOverlayCloseBtn.addEventListener('click', closeOverlay);
            this.infoOverlay.addEventListener('click', (e) => {
                if (e.target === this.infoOverlay) {
                    closeOverlay();
                }
            });
            
            const handleMouseMove = (event) => {
                this.mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                this.mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            };
            window.addEventListener('mousemove', handleMouseMove, false);

            window.addEventListener('dblclick', (event) => {
                if (this.isCharacterMode || this.isSelectingStartPosition) return;
                
                this.raycaster.setFromCamera(this.mouse, this.camera);
                
                const intersectMeshes = this.interactiveBuildingGroup.visible ? this.interactiveMeshes : this.interactiveMeshes1946;
                const buildingIntersects = this.raycaster.intersectObjects(intersectMeshes, true);
                if (buildingIntersects.length > 0) {
                    this.handleBuildingClick(buildingIntersects[0]);
                }
            });
            
            window.addEventListener('click', (event) => {
                if (!this.isSelectingStartPosition) return;

                this.raycaster.setFromCamera(this.mouse, this.camera);
                const walkableIntersects = this.raycaster.intersectObjects(this.walkableMeshes, true);

                if (walkableIntersects.length > 0) {
                    const startPoint = walkableIntersects[0].point.clone();
                    
                    this.isSelectingStartPosition = false;
                    this.setWalkableAreaHighlight(false);
                    
                    this.toggleCharacterMode(startPoint, false);
                }
            });
        }
        handleBuildingClick(intersection) {
            const idAttribute = intersection.object.geometry.attributes._id;
            if (!idAttribute) return;

            const clickedID = idAttribute.getX(intersection.face.a);
            this.customBuildingMaterial.uniforms.uSelectedID.value = clickedID;
            
            const attributes = this.buildingAttributes[clickedID];
            if (attributes) {
                let infoHtml = `<b>ID:</b> ${clickedID}<br>`;
                infoHtml += `<b>GmlID:</b> ${attributes.id || '不明'}<br>`;
                const year = (attributes.yearOfConstruction === "0001" || !attributes.yearOfConstruction) 
                             ? '不明' 
                             : `${attributes.yearOfConstruction}年`;
                infoHtml += `<b>建築年:</b> ${year}<br>`;
                infoHtml += `<b>計測高さ:</b> ${attributes.measuredHeight !== null ? attributes.measuredHeight + 'm' : '不明'}<br>`;
                infoHtml += `<b>地上階数:</b> ${attributes.storeysAboveGround !== null ? attributes.storeysAboveGround : '不明'}<br>`;
                infoHtml += `<b>地下階数:</b> ${attributes.storeysBelowGround !== null ? attributes.storeysBelowGround : '不明'}<br>`;
                const usage = attributes.usage_jp || attributes.usage || '不明';
                const structure = attributes.buildingStructureType_jp || attributes.buildingStructureType || '不明';
                infoHtml += `<b>用途:</b> ${usage}<br>`;
                infoHtml += `<b>構造種別:</b> ${structure}`;

                this.infoOverlayText.innerHTML = infoHtml;
                this.infoOverlay.classList.add('visible');
            }
        }

        createCustomMaterial() {
            const vertexShader = document.getElementById('vertexShader').textContent;
            const fragmentShader = document.getElementById('fragmentShader').textContent;
            return new THREE.ShaderMaterial({
                vertexShader, fragmentShader,
                uniforms: {
                    uSelectedID: { value: -1.0 },
                    uBaseColor: { value: new THREE.Color(0xffffff) },
                    uHighlightColor: { value: new THREE.Color(0x007bff) },
                },
                clippingPlanes: this.clippingPlanes,
                clipIntersection: false
            });
        }

        setWalkableAreaHighlight(highlight) {
            const material = highlight ? this.walkableAreaHighlightMaterial : this.walkableAreaMaterial;
            this.walkableMeshes.forEach(mesh => {
                mesh.material = material;
            });
        }

        setupCharacterModeControls() {
            this.characterModeBtn.addEventListener('click', (event) => {
                if (this.isCharacterMode) {
                    this.toggleCharacterMode(null, true);
                } else if (this.isSelectingStartPosition) {
                    this.isSelectingStartPosition = false;
                    this.setWalkableAreaHighlight(false);
                    this.characterModeBtn.textContent = '人物視点';
                    this.characterModeBtn.classList.remove('active');
                } else {
                    this.isSelectingStartPosition = true;
                    this.setWalkableAreaHighlight(true);
                    this.characterModeBtn.textContent = '開始地点を選択';
                    this.characterModeBtn.classList.add('active');
                }
                event.currentTarget.blur();
            });
            this.keydownListener = (e) => { this.keyState[e.key.toLowerCase()] = true; };
            this.keyupListener = (e) => { this.keyState[e.key.toLowerCase()] = false; };
        }

        toggleCharacterMode(startPosition, isExiting = false) {
            if (isExiting) {
                this.isCharacterMode = false;
                
                if (this.roadAsphaltModel) this.roadAsphaltModel.visible = false;
                if (this.busBayModel) this.busBayModel.visible = false;
                if (this.sidewalkModel) this.sidewalkModel.visible = false;
                if (this.gutterModel) this.gutterModel.visible = false;
                if (this.roadMarkingModel) this.roadMarkingModel.visible = false;

                if (this.htmlTextPivot) this.htmlTextPivot.visible = true;

                if ((this.currentMapLayer === 'kodo' || this.currentMapLayer === 'youto' || this.currentMapLayer === 'keikan') && this.mapGroup) {
                    this.mapGroup.children.forEach(child => {
                        if (child.name === 'district_label_group') {
                            child.visible = true;
                        }
                    });
                }

                this.characterModeBtn.textContent = '人物視点';
                this.characterModeBtn.classList.remove('active');

                if (this.initialCameraPosition && this.initialControlsTarget) {
                    this.camera.position.copy(this.initialCameraPosition);
                    this.controls.target.copy(this.initialControlsTarget);
                }

                this.controls.enabled = true;
                this.girlModel.visible = false;
                
                this.camera.near = 10;
                this.camera.updateProjectionMatrix();

                window.removeEventListener('keydown', this.keydownListener);
                window.removeEventListener('keyup', this.keyupListener);
                
                this.loadMapTiles(); 
                
                return;
            }

            if (!startPosition) return;
            
            this.isCharacterMode = true;

            if (this.roadAsphaltModel) this.roadAsphaltModel.visible = true;
            if (this.busBayModel) this.busBayModel.visible = true;
            if (this.sidewalkModel) this.sidewalkModel.visible = true;
            if (this.gutterModel) this.gutterModel.visible = true;
            if (this.roadMarkingModel) this.roadMarkingModel.visible = true;

            if (this.htmlTextPivot) this.htmlTextPivot.visible = false;

            if (!this.girlModel) {
                alert('キャラクターモデルが読み込まれていません。');
                this.isCharacterMode = false;
                return;
            }
            
            this.characterModeBtn.textContent = '通常視点に戻る';
            this.characterModeBtn.classList.add('active');
            
            this.characterVerticalState = 'GROUNDED';
            this.flightTween.active = false;

            this.controls.enabled = false;
            
            this.camera.near = 1;
            this.camera.updateProjectionMatrix();

            this.girlModel.position.copy(startPosition);
            
            this.targetRotationY = this.camera.rotation.y;
            this.modelRotationY = this.camera.rotation.y;
            this.girlModel.rotation.y = this.modelRotationY;
            
            this.switchCharacterAnimation('idle');
            this.girlModel.visible = true;
            this.keyState = {};

            window.addEventListener('keydown', this.keydownListener);
            window.addEventListener('keyup', this.keyupListener);
        }
        
        switchCharacterAnimation(name) {
            if (!this.girlActions[name]) { console.warn(`Animation "${name}" not found!`); return; }
            const newAction = this.girlActions[name];
            if (!newAction || this.activeGirlAction === newAction) return;
            if (this.activeGirlAction) this.activeGirlAction.fadeOut(0.2);
            newAction.reset().fadeIn(0.2).play();
            this.activeGirlAction = newAction;
        }

        handleCharacterInputs() {
            const inputs = { walk: this.keyState['w'] || this.keyState['arrowup'], turnLeft: this.keyState['a'] || this.keyState['arrowleft'], turnRight: this.keyState['d'] || this.keyState['arrowright'], run: this.keyState[' '] || this.keyState['b'], turnBack: this.keyState['s'] || this.keyState['arrowdown']};
            
            const flyInput = this.keyState['h'];
            const gamepads = navigator.getGamepads();
            let activeGamepad = null;
            for (const gp of gamepads) { if (gp && gp.connected && !gp.id.toLowerCase().includes('surface')) { activeGamepad = gp; break; } }
            
            let gamepadFlyInput = false;
            if (activeGamepad) {
                const dpadUp = activeGamepad.buttons[this.GAMEPAD_BUTTON_MAP.DPAD_UP]?.pressed;
                const dpadDown = activeGamepad.buttons[this.GAMEPAD_BUTTON_MAP.DPAD_DOWN]?.pressed;
                const dpadLeft = activeGamepad.buttons[this.GAMEPAD_BUTTON_MAP.DPAD_LEFT]?.pressed;
                const dpadRight = activeGamepad.buttons[this.GAMEPAD_BUTTON_MAP.DPAD_RIGHT]?.pressed;
                const bButton = activeGamepad.buttons[this.GAMEPAD_BUTTON_MAP.B_BUTTON]?.pressed;
                gamepadFlyInput = activeGamepad.buttons[this.GAMEPAD_BUTTON_MAP.FLY_BUTTON]?.pressed;

                inputs.walk = inputs.walk || dpadUp;
                inputs.turnLeft = inputs.turnLeft || dpadLeft;
                inputs.turnRight = inputs.turnRight || dpadRight;
                inputs.run = inputs.run || (dpadUp && bButton);
                inputs.turnBack = inputs.turnBack || dpadDown;
            }

            if ((flyInput || gamepadFlyInput) && !this.flyButtonPressed) {
                inputs.flyTrigger = true;
                this.flyButtonPressed = true;
            } else {
                inputs.flyTrigger = false;
            }
            if (!flyInput && !gamepadFlyInput) {
                this.flyButtonPressed = false;
            }

            if(inputs.turnBack && this.turn180Timer < 0) { this.turn180Timer = 0.0; }
            if (this.keyState['s']) this.keyState['s'] = false;
            if (this.keyState['arrowdown']) this.keyState['arrowdown'] = false;
            return inputs;
        }
        
        updateCharacter(delta, inputs) {
            if (!this.girlModel || !this.girlMixer) return;

            const groundRunSpeed = 16.0;
            const groundWalkSpeed = 3.0;
            const flyHorizontalSpeed = 24.0;
            const superFlySpeed = 50.0;
            const turnSpeed = 3.0;
            const flyTurnSpeed = 5.0; 
            const groundTurnSpeed = 5.0;
            const collisionThreshold = this.characterRadius + 0.5;
            const flyGravity = 30.0;
            const coyoteTimeThreshold = 0.1;

            if (inputs.flyTrigger && !this.flightTween.active) {
                if (this.characterVerticalState === 'GROUNDED') {
                    this.characterVerticalState = 'ASCENDING';
                    this.flightTween.active = true;
                    this.flightTween.startTime = this.clock.elapsedTime;
                    this.flightTween.startY = this.girlModel.position.y;
                    this.flightTween.endY = 60.0;
                } else if (this.characterVerticalState === 'HOVERING') {
                    const groundCheckRay = new THREE.Raycaster(new THREE.Vector3(this.girlModel.position.x, 100, this.girlModel.position.z), new THREE.Vector3(0, -1, 0));
                    const collidablesForGround = [this.mapGroup, this.interactiveBuildingGroup, ...this.walkableMeshes];
                    const groundHits = groundCheckRay.intersectObjects(collidablesForGround, true);
                    
                    if (groundHits.length > 0) {
                        this.characterVerticalState = 'DESCENDING';
                        this.flightTween.active = true;
                        this.flightTween.startTime = this.clock.elapsedTime;
                        this.flightTween.startY = this.girlModel.position.y;
                        this.flightTween.endY = groundHits[0].point.y;
                    }
                }
            }

            if (this.flightTween.active) {
                const elapsedTime = this.clock.elapsedTime - this.flightTween.startTime;
                let progress = elapsedTime / this.flightTween.duration;
                
                if (progress >= 1.0) {
                    progress = 1.0;
                    this.flightTween.active = false;
                    if (this.characterVerticalState === 'ASCENDING') {
                        this.characterVerticalState = 'HOVERING';
                    } else if (this.characterVerticalState === 'DESCENDING') {
                        this.characterVerticalState = 'GROUNDED';
                    }
                }
                const easedProgress = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;
                this.girlModel.position.y = THREE.MathUtils.lerp(this.flightTween.startY, this.flightTween.endY, easedProgress);
            } else {
                const groundRaycaster = new THREE.Raycaster(this.girlModel.position.clone().add(new THREE.Vector3(0, 0.1, 0)), new THREE.Vector3(0, -1, 0));
                const collidablesForGround = [this.mapGroup, this.interactiveBuildingGroup, ...this.walkableMeshes];
                const groundIntersects = groundRaycaster.intersectObjects(collidablesForGround, true);
                const onGround = groundIntersects.length > 0 && groundIntersects[0].distance < 0.2;

                if (onGround) {
                    this.coyoteTime = coyoteTimeThreshold;
                    if(this.characterVerticalState !== 'GROUNDED') {
                       this.characterVerticalState = 'GROUNDED';
                    }
                    const targetY = groundIntersects[0].point.y;
                    this.girlModel.position.y = THREE.MathUtils.lerp(this.girlModel.position.y, targetY, 0.2);
                } else {
                    this.coyoteTime -= delta;
                    if (this.coyoteTime <= 0 && this.characterVerticalState === 'GROUNDED') {
                         this.characterVerticalState = 'FALLING';
                    }
                    if (this.characterVerticalState === 'FALLING') {
                        this.girlModel.position.y -= flyGravity * delta;
                    }
                }
            }
            
            if (this.turn180Timer >= 0) {
                const turnDuration = 0.5;
                this.targetRotationY -= (Math.PI / turnDuration) * delta;
                this.turn180Timer += delta;
                if (this.turn180Timer >= turnDuration) this.turn180Timer = -1;
            } else {
                 if (inputs.turnLeft) this.targetRotationY += turnSpeed * delta;
                 if (inputs.turnRight) this.targetRotationY -= turnSpeed * delta;
            }

            const onGround = this.characterVerticalState === 'GROUNDED';
            let currentSpeed = 0;
            let currentAnimation = 'idle';

            if (onGround) {
                if (inputs.run) {
                    currentSpeed = groundRunSpeed;
                    currentAnimation = 'run';
                } else if (inputs.walk) {
                    currentSpeed = groundWalkSpeed;
                    currentAnimation = 'walk1(child)';
                }
            } else {
                currentAnimation = 'fly';
                if (inputs.run) {
                    currentSpeed = superFlySpeed;
                } else if (inputs.walk) {
                    currentSpeed = flyHorizontalSpeed;
                }
            }
            this.switchCharacterAnimation(currentAnimation);
            
            const moveDirection = new THREE.Vector3(Math.sin(this.targetRotationY), 0, Math.cos(this.targetRotationY));
            let velocity = moveDirection.clone().multiplyScalar(currentSpeed * delta);
            
            if (onGround && currentSpeed > 0 && this.walkableMeshes.length > 0) {
                const characterCenter = this.girlModel.position.clone().add(new THREE.Vector3(0, this.characterHeight / 2, 0));
                const proposedPosition = this.girlModel.position.clone().add(velocity);

                const downRaycaster = new THREE.Raycaster(
                    new THREE.Vector3(proposedPosition.x, 100, proposedPosition.z),
                    new THREE.Vector3(0, -1, 0)
                );
                const downIntersections = downRaycaster.intersectObjects(this.walkableMeshes, true);
                const isOnWalkableSurface = downIntersections.length > 0;

                if (!isOnWalkableSurface) {
                    const boundaryRaycaster = new THREE.Raycaster(characterCenter, velocity.clone().normalize());
                    const boundaryIntersections = boundaryRaycaster.intersectObjects(this.walkableMeshes, true);

                    if (boundaryIntersections.length > 0 && boundaryIntersections[0].distance < velocity.length() + collisionThreshold) {
                        const hitNormal = boundaryIntersections[0].face.normal;
                        hitNormal.y = 0;
                        hitNormal.normalize();
                        velocity.projectOnPlane(hitNormal);

                        const slideDirection = velocity.clone().normalize();
                        if (slideDirection.lengthSq() > 0) {
                            const cornerRaycaster = new THREE.Raycaster(characterCenter, slideDirection);
                            const cornerIntersections = cornerRaycaster.intersectObjects(this.walkableMeshes, true);
                            if (cornerIntersections.length > 0 && cornerIntersections[0].distance < collisionThreshold) {
                                velocity.set(0, 0, 0);
                            }
                        }
                    } else {
                        velocity.set(0, 0, 0);
                    }
                }
            }
            
            this.girlModel.position.add(velocity);

            const currentTurnSpeed = onGround ? groundTurnSpeed : flyTurnSpeed;
            let deltaRotation = this.targetRotationY - this.modelRotationY;
            while (deltaRotation > Math.PI) deltaRotation -= 2 * Math.PI;
            while (deltaRotation < -Math.PI) deltaRotation += 2 * Math.PI;
            this.modelRotationY += deltaRotation * currentTurnSpeed * delta;
            this.girlModel.rotation.y = this.modelRotationY;
            
            if(this.girlMixer) this.girlMixer.update(delta);
        }

        updateCharacterCamera() {
            if (!this.girlModel) return;

            const isFlying = this.characterVerticalState !== 'GROUNDED' && this.characterVerticalState !== 'FALLING';

            if (isFlying) {
                const flyTargetDistance = 12.0;
                const angle = 45 * (Math.PI / 180);
                
                const camHeight = flyTargetDistance * Math.sin(angle);
                const horizontalDist = flyTargetDistance * Math.cos(angle);

                const camX = this.girlModel.position.x - horizontalDist * Math.sin(this.modelRotationY);
                const camZ = this.girlModel.position.z - horizontalDist * Math.cos(this.modelRotationY);
                const camY = this.girlModel.position.y + camHeight;

                this.camera.position.set(camX, camY, camZ);
                
                const lookAtTarget = this.girlModel.position.clone();
                this.camera.lookAt(lookAtTarget);

            } else {
                const groundTargetHeight = 2.0;
                const groundTargetDistance = 4.0;
                
                const lerpFactor = 0.1;
                this.currentCameraHeight = THREE.MathUtils.lerp(this.currentCameraHeight, groundTargetHeight, lerpFactor);
                this.currentCameraDistance = THREE.MathUtils.lerp(this.currentCameraDistance, groundTargetDistance, lerpFactor);

                const idealX = this.girlModel.position.x - this.currentCameraDistance * Math.sin(this.modelRotationY);
                const idealZ = this.girlModel.position.z - this.currentCameraDistance * Math.cos(this.modelRotationY);
                const idealPosition = new THREE.Vector3(idealX, this.girlModel.position.y + this.currentCameraHeight, idealZ);
                
                this.camera.position.lerp(idealPosition, 0.1);
                
                const lookAtPosition = this.girlModel.position.clone().add(new THREE.Vector3(0, 1.2, 0));
                this.camera.lookAt(lookAtPosition);
            }
        }
    }
    
    window.addEventListener('DOMContentLoaded', () => {
        new GionSimulationApp();
    });
</script>

    <div id="dynamic-loading-overlay">
        <div class="spinner"></div>
        <p id="dynamic-loading-text">読み込み中...</p>
    </div>
