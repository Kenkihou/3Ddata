<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>祇園祭 山鉾巡行シミュレーション ver27</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
        }
    }
    </script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.11.0/proj4.js"></script>

    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: white;
            font-family: 'メイリオ', Meiryo, sans-serif;
        }
        canvas.webgl-canvas {
            display: block; 
            position: fixed;
            top: 0;
            left: 0;
            outline: none;
            z-index: 1; 
        }

        .map-select-btn {
            width: 100%;
            padding: 8px;
            background-color: #555;
            color: white;
            border: 1px solid #777;
            cursor: pointer;
            text-align: left;
            border-radius: 4px;
        }
        .map-select-btn.active {
            background-color: #007bff;
            border-color: #007bff;
        }

        #css3d-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 2;
        }

        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: black; display: flex; justify-content: center;
            align-items: center; z-index: 9999;
            transition: opacity 0.5s ease;
            flex-direction: column;
        }
        #progress-container {
            position: relative;
            width: 160px;
            height: 160px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #progress-circle {
            position: absolute;
        }
        .progress-background, .progress-bar {
            fill: none;
            stroke-width: 12;
        }
        .progress-background {
            stroke: #444;
        }
        .progress-bar {
            stroke: #ffc107;
            stroke-linecap: round;
            stroke-dasharray: 439.82;
            stroke-dashoffset: 439.82;
            transition: stroke-dashoffset 0.3s ease, stroke 0.3s ease;
        }
        #progress-text {
            color: white;
            font-size: 2em;
            font-family: 'Inter', sans-serif;
            font-weight: bold;
        }

        .ui-panel {
            color: white; background-color: rgba(50, 50, 50, 0.7);
            padding: 10px 15px; border-radius: 5px; 
        }
        
        #top-left-controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 102;
            display: flex;
            flex-direction: row;
            gap: 10px;
        }
        
        .control-container {
            position: relative;
        }

        .top-bar-btn {
            padding: 8px 15px;
            background-color: rgba(50, 50, 50, 0.7);
            color: white;
            border: 1px solid #888;
            cursor: pointer;
            flex-shrink: 0;
            white-space: nowrap;
            border-radius: 5px;
            font-size: 0.9em;
        }

        .top-bar-btn:hover {
            background-color: rgba(80, 80, 80, 0.8);
        }

        .top-bar-btn.active {
            background-color: #007bff;
            border-color: #0056b3;
        }

        #building-search-content-wrapper,
        #map-content-wrapper,
        #visibility-content-wrapper {
            display: none;
        }
        
        .close-btn {
            position: absolute;
            top: 5px;
            right: 10px;
            font-size: 1.8em;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
            color: #fff;
        }
        .close-btn:hover {
            color: #ffcccc;
        }
        
        #camera-info-display {
            position: absolute; 
            bottom: 10px;
            right: 10px;
            width: auto;
            z-index: 100;
            font-family: monospace;
            font-size: 0.9em;
            line-height: 1.4;
            white-space: pre;
        }

        #time-display {
            position: absolute;
            top: 55px;
            left: 10px;
            padding: 5px 10px;
            font-size: 1.2em;
            font-family: monospace;
            z-index: 102;
        }

        .yamahoko-label, .yamahoko-label-sub {
            position: absolute; color: white; background-color: rgba(0, 0, 0, 0.7);
            padding: 2px 5px; border-radius: 3px; font-size: 0.8em;
            white-space: nowrap; transform: translate(-50%, -120%);
            pointer-events: none; z-index: 99; text-shadow: 0px 0px 3px black;
            writing-mode: vertical-rl; text-orientation: upright;
        }
        .yamahoko-label-sub {
            font-size: 0.7em;
            z-index: 3;
        }
        .point-label {
            position: absolute; color: black; background-color: rgba(255, 255, 255, 0.7);
            padding: 2px 5px; border-radius: 3px; font-size: 0.7em;
            white-space: nowrap; transform: translate(-50%, -50%);
            pointer-events: none; z-index: 98;
        }

        .bunkazai-label, .bunkazai-label-sub,
        .keikan-label, .keikan-label-sub,
        .kyomachiya-label, .kyomachiya-label-sub {
            position: absolute;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.9em;
            font-weight: bold;
            transform: translate(-50%, -150%);
            pointer-events: auto;
            z-index: 98;
            cursor: pointer;
            display: none;
        }

        .bunkazai-label-sub, .keikan-label-sub, .kyomachiya-label-sub {
            font-size: 0.7em;
            z-index: 3;
        }

        .bunkazai-label, .bunkazai-label-sub {
            color: #3e2723;
            background-color: rgba(255, 224, 178, 0.85);
            border: 1px solid #a1887f;
        }
        .keikan-label, .keikan-label-sub {
            color: #e1bee7;
            background-color: rgba(74, 20, 140, 0.85);
            border: 1px solid #e1bee7;
        }
        .kyomachiya-label, .kyomachiya-label-sub {
            color: #1b5e20;
            background-color: rgba(200, 230, 201, 0.85);
            border: 1px solid #1b5e20;
        }

        .bunkazai-label::after, .bunkazai-label-sub::after,
        .keikan-label::after, .keikan-label-sub::after,
        .kyomachiya-label::after, .kyomachiya-label-sub::after {
            content: attr(data-name);
            position: absolute;
            bottom: 120%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #333;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.9em;

            display: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
        }

        .bunkazai-label:hover::after, .bunkazai-label-sub:hover::after,
        .keikan-label:hover::after, .keikan-label-sub:hover::after,
        .kyomachiya-label:hover::after, .kyomachiya-label-sub:hover::after {
            display: block;
            opacity: 1;
        }


        #controls-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            width: 70%;
            max-width: 600px;
            transform: translateX(-50%);
            background-color: transparent;

            flex-direction: column;
            align-items: flex-start;
            gap: 5px;
            z-index: 101;
            height: auto;
            box-sizing: border-box;
        }
        #playPauseBtn {
            padding: 5px 15px;
            font-size: 1.2em;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
            box-sizing: border-box; 
            flex-shrink: 0;
            background-color: rgba(50, 50, 50, 0.7);
            border: 1px solid #888;
            border-radius: 5px;
            color: white;
        }
        #seek-container { 
            position: relative; 
            width: 100%; 
            height: 40px; 
            background-color: rgba(50, 50, 50, 0.7);
            padding: 0 15px;
            border-radius: 10px;
            box-sizing: border-box;

            align-items: center;
        }
        #seekBar { width: 100%; cursor: pointer; margin: 0; }
        
        #seekBar::-webkit-slider-thumb {

            appearance: none;
            width: 24px;
            height: 24px;
            background: #2196F3;
            cursor: pointer;
            border-radius: 50%;
            border: 2px solid white;
        }

        #seekBar::-moz-range-thumb {
            width: 24px;
            height: 24px;
            background: #2196F3;
            cursor: pointer;
            border-radius: 50%;
            border: 2px solid white;
        }

        #slider-ticks-container {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 10px;
            transform: translateY(-50%);
            pointer-events: none;

        .slider-tick {
            position: absolute;
            width: 2px;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.5);
            transform: translateX(-50%);

        #map-content-wrapper h4,
        #building-search-content-wrapper legend {
            color: white;
        }

        #map-content-wrapper .button-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        #building-search-content-wrapper fieldset {
            border: 1px solid #777;
            border-radius: 4px;
            padding: 10px;
        }
        
        #building-search-content-wrapper div {
            margin-bottom: 5px;
        }
        #building-search-content-wrapper label {
            margin-left: 5px;
            cursor: pointer;
        }

        .visibility-item { 
            display: grid; 
            grid-template-columns: 1fr auto; 
            align-items: center; 
            width: 100%;

        .name-container {

        .master-btn { width: 100%; background-color: #555; color: white; border: 1px solid #777; cursor: pointer; }
        .name-column { color: white; }

        #sub-camera-label {
            position: fixed;
            left: 5px; 
            transform: none; 
            bottom: 288px;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 0.9em;
            z-index: 6;
            pointer-events: none;
            white-space: nowrap;
        }

        #sub-camera-controls {
            position: fixed;
            left: 240px; 
            bottom: 282px; 
            z-index: 7;
        }
        #sub-camera-switch-btn {
            padding: 4px 10px;
            font-size: 0.8em;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: 1px solid #fff;
            border-radius: 5px;
            cursor: pointer;
        }
        #sub-camera-switch-btn:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }
        #camera-select-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.3s ease;
        }
        #camera-select-modal.modal-hidden {

            pointer-events: none;
        }

            background-color: #333;
            color: white;
            padding: 20px 25px;
            border-radius: 10px;
            width: 320px;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .modal-close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 1.8em;
            line-height: 1;
            cursor: pointer;
        }
        .modal-close-btn:hover {
            color: #ffcccc;
        }
        #camera-select-list {
            list-style: none;
            padding: 0;
            margin-top: 15px;
        }
        #camera-select-list li {
            padding: 12px;
            border-bottom: 1px solid #555;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #camera-select-list li:hover {
            background-color: #555;
        }
        #camera-select-list li:last-child {
            border-bottom: none;
        }
        #sync-setting-container {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #555;
            display: flex;
            align-items: center;
            font-size: 0.9em;
        }
        #sync-setting-container input {
            margin-right: 8px;
        }
        #dynamic-loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 10000;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            font-family: 'メイリオ', Meiryo, sans-serif;
        }
        .spinner {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #ffc107;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }

        #dynamic-loading-text {
            margin-top: 20px;
            font-size: 1.2em;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #info-overlay, #panel-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #info-overlay.visible, #panel-overlay.visible {
            opacity: 1;
            pointer-events: all;
        }

        .info-overlay-content, .panel-overlay-content {
            background-color: rgba(40, 40, 40, 0.9);
            color: white;
            padding: 25px;
            border-radius: 10px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            line-height: 1.8;
            font-size: 1.1em;
        }
        .panel-overlay-content {
            max-width: 320px;
            font-size: 1em;
        }

        .info-overlay-close-btn, .panel-overlay-close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 2em;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
            color: #fff;
        }
        .info-overlay-close-btn:hover, .panel-overlay-close-btn:hover {
            color: #ffcccc;
        }

                left: 0;
                top: 0;

                flex-basis: 0;
            }

            .top-bar-btn {
                padding: 8px 5px;
                text-align: center;
                font-size: 0.8em;
            }

            #time-display {
                top: 50px;
                left: 5px;
            }
            #controls-container {
                width: 80%;
            }
            #seek-container {
                height: 80px;
            }
            #seekBar {
                height: 50%;
                -webkit-appearance: none;
                appearance: none;
                background: transparent;
            }
        }

        body.is-phone #sub-camera-label,
        body.is-phone #sub-camera-controls {
            display: none !important;
        }
    </style>
</head>
<body>
    <canvas class="webgl-canvas"></canvas>
    
    <div id="camera-info-display" class="ui-panel"></div>

    <div id="sub-camera-label"></div>
    <div id="sub-camera-controls">
        <button id="sub-camera-switch-btn">カメラ切替</button>
    </div>
    <div id="camera-select-modal" class="modal-hidden">
        <div class="modal-content">
            <span class="modal-close-btn">×</span>
            <h3>サブカメラ視点選択</h3>
            <ul id="camera-select-list"></ul>
            <div id="sync-setting-container">
                <input type="checkbox" id="disable-video-sync">
                <label for="disable-video-sync">サブカメラの視点の切り替えと動画の切り替えを連動させない</label>
            </div>
        </div>
    </div>

    <div id="css3d-container"></div>
    
    <div id="loading-overlay">
        <div id="progress-container">
            <svg id="progress-circle" width="160" height="160" viewBox="0 0 160 160">
                <circle class="progress-background" cx="80" cy="80" r="70" />
                <circle class="progress-bar" cx="80" cy="80" r="70" transform="rotate(-90 80 80)"/>
            </svg>
            <div id="progress-text">0%</div>
        </div>
    </div>

    <div id="top-left-controls">
        <button class="top-bar-btn">最小構成</button>
        
        <div id="building-search-container" class="control-container">
            <button id="building-search-toggle-btn" class="top-bar-btn">建物検索</button>
            <div id="building-search-content-wrapper">
                <fieldset id="search-mode-checkboxes">
                    <legend>表示するラベルを選択</legend>
                    <div>
                        <input type="checkbox" id="search-bunkazai" value="bunkazai">
                        <label for="search-bunkazai">文化財</label>
                    </div>
                    <div>
                        <input type="checkbox" id="search-keikan" value="keikan">
                        <label for="search-keikan">景観</label>
                    </div>
                    <div>
                        <input type="checkbox" id="search-kyomachiya" value="kyomachiya">
                        <label for="search-kyomachiya">京町家</label>
                    </div>
                </fieldset>
            </div>
        </div>

        <div class="control-container">
             <button id="character-mode-btn" class="top-bar-btn">人物視点</button>
        </div>

        <button class="top-bar-btn">視点移動</button>

        <div id="map-select-container" class="control-container">
            <button id="toggle-map-btn" class="top-bar-btn">地図切替</button>
            <div id="map-content-wrapper">
                <h4>地理院タイル</h4>
                <div class="button-group">
                    <button class="map-select-btn" data-layer="ort">電子国土基本図（オルソ）</button>
                    <button class="map-select-btn" data-layer="std">標準地図</button>
                    <button class="map-select-btn" data-layer="ort_USA10">航空写真 (1945-50)</button>
                    <button class="map-select-btn" data-layer="gazo1">航空写真(1974-78)</button>
                </div>
                <h4 style="margin-top: 15px;">各種情報</h4>
                <div class="button-group">
                    <button class="map-select-btn" data-layer="youto">用途地域</button>
                    <button class="map-select-btn" data-layer="kodo">高度地区</button>
                    <button class="map-select-btn" data-layer="keikan">京町家保全継承地区</button>
                </div>
            </div>
        </div>

        <div id="visibility-controls" class="control-container">
            <button id="toggle-visibility-btn" class="top-bar-btn">山鉾一覧</button>
            <div id="visibility-content-wrapper">
                 </div>
        </div>
    </div>

    <div id="time-display" class="ui-panel"></div>
    
    <div id="controls-container">
        <button id="playPauseBtn">100倍再生</button>
        <div id="seek-container">
            <input type="range" id="seekBar" value="0" min="0" max="1000">
            <div id="slider-ticks-container"></div>
        </div>
    </div>
    
    <div id="info-overlay">
        <div class="info-overlay-content">
            <span class="info-overlay-close-btn">&times;</span>
            <div id="info-overlay-text"></div>
        </div>
    </div>

    <div id="panel-overlay">
        <div class="panel-overlay-content">
            <span class="panel-overlay-close-btn">&times;</span>
            <div id="panel-overlay-body"></div>
        </div>
    </div>

    <script id="vertexShader" type="x-shader/x-vertex">
        attribute float _id;
        attribute float isKeikan;
        attribute float isKyomachiya;
        attribute float isBunkazai;
        varying vec3 vNormal;
        varying float vBuildingID;
        varying vec3 vWorldPosition;
        varying float vIsKeikan;
        varying float vIsKyomachiya;
        varying float vIsBunkazai;
        
        void main() {
            vBuildingID = _id;
            vIsKeikan = isKeikan;
            vIsKyomachiya = isKyomachiya;
            vIsBunkazai = isBunkazai;
            vNormal = normalize(normalMatrix * normal);
            vWorldPosition = (modelMatrix * vec4(position, 1.0)).xyz;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    </script>
    <script id="fragmentShader" type="x-shader/x-fragment">
        varying float vBuildingID;
        varying vec3 vNormal;
        varying vec3 vWorldPosition;
        varying float vIsKeikan;
        varying float vIsKyomachiya;
        varying float vIsBunkazai;

        uniform float uSelectedID;
        uniform vec3 uBaseColor;
        uniform vec3 uHighlightColor;
        
        void main() {
            if (vWorldPosition.z > 800.0 || vWorldPosition.z < -800.0 || vWorldPosition.x < -1050.0 || vWorldPosition.x > 950.0) {
                discard;
            }

            vec3 baseColor = uBaseColor;
            if (vIsKeikan > 0.5) {
                baseColor = vec3(0.65, 0.55, 0.85); // 景観（紫）
            } else if (vIsBunkazai > 0.5) {
                baseColor = vec3(0.6, 0.4, 0.2);   // 文化財（茶色）
            } else if (vIsKyomachiya > 0.5) {
                baseColor = vec3(0.4, 0.8, 0.4);   // 京町家（緑）
            }

            vec3 finalColor = baseColor;
            if (vBuildingID > 0.0 && vBuildingID == uSelectedID) {
                finalColor = uHighlightColor;
            }

            vec3 lightDirection = normalize(vec3(0.5, 1.0, 0.75));
            float ambientLight = 0.4;
            float diffuse = max(dot(vNormal, lightDirection), 0.0);
            float brightness = ambientLight + (1.0 - ambientLight) * diffuse;
            vec3 lightedColor = finalColor * brightness;
            
            gl_FragColor = vec4(lightedColor, 1.0);
        }
    </script>

    <script id="skyVertexShader" type="x-shader/x-vertex">
        varying vec3 vWorldPosition;
        void main() {
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            gl_Position = projectionMatrix * mvPosition;
            gl_Position.z = gl_Position.w; 
            vWorldPosition = position;
        }
    </script>
    <script id="skyFragmentShader" type="x-shader/x-fragment">
        varying vec3 vWorldPosition;
        uniform vec3 uTopColor;
        uniform vec3 uBottomColor;

        void main() {
            float h = normalize(vWorldPosition).y;
            float t = (h + 1.0) / 2.0;
            vec3 finalColor = mix(uBottomColor, uTopColor, smoothstep(0.5, 0.7, t));
            float alpha = smoothstep(0.5, 0.55, t);
            gl_FragColor = vec4(finalColor, alpha);
        }
    </script>

    <script id="mapTileVertexShader" type="x-shader/x-vertex">
        varying vec2 vUv;
        varying vec3 vWorldPosition;
        void main() {
            vUv = uv;
            vec4 worldPosition = modelMatrix * vec4(position, 1.0);
            vWorldPosition = worldPosition.xyz;
            gl_Position = projectionMatrix * viewMatrix * worldPosition;
        }
    </script>
    <script id="mapTileFragmentShader" type="x-shader/x-fragment">
        varying vec2 vUv;
        varying vec3 vWorldPosition;

        uniform sampler2D tMap;
        uniform float uRadius;
        uniform float uFadeDistance;

        void main() {
            float dist = length(vWorldPosition.xz);
            float alpha = smoothstep(uRadius, uRadius - uFadeDistance, dist);

            if (alpha < 0.01) {
                discard;
            }

            vec4 texColor = texture2D(tMap, vUv);
            gl_FragColor = vec4(texColor.rgb, texColor.a * alpha);
        }
    </script>

        updateLoadingProgress(percent) {
            this.loadingProgress = Math.min(100, Math.max(0, percent));
            const progressBar = document.querySelector('.progress-bar');
            const progressText = document.getElementById('progress-text');
            
            if (!progressBar || !progressText) return;

            if (this.circleCircumference === 0) {
                const radius = progressBar.r.baseVal.value;
                this.circleCircumference = 2 * Math.PI * radius;
                progressBar.style.strokeDasharray = this.circleCircumference;
            }

            const offset = this.circleCircumference - (this.loadingProgress / 100) * this.circleCircumference;
            progressBar.style.strokeDashoffset = offset;

            if (this.loadingProgress < 40) {
                progressBar.style.stroke = '#ffc107';
            } else if (this.loadingProgress < 80) {
                progressBar.style.stroke = '#90caf9';
            } else {
                progressBar.style.stroke = '#a5d6a7';
            }

            progressText.textContent = `${Math.round(this.loadingProgress)}%`;
        }

        async loadInitialData() {
            try {
                const assetsToLoad = [
                    { name: 'Relay_point.json', weight: 4 }, { name: 'yamahoko2.json', weight: 4 },
                    { name: '../gion_asset/merged_merged_output.json', weight: 15 },
                    { name: '../gion_asset/景観+彩る.json', weight: 4 }, { name: '../gion_asset/kyomachiya_kachizuke.json', weight: 4 },
                    { name: '../gion_asset/bunkazai_kachizuke.json', weight: 4 },
                    { name: 'subCameraMap', weight: 5 }, { name: 'mapTiles', weight: 5 },
                    { name: 'interactiveModels', weight: 45 }, 
                    { name: 'otherModels', weight: 10 }
                ];
                const totalWeight = assetsToLoad.reduce((sum, asset) => sum + asset.weight, 0);
                let completedWeight = 0;

                const markAssetAsLoaded = (assetName) => {
                    const asset = assetsToLoad.find(a => a.name === assetName);
                    if (asset) {
                        completedWeight += asset.weight;
                        const progress = (completedWeight / totalWeight) * 100;
                        this.updateLoadingProgress(progress);
                    }
                };
                
                const [relayRes, yamahokoRes, buildingAttrRes, keikanRes, kyomachiyaRes, bunkazaiRes] = await Promise.all([
                    fetch('Relay_point.json').finally(() => markAssetAsLoaded('Relay_point.json')),
                    fetch('yamahoko2.json').finally(() => markAssetAsLoaded('yamahoko2.json')),
                    fetch('../gion_asset/merged_merged_output.json').finally(() => markAssetAsLoaded('../gion_asset/merged_merged_output.json')),
                    fetch('../gion_asset/景観+彩る.json').finally(() => markAssetAsLoaded('../gion_asset/景観+彩る.json')),
                    fetch('../gion_asset/kyomachiya_kachizuke.json').finally(() => markAssetAsLoaded('kyomachiya_kachizuke.json')),
                    fetch('../gion_asset/bunkazai_kachizuke.json').finally(() => markAssetAsLoaded('bunkazai_kachizuke.json'))
                ]);

                if (!relayRes.ok) throw new Error(`Relay_point.json: ${relayRes.statusText}`);
                if (!yamahokoRes.ok) throw new Error(`yamahoko2.json: ${yamahokoRes.statusText}`);
                if (!buildingAttrRes.ok) throw new Error(`merged_merged_output.json: ${buildingAttrRes.statusText}`);
                if (!keikanRes.ok) throw new Error(`keikan_kachizuke.json: ${keikanRes.statusText}`);
                if (!kyomachiyaRes.ok) throw new Error(`kyomachiya_kachizuke.json: ${kyomachiyaRes.statusText}`);
                if (!bunkazaiRes.ok) throw new Error(`bunkazai_kachizuke.json: ${bunkazaiRes.statusText}`);
                
                const relayData = await relayRes.json();
                this.yamahokoData = await yamahokoRes.json();
                const buildingAttrData = await buildingAttrRes.json();
                const keikanData = await keikanRes.json();
                const kyomachiyaData = await kyomachiyaRes.json();
                const bunkazaiData = await bunkazaiRes.json();

                buildingAttrData.forEach(attr => {
                    const key = attr.sequential_id || attr.serial_number;
                    if (key) {
                        this.buildingAttributes[key] = attr;
                    }
                });

                keikanData.forEach(item => {
                    if (item.GML_ID) {
                        this.keikanData.set(item.GML_ID, item);
                        this.keikanGmlIds.add(item.GML_ID);
                    }
                });

                kyomachiyaData.forEach(item => {
                    if (item['GML ID']) {
                       this.kyomachiyaGmlIds.add(item['GML ID']);
                    }
                });
                
                bunkazaiData.forEach(item => {
                    if (item['GML ID']) {
                        this.bunkazaiData.set(item['GML ID'], item);
                        this.bunkazaiGmlIds.add(item['GML ID']);
                    }
                });

                relayData.forEach(p => {
                    if(p.location && p.location.x && p.location.y && p.location.z) {
                       this.relayPoints[p.name] = new THREE.Vector3(parseFloat(p.location.x), parseFloat(p.location.z), -parseFloat(p.location.y));
                    }
                });
                
                await this.loadAllModels()
                    .finally(() => {
                        markAssetAsLoaded('interactiveModels');
                        markAssetAsLoaded('otherModels');
                    });

                await this.loadSubCameraMap().finally(() => markAssetAsLoaded('subCameraMap'));
                
                await this.loadMapTiles().finally(() => markAssetAsLoaded('mapTiles'));
                
                this.setupSubCameras();
                this.initializeSceneObjects();
                this.setupUI();

                this.updateSceneToTime(this.SIMULATION_START_TIME_OFFSET_MS);

                console.log("Pre-compiling shaders...");
                this.renderer.compile(this.scene, this.camera);
                console.log("Shader pre-compilation complete.");

                this.updateLoadingProgress(100);
                
                setTimeout(() => {
                    const overlay = document.getElementById('loading-overlay');
                    overlay.style.opacity = '0';
                    setTimeout(() => {
                        overlay.style.display = 'none';
                    }, 500);
                }, 300);


                this.animationFrameId = requestAnimationFrame(this.animate.bind(this));

            } catch (error) {
                console.error('初期データ読み込みエラー:', error);
                const progressText = document.getElementById('progress-text');
                if(progressText) progressText.textContent = 'Error';
            }
        }
        
        async loadSubCameraMap() {
            if (this.subCameraMapGroup) {
                this.scene.remove(this.subCameraMapGroup);
            }
            this.subCameraMapGroup = new THREE.Group();
            this.subCameraMapGroup.name = "SubCameraMap";
            this.scene.add(this.subCameraMapGroup);

            const modelsToClone = [
                this.roadAsphaltModel,
                this.busBayModel,
                this.sidewalkModel,
                this.gutterModel,
                this.roadMarkingModel
            ];

            modelsToClone.forEach(model => {
                if (model) {
                    const clonedModel = model.clone();
                    clonedModel.visible = true;
                    this.subCameraMapGroup.add(clonedModel);
                }
            });
            
            if (this.roadAsphaltModel) {
                 console.log("Sub-camera map models cloned and set to visible.");
            } else {
                console.error("Road models for sub-camera not found. They might not have been loaded yet.");
            }
        }

                girlPromise,
                tranPromise,
                roadPromise,
                markingPromise,
                busBayPromise,
                gutterPromise,
                sidewalkPromise,
                Promise.all(yamahokoLoadPromises)
            ]);

            yamahokoResults.forEach(result => {
                if (result.status === 'fulfilled') {
                    const model = result.gltf.scene;
                    model.traverse(child => {
                        if (child.isMesh) {
                            child.material.clippingPlanes = this.clippingPlanes;
                            child.material.clipIntersection = false;
                        }
                    });
                    this.yamahokoModels.set(result.name, model);
                } else {
                    console.warn(`モデルの読み込みに失敗: ${result.name}.glb。立方体で代替します。`, result.reason);
                }
            });

            const loggedMeshNames = new Set();

            interactiveGltfs.forEach(gltf => {
                if(!gltf) return;
                const model = gltf.scene;
                model.traverse(object => {
                    if (object.isMesh && !loggedMeshNames.has(object.uuid)) {
                        console.log(`メッシュ名: ${object.name || '名前なし'} の属性一覧:`, Object.keys(object.geometry.attributes));
                        loggedMeshNames.add(object.uuid);
                    }
                });
            });

            interactiveGltfs.forEach(gltf => {
                if(!gltf) return;
                const model = gltf.scene;
                model.traverse(object => {
                    if (object.isMesh && object.geometry.attributes.uv) {
                        const uvAttribute = object.geometry.attributes.uv;
                        const vertexCount = uvAttribute.count;

                        const idArray = new Float32Array(vertexCount);
                        const isKeikanArray = new Float32Array(vertexCount).fill(0.0);
                        const isKyomachiyaArray = new Float32Array(vertexCount).fill(0.0);
                        const isBunkazaiArray = new Float32Array(vertexCount).fill(0.0);
                        
                        for (let i = 0; i < vertexCount; i++) {
                            const buildingId = Math.round(uvAttribute.getX(i));
                            idArray[i] = buildingId;

                            if (i < 10) {
                                console.log(`頂点[${i}]: U値 = ${uvAttribute.getX(i)}, 四捨五入後のID = ${buildingId}`);
                            }

                            const buildingAttr = this.buildingAttributes[buildingId];
                            if (buildingAttr) {
                                if (this.keikanGmlIds.has(buildingAttr.id)) isKeikanArray[i] = 1.0;
                                if (this.kyomachiyaGmlIds.has(buildingAttr.id)) {
                                    const height = parseFloat(buildingAttr.measuredHeight);
                                    if (!isNaN(height) && height < 10.0) isKyomachiyaArray[i] = 1.0;
                                }
                                if (this.bunkazaiGmlIds.has(buildingAttr.id)) isBunkazaiArray[i] = 1.0;
                            }
                        }
                        
                        object.geometry.setAttribute('_id', new THREE.BufferAttribute(idArray, 1));
                        object.geometry.setAttribute('isKeikan', new THREE.BufferAttribute(isKeikanArray, 1));
                        object.geometry.setAttribute('isKyomachiya', new THREE.BufferAttribute(isKyomachiyaArray, 1));
                        object.geometry.setAttribute('isBunkazai', new THREE.BufferAttribute(isBunkazaiArray, 1));
                        
                        object.material = this.customBuildingMaterial;
                        this.interactiveMeshes.push(object);
                    }
                });
                this.interactiveBuildingGroup.add(model);
            });
            this.scene.add(this.interactiveBuildingGroup);

            this._createAllBuildingLabels();
            
            if (girlGltf) {
                this.girlModel = girlGltf.scene;
                const box = new THREE.Box3().setFromObject(this.girlModel);
                const size = box.getSize(new THREE.Vector3());
                const scale = this.characterHeight / size.y;
                this.girlModel.scale.set(scale, scale, scale);
                this.girlModel.traverse(child => { if (child.isMesh) child.castShadow = true; });
                this.girlModel.visible = false;
                this.scene.add(this.girlModel);
                this.girlMixer = new THREE.AnimationMixer(this.girlModel);
                girlGltf.animations.forEach(clip => { this.girlActions[clip.name] = this.girlMixer.clipAction(clip); });
                if (this.girlActions['idle']) this.switchCharacterAnimation('idle');

                const helperGeo = new THREE.CylinderGeometry(this.characterRadius, this.characterRadius, this.characterHeight, 16);
                const helperMat = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true });
                this.characterCollisionHelper = new THREE.Mesh(helperGeo, helperMat);
                this.characterCollisionHelper.position.y = this.characterHeight / 2;
                this.characterCollisionHelper.visible = false;
                this.girlModel.add(this.characterCollisionHelper);
            }

            if (tranGltf) {
                this.walkableArea = tranGltf.scene;
                this.walkableAreaMaterial = new THREE.MeshBasicMaterial({ visible: false });
                this.walkableAreaHighlightMaterial = new THREE.MeshBasicMaterial({
                    color: 0xffff00,
                    transparent: true,
                    opacity: 0.4,
                    polygonOffset: true,
                    polygonOffsetFactor: -2.0,
                    polygonOffsetUnits: -1.0
                });

                this.walkableArea.position.y = 0.11;
                
                this.walkableArea.traverse(object => {
                    if (object.isMesh) {
                        object.material = this.walkableAreaMaterial;
                        this.walkableMeshes.push(object);
                    }
                });
                this.scene.add(this.walkableArea);
            }
            
            if (roadGltf) {
                this.roadAsphaltModel = roadGltf.scene;
                const asphaltMaterial = new THREE.MeshStandardMaterial({
                    color: 0x696969,
                    roughness: 0.8,
                    metalness: 0.1
                });
                this.roadAsphaltModel.traverse(child => {
                    if (child.isMesh) {
                        child.material = asphaltMaterial;
                    }
                });
                this.roadAsphaltModel.position.y = 0.01;
                this.roadAsphaltModel.rotation.y = 0;
                this.roadAsphaltModel.visible = false;
                this.scene.add(this.roadAsphaltModel);
            }
            const roadParts = [
                { modelGltf: busBayGltf,   prop: 'busBayModel',   color: 0x808080 },
                { modelGltf: sidewalkGltf, prop: 'sidewalkModel', color: 0xA9A9A9 },
                { modelGltf: gutterGltf,   prop: 'gutterModel',   color: 0xC0C0C0 },
                { modelGltf: markingGltf,  prop: 'roadMarkingModel', color: 0xFFFFFF },
            ];

            const roadPartYPosition = 0.11;

            roadParts.forEach(part => {
                if (part.modelGltf) {
                    this[part.prop] = part.modelGltf.scene;
                    const material = new THREE.MeshStandardMaterial({
                        color: part.color,
                        roughness: 0.8,
                        metalness: 0.1
                    });
                    this[part.prop].traverse(child => {
                        if (child.isMesh) {
                            child.material = material;
                        }
                    });
                    this[part.prop].position.y = roadPartYPosition;
                    this[part.prop].rotation.y = 0;
                    this[part.prop].visible = false;
                    this.scene.add(this[part.prop]);
                }
            });
            console.log('3Dモデル読み込み完了');
        }

                            default: infoHtml += `<b>${config.label}:</b> ${value}<br>`; break;

        _createAllBuildingLabels() {
            const buildingVertices = new Map();

            this.interactiveMeshes.forEach(mesh => {
                const idAttribute = mesh.geometry.attributes._id;
                const positionAttribute = mesh.geometry.attributes.position;
                const matrix = mesh.matrixWorld;

                for (let i = 0; i < idAttribute.count; i++) {
                    const buildingId = idAttribute.getX(i);
                    const buildingAttr = this.buildingAttributes[buildingId];
                    if (buildingAttr && (this.bunkazaiGmlIds.has(buildingAttr.id) || this.keikanGmlIds.has(buildingAttr.id) || this.kyomachiyaGmlIds.has(buildingAttr.id))) {
                        if (!buildingVertices.has(buildingId)) {
                            buildingVertices.set(buildingId, { vertices: [], gmlId: buildingAttr.id });
                        }
                        const vertex = new THREE.Vector3().fromBufferAttribute(positionAttribute, i);
                        vertex.applyMatrix4(matrix);
                        buildingVertices.get(buildingId).vertices.push(vertex);
                    }
                }
            });
            
            buildingVertices.forEach((data, buildingId) => {
                if (data.vertices.length === 0) return;

                let sumX = 0, sumZ = 0, maxY = -Infinity;
                data.vertices.forEach(v => { sumX += v.x; sumZ += v.z; maxY = Math.max(maxY, v.y); });

                const anchorPosition = new THREE.Vector3( sumX / data.vertices.length, maxY, sumZ / data.vertices.length );
                const clickHandler = (e) => { e.stopPropagation(); this._showLabelInfoPanel(data.gmlId, buildingId); };
                
                let labelCount = 0;
                const createLabel = (info) => {
                    const offset = new THREE.Vector3(labelCount * 20, 0, 0); 
                    labelCount++;
                    
                    const labelDiv = document.createElement('div');
                    labelDiv.className = info.css;
                    labelDiv.textContent = info.text;
                    labelDiv.dataset.name = info.name;
                    labelDiv.addEventListener('click', clickHandler);
                    document.body.appendChild(labelDiv);
                    this.buildingLabels.push({ position: anchorPosition.clone().add(offset), label: labelDiv, type: info.type, buildingId: buildingId });

                    const subLabelDiv = document.createElement('div');
                    subLabelDiv.className = `${info.css}-sub`;
                    subLabelDiv.textContent = info.text;
                    subLabelDiv.dataset.name = info.name;
                    subLabelDiv.addEventListener('click', clickHandler);
                    document.body.appendChild(subLabelDiv);
                    this.subCameraBuildingLabels.push({ position: anchorPosition.clone().add(offset), label: subLabelDiv, type: info.type, buildingId: buildingId });
                };

                const keikanInfo = this.keikanData.get(data.gmlId);
                if (keikanInfo && keikanInfo['表示名称']) {
                    createLabel({ type: 'keikan', text: '景', name: keikanInfo['表示名称'], css: 'keikan-label' });
                }
                
                const bunkazaiInfo = this.bunkazaiData.get(data.gmlId);
                if (bunkazaiInfo && bunkazaiInfo['名称']) {
                    createLabel({ type: 'bunkazai', text: '文', name: bunkazaiInfo['名称'], css: 'bunkazai-label' });
                }
                
                const attributes = this.buildingAttributes[buildingId];
                if (attributes && this.kyomachiyaGmlIds.has(data.gmlId)) {
                    const height = parseFloat(attributes.measuredHeight);
                    if (!isNaN(height) && height < 10.0) {
                        createLabel({ type: 'kyomachiya', text: '町', name: '京町家', css: 'kyomachiya-label' });
                    }
                }
            });
        }

        lonLatToTile(lon, lat, zoom) {
            const x = Math.floor((lon / 180 + 1) * Math.pow(2, zoom) / 2);
            const y = Math.floor((-Math.log(Math.tan((45 + lat / 2) * Math.PI / 180)) + Math.PI) * Math.pow(2, zoom) / (2 * Math.PI));
            return { x, y };
        }
        
        tileToLonLat(x, y, zoom) {
            const n = Math.pow(2, zoom);
            const lon_deg = x / n * 360.0 - 180.0;
            const lat_rad = Math.atan(Math.sinh(Math.PI * (1 - 2 * y / n)));
            const lat_deg = lat_rad * 180.0 / Math.PI;
            return { lon: lon_deg, lat: lat_deg };
        }

        async loadMapTiles() {
            if (this.mapGroup) {
                this.scene.remove(this.mapGroup);
                this.mapGroup.traverse(child => {
                    if (child.isMesh || child.isLine) {
                        if (child.geometry) child.geometry.dispose();
                        if (child.material) {
                            if (child.material.uniforms && child.material.uniforms.tMap.value) {
                                child.material.uniforms.tMap.value.dispose();
                            }
                            child.material.dispose();
                        }
                    }
                });
            }
            this.kodoInteractiveObjects = [];
            this.hoveredKodoPolygon = null;

            const newMapGroup = new THREE.Group();
            newMapGroup.name = "GroundMap";
            this.mapGroup = newMapGroup;
            this.scene.add(this.mapGroup);

            const centerMeters = this.wgs84_to_jgd2011.forward([this.MAP_CENTER_LON, this.MAP_CENTER_LAT]);

            const layerInfo = this.mapLayers[this.currentMapLayer];
            if (!layerInfo) {
                console.error(`レイヤー情報が見つかりません: ${this.currentMapLayer}`);
                return;
            }
            
            this._updateBuildingModelsVisibility(this.currentMapLayer);
            const textureLoader = new THREE.TextureLoader();

            try {
                if (this.currentMapLayer === 'kodo') {
                    await this._loadRoadGeojsonIfNeeded();

                    const [districtData] = await Promise.all([
                        fetch('../gion_asset/用途地域＋高度地区.geojson').then(res => res.json())
                    ]);
                    const roadData = this.roadGeojsonData;

                    const roadVertices = [];
                    roadData.features.forEach(feature => {
                        if (!feature.geometry || feature.geometry.type !== 'MultiLineString') return;
                        feature.geometry.coordinates.forEach(lineCoords => {
                            for (let i = 0; i < lineCoords.length - 1; i++) {
                                const startCoord = lineCoords[i];
                                const endCoord = lineCoords[i + 1];
                                roadVertices.push(startCoord[0] - centerMeters[0], 0.3, -(startCoord[1] - centerMeters[1]));
                                roadVertices.push(endCoord[0] - centerMeters[0], 0.3, -(endCoord[1] - centerMeters[1]));
                            }
                        });
                    });
                    const roadGeometry = new THREE.BufferGeometry();
                    roadGeometry.setAttribute('position', new THREE.Float32BufferAttribute(roadVertices, 3));
                    const roadMaterial = new THREE.LineBasicMaterial({ color: 0x808080 });
                    const roadLineSegments = new THREE.LineSegments(roadGeometry, roadMaterial);
                    this.mapGroup.add(roadLineSegments);

                    const colorMap = {
                        '12m 第1種高度地区': new THREE.Color(0xADD8E6), '12m 第2種高度地区': new THREE.Color(0xADD8E6),
                        '12m 第3種高度地区': new THREE.Color(0xADD8E6), '12m 第4種高度地区': new THREE.Color(0xADD8E6), 
                        '15m 第1種高度地区': new THREE.Color(0x00BFFF), '15m 第2種高度地区': new THREE.Color(0x00BFFF),
                        '15m 第3種高度地区': new THREE.Color(0x00BFFF), '15m 第4種高度地区': new THREE.Color(0x00BFFF),
                        '20m 第1種高度地区': new THREE.Color(0xFFFF00), '20m 第2種高度地区': new THREE.Color(0xFFFF00),
                        '20m 第3種高度地区': new THREE.Color(0xFFFF00), '20m 第4種高度地区': new THREE.Color(0xFFFF00),
                        '25m 高度地区': new THREE.Color(0xEE7800), '31m 第1種高度地区': new THREE.Color(0xFFC0CB)
                    };

                    districtData.features.forEach(feature => {
                        if (!feature.geometry || !feature.properties['高度_1']) return;
                        const material = new THREE.MeshBasicMaterial({
                            color: colorMap[feature.properties['高度_1']] || 0xCCCCCC,
                            side: THREE.DoubleSide, transparent: true, opacity: 0.5
                        });

                        polygons.forEach(polygonCoords => {
                            try {
                                const shape = new THREE.Shape();
                                const outerRing = polygonCoords[0];
                                if (!outerRing || outerRing.length < 3) return;

                                shape.moveTo(outerRing[0][0] - centerMeters[0], outerRing[0][1] - centerMeters[1]);
                                outerRing.slice(1).forEach(coord => shape.lineTo(coord[0] - centerMeters[0], coord[1] - centerMeters[1]));
                                
                                polygonCoords.slice(1).forEach(holeRing => {
                                    if (!holeRing || holeRing.length < 3) return;
                                    const holePath = new THREE.Path();
                                    holePath.moveTo(holeRing[0][0] - centerMeters[0], holeRing[0][1] - centerMeters[1]);
                                    holeRing.slice(1).forEach(coord => holePath.lineTo(coord[0] - centerMeters[0], coord[1] - centerMeters[1]));
                                    shape.holes.push(holePath);
                                });

                                const geometry = new THREE.ShapeGeometry(shape);
                                const mesh = new THREE.Mesh(geometry, material);
                                mesh.position.y = 0.1; 
                                mesh.rotation.x = -Math.PI / 2;
                                this.mapGroup.add(mesh);
                                
                                mesh.userData.originalColor = material.color.clone();

                                const lineMaterial = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 });
                                const wireframe = new THREE.LineSegments(new THREE.EdgesGeometry(geometry), lineMaterial);
                                wireframe.position.copy(mesh.position);
                                wireframe.rotation.copy(mesh.rotation);
                                wireframe.position.y += 0.1;
                                this.mapGroup.add(wireframe);

                                const centroid = new THREE.Vector3();
                                geometry.boundingBox.getCenter(centroid);
                                const originalDistrictName = feature.properties['高度_1'];
                                if (originalDistrictName) {
                                    const labelText = this._formatKodoDistrictName(originalDistrictName);
                                    const labelGroup = this._createDistrictLabel(labelText, { fontsize: 200, scale: 4});
                                    labelGroup.position.set(centroid.x, 40, -centroid.y); 
                                    labelGroup.name = 'district_label_group';
                                    labelGroup.layers.set(2);
                                    
                                    this.mapGroup.add(labelGroup);
                                    
                                    labelGroup.userData.polygonMesh = mesh;
                                    this.kodoInteractiveObjects.push(labelGroup.children[0]);
                                }

                            } catch (e) { console.warn("ポリゴンの生成に失敗しました:", e); }
                        });
                    });

                } else if (this.currentMapLayer === 'youto') {
                    
                    await this._loadRoadGeojsonIfNeeded();

                    const [districtData] = await Promise.all([
                        fetch('../gion_asset/用途地域＋高度地区.geojson').then(res => res.json())
                    ]);
                    const roadData = this.roadGeojsonData;

                    const roadVertices = [];
                    roadData.features.forEach(feature => {

                    const centerTile = this.lonLatToTile(this.MAP_CENTER_LON, this.MAP_CENTER_LAT, this.MAP_ZOOM_LEVEL);
                    const tileSideMetersApprox = (Math.cos(this.MAP_CENTER_LAT * Math.PI / 180) * 2 * Math.PI * 6378137) / Math.pow(2, this.MAP_ZOOM_LEVEL);
                    const tileOffset = Math.ceil((this.SKY_DOME_RADIUS) / tileSideMetersApprox);
                    
                    const promises = [];
                    for (let i = -tileOffset; i <= tileOffset; i++) {
                        for (let j = -tileOffset; j <= tileOffset; j++) {
                            const tileX = centerTile.x + i, tileY = centerTile.y + j;
                            const tileUrl = layerInfo.url.replace('{z}', this.MAP_ZOOM_LEVEL).replace('{x}', tileX).replace('{y}', tileY);
                            
                            const promise = textureLoader.loadAsync(tileUrl).then(texture => {

                                const vertices = new Float32Array([
                                    v0_jgd[0] - centerMeters[0], 0, -(v0_jgd[1] - centerMeters[1]),
                                    v1_jgd[0] - centerMeters[0], 0, -(v1_jgd[1] - centerMeters[1]),
                                    v2_jgd[0] - centerMeters[0], 0, -(v2_jgd[1] - centerMeters[1]),
                                    v3_jgd[0] - centerMeters[0], 0, -(v3_jgd[1] - centerMeters[1])
                                ]);
                                
                                const geometry = new THREE.BufferGeometry();
                                geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
                                geometry.setAttribute('uv', new THREE.BufferAttribute(new Float32Array([0, 1, 0, 0, 1, 1, 1, 0]), 2));
                                geometry.setIndex(new THREE.BufferAttribute(new Uint16Array([0, 1, 2, 2, 1, 3]), 1));
                                
                                const material = new THREE.ShaderMaterial({
                                    vertexShader: document.getElementById('mapTileVertexShader').textContent,
                                    fragmentShader: document.getElementById('mapTileFragmentShader').textContent,
                                    uniforms: { tMap: { value: texture }, uRadius: { value: this.SKY_DOME_RADIUS }, uFadeDistance: { value: 300.0 }},
                                    transparent: true
                                });
                                const plane = new THREE.Mesh(geometry, material);
                                this.mapGroup.add(plane);
                            }).catch(err => {});
                            promises.push(promise);
                        }
                    }
                    await Promise.all(promises);
                }
            } catch (err) {
                console.error(`地図レイヤー '${this.currentMapLayer}' の読み込み中にエラー:`, err);
            }

        _createDistrictLabel(message, options = {}) {
            const { fontface = 'Arial', textColor = '#000000', backgroundColor = 'rgba(255, 255, 255, 0.7)', borderRadius = 20, padding = 20, scale = 4 } = options;

            let fontsize;
            if (options.fontsize) {
                fontsize = options.fontsize;
            } else {
                fontsize = 120;
                if (message.length > 8) fontsize = 70;
                else if (message.length > 4) fontsize = 90;
            }

            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            context.font = `Bold ${fontsize}px ${fontface}`;

            const metrics = context.measureText(message);
            const textWidth = metrics.width;
            const textHeight = fontsize;

            const backgroundWidth = textWidth + padding * 2;
            const backgroundHeight = textHeight + padding * 2;

            canvas.width = backgroundWidth;
            canvas.height = backgroundHeight;

            context.font = `Bold ${fontsize}px ${fontface}`;
            context.textAlign = 'center';
            context.textBaseline = 'middle';

            context.fillStyle = backgroundColor;
            context.beginPath();
            context.moveTo(borderRadius, 0);
            context.lineTo(canvas.width - borderRadius, 0);
            context.arcTo(canvas.width, 0, canvas.width, borderRadius, borderRadius);
            context.lineTo(canvas.width, canvas.height - borderRadius);
            context.arcTo(canvas.width, canvas.height, canvas.width - borderRadius, canvas.height, borderRadius);
            context.lineTo(borderRadius, canvas.height);
            context.arcTo(0, canvas.height, 0, canvas.height - borderRadius, borderRadius);
            context.lineTo(0, borderRadius);
            context.arcTo(0, 0, borderRadius, 0, borderRadius);
            context.closePath();
            context.fill();

            context.fillStyle = textColor;
            context.fillText(message, canvas.width / 2, canvas.height / 2);

            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearFilter;
            const textMaterial = new THREE.MeshBasicMaterial({
                map: texture,
                transparent: true,
            });

            const textPlaneWidth = backgroundWidth / scale;
            const textPlaneHeight = backgroundHeight / scale;
            const textGeometry = new THREE.PlaneGeometry(textPlaneWidth, textPlaneHeight);
            const textMesh = new THREE.Mesh(textGeometry, textMaterial);

            const group = new THREE.Group();
            group.add(textMesh);

            return group;
        }


        _formatKodoDistrictName(originalName) {
            if (!originalName) return '';
            const meterMatch = originalName.match(/^(\d+m)/);
            const typeMatch = originalName.match(/第(\d)種/);
            const meterPart = meterMatch ? meterMatch[1] : null;
            const typePart = typeMatch ? typeMatch[1] : null;
            if (meterPart && typePart) return `${meterPart}-${typePart}`;
            if (meterPart) return meterPart;
            return originalName;
        }

        setupSubCameras() {

                if (data.type !== 'chase') {
                     if (index === 0) {

                            );
                            subCamera.lookAt(new THREE.Vector3(
                                subCamera.position.x - 1,

                                subCamera.position.z - 1
                            ));

                            console.warn('「四条河原町」の座標が見つかりません。');

        _updateLabelVisibility() {
            const allLabels = [...this.buildingLabels, ...this.subCameraBuildingLabels];
            allLabels.forEach(item => item.label.style.display = 'none');

            if (this.activeSearchModes.size === 0) return;

            const groupedLabels = new Map();
            allLabels.forEach(item => {
                const key = item.position.toArray().join(',');
                if (!groupedLabels.has(key)) {
                    groupedLabels.set(key, []);
                }
                groupedLabels.get(key).push(item);
            });

            groupedLabels.forEach(group => {
                let visibleLabel = null;
                if (this.activeSearchModes.has('keikan') && group.some(l => l.type === 'keikan')) {
                    visibleLabel = group.find(l => l.type === 'keikan');
                } else if (this.activeSearchModes.has('bunkazai') && group.some(l => l.type === 'bunkazai')) {
                    visibleLabel = group.find(l => l.type === 'bunkazai');
                } else if (this.activeSearchModes.has('kyomachiya') && group.some(l => l.type === 'kyomachiya')) {
                    visibleLabel = group.find(l => l.type === 'kyomachiya');
                }
                
                if (this.activeSearchModes.size > 1) {
                     if (visibleLabel) visibleLabel.label.style.display = 'block';
                } else {
                     group.forEach(labelItem => {
                         if(this.activeSearchModes.has(labelItem.type)) {
                             labelItem.label.style.display = 'block';
                         }
                     });
                }
            });
        }
