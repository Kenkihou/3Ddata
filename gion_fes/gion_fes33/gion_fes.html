<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>祇園祭 山鉾巡行シミュ33</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
        }
    }
    </script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.11.0/proj4.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>

<style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: white;
            font-family: 'メイリオ', Meiryo, sans-serif;
            -webkit-text-size-adjust: 100%;
        }
        canvas.webgl-canvas {
            display: block; 
            position: fixed;
            top: 0;
            left: 0;
            outline: none;
            z-index: 1; 
        }

        /* ▼▼▼ 新ロジックのラベルCSSを追加 ▼▼▼ */
        .yamaboko-label {
            /* 基本スタイル（通常時） */
            background-color: rgba(255, 255, 255, 0.75);
            color: black; 
            padding: 4px 6px;
            border-radius: 4px; 
            font-family: "Helvetica", "Arial", sans-serif; 
            font-weight: bold;
            font-size: 14px; 
            /* 縦書き設定 */
            writing-mode: vertical-rl; 
            text-orientation: upright; 
            white-space: nowrap;
            transition: background-color 0.3s, color 0.3s;
        }

        /* イベントごとのスタイル */
        .yamaboko-label.event-kuji-aratame {
            background-color: #2196F3; /* 水色 */
            color: white;
        }
        .yamaboko-label.event-shimenawa-kiri {
            background-color: #F44336; /* 朱色 */
            color: white;
        }
        .yamaboko-label.event-tsujimawashi {
            background-color: #FF9800; /* オレンジ */
            color: white;
        }
        .waypoint-label {
            color: white; background-color: rgba(0, 0, 0, 0.6); padding: 3px 10px;
            border-radius: 10px; font-family: monospace; font-size: 16px; font-weight: bold;
        }
        .kuji-aratame-label, .shimenawa-kiri-label, .tsujimawashi-label {
            color: white; padding: 5px 10px; border-radius: 8px; position: relative;
            font-size: 14px; font-weight: bold; white-space: nowrap;
        }
        .kuji-aratame-label { background: #2196F3; }
        .shimenawa-kiri-label { background: #F44336; }
        .tsujimawashi-label { background: #FF9800; }
        .kuji-aratame-label::after, .shimenawa-kiri-label::after, .tsujimawashi-label::after {
            content: ''; position: absolute; bottom: 0; left: 50%; width: 0; height: 0;
            border: 8px solid transparent; border-bottom: 0; margin-left: -8px; margin-bottom: -8px;
        }
        .kuji-aratame-label::after { border-top-color: #2196F3; }
        .shimenawa-kiri-label::after { border-top-color: #F44336; }
        .tsujimawashi-label::after { border-top-color: #FF9800; }
        /* ▲▲▲ 新ロジックのラベルCSS ▲▲▲ */
        .label-flex-container {
            display: flex;
            flex-direction: column; /* 要素を縦に積む */
            align-items: center;    /* 中央揃えにする */
            gap: 8px;               /* ロゴと名前の間の隙間 */
            pointer-events: none;   /* コンテナ自体はクリックできないようにする */
        }

        /* コンテナの中身（ロゴやラベル）はクリックできるようにする */
        .label-flex-container > div {
            pointer-events: auto;
        }
        .logo-stack-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px; /* 団子（ロゴ）間の隙間 */
        }
        /* ロゴは普段は非表示にしておくためのクラス */
        .youtube-bubble-wrapper {
            display: none; /* この display プロパティをJSで切り替える */
        }
        #sub-camera-controls {
            pointer-events: none; /* コンテナ自体はマウス操作を透過させる */
        }
        #sub-camera-switch-btn {
            pointer-events: auto;  /* 中のボタンだけマウス操作を受け付ける */
        }

        .map-select-btn {
            width: 100%;
            padding: 8px;
            background-color: #555;
            color: white;
            border: 1px solid #777;
            cursor: pointer;
            text-align: left;
            border-radius: 4px;
        }
        .map-select-btn.active {
            background-color: #007bff;
            border-color: #007bff;
        }

        #css3d-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 2;
        }

        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: black; display: flex; justify-content: center;
            align-items: center; z-index: 9999;
            transition: opacity 0.5s ease;
            flex-direction: column;
        }
        #progress-container {
            position: relative;
            width: 160px;
            height: 160px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #progress-circle {
            position: absolute;
        }
        .progress-background, .progress-bar {
            fill: none;
            stroke-width: 12;
        }
        .progress-background {
            stroke: #444;
        }
        .progress-bar {
            stroke: #ffc107;
            stroke-linecap: round;
            stroke-dasharray: 439.82;
            stroke-dashoffset: 439.82;
            transition: stroke-dashoffset 0.3s ease, stroke 0.3s ease;
        }
        #progress-text {
            color: white;
            font-size: 2em;
            font-family: 'Inter', sans-serif;
            font-weight: bold;
        }

        .ui-panel {
            color: white; background-color: rgba(50, 50, 50, 0.7);
            padding: 10px 15px; border-radius: 5px; 
        }
        
        #top-left-controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 102;
            display: flex;
            flex-direction: row;
            gap: 10px;
        }
        
        .control-container {
            position: relative;
        }

        .top-bar-btn {
            padding: 8px 15px;
            background-color: rgba(50, 50, 50, 0.7);
            color: white;
            border: 1px solid #888;
            cursor: pointer;
            flex-shrink: 0;
            white-space: nowrap;
            border-radius: 5px;
            font-size: 0.9em;
        }

        .top-bar-btn:hover {
            background-color: rgba(80, 80, 80, 0.8);
        }

        .top-bar-btn.active {
            background-color: #007bff;
            border-color: #0056b3;
        }

        #building-search-content-wrapper,
        #map-content-wrapper,
        #visibility-content-wrapper {
            display: none;
        }
        
        .close-btn {
            position: absolute;
            top: 5px;
            right: 10px;
            font-size: 1.8em;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
            color: #fff;
        }
        .close-btn:hover {
            color: #ffcccc;
        }
        
        #camera-info-display {
            position: absolute; 
            bottom: 10px;
            right: 10px;
            width: auto;
            z-index: 100;
            font-family: monospace;
            font-size: 0.9em;
            line-height: 1.4;
            white-space: pre;
        }

        #time-display {
            position: absolute;
            top: 55px;
            left: 10px;
            padding: 5px 10px;
            font-size: 1.2em;
            font-family: monospace;
            z-index: 102;
        }

        .bunkazai-label, .bunkazai-label-sub,
        .keikan-label, .keikan-label-sub,
        .kyomachiya-label, .kyomachiya-label-sub {
            position: absolute;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.9em;
            font-weight: bold;
            transform: translate(-50%, -150%);
            pointer-events: auto;
            z-index: 98;
            cursor: pointer;
            display: none;
        }

        .bunkazai-label-sub, .keikan-label-sub, .kyomachiya-label-sub {
            font-size: 0.7em;
            z-index: 3;
        }

        .bunkazai-label, .bunkazai-label-sub {
            color: #3e2723;
            background-color: rgba(255, 224, 178, 0.85);
            border: 1px solid #a1887f;
        }
        .keikan-label, .keikan-label-sub {
            color: #e1bee7;
            background-color: rgba(74, 20, 140, 0.85);
            border: 1px solid #e1bee7;
        }
        .kyomachiya-label, .kyomachiya-label-sub {
            color: #1b5e20;
            background-color: rgba(200, 230, 201, 0.85);
            border: 1px solid #1b5e20;
        }

        .bunkazai-label::after, .bunkazai-label-sub::after,
        .keikan-label::after, .keikan-label-sub::after,
        .kyomachiya-label::after, .kyomachiya-label-sub::after {
            content: attr(data-name);
            position: absolute;
            bottom: 120%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #333;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.9em;
            white-space: nowrap;
            display: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
        }

        .bunkazai-label:hover::after, .bunkazai-label-sub:hover::after,
        .keikan-label:hover::after, .keikan-label-sub:hover::after,
        .kyomachiya-label:hover::after, .kyomachiya-label-sub:hover::after {
            display: block;
            opacity: 1;
        }


        #controls-container {
            position: absolute;
            bottom: 60px;
            left: 50%;
            width: 70%;
            max-width: 600px;
            transform: translateX(-50%);
            background-color: transparent;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 5px;
            z-index: 101;
            height: auto;
            box-sizing: border-box;
        }
        #playPauseBtn {
            padding: 5px 15px;
            font-size: 1.2em;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
            box-sizing: border-box; 
            flex-shrink: 0;
            background-color: rgba(50, 50, 50, 0.7);
            border: 1px solid #888;
            border-radius: 5px;
            color: white;
        }
        #seek-container { 
            position: relative; 
            width: 100%; 
            height: 40px; 
            background-color: rgba(50, 50, 50, 0.7);
            padding: 0 15px;
            border-radius: 10px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
        }
        #seekBar { width: 100%; cursor: pointer; margin: 0; }
        
        #seekBar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            background: #2196F3;
            cursor: pointer;
            border-radius: 50%;
            border: 2px solid white;
        }

        #seekBar::-moz-range-thumb {
            width: 24px;
            height: 24px;
            background: #2196F3;
            cursor: pointer;
            border-radius: 50%;
            border: 2px solid white;
        }

        #slider-ticks-container {
            position: absolute;
            top: 50%;
            left: 12px; /* ← 青丸の半径分(24px / 2)だけ右にずらす */
            width: calc(100% - 24px); /* ← 青丸の直径分(24px)だけ幅を狭める */
            height: 10px;
            transform: translateY(-50%);
            pointer-events: none;
            display: flex;
            justify-content: space-between;
        }
        .slider-tick {
            position: absolute;
            width: 2px;
            height: 100%;
            background-color: #000000;
            transform: translateX(-50%);
        }

        #map-content-wrapper h4,
        #building-search-content-wrapper legend {
            color: white;
        }

        #map-content-wrapper .button-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        #building-search-content-wrapper fieldset {
            border: 1px solid #777;
            border-radius: 4px;
            padding: 10px;
        }
        
        #building-search-content-wrapper div {
            margin-bottom: 5px;
        }
        #building-search-content-wrapper label {
            margin-left: 5px;
            cursor: pointer;
        }

        .visibility-item { 
            display: grid; 
            grid-template-columns: 1fr auto; 
            align-items: center; 
            width: 100%; 
            gap: 5px; 
        }
        .name-container { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        .rank-column { 
            width: 110px; 
            flex-shrink: 0; 
        }
        .visibility-toggle-btn { width: 60px; flex-shrink: 0; }
        #master-visibility-controls { display: flex; gap: 10px; width: 100%; margin-bottom: 8px; }
        .master-btn { width: 100%; background-color: #555; color: white; border: 1px solid #777; cursor: pointer; }
        .name-column { color: white; }

        #sub-camera-label {
            position: fixed;
            left: 5px; 
            transform: none; 
            bottom: 288px;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 0.9em;
            z-index: 6;
            pointer-events: none;
            white-space: nowrap;
        }

        #sub-camera-controls {
            position: fixed;
            left: 240px; 
            bottom: 282px; 
            z-index: 7;
        }
        #sub-camera-switch-btn {
            padding: 4px 10px;
            font-size: 0.8em;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: 1px solid #fff;
            border-radius: 5px;
            cursor: pointer;
        }
        #sub-camera-switch-btn:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }
        #camera-select-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.3s ease;
        }
        #viewpoint-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6); display: flex;
            justify-content: center; align-items: center; z-index: 1000;
            transition: opacity 0.3s ease;
        }
        #viewpoint-modal.modal-hidden {
            opacity: 0;
            pointer-events: none;
        }
        #viewpoint-list {
            list-style: none; padding: 0; margin-top: 15px;
        }
        #viewpoint-list li {
            padding: 12px; border-bottom: 1px solid #555;
            cursor: pointer; transition: background-color 0.2s;
        }
        #viewpoint-list li:hover { background-color: #555; }
        #viewpoint-list li:last-child { border-bottom: none; }
        #camera-select-modal.modal-hidden {
            opacity: 0;
            pointer-events: none;
        }
        .modal-content {
            background-color: #333;
            color: white;
            padding: 20px 25px;
            border-radius: 10px;
            /* ▼▼▼ 変更点1: 横幅を広げる ▼▼▼ */
            width: 550px;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .modal-close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 1.8em;
            line-height: 1;
            cursor: pointer;
        }
        .modal-close-btn:hover {
            color: #ffcccc;
        }
        #camera-select-list {
            list-style: none;
            padding: 0;
            margin-top: 15px;
            /* ▼▼▼ 変更点2: グリッドレイアウトに変更 ▼▼▼ */
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }
        #camera-select-list li {
            padding: 12px;
            /* ▼▼▼ 変更点3: 下線を削除し、見た目を調整 ▼▼▼ */
            border-bottom: none;
            cursor: pointer;
            transition: background-color 0.2s;
            border-radius: 4px;
            text-align: center;
        }
        #camera-select-list li:hover {
            background-color: #555;
        }
        #camera-select-list li:last-child {
            border-bottom: none;
        }
        #sync-setting-container {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #555;
            display: flex;
            align-items: center;
            font-size: 0.9em;
        }
        #sync-setting-container input {
            margin-right: 8px;
        }
        #dynamic-loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 10000;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            font-family: 'メイリオ', Meiryo, sans-serif;
        }
        .spinner {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #ffc107;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }

        #dynamic-loading-text {
            margin-top: 20px;
            font-size: 1.2em;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #info-overlay, #panel-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #info-overlay.visible, #panel-overlay.visible {
            opacity: 1;
            pointer-events: all;
        }

        .info-overlay-content, .panel-overlay-content {
            background-color: rgba(40, 40, 40, 0.9);
            color: white;
            padding: 25px;
            border-radius: 10px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            line-height: 1.8;
            font-size: 1.1em;
        }
        .panel-overlay-content {
            max-width: 320px;
            font-size: 1em;
        }

        .info-overlay-close-btn, .panel-overlay-close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 2em;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
            color: #fff;
        }
        .info-overlay-close-btn:hover, .panel-overlay-close-btn:hover {
            color: #ffcccc;
        }

        #joystick-area-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 180px;
            height: 180px;
            z-index: 102;
            display: none; /* 初期状態では非表示にする */
        }

        #joystick-wrapper {
            position: absolute;
            top: 30px; /* (180px - 120px) / 2 */
            left: 30px; /* (180px - 120px) / 2 */
            width: 120px;
            height: 120px;
            touch-action: none;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            z-index: 103;
            display: none;
        }

        #compass-container {
            position: absolute;
            top: 5px; /* (180px - 170px) / 2 */
            left: 5px; /* (180px - 170px) / 2 */
            width: 170px;
            height: 170px;
            pointer-events: none;
            display: none;
        }

        .compass-label {
            position: absolute;
            color: white;
            background-color: rgba(0, 0, 0, 0.4);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            line-height: 30px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }
        .compass-label span {
            display: inline-block; /* transform(回転)を正しく適用するために必要 */
        }
        #compass-n { top: 0; left: 50%; transform: translateX(-50%); }
        #compass-s { bottom: 0; left: 50%; transform: translateX(-50%); }
        #compass-e { top: 50%; right: 0; transform: translateY(-50%); }
        #compass-w { top: 50%; left: 0; transform: translateY(-50%); }

        .video-modal {
            display: none; /* 初期状態では非表示 */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            z-index: 11000;
            justify-content: center;
            align-items: center;
        }

        #video-modal-content {
            position: relative;
            background-color: #181818;
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 800px; /* YouTubeの表示幅に合わせて調整 */
        }
        
        #video-modal-close-btn {
            position: absolute;
            top: -10px;
            right: -10px;
            width: 30px;
            height: 30px;
            background: white;
            color: black;
            border-radius: 50%;
            text-align: center;
            line-height: 30px;
            font-size: 1.5em;
            font-weight: bold;
            cursor: pointer;
            border: 2px solid black;
        }

        #youtube-player-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9のアスペクト比を維持 */
        }

        #youtube-player-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .youtube-bubble {
            position: relative; /* ← この一行を追加 */
            background-color: white;
            border-radius: 50%; /* 円形にする */
            padding: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 40px; /* ロゴのサイズに合わせて調整 */
            height: 40px;
            transition: transform 0.2s ease; /* ホバー時のアニメーション */
        }
        .youtube-bubble.youtube-bubble-keikan {
            /* 景観ラベルと同じ紫色 */
            background-color: rgba(74, 20, 140, 0.85); 
        }
        .youtube-bubble.youtube-bubble-keikan::after {
            /* 吹き出しのしっぽも同じ色に */

            border-top-color: rgba(255, 224, 178, 0.85);
        }

        /* 吹き出しのツールチップ（名称表示）スタイル */
        .youtube-bubble::before {
            content: attr(data-name);
            position: absolute;
            bottom: 120%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #333;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.9em;
            white-space: nowrap;
            display: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
        }
        /* 吹き出しにマウスカーソルが乗った時にツールチップを表示 */
        .youtube-bubble:hover::before {
            display: block;
            opacity: 1;
        }

        /* マウスを乗せたときに少し大きくする */
        .youtube-bubble:hover {
            transform: scale(1.1);
        }

        .youtube-bubble a {
            display: block;
        }

        .youtube-bubble img {
            width: 32px; /* 円の中に収まるように調整 */

        }

        /* 吹き出しのしっぽ部分 */
        .youtube-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px; /* 吹き出しの下にくっつける */
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 8px 0;

    <script id="vertexShader" type="x-shader/x-vertex">
        attribute float _id;
        attribute float isKeikan;
        attribute float isKyomachiya;
        attribute float isBunkazai;
        varying vec3 vNormal;
        varying float vBuildingID;
        varying vec3 vWorldPosition;
        varying float vIsKeikan;
        varying float vIsKyomachiya;
        varying float vIsBunkazai;
        
        void main() {
            vBuildingID = _id;
            vIsKeikan = isKeikan;
            vIsKyomachiya = isKyomachiya;
            vIsBunkazai = isBunkazai;
            vNormal = normalize(normalMatrix * normal);
            vWorldPosition = (modelMatrix * vec4(position, 1.0)).xyz;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    </script>
    <script id="fragmentShader" type="x-shader/x-fragment">
        varying float vBuildingID;
        varying vec3 vNormal;
        varying vec3 vWorldPosition;
        varying float vIsKeikan;
        varying float vIsKyomachiya;
        varying float vIsBunkazai;

        uniform float uSelectedID;
        uniform vec3 uBaseColor;
        uniform vec3 uHighlightColor;
        
        void main() {
            if (vWorldPosition.z > 800.0 || vWorldPosition.z < -800.0 || vWorldPosition.x < -1050.0 || vWorldPosition.x > 950.0) {
                discard;
            }

            vec3 baseColor = uBaseColor;
            if (vIsKeikan > 0.5) {
                baseColor = vec3(0.65, 0.55, 0.85); // 景観（紫）
            } else if (vIsBunkazai > 0.5) {
                baseColor = vec3(0.6, 0.4, 0.2);   // 文化財（茶色）
            } else if (vIsKyomachiya > 0.5) {
                baseColor = vec3(0.4, 0.8, 0.4);   // 京町家（緑）
            }

            vec3 finalColor = baseColor;
            if (vBuildingID > 0.0 && vBuildingID == uSelectedID) {
                finalColor = uHighlightColor;
            }

            vec3 lightDirection = normalize(vec3(0.5, 1.0, 0.75));
            float ambientLight = 0.4;
            float diffuse = max(dot(vNormal, lightDirection), 0.0);
            float brightness = ambientLight + (1.0 - ambientLight) * diffuse;
            vec3 lightedColor = finalColor * brightness;
            
            gl_FragColor = vec4(lightedColor, 1.0);
        }
    </script>

    <script id="skyVertexShader" type="x-shader/x-vertex">
        varying vec3 vWorldPosition;
        void main() {
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            gl_Position = projectionMatrix * mvPosition;
            gl_Position.z = gl_Position.w; 
            vWorldPosition = position;
        }
    </script>
    <script id="skyFragmentShader" type="x-shader/x-fragment">
        varying vec3 vWorldPosition;
        uniform vec3 uTopColor;
        uniform vec3 uBottomColor;

        void main() {
            float h = normalize(vWorldPosition).y;
            float t = (h + 1.0) / 2.0;
            vec3 finalColor = mix(uBottomColor, uTopColor, smoothstep(0.5, 0.7, t));
            float alpha = smoothstep(0.5, 0.55, t);
            gl_FragColor = vec4(finalColor, alpha);
        }
    </script>

    <script id="mapTileVertexShader" type="x-shader/x-vertex">
        varying vec2 vUv;
        varying vec3 vWorldPosition;
        void main() {
            vUv = uv;
            vec4 worldPosition = modelMatrix * vec4(position, 1.0);
            vWorldPosition = worldPosition.xyz;
            gl_Position = projectionMatrix * viewMatrix * worldPosition;
        }
    </script>
    <script id="mapTileFragmentShader" type="x-shader/x-fragment">
        varying vec2 vUv;
        varying vec3 vWorldPosition;

        uniform sampler2D tMap;
        uniform float uRadius;
        uniform float uFadeDistance;

        void main() {
            float dist = length(vWorldPosition.xz);
            float alpha = smoothstep(uRadius, uRadius - uFadeDistance, dist);

            if (alpha < 0.01) {
                discard;
            }

            vec4 texColor = texture2D(tMap, vUv);
            gl_FragColor = vec4(texColor.rgb, texColor.a * alpha);
        }
    </script>

            if (this.circleCircumference === 0) {
                const radius = progressBar.r.baseVal.value;
                this.circleCircumference = 2 * Math.PI * radius;
                progressBar.style.strokeDasharray = this.circleCircumference;
            }
            const offset = this.circleCircumference - (this.loadingProgress / 100) * this.circleCircumference;
            progressBar.style.strokeDashoffset = offset;
            if (this.loadingProgress < 40) progressBar.style.stroke = '#ffc107';

                            // displayTypeが 'timed' の場合、最初は非表示にしておく
                            if (item.displayType === 'timed') {
                                logoObject.visible = false;
                            }
                            
                            this.scene.add(logoObject);

                            // animateループで処理するために情報を保存
                            this.fixedPointVideoMarkers.push({
                                logo: logoObject,
                                displayType: item.displayType,
                                startTime: timeToSeconds(item.startTime),
                                endTime: timeToSeconds(item.endTime)
                            });
                        } else {
                            console.warn(`Waypoint not found for fixed video: ${item.placeName}`);
                        }
                    });
                }
                // ▲▲▲ 変更ここまで ▲▲▲

                const waypointsToShow = ['四条新町', '四条堺町', '四条河原町', '河原町御池', '新町御池', '四条烏丸', '河原町三条'];
                this.allWaypoints.forEach((pos, name) => {
                    if (waypointsToShow.includes(name)) {
                        const label = this._createCSSLabel(name, "waypoint-label");
                        label.position.copy(pos).y += 20;
                        this.scene.add(label);
                        this.placeNameLabels.push(label);
                    }
                });

                const allPoints = [...this.allWaypoints.values()];
                const boundingBox = new THREE.Box3().setFromPoints(allPoints);
                const center = new THREE.Vector3();
                boundingBox.getCenter(center);
                
                const base_z_distance = 900;
                let final_z_distance = base_z_distance;
                if (this.camera.aspect < 1.0) {
                    final_z_distance = base_z_distance / this.camera.aspect;
                }
                const final_y_distance = final_z_distance * (600 / 900);

                this.camera.position.set(center.x, center.y + final_y_distance, center.z + final_z_distance);
                this.camera.lookAt(center);
                this.controls.target.copy(center);
                this.controls.update();
                
                this.initialCameraPosition = this.camera.position.clone();
                this.initialControlsTarget = this.controls.target.clone();

                this.updateLoadingProgress(85);

                await this.loadAllModels();
                this.updateLoadingProgress(95);

                await Promise.all([
                    this.loadSubCameraMap(),
                    this.loadMapTiles()
                ]);

                this.initializeSceneObjects();
                this.setupSubCameras();
                this.setupUI();

                this.updateLoadingProgress(100);
                setTimeout(() => {
                    const overlay = document.getElementById('loading-overlay');
                    overlay.style.opacity = '0';
                    setTimeout(() => { overlay.style.display = 'none'; }, 500);
                }, 300);

                this.animationFrameId = requestAnimationFrame(this.animate.bind(this));

            } catch (error) {
                console.error('初期データ読み込みエラー:', error);
                const progressText = document.getElementById('progress-text');
                if(progressText) progressText.textContent = 'Error';
            }
        }

        _calculateVideoTimings() {
            const allSchedules = new Map();
            for (const name in this.yamabokoPropertyMap) {
                const scheduleProp = this.yamabokoPropertyMap[name].replace('Object', 'Schedule');
                if (this[scheduleProp]) {
                    allSchedules.set(name, this[scheduleProp]);
                }
            }

            this.videoEventsData.forEach(eventInfo => {
                const schedule = allSchedules.get(eventInfo.yamabokoName);
                if (!schedule) return;

                const waypointPos = this.allWaypoints.get(eventInfo.placeName);
                if (!waypointPos) return;

                const targetEvent = schedule.find(e => 
                    (e.type === 'STOP' || e.type === 'TURN') && e.position.equals(waypointPos)
                );

                if (targetEvent) {
                    const arrivalTime = targetEvent.startTime;
                    // ▼▼▼ この行を修正します ▼▼▼
                    const displayEndTime = arrivalTime + (eventInfo.duration || 500);

                    if (!this.videoDisplayTimings.has(eventInfo.yamabokoName)) {
                        this.videoDisplayTimings.set(eventInfo.yamabokoName, []);
                    }
                    this.videoDisplayTimings.get(eventInfo.yamabokoName).push({
                        startTime: arrivalTime,
                        endTime: displayEndTime,
                        videoUrl: eventInfo.videoUrl
                    });
                }
            });
        }

        _createCSSLabel(text, className) {
            const div = document.createElement('div');
            div.className = className;
            div.textContent = text;
            const label = new CSS2DObject(div);
            return label;
        }

        _extractWaypoints(sceneObject) {
            const waypointPositions = new Map();
            sceneObject.traverse((child) => {
                if (child.isObject3D && child.name) {
                    const worldPos = new THREE.Vector3();
                    child.getWorldPosition(worldPos);
                    waypointPositions.set(child.name, worldPos);
                }
            });
            return waypointPositions;
        }

        _createPathFromGltf(gltf) {
            const points = [];
            gltf.scene.traverse(obj => {
                if (obj.isLine || obj.isMesh) {
                    const positionAttribute = obj.geometry.getAttribute('position');
                    if (positionAttribute) {
                        for (let i = 0; i < positionAttribute.count; i++) {
                            const point = new THREE.Vector3();
                            point.fromBufferAttribute(positionAttribute, i);
                            obj.localToWorld(point);
                            if (!points.length || !points[points.length - 1].equals(point)) {
                                points.push(point);
                            }
                        }
                    }
                }
            });
            if (points.length < 2) return null;
            const path = new THREE.CurvePath();
            for (let i = 0; i < points.length - 1; i++) {
                path.add(new THREE.LineCurve3(points[i], points[i + 1]));
            }
            return path;
        }

        _createSchedule(yamabokoName, timetable, waypointPositions, fullPath) {
            const schedule = [];
            if (!fullPath || !timetable) return schedule;
            const tsujimawashiNames = ['四条河原町', '河原町御池', '新町御池', '四条新町'];
            const pathPoints = fullPath.getPoints(2000);
            const findForwardClosestPointIndex = (targetPos, searchFromIndex) => {
                let closestIndex = searchFromIndex, minDistance = Infinity;
                if (searchFromIndex >= 0 && searchFromIndex < pathPoints.length) minDistance = pathPoints[searchFromIndex].distanceTo(targetPos);
                else return 0;
                for (let i = searchFromIndex; i < pathPoints.length; i++) {
                    const distance = pathPoints[i].distanceTo(targetPos);
                    if (distance < minDistance) { minDistance = distance; closestIndex = i; }
                }
                return closestIndex;
            };
            const findWrappedClosestPointIndex = (targetPos, searchToIndex) => {
                 let closestIndex = 0, minDistance = Infinity;
                 if (searchToIndex > 0 && pathPoints.length > 0) minDistance = pathPoints[0].distanceTo(targetPos);
                 else return 0;
                 for (let i = 0; i < searchToIndex; i++) {
                    const distance = pathPoints[i].distanceTo(targetPos);
                    if (distance < minDistance) { minDistance = distance; closestIndex = i; }
                 }
                 return closestIndex;
            };
            const timeToSeconds = (timeStr) => {
                const [h, m, s] = timeStr.split(':').map(Number);
                return h * 3600 + m * 60 + s;
            };
            let lastPathIndex = 0;
            for (let i = 0; i < timetable.length - 1; i++) {
                const startEntry = timetable[i], endEntry = timetable[i + 1];
                const startTime = timeToSeconds(startEntry.time), endTime = timeToSeconds(endEntry.time);
                const startPos = waypointPositions.get(startEntry.place), endPos = waypointPositions.get(endEntry.place);
                if (!startPos || !endPos) continue;
                const event = { startTime, endTime };
                const isTurnEvent = tsujimawashiNames.includes(startEntry.place) && startEntry.place === endEntry.place;
                if (isTurnEvent) {
                    if (startTime > endTime) continue;
                    event.type = 'TURN';
                    event.position = startPos;
                    let preTurnWaypointName = startEntry.place + "-1";
                    if ((yamabokoName === "船鉾" || yamabokoName === "岩戸山") && startEntry.place === "四条新町") preTurnWaypointName = startEntry.place + "-2";
                    const preTurnPos = waypointPositions.get(preTurnWaypointName);
                    const postTurnPos = waypointPositions.get(startEntry.place + "+1");
                    if (preTurnPos && postTurnPos) {
                        event.startDirection = new THREE.Vector3().subVectors(startPos, preTurnPos).normalize();
                        event.endDirection = new THREE.Vector3().subVectors(postTurnPos, startPos).normalize();
                    }
                } else if (startPos.equals(endPos)) {
                    if (startTime > endTime) continue;
                    event.type = 'STOP'; event.position = startPos;
                } else {
                    if (startTime >= endTime) continue;
                    event.type = 'MOVE';
                    const startIndex = findForwardClosestPointIndex(startPos, lastPathIndex);
                    let endIndex = findForwardClosestPointIndex(endPos, startIndex);
                    const forwardMatchDistance = pathPoints[endIndex].distanceTo(endPos);
                    const wrappedEndIndex = findWrappedClosestPointIndex(endPos, startIndex);
                    const wrappedMatchDistance = pathPoints[wrappedEndIndex].distanceTo(endPos);
                    if (wrappedMatchDistance < forwardMatchDistance * 0.8) endIndex = wrappedEndIndex;
                    if (startIndex !== -1 && endIndex !== -1) {
                        let segmentPoints;
                        if (startIndex <= endIndex) segmentPoints = pathPoints.slice(startIndex, endIndex + 1);
                        else segmentPoints = pathPoints.slice(startIndex).concat(pathPoints.slice(0, endIndex + 1));
                        
                        if (segmentPoints.length > 1) {
                            const path = new THREE.CurvePath();
                            for (let j = 0; j < segmentPoints.length - 1; j++) path.add(new THREE.LineCurve3(segmentPoints[j], segmentPoints[j + 1]));
                            event.path = path;
                        } else {
                            event.type = 'FALLBACK_MOVE'; event.startPos = startPos; event.endPos = endPos;
                        }
                    } else {
                        event.type = 'FALLBACK_MOVE'; event.startPos = startPos; event.endPos = endPos;
                    }
                    lastPathIndex = endIndex;
                }
                schedule.push(event);
            }
            return schedule;
        }

_updateObjectState(movingObject, schedule, currentTime, specialPositions) {
            if (!movingObject || movingObject.children.length === 0) return;

            const labelContainer = movingObject.getObjectByName('labelContainer');
            if (!labelContainer) return;

            // ▼▼▼ ここからが修正箇所です ▼▼▼
            // 1. ロゴの「串」コンテナと、その中の全ロゴ（団子）要素を取得
            const logoStackContainer = labelContainer.element.querySelector('.logo-stack-container');
            const nameDiv = labelContainer.element.querySelector('.yamaboko-label');
            const logoInstances = logoStackContainer ? logoStackContainer.querySelectorAll('.logo-instance') : [];
            
            // 2. まず、すべてのロゴを一旦非表示にする
            logoInstances.forEach(logo => logo.style.display = 'none');
            // ▲▲▲ 修正ここまで ▲▲▲

            let isKujiAratame = false;
            let isShimenawaKiri = false;
            let isTsujimawashi = false;

            let currentEvent = schedule.find(e => currentTime >= e.startTime && currentTime < e.endTime);
            
            if (currentEvent) {
                const eventDuration = currentEvent.endTime - currentEvent.startTime;
                const eventProgress = eventDuration > 0 ? (currentTime - currentEvent.startTime) / eventDuration : 1;
                const forward = new THREE.Vector3(0, 0, 1);
                switch (currentEvent.type) {
                    case 'MOVE':
                        if (currentEvent.path && currentEvent.path.getLength() > 0) {
                            const currentPosition = currentEvent.path.getPointAt(eventProgress);
                            movingObject.position.copy(currentPosition);
                            const tangent = currentEvent.path.getTangentAt(eventProgress).normalize();
                            const lookAtPosition = new THREE.Vector3().addVectors(currentPosition, tangent);
                            movingObject.lookAt(lookAtPosition);
                        }
                        break;
                    case 'STOP':
                        movingObject.position.copy(currentEvent.position);
                        
                        if (specialPositions.shijoSakaimachi && currentEvent.position.equals(specialPositions.shijoSakaimachi)) {
                            isKujiAratame = true;
                        }
                                                
                        if (movingObject.userData.name === '長刀鉾' && specialPositions.shijoFuyacho && currentEvent.position.equals(specialPositions.shijoFuyacho)) isShimenawaKiri = true;
                        break;
                    case 'TURN':
                        movingObject.position.copy(currentEvent.position);
                        if (currentEvent.startDirection && currentEvent.endDirection) {
                            const startQuat = new THREE.Quaternion().setFromUnitVectors(forward, currentEvent.startDirection);
                            const endQuat = new THREE.Quaternion().setFromUnitVectors(forward, currentEvent.endDirection);
                            movingObject.quaternion.slerpQuaternions(startQuat, endQuat, eventProgress);
                        }
                        isTsujimawashi = true;
                        break;
                    case 'FALLBACK_MOVE':
                        movingObject.position.lerpVectors(currentEvent.startPos, currentEvent.endPos, eventProgress);
                        break;
                }
            } else {
                const pastEvents = schedule.filter(e => e.endTime <= currentTime);
                const futureEvents = schedule.filter(e => e.startTime >= currentTime);
                
                if (pastEvents.length > 0) {
                    const lastEvent = pastEvents[pastEvents.length - 1];
                    const forward = new THREE.Vector3(0, 0, 1);
                    switch (lastEvent.type) {
                        case 'MOVE':
                            if (lastEvent.path && lastEvent.path.getLength() > 0) {
                                const finalPosition = lastEvent.path.getPointAt(1);
                                movingObject.position.copy(finalPosition);
                                const finalTangent = lastEvent.path.getTangentAt(1).normalize();
                                movingObject.lookAt(new THREE.Vector3().addVectors(finalPosition, finalTangent));
                            }
                            break;
                        case 'STOP': 
                            movingObject.position.copy(lastEvent.position);
                            break;
                        case 'TURN':
                            movingObject.position.copy(lastEvent.position);
                            if (lastEvent.startDirection && lastEvent.endDirection) {
                                const endQuat = new THREE.Quaternion().setFromUnitVectors(forward, lastEvent.endDirection);
                                movingObject.quaternion.copy(endQuat);
                            }
                            break;
                        case 'FALLBACK_MOVE':
                            movingObject.position.copy(lastEvent.endPos);
                            break;
                    }
                } else if (futureEvents.length > 0) {
                    const firstEvent = futureEvents[0];
                    if (firstEvent.type === 'MOVE' && firstEvent.path) {
                        movingObject.position.copy(firstEvent.path.getPointAt(0));
                        const tangent = firstEvent.path.getTangentAt(0).normalize();
                        movingObject.lookAt(new THREE.Vector3().addVectors(movingObject.position, tangent));
                    } else if (firstEvent.position) {
                        movingObject.position.copy(firstEvent.position);
                    } else if (firstEvent.startPos) {
                        movingObject.position.copy(firstEvent.startPos);
                    }
                }
            }
            
            // ▼▼▼ ここからが修正箇所です ▼▼▼
            if (logoInstances.length > 0) {
                const yamabokoName = movingObject.userData.name;
                const videoTimings = this.videoDisplayTimings.get(yamabokoName);
                if (videoTimings) {
                    // 3. 現在時刻で表示すべき「すべて」のイベントを絞り込む
                    const activeTimings = videoTimings.filter(timing => 
                        currentTime >= timing.startTime && currentTime < timing.endTime
                    );

                    // 4. 表示すべきイベントの数だけ、用意しておいたロゴを表示状態にする
                    activeTimings.forEach((timing, index) => {
                        if (index < logoInstances.length) { // 用意したロゴの数を超えないように
                            const logoToShow = logoInstances[index];
                            logoToShow.style.display = 'flex';
                            logoToShow.userData = { videoUrl: timing.videoUrl };
                        }
                    });
                }
            }
            // ▲▲▲ 修正ここまで ▲▲▲
            
            if (!nameDiv) return;

            const kujiTorazuFloats = new Set(['長刀鉾', '函谷鉾', '放下鉾', '岩戸山', '船鉾']);
            const baseText = movingObject.userData.name || '';
            let newText = baseText;
            let newClassName = 'yamaboko-label';

            if (isKujiAratame) {
                if (kujiTorazuFloats.has(baseText)) {
                    newText = `${baseText}<br>くじ取らず`;
                } else {
                    newText = `${baseText}<br>くじ改め`;
                }
                newClassName += ' event-kuji-aratame';
            } else if (isShimenawaKiri) {
                newText = `${baseText}<br>しめ縄切り`;
                newClassName += ' event-shimenawa-kiri';
            } else if (isTsujimawashi && this.tsujimawashiLabelTargets.has(baseText)) {
                newText = `${baseText}<br>辻回し`;
                newClassName += ' event-tsujimawashi';
            }
            
            nameDiv.innerHTML = newText;
            nameDiv.className = newClassName;

            const wasVisible = movingObject.visible;
            movingObject.visible = true; 
            
            const box = new THREE.Box3().setFromObject(movingObject);
            const topY = box.max.y;

            movingObject.visible = wasVisible;

            const nameLabelOffset = 5;
            labelContainer.position.y = topY + nameLabelOffset;
        }

_updateLabelOcclusion(occlusionArea) {
            const labelsToCheck = [];
            
            // ▼▼▼ このブロックの判定条件を修正します ▼▼▼
            this.scene.traverse(child => {
                // 'yamaboko-label'を探す代わりに、新しいコンテナの'labelContainer'を探すように変更
                if (child.isCSS2DObject && (child.element.classList.contains('waypoint-label') || child.name === 'labelContainer' || child.element.classList.contains('youtube-bubble'))) {
                    labelsToCheck.push(child);
                }
            });
            // ▲▲▲ 修正ここまで ▲▲▲

            const _vector = new THREE.Vector3();
            for (const label of labelsToCheck) {
                // ラベルが表示対象でなければスキップ
                if (!label.parent || !label.parent.visible) {
                    label.visible = false;
                    continue;
                }
                
                _vector.setFromMatrixPosition(label.matrixWorld);
                _vector.project(this.camera);

                // カメラの後ろにある場合は非表示
                if (_vector.z > 1) {
                    label.visible = false;
                    continue;
                }

                // スクリーン座標に変換
                const x = (_vector.x * 0.5 + 0.5) * window.innerWidth;
                const y = (_vector.y * -0.5 + 0.5) * window.innerHeight;

                // 重なり判定
                if (x > occlusionArea.left && x < occlusionArea.right && y > occlusionArea.top && y < occlusionArea.bottom) {
                    label.visible = false;
                } else {
                    label.visible = true;
                }
            }
        }

        async loadAllModels() {
            const loader = new GLTFLoader();
            const dracoLoader = new DRACOLoader();
            dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/libs/draco/gltf/');
            loader.setDRACOLoader(dracoLoader);
            
            const interactiveModelPaths = ['../gion_asset/bldg.glb'];
            const girlPath = 'girl3.glb';
            const tranPath = '../gion_asset/tran_3.glb'; 
            const roadPath = '../gion_asset/車道アスファルト.glb';
            const markingPath = '../gion_asset/白線.glb';
            const busBayPath = '../gion_asset/バスベイ.glb';
            const gutterPath = '../gion_asset/側溝.glb';
            const sidewalkPath = '../gion_asset/歩道.glb';
            const wallPath = 'collision_walls.glb';
            
            const [buildingAttrRes, keikanRes, kyomachiyaRes, bunkazaiRes] = await Promise.all([
                fetch('../gion_asset/merged_merged_output.json'),
                fetch('../gion_asset/景観+彩る.json'),
                fetch('../gion_asset/kyomachiya_kachizuke.json'),
                fetch('../gion_asset/bunkazai_kachizuke.json')
            ]);

            const buildingAttrData = await buildingAttrRes.json();
            const keikanData = await keikanRes.json();
            const kyomachiyaData = await kyomachiyaRes.json();
            const bunkazaiData = await bunkazaiRes.json();

            buildingAttrData.forEach(attr => {
                const key = attr.sequential_id || attr.serial_number;
                if (key) this.buildingAttributes[key] = attr;
            });
            keikanData.forEach(item => {
                if (item.GML_ID) {
                    this.keikanData.set(item.GML_ID, item);
                    this.keikanGmlIds.add(item.GML_ID);
                    // ▼▼▼ 修正点1 ▼▼▼
                    if (item.youtubeUrl) {
                        this.videoUrlMap.set(item.GML_ID, {
                            url: item.youtubeUrl,
                            type: 'keikan', // 種別を'keikan'として保存
                            name: item['表示名称'] || '名称不明' // 名称を保存
                        });
                    }
                    // ▲▲▲ 修正ここまで ▲▲▲
                }
            });
            kyomachiyaData.forEach(item => {
                if (item['GML ID']) this.kyomachiyaGmlIds.add(item['GML ID']);
            });
            bunkazaiData.forEach(item => {
                if (item['GML ID']) {
                    this.bunkazaiData.set(item['GML ID'], item);
                    this.bunkazaiGmlIds.add(item['GML ID']);
                    // ▼▼▼ 修正点2 ▼▼▼
                    if (item.youtubeUrl) {
                        this.videoUrlMap.set(item['GML ID'], {
                            url: item.youtubeUrl,
                            type: 'bunkazai', // 種別を'bunkazai'として保存
                            name: item['名称'] || '名称不明' // 名称を保存
                        });
                    }
                    // ▲▲▲ 修正ここまで ▲▲▲
                }
            });

            this.customBuildingMaterial = this.createCustomMaterial();

            const interactivePromises = interactiveModelPaths.map(path => loader.loadAsync(path).catch(e => console.error(`Failed to load ${path}`, e)));
            const girlPromise = loader.loadAsync(girlPath).catch(e => console.error(`Failed to load ${girlPath}`, e));
            const tranPromise = loader.loadAsync(tranPath).catch(e => console.error(`Failed to load ${tranPath}`, e));
            const roadPromise = loader.loadAsync(roadPath).catch(e => console.error(`Failed to load ${roadPath}`, e));
            const markingPromise = loader.loadAsync(markingPath).catch(e => console.error(`Failed to load ${markingPath}`, e));
            const busBayPromise = loader.loadAsync(busBayPath).catch(e => console.error(`Failed to load ${busBayPath}`, e));
            const gutterPromise = loader.loadAsync(gutterPath).catch(e => console.error(`Failed to load ${gutterPath}`, e));
            const sidewalkPromise = loader.loadAsync(sidewalkPath).catch(e => console.error(`Failed to load ${sidewalkPath}`, e));
            const wallPromise = loader.loadAsync(wallPath).catch(e => console.error(`Failed to load ${wallPath}`, e));

            const [interactiveGltfs, girlGltf, tranGltf, roadGltf,markingGltf, busBayGltf, gutterGltf, sidewalkGltf, wallGltf] = await Promise.all([
                Promise.all(interactivePromises),
                girlPromise, tranPromise, roadPromise, markingPromise, busBayPromise, gutterPromise, sidewalkPromise, wallPromise
            ]);

            interactiveGltfs.forEach(gltf => {
                if(!gltf) return;
                const tempBBoxes = [];
                gltf.scene.traverse(object => {
                    if (object.isMesh && object.geometry.attributes.uv) {
                        const uvAttribute = object.geometry.attributes.uv;
                        const vertexCount = uvAttribute.count;
                        const idArray = new Float32Array(vertexCount);
                        const isKeikanArray = new Float32Array(vertexCount).fill(0.0);
                        const isKyomachiyaArray = new Float32Array(vertexCount).fill(0.0);
                        const isBunkazaiArray = new Float32Array(vertexCount).fill(0.0);
                        for (let i = 0; i < vertexCount; i++) {
                            const buildingId = Math.round(uvAttribute.getX(i));
                            idArray[i] = buildingId;
                            const buildingAttr = this.buildingAttributes[buildingId];
                            if (buildingAttr) {
                                if (this.keikanGmlIds.has(buildingAttr.id)) isKeikanArray[i] = 1.0;
                                if (this.kyomachiyaGmlIds.has(buildingAttr.id)) {
                                    const height = parseFloat(buildingAttr.measuredHeight);
                                    if (!isNaN(height) && height < 10.0) isKyomachiyaArray[i] = 1.0;
                                }
                                if (this.bunkazaiGmlIds.has(buildingAttr.id)) isBunkazaiArray[i] = 1.0;
                            }
                        }
                        object.geometry.setAttribute('_id', new THREE.BufferAttribute(idArray, 1));
                        object.geometry.setAttribute('isKeikan', new THREE.BufferAttribute(isKeikanArray, 1));
                        object.geometry.setAttribute('isKyomachiya', new THREE.BufferAttribute(isKyomachiyaArray, 1));
                        object.geometry.setAttribute('isBunkazai', new THREE.BufferAttribute(isBunkazaiArray, 1));
                        object.material = this.customBuildingMaterial;
                        this.interactiveMeshes.push(object);
                        
                        object.bBox = new THREE.Box3().setFromObject(object);
                        tempBBoxes.push(object);
                    }
                });
                this.interactiveBuildingGroup.add(gltf.scene);
                this.collisionObstacles = tempBBoxes; 
            });
            this.scene.add(this.interactiveBuildingGroup);
            this._createAllBuildingLabels();

_createAllBuildingLabels() {
            const buildingVertices = new Map();
            this.interactiveMeshes.forEach(mesh => {
                const idAttribute = mesh.geometry.attributes._id;
                const positionAttribute = mesh.geometry.attributes.position;
                const matrix = mesh.matrixWorld;
                for (let i = 0; i < idAttribute.count; i++) {
                    const buildingId = idAttribute.getX(i);
                    const buildingAttr = this.buildingAttributes[buildingId];
                    if (buildingAttr && (this.bunkazaiGmlIds.has(buildingAttr.id) || this.keikanGmlIds.has(buildingAttr.id) || this.kyomachiyaGmlIds.has(buildingAttr.id))) {
                        if (!buildingVertices.has(buildingId)) {
                            buildingVertices.set(buildingId, { vertices: [], gmlId: buildingAttr.id });
                        }
                        const vertex = new THREE.Vector3().fromBufferAttribute(positionAttribute, i);
                        vertex.applyMatrix4(matrix);
                        buildingVertices.get(buildingId).vertices.push(vertex);
                    }
                }
            });
            
            buildingVertices.forEach((data, buildingId) => {
                if (data.vertices.length === 0) return;
                let sumX = 0, sumZ = 0, maxY = -Infinity;
                data.vertices.forEach(v => { sumX += v.x; sumZ += v.z; maxY = Math.max(maxY, v.y); });

                const anchorPosition = new THREE.Vector3( sumX / data.vertices.length, maxY, sumZ / data.vertices.length );
                const gmlId = data.gmlId;
                const clickHandler = (e) => { e.stopPropagation(); this._showLabelInfoPanel(gmlId, buildingId); };
                
                let labelCount = 0;
                const createLabel = (info) => {
                    const offset = new THREE.Vector3(labelCount * 20, 0, 0); 
                    labelCount++;
                    const labelDiv = document.createElement('div');
                    labelDiv.className = info.css;
                    labelDiv.textContent = info.text;
                    labelDiv.dataset.name = info.name;
                    labelDiv.addEventListener('click', clickHandler);
                    document.getElementById('css3d-container').appendChild(labelDiv);
                    this.buildingLabels.push({ position: anchorPosition.clone().add(offset), element: labelDiv, type: info.type, buildingId: buildingId });
                    
                    const subLabelDiv = document.createElement('div');
                    subLabelDiv.className = `${info.css}-sub`;
                    subLabelDiv.textContent = info.text;
                    subLabelDiv.dataset.name = info.name;
                    subLabelDiv.addEventListener('click', clickHandler);
                    document.getElementById('css3d-container').appendChild(subLabelDiv);
                    this.subCameraBuildingLabels.push({ position: anchorPosition.clone().add(offset), element: subLabelDiv, type: info.type, buildingId: buildingId });
                };

                // ▼▼▼ ここからが修正ブロックです ▼▼▼
                // 修正点1: 変数名を videoUrl から videoInfo に変更（より分かりやすくするため）
                const videoInfo = this.videoUrlMap.get(gmlId);
                if (videoInfo) {
                    // 修正点2: createYoutubeClickableLogo に videoInfo オブジェクトを引数として渡す
                    const youtubeLogoObject = this.createYoutubeClickableLogo(videoInfo);
                    
                    // 修正点3: userDataには videoInfo オブジェクトの中の url プロパティを渡す
                    youtubeLogoObject.userData.videoUrl = videoInfo.url;
                    
                    youtubeLogoObject.position.copy(anchorPosition);
                    youtubeLogoObject.position.y += 15;
                    this.scene.add(youtubeLogoObject);
                }
                // ▲▲▲ 修正ブロックここまで ▲▲▲

                const keikanInfo = this.keikanData.get(gmlId);
                if (keikanInfo && keikanInfo['表示名称']) createLabel({ type: 'keikan', text: '景', name: keikanInfo['表示名称'], css: 'keikan-label' });
                const bunkazaiInfo = this.bunkazaiData.get(gmlId);
                if (bunkazaiInfo && bunkazaiInfo['名称']) createLabel({ type: 'bunkazai', text: '文', name: bunkazaiInfo['名称'], css: 'bunkazai-label' });
                const attributes = this.buildingAttributes[buildingId];
                if (attributes && this.kyomachiyaGmlIds.has(gmlId)) {
                    const height = parseFloat(attributes.measuredHeight);
                    if (!isNaN(height) && height < 10.0) createLabel({ type: 'kyomachiya', text: '町', name: '京町家', css: 'kyomachiya-label' });
                }
            });
        }

        lonLatToTile(lon, lat, zoom) {
            const x = Math.floor((lon / 180 + 1) * Math.pow(2, zoom) / 2);
            const y = Math.floor((-Math.log(Math.tan((45 + lat / 2) * Math.PI / 180)) + Math.PI) * Math.pow(2, zoom) / (2 * Math.PI));
            return { x, y };
        }
        
        tileToLonLat(x, y, zoom) {
            const n = Math.pow(2, zoom);
            const lon_deg = x / n * 360.0 - 180.0;
            const lat_rad = Math.atan(Math.sinh(Math.PI * (1 - 2 * y / n)));
            const lat_deg = lat_rad * 180.0 / Math.PI;
            return { lon: lon_deg, lat: lat_deg };
        }
