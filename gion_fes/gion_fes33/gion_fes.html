                                    const labelGroup = this._createDistrictLabel(originalDistrictName, { fontsize: 150, scale: 2.5 });
                                    labelGroup.position.set(centroid.x, 40, -centroid.y); 
                                    labelGroup.name = 'district_label_group';
                                    labelGroup.layers.set(2);
                                    
                                    this.mapGroup.add(labelGroup);
                                    
                                    labelGroup.userData.polygonMesh = mesh;
                                    this.kodoInteractiveObjects.push(labelGroup.children[0]);
                                }

                            } catch (e) { console.warn("ポリゴンの生成に失敗しました:", e); }
                        });
                    });


                } else if (this.currentMapLayer === 'keikan') {
                    
                    await this._loadRoadGeojsonIfNeeded();
                    
                    const [districtData] = await Promise.all([
                        fetch('../gion_asset/京町家保全継承地区.geojson').then(res => res.json())
                    ]);
                    const roadData = this.roadGeojsonData;

                    const roadVertices = [];
                    roadData.features.forEach(feature => {
                        if (!feature.geometry || feature.geometry.type !== 'MultiLineString') return;
                        feature.geometry.coordinates.forEach(lineCoords => {
                            for (let i = 0; i < lineCoords.length - 1; i++) {
                                const startCoord = lineCoords[i];
                                const endCoord = lineCoords[i + 1];
                                roadVertices.push(startCoord[0] - centerMeters[0], 0.3, -(startCoord[1] - centerMeters[1]));
                                roadVertices.push(endCoord[0] - centerMeters[0], 0.3, -(endCoord[1] - centerMeters[1]));
                            }
                        });
                    });
                    const roadGeometry = new THREE.BufferGeometry();
                    roadGeometry.setAttribute('position', new THREE.Float32BufferAttribute(roadVertices, 3));
                    const roadMaterial = new THREE.LineBasicMaterial({ color: 0x808080 });
                    const roadLineSegments = new THREE.LineSegments(roadGeometry, roadMaterial);
                    this.mapGroup.add(roadLineSegments);

                    const material = new THREE.MeshBasicMaterial({
                        color: 0xFFFF00,
                        side: THREE.DoubleSide, transparent: true, opacity: 0.5
                    });

                    districtData.features.forEach(feature => {
                        if (!feature.geometry || !feature.properties['地区名']) return;
                        
                        const polygons = feature.geometry.type === 'MultiPolygon' ? feature.geometry.coordinates : [feature.geometry.coordinates];
                        
                        polygons.forEach(polygonCoords => {
                            try {
                                const shape = new THREE.Shape();
                                const outerRing = polygonCoords[0];
                                if (!outerRing || outerRing.length < 3) return;

                                shape.moveTo(outerRing[0][0] - centerMeters[0], outerRing[0][1] - centerMeters[1]);
                                outerRing.slice(1).forEach(coord => shape.lineTo(coord[0] - centerMeters[0], coord[1] - centerMeters[1]));
                                
                                polygonCoords.slice(1).forEach(holeRing => {
                                    if (!holeRing || holeRing.length < 3) return;
                                    const holePath = new THREE.Path();
                                    holePath.moveTo(holeRing[0][0] - centerMeters[0], holeRing[0][1] - centerMeters[1]);
                                    holeRing.slice(1).forEach(coord => holePath.lineTo(coord[0] - centerMeters[0], coord[1] - centerMeters[1]));
                                    shape.holes.push(holePath);
                                });

                                const geometry = new THREE.ShapeGeometry(shape);
                                const mesh = new THREE.Mesh(geometry, material.clone());
                                mesh.position.y = 0.1; 
                                mesh.rotation.x = -Math.PI / 2;
                                this.mapGroup.add(mesh);
                                
                                mesh.userData.originalColor = material.color.clone();

                                const lineMaterial = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 });
                                const wireframe = new THREE.LineSegments(new THREE.EdgesGeometry(geometry), lineMaterial);
                                wireframe.position.copy(mesh.position);
                                wireframe.rotation.copy(mesh.rotation);
                                wireframe.position.y += 0.1;
                                this.mapGroup.add(wireframe);
                                
                                geometry.computeBoundingBox();
                                const centroid = new THREE.Vector3();
                                geometry.boundingBox.getCenter(centroid);
                                const originalDistrictName = feature.properties['地区名'];
                                if (originalDistrictName) {
                                    const labelGroup = this._createDistrictLabel(originalDistrictName, { fontsize: 150, scale: 2.5 });
                                    labelGroup.position.set(centroid.x, 40, -centroid.y); 
                                    labelGroup.name = 'district_label_group';
                                    labelGroup.layers.set(2);
                                    
                                    this.mapGroup.add(labelGroup);
                                    
                                    labelGroup.userData.polygonMesh = mesh;
                                    this.kodoInteractiveObjects.push(labelGroup.children[0]);
                                }

                            } catch (e) { console.warn("ポリゴンの生成に失敗しました:", e); }
                        });
                    });
                
                } else if (layerInfo.type === 'image') {
                    const texture = await textureLoader.loadAsync(layerInfo.url);
                    const geometry = new THREE.PlaneGeometry(5000, 5000);
                    const material = new THREE.ShaderMaterial({
                        vertexShader: document.getElementById('mapTileVertexShader').textContent,
                        fragmentShader: document.getElementById('mapTileFragmentShader').textContent,
                        uniforms: { tMap: { value: texture }, uRadius: { value: this.SKY_DOME_RADIUS }, uFadeDistance: { value: 300.0 } },
                        transparent: true, polygonOffset: true, polygonOffsetFactor: -1.0, polygonOffsetUnits: -1.0
                    });
                    const plane = new THREE.Mesh(geometry, material);
                    plane.rotation.x = -Math.PI / 2;
                    this.mapGroup.add(plane);

                } else if (layerInfo.type === 'tile') {
                    const centerTile = this.lonLatToTile(this.MAP_CENTER_LON, this.MAP_CENTER_LAT, this.MAP_ZOOM_LEVEL);
                    const tileSideMetersApprox = (Math.cos(this.MAP_CENTER_LAT * Math.PI / 180) * 2 * Math.PI * 6378137) / Math.pow(2, this.MAP_ZOOM_LEVEL);
                    const tileOffset = Math.ceil((this.SKY_DOME_RADIUS) / tileSideMetersApprox);
                    
                    const promises = [];
                    for (let i = -tileOffset; i <= tileOffset; i++) {
                        for (let j = -tileOffset; j <= tileOffset; j++) {
                            const tileX = centerTile.x + i, tileY = centerTile.y + j;
                            const tileUrl = layerInfo.url.replace('{z}', this.MAP_ZOOM_LEVEL).replace('{x}', tileX).replace('{y}', tileY);
                            
                            const promise = textureLoader.loadAsync(tileUrl).then(texture => {
                                const v0_jgd = this.wgs84_to_jgd2011.forward(Object.values(this.tileToLonLat(tileX, tileY, this.MAP_ZOOM_LEVEL)));
                                const v1_jgd = this.wgs84_to_jgd2011.forward(Object.values(this.tileToLonLat(tileX, tileY + 1, this.MAP_ZOOM_LEVEL)));
                                const v2_jgd = this.wgs84_to_jgd2011.forward(Object.values(this.tileToLonLat(tileX + 1, tileY, this.MAP_ZOOM_LEVEL)));
                                const v3_jgd = this.wgs84_to_jgd2011.forward(Object.values(this.tileToLonLat(tileX + 1, tileY + 1, this.MAP_ZOOM_LEVEL)));

                                const vertices = new Float32Array([
                                    v0_jgd[0] - centerMeters[0], 0, -(v0_jgd[1] - centerMeters[1]),
                                    v1_jgd[0] - centerMeters[0], 0, -(v1_jgd[1] - centerMeters[1]),
                                    v2_jgd[0] - centerMeters[0], 0, -(v2_jgd[1] - centerMeters[1]),
                                    v3_jgd[0] - centerMeters[0], 0, -(v3_jgd[1] - centerMeters[1])
                                ]);
                                
                                const geometry = new THREE.BufferGeometry();
                                geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
                                geometry.setAttribute('uv', new THREE.BufferAttribute(new Float32Array([0, 1, 0, 0, 1, 1, 1, 0]), 2));
                                geometry.setIndex(new THREE.BufferAttribute(new Uint16Array([0, 1, 2, 2, 1, 3]), 1));
                                
                                const material = new THREE.ShaderMaterial({
                                    vertexShader: document.getElementById('mapTileVertexShader').textContent,
                                    fragmentShader: document.getElementById('mapTileFragmentShader').textContent,
                                    uniforms: { tMap: { value: texture }, uRadius: { value: this.SKY_DOME_RADIUS }, uFadeDistance: { value: 300.0 }},
                                    transparent: true
                                });
                                const plane = new THREE.Mesh(geometry, material);
                                this.mapGroup.add(plane);
                            }).catch(err => {});
                            promises.push(promise);
                        }
                    }
                    await Promise.all(promises);
                }
            } catch (err) {
                console.error(`地図レイヤー '${this.currentMapLayer}' の読み込み中にエラー:`, err);
            }
        }

        _createDistrictLabel(message, options = {}) {
            const { fontface = 'Arial', textColor = '#000000', backgroundColor = 'rgba(255, 255, 255, 0.7)', borderRadius = 20, padding = 20, scale = 4 } = options;
            let fontsize;
            if (options.fontsize) fontsize = options.fontsize;
            else {
                fontsize = 120;
                if (message.length > 8) fontsize = 70;
                else if (message.length > 4) fontsize = 90;
            }
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            context.font = `Bold ${fontsize}px ${fontface}`;
            const metrics = context.measureText(message);
            const textWidth = metrics.width;
            const textHeight = fontsize;
            const backgroundWidth = textWidth + padding * 2;
            const backgroundHeight = textHeight + padding * 2;
            canvas.width = backgroundWidth;
            canvas.height = backgroundHeight;
            context.font = `Bold ${fontsize}px ${fontface}`;
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillStyle = backgroundColor;
            context.beginPath();
            context.moveTo(borderRadius, 0);
            context.lineTo(canvas.width - borderRadius, 0);
            context.arcTo(canvas.width, 0, canvas.width, borderRadius, borderRadius);
            context.lineTo(canvas.width, canvas.height - borderRadius);
            context.arcTo(canvas.width, canvas.height, canvas.width - borderRadius, canvas.height, borderRadius);
            context.lineTo(borderRadius, canvas.height);
            context.arcTo(0, canvas.height, 0, canvas.height - borderRadius, borderRadius);
            context.lineTo(0, borderRadius);
            context.arcTo(0, 0, borderRadius, 0, borderRadius);
            context.closePath();
            context.fill();
            context.fillStyle = textColor;
            context.fillText(message, canvas.width / 2, canvas.height / 2);
            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearFilter;
            const textMaterial = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
            const textPlaneWidth = backgroundWidth / scale;
            const textPlaneHeight = backgroundHeight / scale;
            const textGeometry = new THREE.PlaneGeometry(textPlaneWidth, textPlaneHeight);
            const textMesh = new THREE.Mesh(textGeometry, textMaterial);
            const group = new THREE.Group();
            group.add(textMesh);
            return group;
        }

        _formatKodoDistrictName(originalName) {
            if (!originalName) return '';
            const meterMatch = originalName.match(/^(\d+m)/);
            const typeMatch = originalName.match(/第(\d)種/);
            const meterPart = meterMatch ? meterMatch[1] : null;
            const typePart = typeMatch ? typeMatch[1] : null;
            if (meterPart && typePart) return `${meterPart}-${typePart}`;
            if (meterPart) return meterPart;
            return originalName;
        }

addSkyDome() {

            const skyMaterial = new THREE.ShaderMaterial({
                vertexShader: document.getElementById('skyVertexShader').textContent,
                fragmentShader: document.getElementById('skyFragmentShader').textContent,
                uniforms: {
                    uTopColor: { value: new THREE.Color(0x87CEEB) },
                    uBottomColor: { value: new THREE.Color(0xFFFFFF) }
                },

            });

setupSubCameras() {
            this.subCameraData.forEach((data, index) => {
                const subCamera = new THREE.PerspectiveCamera(75, 1, 0.1, 8000);
                if (data.type !== 'chase') {
                     if (index === 0) { 
                        const shijoKawaramachiPos = this.allWaypoints.get('四条河原町');
                        if (shijoKawaramachiPos) {
                            // ▼▼▼ ここから修正 ▼▼▼
                            
                            const lookAtTarget = shijoKawaramachiPos.clone();
                            lookAtTarget.y += 10; // 注視点用の座標を複製し、Y座標を10m上げる

                            subCamera.position.set(shijoKawaramachiPos.x + 15, 15, shijoKawaramachiPos.z + 15);
                            subCamera.lookAt(lookAtTarget); // Yを上げた座標を見る
                            // ▲▲▲ 修正ここまで ▲▲▲
                        }
                    } else if (data.position) {
                        subCamera.position.copy(data.position);
                        if (data.lookAtTargetName && this.allWaypoints.has(data.lookAtTargetName)) {
                            subCamera.lookAt(this.allWaypoints.get(data.lookAtTargetName));
                        }
                    }
                }
                this.subCameras.push(subCamera);
            });
        }
        
        setupUI() {
            const isLikelyPhone = () => {
                const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
                if (!isTouch) return false;
                const smallerDimension = Math.min(window.screen.width, window.screen.height);
                return smallerDimension <= 650;
            };

            if (isLikelyPhone()) {
                this.isPhone = true;
                this.isSubCameraVisible = false;
                document.body.classList.add('is-phone');
            }
            
            let currentPanelContent = null;
            let originalParent = null;

            const openPanelModal = (contentElement) => {
                if (!contentElement) return;
                currentPanelContent = contentElement;
                originalParent = contentElement.parentNode;
                contentElement.style.display = 'block';
                this.panelOverlayBody.appendChild(contentElement);
                this.panelOverlay.classList.add('visible');
            };

            const closePanelModal = () => {
                if (currentPanelContent && originalParent) {
                    currentPanelContent.style.display = 'none';
                    originalParent.appendChild(currentPanelContent);
                }
                this.panelOverlay.classList.remove('visible');
                currentPanelContent = null;
                originalParent = null;
            };

            this.panelOverlayCloseBtn.addEventListener('click', closePanelModal);
            this.panelOverlay.addEventListener('click', (e) => {
                if (e.target === this.panelOverlay) {
                    closePanelModal();
                }
            });

            this.setupControls();
            this.setupVisibilityControls(openPanelModal);
            this.setupClickEvents();
            this.setupCameraSwitchUI();
            this.setupMapSelection(openPanelModal);
            this.setupCharacterModeControls();
            this.setupBuildingSearchModeControls(openPanelModal);
            this.setupMinimalModeControls();
            this.setupViewpointControls();
            this.setupModalControls(); 
        }

setupMinimalModeControls() {

        toggleMinimalMode() {
            this.isMinimalMode = !this.isMinimalMode;
            this.applyMinimalModeState();
        }

applyMinimalModeState() {
            const minimalModeBtn = document.getElementById('minimal-mode-btn');
            
            // ▼▼▼ 変更点1: 非表示にするボタンのリストを定義（視点移動ボタンは除外） ▼▼▼
            const buttonsToHide = [
                document.getElementById('building-search-toggle-btn'),
                document.getElementById('character-mode-btn'),
                document.getElementById('toggle-map-btn'),
                document.getElementById('toggle-visibility-btn')
            ];
            // ▲▲▲ 変更ここまで ▲▲▲

            const subCameraUIs = [
                document.getElementById('sub-camera-label'),
                document.getElementById('sub-camera-controls')
            ];

            if (minimalModeBtn) minimalModeBtn.classList.toggle('active', this.isMinimalMode);

            // ▼▼▼ 変更点2: 'display' の代わりに 'visibility' を使ってボタンを非表示にする ▼▼▼
            buttonsToHide.forEach(btn => {
                if (btn) {
                    // visibilityを使うことで、ボタンのあったスペースを維持し、レイアウトが崩れないようにする
                    btn.style.visibility = this.isMinimalMode ? 'hidden' : 'visible';
                }
            });
            // ▲▲▲ 変更ここまで ▲▲▲

            // 3Dオブジェクトの表示/非表示を切り替え
            if (this.interactiveBuildingGroup) this.interactiveBuildingGroup.visible = !this.isMinimalMode;
            if (this.buildingModel1946) this.buildingModel1946.visible = !this.isMinimalMode;
            if (this.buildingModel1975) this.buildingModel1975.visible = !this.isMinimalMode;
            if (this.mapGroup) this.mapGroup.visible = !this.isMinimalMode;
            if (this.sky) this.sky.visible = !this.isMinimalMode;
            if (this.walkableArea) this.walkableArea.visible = this.isMinimalMode;
            // 背景色を切り替え
            this.scene.background = this.isMinimalMode ? new THREE.Color(0x000000) : null;
            
            // サブカメラの表示/非表示を切り替え
            this.isSubCameraVisible = !this.isMinimalMode && !this.isPhone;
            subCameraUIs.forEach(ui => {
                // こちらはレイアウトに影響しないため display:none のままでOK
                if (ui) ui.style.display = this.isSubCameraVisible ? 'block' : 'none';
            });

            // UIパネルの表示/非表示を切り替え
            const cameraInfo = document.getElementById('camera-info-display');
            if (cameraInfo) cameraInfo.style.display = this.isMinimalMode ? 'none' : 'block';

            // 建物ラベルの表示/非表示を更新
            this._updateLabelVisibility();

            // 最小構成モード切替時に、山鉾・地名ラベルの表示状態をリセットする
            if (this.isMinimalMode) {
                this.scene.traverse(child => {
                    if (child.isCSS2DObject && (child.element.classList.contains('waypoint-label') || child.element.classList.contains('yamaboko-label'))) {
                        // 親の山鉾が表示されている場合のみラベルも表示する
                        if (child.parent && child.parent.visible) {
                            child.visible = true;
                        }
                    }
                });
            }
        }

        setupBuildingSearchModeControls(openModalCallback) {
            this.buildingSearchToggleBtn.addEventListener('click', () => {
                openModalCallback(document.getElementById('building-search-content-wrapper'));
            });

            this.searchModeCheckboxes.addEventListener('change', (e) => {
                if (e.target.type === 'checkbox') {
                    const mode = e.target.value;
                    if (e.target.checked) {
                        this.activeSearchModes.add(mode);
                    } else {
                        this.activeSearchModes.delete(mode);
                    }
                    this._updateLabelVisibility();
                }
            });
        }

        _updateLabelVisibility() {
            const allLabels = [...this.buildingLabels, ...this.subCameraBuildingLabels];
            if (this.isMinimalMode) {
                allLabels.forEach(item => item.element.style.display = 'none');
                return;
            }
            allLabels.forEach(item => item.element.style.display = 'none');

            if (this.activeSearchModes.size === 0) return;

            const groupedLabels = new Map();
            allLabels.forEach(item => {
                const key = item.position.toArray().join(',');
                if (!groupedLabels.has(key)) {
                    groupedLabels.set(key, []);
                }
                groupedLabels.get(key).push(item);
            });

            groupedLabels.forEach(group => {
                let visibleLabel = null;
                if (this.activeSearchModes.has('keikan') && group.some(l => l.type === 'keikan')) {
                    visibleLabel = group.find(l => l.type === 'keikan');
                } else if (this.activeSearchModes.has('bunkazai') && group.some(l => l.type === 'bunkazai')) {
                    visibleLabel = group.find(l => l.type === 'bunkazai');
                } else if (this.activeSearchModes.has('kyomachiya') && group.some(l => l.type === 'kyomachiya')) {
                    visibleLabel = group.find(l => l.type === 'kyomachiya');
                }
                
                if (this.activeSearchModes.size > 1) {
                     if (visibleLabel) visibleLabel.element.style.display = 'block';
                } else {
                     group.forEach(labelItem => {
                         if(this.activeSearchModes.has(labelItem.type)) {
                             labelItem.element.style.display = 'block';
                         }
                     });
                }
            });
        }
        
        _updateBuildingModelsVisibility(layerId) {
            this.interactiveBuildingGroup.visible = false;
            if (this.buildingModel1946) this.buildingModel1946.visible = false;
            if (this.buildingModel1975) this.buildingModel1975.visible = false;

            if (layerId === 'ort_USA10') {

                    this.load1946Model();

            } else if (layerId === 'gazo1') {
                if (this.buildingModel1975) {
                    this.buildingModel1975.visible = true;
                } else {
                    this.load1975Model();
                }
            } else {
                this.interactiveBuildingGroup.visible = true;
            }
        }

setupControls() {
             this.seekBar.min = this.animationStartTime;
             this.seekBar.max = this.animationEndTime;
             this.seekBar.value = this.masterTime;
             this.seekBar.step = 1;

             this.playPauseBtn.addEventListener('click', () => {
                 if (this.timeScale === 0) {
                     if (this.masterTime >= this.animationEndTime) {
                         this.masterTime = this.animationStartTime;
                     }

            };
            window.addEventListener('mousemove', handleMouseMove, false);

            const idAttribute = intersection.object.geometry.attributes._id;

                infoHtml += `<b>地下階数:</b> ${attributes.storeysBelowGround !== null ? attributes.storeysBelowGround : '不明'}<br>`;

            });

positionLabels(camera, viewport, labels, occlusionArea = null) {
            const _vector = new THREE.Vector3();

            for (const item of labels) {
                const { element, position } = item;
                _vector.copy(position);
                _vector.project(camera);

                const isInView = _vector.z < 1 && _vector.x >= -1 && _vector.x <= 1 && _vector.y >= -1 && _vector.y <= 1;
                const isSearchVisible = element.style.display === 'block';

                if (isInView && isSearchVisible) {
                    const x = viewport.left + ((_vector.x + 1) / 2) * viewport.width;
                    const y = viewport.top + ((-_vector.y + 1) / 2) * viewport.height;

                    let isOccluded = false;
                    if (occlusionArea && this.isSubCameraVisible && !this.isCharacterMode) {
                        if (x > occlusionArea.left && x < occlusionArea.right && y > occlusionArea.top && y < occlusionArea.bottom) {
                            isOccluded = true;
                        }
                    }

                    if (isOccluded) {
                        element.style.visibility = 'hidden';
                    } else {
                        element.style.visibility = 'visible';
                        element.style.left = `${x}px`;
                        element.style.top = `${y}px`;
                    }
                } else {
                    // ▼▼▼ 画面外、または検索で非表示の場合はvisibilityをhiddenにする ▼▼▼
                    element.style.visibility = 'hidden';
                }
            }
        }

updateCharacter(deltaTime) {
            if (!this.girlModel || !this.girlMixer) return;

            this.girlMixer.update(deltaTime);
            
            const wasMoving = this.isMoving;
            this.isMoving = this.moveState.force > 0.05;

            if (this.isMoving && !wasMoving) {
                this.cameraFollowOffset.copy(this.camera.position).sub(this.girlModel.position);
            }

            if (this.isMoving) {
                this.controls.enabled = false; 

                const isRunning = this.moveState.force > 0.6;
                this.switchToAction(isRunning ? 'run' : 'walk1child');
                
                const nippleInstance = this.joystickManager.get(0);
                if (nippleInstance && nippleInstance.ui.front) {
                    nippleInstance.ui.front.style.backgroundColor = isRunning ? 'skyblue' : 'white';
                }

                const walkSpeed = 4.0;
                const runSpeed = 10.0;
                const speed = isRunning ? runSpeed : walkSpeed;
                const moveDistance = speed * this.moveState.force * deltaTime;

                const cameraForward = new THREE.Vector3();
                this.camera.getWorldDirection(cameraForward);
                cameraForward.y = 0;
                cameraForward.normalize();
                const cameraRight = new THREE.Vector3().crossVectors(this.camera.up, cameraForward).negate();
                const moveDirection = cameraForward.multiplyScalar(this.moveState.y).add(cameraRight.multiplyScalar(this.moveState.x)).normalize();
                
                const characterAngle = Math.atan2(moveDirection.x, moveDirection.z) + Math.PI;
                const targetQuaternion = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), characterAngle);
                this.girlModel.quaternion.slerp(targetQuaternion, 0.15);
                
                const intendedMove = moveDirection.clone().multiplyScalar(moveDistance);

                const raycaster = new THREE.Raycaster();
                const characterPosition = this.girlModel.position.clone();
                const characterRadius = 0.25;
                const rightVec = new THREE.Vector3().crossVectors(moveDirection, this.camera.up).normalize().multiplyScalar(characterRadius);

                const baseRayOrigins = [
                    characterPosition.clone().add(new THREE.Vector3(0, 0.25, 0)),
                    characterPosition.clone().add(new THREE.Vector3(0, 0.8, 0))
                ];
                const rayOrigins = [];
                baseRayOrigins.forEach(base => {
                    rayOrigins.push(base);
                    rayOrigins.push(base.clone().add(rightVec));
                    rayOrigins.push(base.clone().sub(rightVec));
                });
                
                let collisionDetected = false;
                let collisionNormal = null;

                for (const origin of rayOrigins) {
                    raycaster.set(origin, moveDirection);
                    raycaster.far = 1.0;
                    const intersects = raycaster.intersectObjects(this.wallCollisionMeshes);

                    if (intersects.length > 0) {
                        collisionDetected = true;
                        collisionNormal = intersects[0].face.normal;
                        break; 
                    }
                }

                if (collisionDetected) {
                    const slideDirection = intendedMove.clone();
                    slideDirection.projectOnPlane(collisionNormal);
                    this.girlModel.position.add(slideDirection);
                } else {
                    this.girlModel.position.add(intendedMove);
                }

            } else {
                this.controls.enabled = true;
                this.switchToAction('idle');
                if(this.joystickManager){
                    const nippleInstance = this.joystickManager.get(0);
                    if (nippleInstance && nippleInstance.ui.front) {
                        nippleInstance.ui.front.style.backgroundColor = 'white';
                    }
                }
            }

            // ▼▼▼ コンパスの回転ロジックを最終版に修正 ▼▼▼
            if (this.compassContainer) {
                const cameraDirection = new THREE.Vector3();
                this.camera.getWorldDirection(cameraDirection);
                cameraDirection.y = 0;
                cameraDirection.normalize();

                const angleRad = Math.atan2(cameraDirection.x, cameraDirection.z);
                const angleDeg = -angleRad * 180 / Math.PI; // 正しい回転角度
                
                // コンパスの円盤全体を回転
                this.compassContainer.style.transform = `rotate(${angleDeg}deg)`;
                
                // 文字だけを逆方向に回転させて、向きをまっすぐに保つ
                if (this.compassLabelSpans) {
                    const counterAngleDeg = -angleDeg;
                    this.compassLabelSpans.forEach(span => {
                        span.style.transform = `rotate(${counterAngleDeg}deg)`;
                    });
                }
            }
            // ▲▲▲ 修正ここまで ▲▲▲
        }

        updateCharacterCamera() {
            if (!this.girlModel) return;

            const modelCenter = this.girlModel.position.clone().add(new THREE.Vector3(0, 1, 0));

        }        

animate = (currentTime) => {
             this.animationFrameId = requestAnimationFrame(this.animate.bind(this));
             const delta = this.clock.getDelta();

             if (!this.isScrubbing) {
                 this.masterTime += delta * this.timeScale;
             }
             if (this.masterTime >= this.animationEndTime) {
                 this.masterTime = this.animationEndTime;
                 if (this.timeScale !== 0) {
                     this.timeScale = 0;
                     this.playPauseBtn.textContent = this.isCharacterMode ? '10倍再生' : '100倍再生';
                 }
             }
             if (this.masterTime < this.animationStartTime) {
                 this.masterTime = this.animationStartTime;
             }
             if (!this.isScrubbing) {
                 this.seekBar.value = this.masterTime;
             }
             
             const h = Math.floor(this.masterTime / 3600).toString().padStart(2, '0');
             const m = Math.floor((this.masterTime % 3600) / 60).toString().padStart(2, '0');
             const s = Math.floor(this.masterTime % 60).toString().padStart(2, '0');
             this.timeDisplay.textContent = `時刻: ${h}:${m}:${s}`;
             
             const subViewportSize = 320;
             const occlusionArea = {
                 left: 0,
                 top: window.innerHeight - subViewportSize,
                 right: subViewportSize,
                 bottom: window.innerHeight
             };
             const subViewportRenderer = { left: 0, top: 0, width: subViewportSize, height: subViewportSize };

            this._updateObjectState(this.naginataHokoObject, this.naginataHokoSchedule, this.masterTime, this.specialPositions);
            this._updateObjectState(this.arareTenjinyamaObject, this.arareTenjinyamaSchedule, this.masterTime, this.specialPositions);
            this._updateObjectState(this.uradeyamaObject, this.uradeyamaSchedule, this.masterTime, this.specialPositions);
            this._updateObjectState(this.yamabushiyamaObject, this.yamabushiyamaSchedule, this.masterTime, this.specialPositions);
            this._updateObjectState(this.kankobokoObject, this.kankobokoSchedule, this.masterTime, this.specialPositions);
            this._updateObjectState(this.aburatenjinyamaObject, this.aburatenjinyamaSchedule, this.masterTime, this.specialPositions);
            this._updateObjectState(this.ayagasabokoObject, this.ayagasabokoSchedule, this.masterTime, this.specialPositions);
            this._updateObjectState(this.toroyamaObject, this.toroyamaSchedule, this.masterTime, this.specialPositions);
            this._updateObjectState(this.kikusuibokoObject, this.kikusuibokoSchedule, this.masterTime, this.specialPositions);
            this._updateObjectState(this.hoshoyamaObject, this.hoshoyamaSchedule, this.masterTime, this.specialPositions);
            this._updateObjectState(this.hakugasanObject, this.hakugasanSchedule, this.masterTime, this.specialPositions);
            this._updateObjectState(this.hakurakutenyamaObject, this.hakurakutenyamaSchedule, this.masterTime, this.specialPositions);
            this._updateObjectState(this.tsukihokoObject, this.tsukihokoSchedule, this.masterTime, this.specialPositions);
            this._updateObjectState(this.tokusayamaObject, this.tokusayamaSchedule, this.masterTime, this.specialPositions);
            this._updateObjectState(this.shijokasabokoObject, this.shijokasabokoSchedule, this.masterTime, this.specialPositions);
            this._updateObjectState(this.taishiyamaObject, this.taishiyamaSchedule, this.masterTime, this.specialPositions);
            this._updateObjectState(this.niwatoribokoObject, this.niwatoribokoSchedule, this.masterTime, this.specialPositions);
            this._updateObjectState(this.ashikariyamaObject, this.ashikariyamaSchedule, this.masterTime, this.specialPositions);
            this._updateObjectState(this.kakkyoyamaObject, this.kakkyoyamaSchedule, this.masterTime, this.specialPositions);
            this._updateObjectState(this.mosoyamaObject, this.mosoyamaSchedule, this.masterTime, this.specialPositions);
            this._updateObjectState(this.houkabokoObject, this.houkabokoSchedule, this.masterTime, this.specialPositions);
            this._updateObjectState(this.iwatoyamaObject, this.iwatoyamaSchedule, this.masterTime, this.specialPositions);
            this._updateObjectState(this.funabokoObject, this.funabokoSchedule, this.masterTime, this.specialPositions);

            // ▼▼▼ 変更箇所：ここから新しいロジックを追加 ▼▼▼
            if (this.fixedPointVideoMarkers.length > 0) {
                this.fixedPointVideoMarkers.forEach(marker => {
                    if (marker.displayType === 'timed') {
                        const isVisible = this.masterTime >= marker.startTime && this.masterTime < marker.endTime;
                        marker.logo.visible = isVisible;
                    }
                });
            }
            // ▲▲▲ 変更ここまで ▲▲▲

            let mainViewScale;
            if (this.isCharacterMode) {
                mainViewScale = 1;
            } else {
                const isCloseToGround = this.camera.position.y < 100;
                mainViewScale = isCloseToGround ? 1 : this.yamabokoScale;
            }

             if(this.isCharacterMode) {
                 if (this.mapGroup) this.mapGroup.visible = false;
                 this.updateCharacter(delta);
                 this.updateCharacterCamera();
                 if (this.characterPositionMarker) this.characterPositionMarker.position.set(this.girlModel.position.x, 50.0, this.girlModel.position.z);
             } else {
                if (this.mapGroup && !this.isMinimalMode) this.mapGroup.visible = true;
                const showRoadsInMainView = this.camera.position.y < 100 && !this.isMinimalMode;
                const roadModels = [ this.roadAsphaltModel, this.roadMarkingModel, this.busBayModel, this.gutterModel, this.sidewalkModel ];
                roadModels.forEach(model => { if (model) model.visible = showRoadsInMainView; });
                
                this.updateCameraInfoDisplay();
             }

            // ▼▼▼ 変更点: 感度調整のロジックをカメラのY座標（高さ）基準に変更 ▼▼▼
            if (!this.isCharacterMode) {
                // 1. カメラ自体のY座標（高さ）を取得
                const cameraHeight = this.camera.position.y;

                // 2. 高さに応じて速度を計算するための設定値（ここを調整します）
                const minHeight = 50;   // この高さより低い場合は最も遅くなる
                const maxHeight = 1000; // この高さより高い場合は最も速くなる
                
                const minZoom = 0.1;  // 最も遅いズーム速度
                const maxZoom = 1.0;  // 最も速いズーム速度

                const minRotate = 0.1; // 最も遅い回転速度
                const maxRotate = 1.0; // 最も速い回転速度

                // 3. 高さを0から1の範囲に正規化
                const t = Math.max(0, Math.min(1, (cameraHeight - minHeight) / (maxHeight - minHeight)));

                // 4. 正規化された値を使って、各速度を線形補間で算出
                const newZoomSpeed = minZoom + t * (maxZoom - minZoom);
                const newRotateSpeed = minRotate + t * (maxRotate - minRotate);
                
                // 5. OrbitControlsに新しい速度を適用
                this.controls.zoomSpeed = newZoomSpeed;
                this.controls.rotateSpeed = newRotateSpeed;
            }
            // ▲▲▲ 変更ここまで ▲▲▲

             this.controls.update();

            if (this.isSubCameraVisible && !this.isCharacterMode) {
                this._updateLabelOcclusion(occlusionArea);
            }
            this.positionLabels(this.camera, {left: 0, top: 0, width: window.innerWidth, height: window.innerHeight}, this.buildingLabels, occlusionArea);

            this.renderer.clear();
            this.renderer.setScissorTest(true);

            if (this.subCameraMapGroup) this.subCameraMapGroup.visible = false;
            
            const mainViewport = { left: 0, top: 0, width: window.innerWidth, height: window.innerHeight };
            this.renderer.setViewport(mainViewport.left, 0, mainViewport.width, mainViewport.height);
            this.renderer.setScissor(mainViewport.left, 0, mainViewport.width, mainViewport.height);

            this._setYamabokoModelScale(mainViewScale);
            this.renderer.render(this.scene, this.camera);

            if(this.isSubCameraVisible && !this.isCharacterMode) {
                if (this.mapGroup) this.mapGroup.visible = false;
                if (this.subCameraMapGroup) this.subCameraMapGroup.visible = true;
                
                this.renderer.setViewport(subViewportRenderer.left, subViewportRenderer.top, subViewportRenderer.width, subViewportRenderer.height);
                this.renderer.setScissor(subViewportRenderer.left, subViewportRenderer.top, subViewportRenderer.width, subViewportRenderer.height);
                this.renderer.clear();

                if (this.subCameras.length > 0) {
                    const activeSubCameraIndex = this.activeSubCameraIndex;
                    const activeSubCameraData = this.subCameraData[activeSubCameraIndex];
                    const activeSubCamera = this.subCameras[activeSubCameraIndex];

                    if (activeSubCameraData.type === 'chase') {
                        const target = this[activeSubCameraData.targetName];
                        if (target) {
                            const modelScene = target.children.find(child => child.type === 'Group');
                            const currentScale = modelScene ? modelScene.scale.x : 1;
                            const box = new THREE.Box3().setFromObject(target);
                            const highestPointY = box.max.y / currentScale;

                            const lookAtTarget = new THREE.Vector3(
                                target.position.x,
                                highestPointY - 1,
                                target.position.z
                            );
                            const forward = new THREE.Vector3(0, 0, 1);
                            forward.applyQuaternion(target.quaternion);
                            forward.y = 0;
                            forward.normalize();
                            const cameraOffset = forward.clone().multiplyScalar(-5);
                            const cameraPosition = lookAtTarget.clone().add(cameraOffset);
                            cameraPosition.y = highestPointY + 2;
                            activeSubCamera.position.copy(cameraPosition);
                            activeSubCamera.lookAt(lookAtTarget);
                        }
                    }

                    this.subCameraLabel.textContent = this.subCameraData[this.activeSubCameraIndex].name;
                    this.subCameraSwitchBtn.style.display = 'block';
                    
                    this._setYamabokoModelScale(1);
                    this.renderer.render(this.scene, activeSubCamera);
                    this._setYamabokoModelScale(mainViewScale);
                }
                
                if (this.mapGroup && !this.isMinimalMode) this.mapGroup.visible = true;
            }
            
            this.renderer.setScissorTest(false);
            this.cssRenderer.render(this.cssScene, this.camera);
            this.labelRenderer.render(this.scene, this.camera);
        };


createYoutubeClickableLogo(videoInfo) { 
            const div = document.createElement('div');
            div.className = 'youtube-bubble'; 
            div.style.cursor = 'pointer';
            
            // videoInfo.typeに応じて、色分け用のクラスを追加
            if (videoInfo.type === 'keikan') {
                div.classList.add('youtube-bubble-keikan');
            } else if (videoInfo.type === 'bunkazai') {
                div.classList.add('youtube-bubble-bunkazai');
            }

            // ツールチップ表示のためにdata-name属性に名称を設定
            div.dataset.name = videoInfo.name;
            // ネイティブのtitle属性も設定しておくと親切
            div.title = `動画を再生: ${videoInfo.name}`;

            div.style.pointerEvents = 'auto';

            const img = document.createElement('img');
            img.src = 'https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg';
            div.appendChild(img);
            
            const logoObject = new CSS2DObject(div);

            // ▼▼▼ 変更箇所：イベントハンドラを修正 ▼▼▼
            // userDataに依存せず、クロージャ内のvideoInfoを直接参照するように変更
            div.addEventListener('click', (e) => {
                e.stopPropagation();
                // videoInfoオブジェクトがURLプロパティを持っているか確認
                if (videoInfo && videoInfo.url) {
                    this.showVideoModal(videoInfo.url);
                }
            });
            // ▲▲▲ 変更ここまで ▲▲▲

            return logoObject;
        }

        showVideoModal(videoUrl) {
            // もしシミュレーションが再生中なら停止する
            if (this.timeScale > 0) {
                this.timeScale = 0;
                // ボタンのテキストを再生可能状態に戻す
                const playText = this.isCharacterMode ? '▶ | 10倍再生' : '▶ | 100倍再生';
                this.playPauseBtn.innerHTML = playText;
            }
            
            // iframeを作成し、自動再生オプションを付けてコンテナに挿入
            const iframe = document.createElement('iframe');
            iframe.width = "560";
            iframe.height = "315";
            // autoplay=1 をURLに追加して自動再生
            iframe.src = `${videoUrl}&autoplay=1`;
            iframe.title = "YouTube video player";
            iframe.frameBorder = "0";
            iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
            iframe.referrerPolicy = "strict-origin-when-cross-origin";
            iframe.allowFullscreen = true;

            // コンテナを一度空にしてからiframeを追加
            this.youtubePlayerContainer.innerHTML = '';
            this.youtubePlayerContainer.appendChild(iframe);

            // モーダルを表示
            this.videoModal.style.display = 'flex';
        }

    }



    
    
    window.addEventListener('DOMContentLoaded', () => {
        new GionSimulationApp();
    });
</script>
