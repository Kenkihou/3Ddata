<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>祇園祭山鉾巡行デモ（スマホ対応最終版）</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #clock-display {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 24px;
            font-family: monospace;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 5px;
            z-index: 10;
        }
        
        /* ★★★ ここからがレイアウトの修正箇所です ★★★ */
        #controls-container {
            position: absolute;
            bottom: 0; /* 画面下部に配置 */
            left: 0;
            right: 0;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px 0; /* 上下のパディングのみに */
            display: flex;
            justify-content: center; /* 中身を中央揃え */
            align-items: center;
            gap: 15px;
            z-index: 10;
        }
        #controls-container button {
            padding: 8px 12px;
            font-size: 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #444;
            color: white;
            width: 120px;
            text-align: center;
            flex-shrink: 0;
        }
        #controls-container button:hover {
            background-color: #666;
        }

        #slider-wrapper {
            position: relative;
            width: 600px;
            height: 20px;
            display: flex;
            align-items: center;
        }
        
        /* スマホ縦長表示用の設定 */
        @media (max-width: 768px) {
            #controls-container {
                flex-direction: column; /* 縦並びに変更 */
                gap: 10px;
                padding: 10px; /* 全方向にパディングを少し入れる */
            }
            #slider-wrapper {
                width: 80vw; /* 画面幅の80%を指定 */
            }
        }
        /* ★★★ 修正はここまで ★★★ */
        
        #slider-ticks {
            position: absolute;
            width: 100%;
            height: 8px;
            background-color: #555;
            border-radius: 4px;
            pointer-events: none;
        }
        .slider-tick {
            position: absolute;
            width: 2px;
            height: 100%;
            background-color: #888;
            transform: translateX(-50%);
        }

        #time-slider {
            -webkit-appearance: none; appearance: none;
            width: 100%; height: 100%; background: transparent;
            cursor: pointer; margin: 0; position: relative; z-index: 2;
        }
        #time-slider::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 18px; height: 18px; background: #2196F3;
            border-radius: 50%; border: 2px solid white; margin-top: 1px;
        }
        #time-slider::-moz-range-thumb {
            width: 14px; height: 14px; background: #2196F3;
            border-radius: 50%; border: 2px solid white;
        }

        .yamaboko-label {
            color: black; background-color: rgba(255, 255, 255, 0.75); padding: 4px 6px;
            border-radius: 4px; font-family: "Helvetica", "Arial", sans-serif; font-weight: bold;
            font-size: 14px; writing-mode: vertical-rl; text-orientation: upright; white-space: nowrap;
        }
        .waypoint-label {
            color: white; background-color: rgba(0, 0, 0, 0.6); padding: 3px 10px;
            border-radius: 10px; font-family: monospace; font-size: 16px; font-weight: bold;
        }
        .kuji-aratame-label, .shimenawa-kiri-label, .tsujimawashi-label {
            color: white; padding: 5px 10px; border-radius: 8px; position: relative;
            font-size: 14px; font-weight: bold; white-space: nowrap;
        }
        .kuji-aratame-label { background: #2196F3; }
        .shimenawa-kiri-label { background: #F44336; }
        .tsujimawashi-label { background: #FF9800; }
        .kuji-aratame-label::after, .shimenawa-kiri-label::after, .tsujimawashi-label::after {
            content: ''; position: absolute; bottom: 0; left: 50%; width: 0; height: 0;
            border: 8px solid transparent; border-bottom: 0; margin-left: -8px; margin-bottom: -8px;
        }
        .kuji-aratame-label::after { border-top-color: #2196F3; }
        .shimenawa-kiri-label::after { border-top-color: #F44336; }
        .tsujimawashi-label::after { border-top-color: #FF9800; }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="clock-display">08:30:00</div>
    <div id="controls-container">
        <button id="play-pause-button">▶✖１００</button>
        <div id="slider-wrapper">
            <div id="slider-ticks"></div>
            <input type="range" id="time-slider">
        </div>
    </div>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    
    let labelRenderer;
    labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0px';
    labelRenderer.domElement.style.pointerEvents = 'none';
    document.body.appendChild(labelRenderer.domElement);
    
    const controls = new OrbitControls(camera, renderer.domElement);
    const clock = new THREE.Clock();
    const clockDisplay = document.getElementById('clock-display');
    const timeSlider = document.getElementById('time-slider');
    const playPauseButton = document.getElementById('play-pause-button');
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
    directionalLight.position.set(50, 100, 50);
    scene.add(directionalLight);

    function createCSSLabel(text, className) {
        const div = document.createElement('div');
        div.className = className;
        div.textContent = text;
        const label = new CSS2DObject(div);
        return label;
    }

    let naginataHokoObject, arareTenjinyamaObject, uradeyamaObject, yamabushiyamaObject, kankobokoObject, aburatenjinyamaObject, ayagasabokoObject, toroyamaObject, kikusuibokoObject, hoshoyamaObject, hakugasanObject, hakurakutenyamaObject, tsukihokoObject, tokusayamaObject, shijokasabokoObject, taishiyamaObject, niwatoribokoObject, ashikariyamaObject, kakkyoyamaObject, mosoyamaObject, houkabokoObject, iwatoyamaObject, funabokoObject;
    let naginataHokoSchedule = [], arareTenjinyamaSchedule = [], uradeyamaSchedule = [], yamabushiyamaSchedule = [], kankobokoSchedule = [], aburatenjinyamaSchedule = [], ayagasabokoSchedule = [], toroyamaSchedule = [], kikusuibokoSchedule = [], hoshoyamaSchedule = [], hakugasanSchedule = [], hakurakutenyamaSchedule = [], tsukihokoSchedule = [], tokusayamaSchedule = [], shijokasabokoSchedule = [], taishiyamaSchedule = [], niwatoribokoSchedule = [], ashikariyamaSchedule = [], kakkyoyamaSchedule = [], mosoyamaSchedule = [], houkabokoSchedule = [], iwatoyamaSchedule = [], funabokoSchedule = [];
    let timeScale = 0;
    const animationStartTime = 8 * 3600 + 30 * 60;
    const animationEndTime = 15 * 3600 + 15 * 60;
    let masterTime = 8 * 3600 + 30 * 60;
    let isScrubbing = false;

    naginataHokoObject = new THREE.Group(); scene.add(naginataHokoObject);
    arareTenjinyamaObject = new THREE.Group(); scene.add(arareTenjinyamaObject);
    uradeyamaObject = new THREE.Group(); scene.add(uradeyamaObject);
    yamabushiyamaObject = new THREE.Group(); scene.add(yamabushiyamaObject);
    kankobokoObject = new THREE.Group(); scene.add(kankobokoObject);
    aburatenjinyamaObject = new THREE.Group(); scene.add(aburatenjinyamaObject);
    ayagasabokoObject = new THREE.Group(); scene.add(ayagasabokoObject);
    toroyamaObject = new THREE.Group(); scene.add(toroyamaObject);
    kikusuibokoObject = new THREE.Group(); scene.add(kikusuibokoObject);
    hoshoyamaObject = new THREE.Group(); scene.add(hoshoyamaObject);
    hakugasanObject = new THREE.Group(); scene.add(hakugasanObject);
    hakurakutenyamaObject = new THREE.Group(); scene.add(hakurakutenyamaObject);
    tsukihokoObject = new THREE.Group(); scene.add(tsukihokoObject);
    tokusayamaObject = new THREE.Group(); scene.add(tokusayamaObject);
    shijokasabokoObject = new THREE.Group(); scene.add(shijokasabokoObject);
    taishiyamaObject = new THREE.Group(); scene.add(taishiyamaObject);
    niwatoribokoObject = new THREE.Group(); scene.add(niwatoribokoObject);
    ashikariyamaObject = new THREE.Group(); scene.add(ashikariyamaObject);
    kakkyoyamaObject = new THREE.Group(); scene.add(kakkyoyamaObject);
    mosoyamaObject = new THREE.Group(); scene.add(mosoyamaObject);
    houkabokoObject = new THREE.Group(); scene.add(houkabokoObject);
    iwatoyamaObject = new THREE.Group(); scene.add(iwatoyamaObject);
    funabokoObject = new THREE.Group(); scene.add(funabokoObject);

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');
    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader);
    const jsonLoader = new THREE.FileLoader();
    function loadGLB(url) { return new Promise((resolve, reject) => { loader.load(url, resolve, undefined, reject); }); }
    function loadJSON(url) { return new Promise((resolve, reject) => { jsonLoader.load(url, (data) => resolve(JSON.parse(data)), undefined, reject); }); }

    let allWaypoints;
    let specialPositions;

    Promise.all([
        loadGLB(`../gion_asset2/長刀鉾.glb?v=${Date.now()}`), loadGLB(`../gion_asset2/霰天神山.glb?v=${Date.now()}`), loadGLB(`../gion_asset2/占出山.glb?v=${Date.now()}`),
        loadGLB(`../gion_asset2/長刀鉾パス.glb?v=${Date.now()}`), loadGLB(`../gion_asset2/霰天神山パス.glb?v=${Date.now()}`), loadGLB(`../gion_asset2/占出山パス.glb?v=${Date.now()}`),
        loadGLB(`../gion_asset2/山伏山.glb?v=${Date.now()}`), loadGLB(`../gion_asset2/山伏山パス.glb?v=${Date.now()}`),
        loadGLB(`../gion_asset2/函谷鉾.glb?v=${Date.now()}`), loadGLB(`../gion_asset2/函谷鉾パス.glb?v=${Date.now()}`),
        loadGLB(`../gion_asset2/油天神山.glb?v=${Date.now()}`), loadGLB(`../gion_asset2/油天神山パス.glb?v=${Date.now()}`),
        loadGLB(`../gion_asset2/綾傘鉾.glb?v=${Date.now()}`), loadGLB(`../gion_asset2/綾傘鉾パス.glb?v=${Date.now()}`),
        loadGLB(`../gion_asset2/蟷螂山.glb?v=${Date.now()}`), loadGLB(`../gion_asset2/蟷螂山パス.glb?v=${Date.now()}`),
        loadGLB(`../gion_asset2/菊水鉾.glb?v=${Date.now()}`), loadGLB(`../gion_asset2/菊水鉾パス.glb?v=${Date.now()}`),
        loadGLB(`../gion_asset2/保昌山.glb?v=${Date.now()}`), loadGLB(`../gion_asset2/保昌山パス.glb?v=${Date.now()}`),
        loadGLB(`../gion_asset2/伯牙山.glb?v=${Date.now()}`), loadGLB(`../gion_asset2/伯牙山パス.glb?v=${Date.now()}`),
        loadGLB(`../gion_asset2/白楽天山.glb?v=${Date.now()}`), loadGLB(`../gion_asset2/白楽天山パス.glb?v=${Date.now()}`),
        loadGLB(`../gion_asset2/月鉾.glb?v=${Date.now()}`), loadGLB(`../gion_asset2/月鉾パス.glb?v=${Date.now()}`),
        loadGLB(`../gion_asset2/木賊山.glb?v=${Date.now()}`), loadGLB(`../gion_asset2/木賊山パス.glb?v=${Date.now()}`),
        loadGLB(`../gion_asset2/四条傘鉾.glb?v=${Date.now()}`), loadGLB(`../gion_asset2/四条傘鉾パス.glb?v=${Date.now()}`),
        loadGLB(`../gion_asset2/太子山.glb?v=${Date.now()}`), loadGLB(`../gion_asset2/太子山パス.glb?v=${Date.now()}`),
        loadGLB(`../gion_asset2/鶏鉾.glb?v=${Date.now()}`), loadGLB(`../gion_asset2/鶏鉾パス.glb?v=${Date.now()}`),
        loadGLB(`../gion_asset2/芦刈山.glb?v=${Date.now()}`), loadGLB(`../gion_asset2/芦刈山パス.glb?v=${Date.now()}`),
        loadGLB(`../gion_asset2/郭巨山.glb?v=${Date.now()}`), loadGLB(`../gion_asset2/郭巨山パス.glb?v=${Date.now()}`),
        loadGLB(`../gion_asset2/孟宗山.glb?v=${Date.now()}`), loadGLB(`../gion_asset2/孟宗山パス.glb?v=${Date.now()}`),
        loadGLB(`../gion_asset2/放下鉾.glb?v=${Date.now()}`), loadGLB(`../gion_asset2/放下鉾パス.glb?v=${Date.now()}`),
        loadGLB(`../gion_asset2/岩戸山.glb?v=${Date.now()}`), loadGLB(`../gion_asset2/岩戸山パス.glb?v=${Date.now()}`),
        loadGLB(`../gion_asset2/船鉾.glb?v=${Date.now()}`), loadGLB(`../gion_asset2/船鉾パス.glb?v=${Date.now()}`),
        loadGLB(`../gion_asset2/中継地点0909.glb?v=${Date.now()}`),
        loadGLB(`../gion_asset2/全経路0909.glb?v=${Date.now()}`),
        loadJSON(`山鉾時刻表.json?v=${Date.now()}`)
    ]).then((results) => {
        const [
            naginataHokoGltf, arareTenjinyamaGltf, uradeyamaGltf, naginataHokoMovementPathGltf, arareTenjinyamaMovementPathGltf, uradeyamaMovementPathGltf,
            yamabushiyamaGltf, yamabushiyamaMovementPathGltf, kankobokoGltf, kankobokoMovementPathGltf, aburatenjinyamaGltf, aburatenjinyamaMovementPathGltf, ayagasabokoGltf, ayagasabokoMovementPathGltf,
            toroyamaGltf, toroyamaMovementPathGltf, kikusuibokoGltf, kikusuibokoMovementPathGltf, hoshoyamaGltf, hoshoyamaMovementPathGltf, hakugasanGltf, hakugasanMovementPathGltf,
            hakurakutenyamaGltf, hakurakutenyamaMovementPathGltf, tsukihokoGltf, tsukihokoMovementPathGltf, tokusayamaGltf, tokusayamaMovementPathGltf, shijokasabokoGltf, shijokasabokoMovementPathGltf,
            taishiyamaGltf, taishiyamaMovementPathGltf, niwatoribokoGltf, niwatoribokoMovementPathGltf, ashikariyamaGltf, ashikariyamaMovementPathGltf, kakkyoyamaGltf, kakkyoyamaMovementPathGltf,
            mosoyamaGltf, mosoyamaMovementPathGltf, houkabokoGltf, houkabokoMovementPathGltf, iwatoyamaGltf, iwatoyamaMovementPathGltf, funabokoGltf, funabokoMovementPathGltf,
            waypointsGltf, displayPathGltf, timetableData
        ] = results;

        allWaypoints = extractWaypoints(waypointsGltf.scene);
        
        specialPositions = {
            shijoSakaimachi: allWaypoints.get('四条堺町'),
            shijoFuyacho: allWaypoints.get('四条麩屋町')
        };
        
        const tsujimawashiTargets = ['長刀鉾', '函谷鉾', '菊水鉾', '月鉾', '鶏鉾', '放下鉾', '岩戸山', '船鉾'];

        const setupYamaboko = (object, modelGltf, pathGltf, name, timetable, labelHeight, eventLabelHeight) => {
            const path = createPathFromGltf(pathGltf);
            const model = modelGltf.scene;
            model.scale.set(5, 5, 5);
            object.add(model);
            const nameLabel = createCSSLabel(name, "yamaboko-label");
            nameLabel.position.set(0, labelHeight, 0);
            object.add(nameLabel);
            const kujiAratameLabel = createCSSLabel("くじ改め", "kuji-aratame-label");
            kujiAratameLabel.name = 'kujiAratameLabel';
            kujiAratameLabel.position.set(0, eventLabelHeight, 0);
            kujiAratameLabel.visible = false;
            object.add(kujiAratameLabel);
            
            if (tsujimawashiTargets.includes(name)) {
                const tsujimawashiLabel = createCSSLabel("辻回し", "tsujimawashi-label");
                tsujimawashiLabel.name = 'tsujimawashiLabel';
                tsujimawashiLabel.position.set(0, eventLabelHeight, 0);
                tsujimawashiLabel.visible = false;
                object.add(tsujimawashiLabel);
            }

            return createSchedule(name, timetable, allWaypoints, path);
        };
        
        naginataHokoSchedule = setupYamaboko(naginataHokoObject, naginataHokoGltf, naginataHokoMovementPathGltf, "長刀鉾", timetableData.長刀鉾時刻表, 90, 120);
        const shimenawaKiriLabel = createCSSLabel("しめ縄切り", "shimenawa-kiri-label");
        shimenawaKiriLabel.name = 'shimenawaKiriLabel';
        shimenawaKiriLabel.position.set(0, 150, 0);
        shimenawaKiriLabel.visible = false;
        naginataHokoObject.add(shimenawaKiriLabel);

        arareTenjinyamaSchedule = setupYamaboko(arareTenjinyamaObject, arareTenjinyamaGltf, arareTenjinyamaMovementPathGltf, "霰天神山", timetableData.霰天神山時刻表, 72, 95);
        uradeyamaSchedule = setupYamaboko(uradeyamaObject, uradeyamaGltf, uradeyamaMovementPathGltf, "占出山", timetableData.占出山時刻表, 60, 85);
        yamabushiyamaSchedule = setupYamaboko(yamabushiyamaObject, yamabushiyamaGltf, yamabushiyamaMovementPathGltf, "山伏山", timetableData.山伏山時刻表, 75, 100);
        kankobokoSchedule = setupYamaboko(kankobokoObject, kankobokoGltf, kankobokoMovementPathGltf, "函谷鉾", timetableData.函谷鉾時刻表, 75, 100);
        aburatenjinyamaSchedule = setupYamaboko(aburatenjinyamaObject, aburatenjinyamaGltf, aburatenjinyamaMovementPathGltf, "油天神山", timetableData.油天神山時刻表, 75, 100);
        ayagasabokoSchedule = setupYamaboko(ayagasabokoObject, ayagasabokoGltf, ayagasabokoMovementPathGltf, "綾傘鉾", timetableData.綾傘鉾時刻表, 75, 100);
        toroyamaSchedule = setupYamaboko(toroyamaObject, toroyamaGltf, toroyamaMovementPathGltf, "蟷螂山", timetableData.蟷螂山時刻表, 75, 100);
        kikusuibokoSchedule = setupYamaboko(kikusuibokoObject, kikusuibokoGltf, kikusuibokoMovementPathGltf, "菊水鉾", timetableData.菊水鉾時刻表, 75, 100);
        hoshoyamaSchedule = setupYamaboko(hoshoyamaObject, hoshoyamaGltf, hoshoyamaMovementPathGltf, "保昌山", timetableData.保昌山時刻表, 75, 100);
        hakugasanSchedule = setupYamaboko(hakugasanObject, hakugasanGltf, hakugasanMovementPathGltf, "伯牙山", timetableData.伯牙山時刻表, 75, 100);
        hakurakutenyamaSchedule = setupYamaboko(hakurakutenyamaObject, hakurakutenyamaGltf, hakurakutenyamaMovementPathGltf, "白楽天山", timetableData.白楽天山時刻表, 75, 100);
        tsukihokoSchedule = setupYamaboko(tsukihokoObject, tsukihokoGltf, tsukihokoMovementPathGltf, "月鉾", timetableData.月鉾時刻表, 75, 100);
        tokusayamaSchedule = setupYamaboko(tokusayamaObject, tokusayamaGltf, tokusayamaMovementPathGltf, "木賊山", timetableData.木賊山時刻表, 75, 100);
        shijokasabokoSchedule = setupYamaboko(shijokasabokoObject, shijokasabokoGltf, shijokasabokoMovementPathGltf, "四条傘鉾", timetableData.四条傘鉾時刻表, 75, 100);
        taishiyamaSchedule = setupYamaboko(taishiyamaObject, taishiyamaGltf, taishiyamaMovementPathGltf, "太子山", timetableData.太子山時刻表, 75, 100);
        niwatoribokoSchedule = setupYamaboko(niwatoribokoObject, niwatoribokoGltf, niwatoribokoMovementPathGltf, "鶏鉾", timetableData.鶏鉾時刻表, 75, 100);
        ashikariyamaSchedule = setupYamaboko(ashikariyamaObject, ashikariyamaGltf, ashikariyamaMovementPathGltf, "芦刈山", timetableData.芦刈山時刻表, 75, 100);
        kakkyoyamaSchedule = setupYamaboko(kakkyoyamaObject, kakkyoyamaGltf, kakkyoyamaMovementPathGltf, "郭巨山", timetableData.郭巨山時刻表, 75, 100);
        mosoyamaSchedule = setupYamaboko(mosoyamaObject, mosoyamaGltf, mosoyamaMovementPathGltf, "孟宗山", timetableData.孟宗山時刻表, 75, 100);
        houkabokoSchedule = setupYamaboko(houkabokoObject, houkabokoGltf, houkabokoMovementPathGltf, "放下鉾", timetableData.放下鉾時刻表, 75, 100);
        iwatoyamaSchedule = setupYamaboko(iwatoyamaObject, iwatoyamaGltf, iwatoyamaMovementPathGltf, "岩戸山", timetableData.岩戸山時刻表, 75, 100);
        funabokoSchedule = setupYamaboko(funabokoObject, funabokoGltf, funabokoMovementPathGltf, "船鉾", timetableData.船鉾時刻表, 75, 100);
        
        const waypointsToShow = [
            '四条新町', '四条堺町', '四条河原町', 
            '河原町御池', '新町御池', '四条烏丸', '河原町三条'
        ];
        allWaypoints.forEach((pos, name) => {
            if (waypointsToShow.includes(name)) {
                const label = createCSSLabel(name, "waypoint-label");
                label.position.copy(pos).y += 20;
                scene.add(label);
            }
        });
        
        const allPoints = [...allWaypoints.values()];
        const boundingBox = new THREE.Box3().setFromPoints(allPoints);
        const center = new THREE.Vector3();
        boundingBox.getCenter(center);
        
        camera.position.copy(center);
        camera.position.y += 600;
        camera.position.z += 900;
        camera.lookAt(center);
        controls.target.copy(center);

        controls.update();

        loader.load(
            'tran_3.glb',
            function (gltf) {
                const model = gltf.scene;
                scene.add(model);
            },
            undefined, 
            function (error) {
                console.error('An error happened while loading tran_3.glb:', error);
            }
        );

    }).catch(error => { console.error("ファイルのいずれかの読み込みに失敗しました:", error); });

    function extractWaypoints(sceneObject) {
        const waypointPositions = new Map();
        sceneObject.traverse((child) => {
            if (child.isObject3D && child.name) {
                const worldPos = new THREE.Vector3();
                child.getWorldPosition(worldPos);
                waypointPositions.set(child.name, worldPos);
            }
        });
        return waypointPositions;
    }

    function createPathFromGltf(gltf) {
        const points = [];
        gltf.scene.traverse(obj => {
            if (obj.isLine || obj.isMesh) {
                const positionAttribute = obj.geometry.getAttribute('position');
                if (positionAttribute) {
                    for (let i = 0; i < positionAttribute.count; i++) {
                        const point = new THREE.Vector3();
                        point.fromBufferAttribute(positionAttribute, i);
                        obj.localToWorld(point);
                        if (!points.length || !points[points.length - 1].equals(point)) {
                            points.push(point);
                        }
                    }
                }
            }
        });
        if (points.length < 2) return null;
        const path = new THREE.CurvePath();
        for (let i = 0; i < points.length - 1; i++) {
            path.add(new THREE.LineCurve3(points[i], points[i + 1]));
        }
        return path;
    }

    function createSchedule(yamabokoName, timetable, waypointPositions, fullPath) {
        const schedule = [];
        if (!fullPath || !timetable) return schedule;
        const tsujimawashiNames = ['四条河原町', '河原町御池', '新町御池', '四条新町'];
        const pathPoints = fullPath.getPoints(2000);
        const findForwardClosestPointIndex = (targetPos, searchFromIndex) => {
            let closestIndex = searchFromIndex;
            let minDistance = Infinity;
            if (searchFromIndex >= 0 && searchFromIndex < pathPoints.length) {
                minDistance = pathPoints[searchFromIndex].distanceTo(targetPos);
            } else { return 0; }
            for (let i = searchFromIndex; i < pathPoints.length; i++) {
                const distance = pathPoints[i].distanceTo(targetPos);
                if (distance < minDistance) {
                    minDistance = distance;
                    closestIndex = i;
                }
            }
            return closestIndex;
        };
        const findWrappedClosestPointIndex = (targetPos, searchToIndex) => {
             let closestIndex = 0;
             let minDistance = Infinity;
             if (searchToIndex > 0 && pathPoints.length > 0) {
                minDistance = pathPoints[0].distanceTo(targetPos);
             } else { return 0; }
             for (let i = 0; i < searchToIndex; i++) {
                const distance = pathPoints[i].distanceTo(targetPos);
                if (distance < minDistance) {
                    minDistance = distance;
                    closestIndex = i;
                }
             }
             return closestIndex;
        };
        const timeToSeconds = (timeStr) => {
            const [h, m, s] = timeStr.split(':').map(Number);
            return h * 3600 + m * 60 + s;
        };
        let lastPathIndex = 0;
        for (let i = 0; i < timetable.length - 1; i++) {
            const startEntry = timetable[i];
            const endEntry = timetable[i + 1];
            const startTime = timeToSeconds(startEntry.time);
            const endTime = timeToSeconds(endEntry.time);
            const startPos = waypointPositions.get(startEntry.place);
            const endPos = waypointPositions.get(endEntry.place);
            if (!startPos || !endPos) continue;
            const event = { startTime, endTime };
            const isTurnEvent = tsujimawashiNames.includes(startEntry.place) && startEntry.place === endEntry.place;
            if (isTurnEvent) {
                if (startTime > endTime) continue;
                event.type = 'TURN';
                event.position = startPos;
                let preTurnWaypointName = startEntry.place + "-1";
                if ((yamabokoName === "船鉾" || yamabokoName === "岩戸山") && startEntry.place === "四条新町") {
                    preTurnWaypointName = startEntry.place + "-2";
                }
                const preTurnPos = waypointPositions.get(preTurnWaypointName);
                const postTurnPos = waypointPositions.get(startEntry.place + "+1");
                if (preTurnPos && postTurnPos) {
                    event.startDirection = new THREE.Vector3().subVectors(startPos, preTurnPos).normalize();
                    event.endDirection = new THREE.Vector3().subVectors(postTurnPos, startPos).normalize();
                }
            } else if (startPos.equals(endPos)) {
                if (startTime > endTime) continue;
                event.type = 'STOP';
                event.position = startPos;
            } else {
                if (startTime >= endTime) continue;
                event.type = 'MOVE';
                const startIndex = findForwardClosestPointIndex(startPos, lastPathIndex);
                let endIndex = findForwardClosestPointIndex(endPos, startIndex);
                const forwardMatchDistance = pathPoints[endIndex].distanceTo(endPos);
                const wrappedEndIndex = findWrappedClosestPointIndex(endPos, startIndex);
                const wrappedMatchDistance = pathPoints[wrappedEndIndex].distanceTo(endPos);
                if (wrappedMatchDistance < forwardMatchDistance * 0.8) {
                    endIndex = wrappedEndIndex;
                }
                if (startIndex !== -1 && endIndex !== -1) {
                    let segmentPoints;
                    if (startIndex <= endIndex) {
                        segmentPoints = pathPoints.slice(startIndex, endIndex + 1);
                    } else {
                        const part1 = pathPoints.slice(startIndex);
                        const part2 = pathPoints.slice(0, endIndex + 1);
                        segmentPoints = part1.concat(part2);
                    }
                    if (segmentPoints.length > 1) {
                        const path = new THREE.CurvePath();
                        for (let j = 0; j < segmentPoints.length - 1; j++) {
                            path.add(new THREE.LineCurve3(segmentPoints[j], segmentPoints[j + 1]));
                        }
                        event.path = path;
                    } else {
                        event.type = 'FALLBACK_MOVE';
                        event.startPos = startPos;
                        event.endPos = endPos;
                    }
                } else {
                    event.type = 'FALLBACK_MOVE';
                    event.startPos = startPos;
                    event.endPos = endPos;
                }
                lastPathIndex = endIndex;
            }
            schedule.push(event);
        }
        return schedule;
    }
    
    function setupUI() {
        timeSlider.min = animationStartTime;
        timeSlider.max = animationEndTime;
        timeSlider.value = masterTime;
        timeSlider.step = 1;
        
        playPauseButton.addEventListener('click', () => {
            if (timeScale === 0) {
                if (masterTime >= animationEndTime) {
                    masterTime = animationStartTime;
                }
                timeScale = 100;
                playPauseButton.textContent = '❚❚';
            } else {
                timeScale = 0;
                playPauseButton.textContent = '▶✖１００';
            }
        });

        timeSlider.addEventListener('input', () => {
            masterTime = parseInt(timeSlider.value, 10);
        });
        timeSlider.addEventListener('mousedown', () => { isScrubbing = true; });
        timeSlider.addEventListener('mouseup', () => { isScrubbing = false; });
        
        const sliderTicksContainer = document.getElementById('slider-ticks');
        const totalDuration = animationEndTime - animationStartTime;
        
        for (let time = animationStartTime; time <= animationEndTime; time += 30 * 60) {
            const tick = document.createElement('div');
            tick.className = 'slider-tick';
            
            const percent = ((time - animationStartTime) / totalDuration) * 100;
            tick.style.left = `${percent}%`;
            
            sliderTicksContainer.appendChild(tick);
        }
    }
    setupUI();

    function updateObjectState(movingObject, schedule, currentTime, specialPositions) {
        if (!movingObject || movingObject.children.length === 0) return;

        const kujiAratameLabel = movingObject.getObjectByName('kujiAratameLabel');
        const shimenawaKiriLabel = movingObject.getObjectByName('shimenawaKiriLabel');
        const tsujimawashiLabel = movingObject.getObjectByName('tsujimawashiLabel');

        if (kujiAratameLabel) kujiAratameLabel.visible = false;
        if (shimenawaKiriLabel) shimenawaKiriLabel.visible = false;
        if (tsujimawashiLabel) tsujimawashiLabel.visible = false;

        let currentEvent = schedule.find(e => currentTime >= e.startTime && currentTime < e.endTime);
        
        if (currentEvent) {
            const eventDuration = currentEvent.endTime - currentEvent.startTime;
            const eventProgress = eventDuration > 0 ? (currentTime - currentEvent.startTime) / eventDuration : 1;
            const forward = new THREE.Vector3(0, 0, 1);
            switch (currentEvent.type) {
                case 'MOVE':
                    if (currentEvent.path && currentEvent.path.getLength() > 0) {
                        const currentPosition = currentEvent.path.getPointAt(eventProgress);
                        movingObject.position.copy(currentPosition);
                        const tangent = currentEvent.path.getTangentAt(eventProgress).normalize();
                        const lookAtPosition = new THREE.Vector3().addVectors(currentPosition, tangent);
                        movingObject.lookAt(lookAtPosition);
                    }
                    break;
                case 'STOP':
                    movingObject.position.copy(currentEvent.position);
                    if (kujiAratameLabel && specialPositions.shijoSakaimachi && currentEvent.position.equals(specialPositions.shijoSakaimachi)) {
                        kujiAratameLabel.visible = true;
                    }
                    if (shimenawaKiriLabel && specialPositions.shijoFuyacho && currentEvent.position.equals(specialPositions.shijoFuyacho)) {
                        shimenawaKiriLabel.visible = true;
                    }
                    break;
                case 'TURN':
                    movingObject.position.copy(currentEvent.position);
                    if (currentEvent.startDirection && currentEvent.endDirection) {
                        const startQuat = new THREE.Quaternion().setFromUnitVectors(forward, currentEvent.startDirection);
                        const endQuat = new THREE.Quaternion().setFromUnitVectors(forward, currentEvent.endDirection);
                        const currentQuat = new THREE.Quaternion().copy(startQuat);
                        currentQuat.slerp(endQuat, eventProgress);
                        movingObject.quaternion.copy(currentQuat);
                    }
                    if (tsujimawashiLabel) {
                        tsujimawashiLabel.visible = true;
                    }
                    break;
                case 'FALLBACK_MOVE':
                    movingObject.position.lerpVectors(currentEvent.startPos, currentEvent.endPos, eventProgress);
                    break;
            }
        } else {
            const pastEvents = schedule.filter(e => e.endTime <= currentTime);
            if (pastEvents.length > 0) {
                const lastEvent = pastEvents[pastEvents.length - 1];
                const forward = new THREE.Vector3(0, 0, 1);
                switch (lastEvent.type) {
                    case 'MOVE':
                        if (lastEvent.path && lastEvent.path.getLength() > 0) {
                            const finalPosition = lastEvent.path.getPointAt(1);
                            movingObject.position.copy(finalPosition);
                            const finalTangent = lastEvent.path.getTangentAt(1).normalize();
                            const lookAtPosition = new THREE.Vector3().addVectors(finalPosition, finalTangent);
                            movingObject.lookAt(lookAtPosition);
                        }
                        break;
                    case 'STOP': 
                        movingObject.position.copy(lastEvent.position);
                        break;
                    case 'TURN':
                        movingObject.position.copy(lastEvent.position);
                        if (lastEvent.startDirection && lastEvent.endDirection) {
                            const endQuat = new THREE.Quaternion().setFromUnitVectors(forward, lastEvent.endDirection);
                            movingObject.quaternion.copy(endQuat);
                        }
                        break;
                    case 'FALLBACK_MOVE':
                        movingObject.position.copy(lastEvent.endPos);
                        break;
                }
            }
        }
    }

    function animate() {
        requestAnimationFrame(animate);
        const deltaTime = clock.getDelta();
        if (!isScrubbing) {
            masterTime += deltaTime * timeScale;
        }

        if (masterTime >= animationEndTime) {
            masterTime = animationEndTime;
            if (timeScale !== 0) {
                timeScale = 0;
                playPauseButton.textContent = '▶✖１００';
            }
        }
        if (masterTime < animationStartTime) {
            masterTime = animationStartTime;
        }
        
        const h = Math.floor(masterTime / 3600).toString().padStart(2, '0');
        const m = Math.floor((masterTime % 3600) / 60).toString().padStart(2, '0');
        const s = Math.floor(masterTime % 60).toString().padStart(2, '0');
        clockDisplay.textContent = `${h}:${m}:${s}`;
        
        if (!isScrubbing) {
            timeSlider.value = masterTime;
        }
        
        updateObjectState(naginataHokoObject, naginataHokoSchedule, masterTime, specialPositions);
        updateObjectState(arareTenjinyamaObject, arareTenjinyamaSchedule, masterTime, specialPositions);
        updateObjectState(uradeyamaObject, uradeyamaSchedule, masterTime, specialPositions);
        updateObjectState(yamabushiyamaObject, yamabushiyamaSchedule, masterTime, specialPositions);
        updateObjectState(kankobokoObject, kankobokoSchedule, masterTime, specialPositions);
        updateObjectState(aburatenjinyamaObject, aburatenjinyamaSchedule, masterTime, specialPositions);
        updateObjectState(ayagasabokoObject, ayagasabokoSchedule, masterTime, specialPositions);
        updateObjectState(toroyamaObject, toroyamaSchedule, masterTime, specialPositions);
        updateObjectState(kikusuibokoObject, kikusuibokoSchedule, masterTime, specialPositions);
        updateObjectState(hoshoyamaObject, hoshoyamaSchedule, masterTime, specialPositions);
        updateObjectState(hakugasanObject, hakugasanSchedule, masterTime, specialPositions);
        updateObjectState(hakurakutenyamaObject, hakurakutenyamaSchedule, masterTime, specialPositions);
        updateObjectState(tsukihokoObject, tsukihokoSchedule, masterTime, specialPositions);
        updateObjectState(tokusayamaObject, tokusayamaSchedule, masterTime, specialPositions);
        updateObjectState(shijokasabokoObject, shijokasabokoSchedule, masterTime, specialPositions);
        updateObjectState(taishiyamaObject, taishiyamaSchedule, masterTime, specialPositions);
        updateObjectState(niwatoribokoObject, niwatoribokoSchedule, masterTime, specialPositions);
        updateObjectState(ashikariyamaObject, ashikariyamaSchedule, masterTime, specialPositions);
        updateObjectState(kakkyoyamaObject, kakkyoyamaSchedule, masterTime, specialPositions);
        updateObjectState(mosoyamaObject, mosoyamaSchedule, masterTime, specialPositions);
        updateObjectState(houkabokoObject, houkabokoSchedule, masterTime, specialPositions);
        updateObjectState(iwatoyamaObject, iwatoyamaSchedule, masterTime, specialPositions);
        updateObjectState(funabokoObject, funabokoSchedule, masterTime, specialPositions);
        
        renderer.render(scene, camera);
        labelRenderer.render(scene, camera);
        controls.update();
    }
    animate();

    function debounce(func, wait) {
        let timeout;
        return function executedFunction(...args) {
            const later = () => {
                clearTimeout(timeout);
                func(...args);
            };
            clearTimeout(timeout);
            timeout = setTimeout(later, wait);
        };
    };

    const handleResize = debounce(() => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
    }, 250);

    window.addEventListener('resize', handleResize);

</script>
